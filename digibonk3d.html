<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DigiBonk 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
/* HUD estilo Digivice: paneles azul oscuro con borde neón */
#hud{position:fixed;left:16px;top:16px;pointer-events:none}
.hud-card{display:flex;gap:14px;align-items:center;padding:10px 14px 10px 10px;border-radius:16px;
  background:linear-gradient(160deg,rgba(24,62,110,.94),rgba(8,18,40,.95));border:2px solid #7fd0ff;
  box-shadow:0 0 18px rgba(79,195,247,.35),inset 0 2px 0 rgba(255,255,255,.15)}
.hud-portrait{position:relative;width:66px;height:66px;border-radius:14px;display:grid;place-items:center;
  border:2px solid #7fd0ff;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.05))}
#pimg{width:54px;height:54px;image-rendering:pixelated}
.hud-lvl{position:absolute;right:-9px;bottom:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;
  background:#ffd54f;color:#1a1200;font-weight:900;font-size:13px;border:2px solid #1a1200}
.hud-main{min-width:250px}
.hud-name{font-weight:900;font-size:17px;letter-spacing:.5px;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.1}
.hud-hp{position:relative;width:250px;height:18px;margin-top:6px;border-radius:9px;background:#06141a;border:1px solid #3b78b0;overflow:hidden}
#hp{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#3fb950,#a6e35a);transition:width .15s}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px 2px #000}
.hud-chips{display:flex;gap:6px;margin-top:7px}
.chip{font-size:12px;padding:2px 9px;border-radius:9px;background:rgba(8,18,40,.85);border:1px solid #2d5f78;color:#cfe8ff;white-space:nowrap}
.chip b{color:#fff}
.chip.ready{border-color:#7cf29c;color:#7cf29c;box-shadow:0 0 8px rgba(124,242,156,.5)}
#timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:4px 18px;border-radius:10px;
  background:#0b1120;border:2px solid #ffd54f;box-shadow:0 0 14px rgba(255,213,79,.35);
  font-family:'Consolas',monospace;font-size:26px;font-weight:bold;color:#ffd54f;pointer-events:none}
#xp{position:fixed;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,#0288d1,#4fc3f7);box-shadow:0 0 10px #4fc3f7;pointer-events:none}
#xpTxt{position:fixed;left:16px;bottom:14px;font-size:12px;font-weight:bold;letter-spacing:.5px;color:#cfe8ff;text-shadow:0 1px 3px #000;pointer-events:none}
/* El temporizador avisa cuando falta menos de 30 s para el jefe */
#timer.urgent{color:#ff5252;border-color:#ff5252;box-shadow:0 0 18px rgba(255,82,82,.6);animation:timerPulse .8s ease-in-out infinite}
@keyframes timerPulse{50%{transform:translateX(-50%) scale(1.06)}}
#combo{position:fixed;right:24px;top:200px;padding:4px 14px;border-radius:10px;background:#ffd54f;color:#1a1200;
  font-weight:900;font-size:28px;box-shadow:0 0 14px rgba(255,213,79,.6);pointer-events:none}
#combo:empty{display:none}
/* Anuncios centrales (digievolución, cofres, hordas, jefe) */
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#banner b{display:block;font-size:46px;letter-spacing:3px;color:inherit;text-shadow:0 4px 0 #000,0 0 24px currentColor}
#banner small{display:block;margin-top:4px;font-size:15px;letter-spacing:1px;color:#e6f4ff;text-shadow:0 2px 4px #000}
#banner.show{animation:bannerIn 2.4s ease both}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.98)}}
/* Viñeta roja al recibir daño */
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(198,40,40,.9) 100%)}
/* Aviso flotante sobre el cofre cercano */
#prompt{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:none;padding:5px 12px;border-radius:10px;
  background:rgba(8,14,30,.92);border:2px solid #ffd54f;color:#ffd54f;font-weight:bold;font-size:14px;letter-spacing:.5px;
  pointer-events:none;white-space:nowrap;box-shadow:0 0 12px rgba(255,213,79,.4)}
#prompt kbd{display:inline-block;min-width:20px;padding:0 6px;margin-right:4px;border-radius:5px;background:#ffd54f;color:#1a1200;text-align:center}
/* Pantalla de inicio: el Digimon de la vista previa flota suavemente */
.preview img{animation:previewBob 2.6s ease-in-out infinite}
@keyframes previewBob{50%{transform:translateY(-6px)}}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,16,34,.75),rgba(0,0,0,.9));text-align:center}
#overlay.hidden{display:none}
#overlay.menu-mode{display:block;background:linear-gradient(90deg,rgba(4,7,16,.95) 0%,rgba(4,7,16,.75) 50%,rgba(4,7,16,.2) 100%)}
#overlay.menu-mode.hidden{display:none}
.menu{position:absolute;inset:0;display:grid;grid-template-columns:1fr 330px;grid-template-rows:1fr auto;gap:22px;padding:34px 40px 22px;box-sizing:border-box}
.m-left{align-self:center}
.logo{font-size:60px;font-weight:900;letter-spacing:2px;line-height:1;color:#fff;text-shadow:0 4px 0 #1565c0,0 0 24px rgba(79,195,247,.6);text-align:left}
.logo span{color:#ffd54f}
.logo em{font-style:normal;color:#4fc3f7;font-size:36px}
.sub{margin:8px 0 24px;color:#90caf9;font-size:15px;letter-spacing:1px;text-align:left}
.play{padding:16px 56px;font-size:26px;font-weight:900;letter-spacing:3px;border:0;border-radius:14px;cursor:pointer;color:#1a1200;background:linear-gradient(180deg,#ffe082,#ffb300);box-shadow:0 6px 0 #b27300,0 0 26px rgba(255,193,7,.45)}
.play:hover{transform:translateY(-2px)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #b27300}
.tiles{display:flex;gap:14px;margin-top:22px}
.tile{flex:1;padding:14px 16px;border-radius:12px;background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;text-align:left;min-width:0}
.tile b{display:block;color:#ffd54f;font-size:16px}
.tile small{display:block;opacity:.8;margin-top:4px;font-size:12px}
.tile.dis{opacity:.45;border-color:#38465f}
.m-right{align-self:center;background:rgba(8,14,30,.92);border:2px solid #4fc3f7;border-radius:14px;padding:16px 18px;box-shadow:0 0 18px rgba(79,195,247,.25);max-height:70vh;overflow:auto}
.m-right h3{margin:0 0 10px;color:#ffd54f;font-size:18px;letter-spacing:1px}
.rec{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid #1e2a44;font-size:13px}
.muted{opacity:.7;font-size:13px}
.m-bottom{grid-column:1/3;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;opacity:.85;text-align:left}
.picker{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.pick-card{width:150px;flex:0 0 150px;padding:12px;border-radius:12px;cursor:pointer;background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;text-align:center;transition:transform .12s}
.pick-card:hover{transform:translateY(-3px)}
.pick-card.sel{border-color:#ffd54f;box-shadow:0 0 18px rgba(255,213,79,.5)}
.pick-card img{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.pick-card b{color:#ffd54f;font-size:14px}
.pick-card small{display:block;opacity:.8;margin-top:4px;font-size:11px}
.legal{font-size:11px;opacity:.55;margin:0;text-align:left}
#overlay h1{margin:0 0 6px;font-size:44px;letter-spacing:2px;color:#4fc3f7;text-shadow:0 0 18px rgba(79,195,247,.6)}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.card{width:220px;padding:14px;border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .12s;
  background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;box-shadow:0 0 12px rgba(79,195,247,.25)}
.card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 22px rgba(79,195,247,.6)}
.card img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.card b{color:#ffd54f;font-size:17px}
.card small{display:block;opacity:.8;margin-top:6px;font-size:13px}
/* ---- Pantalla de inicio: vista previa del Digimon, stats y tecla de atajo ---- */
#overlay.menu-mode{background:radial-gradient(ellipse 90% 80% at 70% 40%,rgba(21,46,96,.55),rgba(4,7,16,.96) 70%)}
.menu{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;gap:26px 30px;padding:30px 40px 24px}
.m-left{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:26px;align-items:center}
.m-left .brand{min-width:0}
.preview{background:linear-gradient(170deg,rgba(30,42,68,.96),rgba(10,16,32,.96));border:2px solid #ffd54f;border-radius:18px;
  padding:18px;text-align:center;box-shadow:0 0 26px rgba(255,213,79,.25)}
.preview img{width:150px;height:150px;image-rendering:pixelated;display:block;margin:0 auto 8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.preview h2{margin:0;color:#ffd54f;font-size:24px;letter-spacing:1px}
.preview .pdesc{margin:6px 0 12px;font-size:13px;color:#cfe8ff;min-height:34px}
.stat{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:12px;margin:6px 0;text-align:left;color:#b0bec5}
.stat i{display:block;height:8px;border-radius:4px;background:#1b2740;overflow:hidden}
.stat i b{display:block;height:100%;background:linear-gradient(90deg,#0288d1,#4fc3f7);border-radius:4px}
.stat i b.warm{background:linear-gradient(90deg,#ff8f00,#ffd54f)}
.tiles{margin-top:18px}
.picker{padding:10px 4px 14px}
.pick-card{position:relative;width:118px;flex:0 0 118px;padding:10px 8px;cursor:pointer}
.pick-card.sel{transform:translateY(-4px)}
.pick-card img{width:60px;height:60px;margin:0 auto 4px}
.pick-card b{font-size:13px}
.pick-card small{font-size:10px;line-height:1.25;opacity:.75}
.pick-card .num{position:absolute;top:6px;left:8px;font-size:11px;color:#90caf9;font-weight:bold}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border-radius:5px;background:#16213a;border:1px solid #4fc3f7;
  border-bottom-width:3px;font-size:12px;font-weight:bold;text-align:center;color:#e3f2fd}
.hints{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#cfe8ff}
.hints span{white-space:nowrap}
.rec{align-items:center}
.rec.best{color:#ffd54f;font-weight:bold;background:linear-gradient(90deg,rgba(255,213,79,.12),transparent)}
.rec span:first-child{font-weight:bold}
.m-right h3 small{display:block;font-size:12px;opacity:.6;letter-spacing:0;margin-top:4px;color:#90caf9}
/* ---- Subida de nivel: tarjetas por categoría ---- */
.card{width:230px;text-align:left;position:relative;border-top-width:6px}
.card.ofensiva{border-color:#ef5350;border-top-color:#ef5350}
.card.defensiva{border-color:#66bb6a;border-top-color:#66bb6a}
.card.utilidad{border-color:#ab47bc;border-top-color:#ab47bc}
.card .tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:8px;margin-bottom:6px;color:#0b0f1a;font-weight:bold}
.card.ofensiva .tag{background:#ef5350}
.card.defensiva .tag{background:#66bb6a}
.card.utilidad .tag{background:#ab47bc;color:#fff}
.card .num{position:absolute;right:12px;top:14px;color:#90caf9;font-weight:bold;font-size:14px}
.card b{display:block;font-size:17px;padding-right:24px;text-align:left;color:#ffd54f}
.card p{margin:8px 0 0;font-size:13px;line-height:1.35;color:#dbe9ff;text-align:left}
#overlay h2{margin:0;font-size:24px;color:#ffd54f;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.up-sub{margin:6px 0 0;font-size:13px;color:#90caf9}
.card.sel-key{outline:2px dashed rgba(255,255,255,.25);outline-offset:4px}
/* ---- Pausa: Digivice azul (mismo diseño que la demo) ---- */
#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(ellipse at center,rgba(10,20,44,.45),rgba(3,6,14,.86));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20}
#pause.hidden{display:none}
.pz-device{position:relative;width:min(540px,94vw);max-height:96vh;overflow:hidden;padding:30px 36px 20px;
  border-radius:44% 44% 36% 36% / 14% 14% 10% 10%;color:#e6f4ff;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.4),transparent 35%),linear-gradient(160deg,#7fcaf3,#3d8fd1 32%,#1f5fa2 64%,#143f74);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -12px 22px rgba(0,20,50,.55),0 0 0 3px #0b1d3a,0 26px 60px rgba(0,0,0,.75)}
.pz-brand{text-align:center;font-weight:900;letter-spacing:6px;font-size:12px;color:#0d2a52;margin:-14px 0 6px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pz-bezel{background:linear-gradient(180deg,#0d2238,#071526);border-radius:26px;padding:12px;box-shadow:inset 0 3px 10px rgba(0,0,0,.8)}
.pz-lcd{position:relative;border-radius:18px;padding:14px 16px;background:radial-gradient(ellipse at 50% 0%,#2b4b52,#16292e 50%,#0a1518);box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.pz-title{width:max-content;margin:0 auto 4px;padding:4px 16px;border-radius:10px;font-weight:900;letter-spacing:2px;font-size:12px;color:#fff;
  background:linear-gradient(180deg,#3a94e0,#1d5ea8);border:1px solid #7fd0ff;text-shadow:0 1px 0 #0d2a52}
.pz-zone{text-align:center;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#bfe9d8}
.pz-st{color:#7cf29c}
.pz-close{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:2px solid #9fe3ff;background:#0a2a4d;color:#fff;cursor:pointer;font-size:13px}
.pz-close:hover{background:#15527f}
.pz-profile{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin-top:10px}
.pz-av{width:92px;height:92px;border-radius:14px;border:2px solid #7fd0ff;display:grid;place-items:center;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.04))}
.pz-av img{width:74px;height:74px;object-fit:contain;image-rendering:pixelated}
.pz-name{font-size:26px;font-weight:900;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.05}
.pz-quote{font-size:12px;font-style:italic;color:#bfe9ff;margin:2px 0 6px}
.pz-lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#bfe9ff;text-transform:uppercase;margin:5px 0 2px}
.pz-bar{height:13px;border-radius:7px;background:#06141a;border:1px solid #3b78b0;overflow:hidden;position:relative}
.pz-bar i{position:absolute;top:0;bottom:0;left:0;display:block;background:linear-gradient(90deg,#3fb950,#a6e35a)}
.pz-bar.evo i{background:linear-gradient(90deg,#8e24aa,#ffd54f)}
.pz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.pz-stats div{text-align:center;padding:6px 2px;border-radius:10px;background:rgba(8,26,34,.8);border:1px solid #2d5f78}
.pz-stats small{display:block;font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:#9ad3e8;line-height:1.2;min-height:20px}
.pz-stats b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.pz-btns{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:8px}
.pz-btn{padding:10px 6px;border-radius:12px;border:1px solid #7fd0ff;cursor:pointer;font:900 12px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;line-height:1.15;
  background:linear-gradient(180deg,#1e3a66,#0e1f3d);box-shadow:0 4px 0 #050b18}
.pz-btn small{display:block;font-size:9px;letter-spacing:.6px;font-weight:700;opacity:.85}
.pz-btn:hover{filter:brightness(1.12)}
.pz-btn:active{transform:translateY(2px)}
.pz-primary{background:linear-gradient(180deg,#7ef07e,#2fa84a 60%,#1c7a33);border-color:#bdf9c6;box-shadow:0 4px 0 #0f4a20}
.pz-danger{background:linear-gradient(180deg,#ff7a6b,#c62828 60%,#8e1b1b);border-color:#ffb3a8;box-shadow:0 4px 0 #4a0b0b}
.pz-confirm{text-align:center;padding:6px 0}
.pz-warn{font-size:17px;font-weight:bold;color:#ef9a9a;letter-spacing:.5px}
.pz-confirm p{margin:4px 0 12px;font-size:13px;color:#cfe8ff}
.pz-confirm .pz-btns{grid-template-columns:1fr 1fr}
.pz-keys{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:12px;font-size:11px;color:#cfe8ff}
.pz-keys span{white-space:nowrap}
.pz-keys .kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#f4f7fb,#b8c4d6);color:#1a2236;font:bold 10px ui-monospace,Menlo,monospace;border:1px solid #fff;box-shadow:0 2px 0 #55607a;text-align:center}
/* Viñeta suave del entorno */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(10,20,40,.45) 100%)}
/* Minimapa y mapa completo */
#minimap{position:fixed;right:16px;top:16px;width:170px;height:170px;border-radius:50%;border:3px solid #4fc3f7;
  box-shadow:0 0 14px rgba(79,195,247,.4);pointer-events:none;background:#16321f}
#mapview{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(4,8,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:15;cursor:pointer}
#mapview.open{display:flex}
#bigmap{width:min(72vh,600px);height:min(72vh,600px);border-radius:50%;border:3px solid #4fc3f7;box-shadow:0 0 30px rgba(79,195,247,.4)}
.mapleg{font-size:13px;color:#cfe8ff;text-align:center;background:rgba(6,14,26,.85);padding:6px 14px;border-radius:10px;border:1px solid #2d5f78}
/* Menú de inicio: fila de skins y monedas */
.menu-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px}
.mini-btn{padding:9px 16px;border-radius:12px;border:1px solid #7fd0ff;background:linear-gradient(180deg,#1e3a66,#0e1f3d);color:#fff;font-weight:bold;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 #050b18}
.mini-btn:hover{filter:brightness(1.15)}
.bits-chip{padding:7px 12px;border-radius:10px;background:#1b2a14;border:1px solid #7cf29c;color:#b9f6ca;font-weight:bold;white-space:nowrap}
.daily-chip{font-size:12px;color:#cfe8ff;opacity:.9}
.dif{padding:1px 7px;border-radius:7px;font-size:11px;color:#06101e}
.dif-Fácil{background:#7cf29c}.dif-Media{background:#ffd54f}.dif-Difícil{background:#ef5350;color:#fff}
/* Gacha de skins */
.gacha{width:min(880px,96vw);max-height:92vh;overflow:auto;padding:18px 22px;border-radius:18px;color:#e6f4ff;text-align:left;
  background:linear-gradient(170deg,rgba(24,36,64,.97),rgba(8,12,26,.97));border:2px solid #4fc3f7;box-shadow:0 0 30px rgba(79,195,247,.35)}
.g-head{display:flex;align-items:center;gap:14px}
.g-head h2{margin:0;flex:1;font-size:24px;color:#ffd54f;letter-spacing:1px}
.g-back{padding:7px 12px;border-radius:10px;border:1px solid #4fc3f7;background:#0e1f3d;color:#fff;cursor:pointer}
.g-bits{padding:6px 12px;border-radius:10px;background:#1b2a14;border:1px solid #7cf29c;color:#b9f6ca;font-weight:bold}
.g-top{display:grid;grid-template-columns:240px 1fr;gap:14px;margin:14px 0}
.g-pull,.g-result{border-radius:14px;padding:14px;background:rgba(8,20,40,.8);border:1px solid #2d5f78;text-align:center}
.g-cost{font-size:13px;color:#9fd4ff}
.g-btn{margin:10px 0 6px;padding:12px 28px;border-radius:14px;border:0;cursor:pointer;font-weight:900;letter-spacing:2px;color:#1a1200;background:linear-gradient(180deg,#ffe082,#ffb300);box-shadow:0 5px 0 #b27300}

import * as THREE from 'three';

// Prototipo 3D estilo Megabonk. Sprites 2D (pixel art de King) como billboards.
const BOSS_AT = 240; // segundos hasta el jefe final; ganas al derrotarlo
const ARENA_R = 70;  // radio del escenario: el mapa tiene límite circular con montañas
// Recorta un punto al círculo de radio m (para aparecer y moverse dentro del escenario)
function clampArena(x, z, m){
  const r = Math.hypot(x, z);
  return r > m ? [x*m/r, z*m/r] : [x, z];
}
// Terreno: el pueblo (centro) es llano y el resto del mapa tiene colinas suaves
const smooth01 = t => { t = Math.min(1, Math.max(0, t)); return t*t*(3 - 2*t); };
// Estanque al suroeste: cuenca plana con agua; se funde con el terreno alrededor
const POND = {x: -38, z: 22, r: 6, water: -0.35, bed: -0.9};
function pondWeight(x, z){
  const d = Math.hypot(x - POND.x, z - POND.z);
  return 1 - smooth01((d - POND.r)/3);
}
function terrainH(x, z){
  const r = Math.hypot(x, z);
  const flat = smooth01((r - 26)/14);                 // 0 en el pueblo, 1 fuera
  const edge = 1 - smooth01((r - (ARENA_R - 18))/8);  // vuelve a 0 junto a las montañas
  const hills = 4.5*Math.sin(x*0.05 + 1.3)*Math.cos(z*0.043) + 3*Math.sin((x - z)*0.11 + 0.7) + 1.5*Math.cos(x*0.13 + z*0.09);
  const base = hills * flat * edge;
  const w = pondWeight(x, z);
  return base*(1 - w) + POND.bed*w;
}

const solids = {circles: [], segs: []};
// Empuja un objeto {x, z} fuera de los sólidos, teniendo en cuenta su radio
function resolveSolids(o, rad, height = 0){
  for (const c of solids.circles){
    if (height >= c.h) continue;   // por encima de la altura del objeto se puede saltar
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), min = rad + c.r;
    if (d < min){
      if (d > 1e-6){ o.x = c.x + dx/d*min; o.z = c.z + dz/d*min; }
      else { o.x = c.x + min; }
    }
  }
  for (const s of solids.segs){
    if (height >= s.h) continue;
    const vx = s.bx - s.ax, vz = s.bz - s.az, len2 = vx*vx + vz*vz;
    const t = Math.min(1, Math.max(0, ((o.x - s.ax)*vx + (o.z - s.az)*vz)/len2));

function zoneTint(x, z){
  const r = Math.hypot(x, z);
  const dirt = 1 - smooth01((r - 14)/12);
  const edgeDark = smooth01((r - (ARENA_R - 26))/16);
  const n = 0.93 + 0.07*Math.sin(x*0.09)*Math.cos(z*0.07);
  const k = 1 - edgeDark*0.25;
  let R = n*k, G = n*(1 - edgeDark*0.15), B = n*(1 - edgeDark*0.2);
  R = R*(1 - dirt) + 1.05*dirt; G = G*(1 - dirt) + 0.86*dirt; B = B*(1 - dirt) + 0.6*dirt;
  return [R, G, B];
}
{
  const pos = terrainGeo.attributes.position, col = new Float32Array(pos.count*3);
  for (let i = 0; i < pos.count; i++) col.set(zoneTint(pos.getX(i), pos.getZ(i)), i*3);
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

function loadTex(path, rx, ry, pixel = false){
  const t = loader.load(path, tex => tex.repeat.set(rx, ry * (tex.image.width / tex.image.height)));
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  if (pixel) t.magFilter = THREE.NearestFilter;   // pixel art: bordes nítidos
  return t;
}

// Montañas altas que cierran el escenario (dos anillos, el exterior más alto)
function buildMountains(){
  // Una sola malla continua de crestas: no hay conos que se crucen, así que no parpadea
  const SEG = 360, rBase = ARENA_R + 16, rPeak = ARENA_R + 5;
  const H = a => 26 + 9*Math.sin(a*5 + 1.3) + 5*Math.sin(a*11 + 0.4) + 3*Math.sin(a*23);
  const rock = new THREE.Color(0x4b5a73), snow = new THREE.Color(0xe8f1ff);
  const pos = [], col = [];
  const pt = (r, h, a) => [Math.cos(a)*r, h, Math.sin(a)*r];
  const colorAt = h => rock.clone().lerp(snow, THREE.MathUtils.smoothstep(h, 30, 38));
  for (let i = 0; i < SEG; i++){
    const a0 = i/SEG*Math.PI*2, a1 = (i+1)/SEG*Math.PI*2;
    const h0 = H(a0), h1 = H(a1), hm = H((a0+a1)/2) * 1.08;
    const b0 = pt(rBase, 0, a0), b1 = pt(rBase, 0, a1);
    const t0 = pt(rPeak, h0, a0), t1 = pt(rPeak, h1, a1), tm = pt(rPeak - 4, hm, (a0+a1)/2);
    // dos caras por segmento: base exterior -> pico
    const faces = [[b0, b1, tm], [b0, tm, t0], [b1, t1, tm], [b1, tm, t0]];
    for (const f of faces){
      for (const v of f){
        pos.push(v[0], v[1], v[2]);
        const c = colorAt(v[1]); col.push(c.r, c.g, c.b);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, flatShading: true, roughness: 0.9, side: THREE.DoubleSide}));
  scene.add(mesh);
}

const texCache = {};
function tex(url){
  if (!texCache[url]){
    texCache[url] = loader.load(url);
    texCache[url].magFilter = THREE.NearestFilter;
  }
  return texCache[url];
}
function billboard(url, scale){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: tex(url), transparent: true}));
  s.scale.set(scale, scale, 1);
  return s;
}

// ---------- Entorno: árboles, rocas y flores (texturas procedurales) ----------
function propTex(kind){
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  if (kind === 'tree'){
    c.width = 64; c.height = 96;
    x.fillStyle = '#5d4037'; x.fillRect(28, 60, 8, 36);
    x.fillStyle = '#2e7d32';
    for (const [a, b, r] of [[32,36,26],[20,50,18],[44,50,18],[32,22,18]]){ x.beginPath(); x.arc(a, b, r, 0, Math.PI*2); x.fill(); }
    x.fillStyle = '#43a047'; x.beginPath(); x.arc(26, 28, 7, 0, Math.PI*2); x.fill();
  } else if (kind === 'rock'){
    c.width = c.height = 48;
    x.fillStyle = '#616161'; x.beginPath(); x.ellipse(24, 34, 20, 12, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = '#9e9e9e'; x.beginPath(); x.ellipse(19, 28, 8, 5, 0, 0, Math.PI*2); x.fill();
  } else {
    c.width = c.height = 32;
    x.fillStyle = '#2e7d32'; x.fillRect(15, 16, 2, 16);
    x.fillStyle = ['#ff8a80','#fff176','#f48fb1'][Math.random()*3 | 0];
    x.beginPath(); x.arc(16, 12, 5, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; return t;
}
// Decoración 2D integrada en el 3D: sprites de pixel art que siempre miran a la cámara
function decoTex(file){
  const t = loader.load(file);
  t.magFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function decoSprite(tex, w, h, x, y, z){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, alphaTest: 0.5}));
  sp.scale.set(w, h, 1);
  sp.position.set(x, y + h/2, z);
  scene.add(sp);
  return sp;
}
function buildEnvironment(){
  const T = {
    arbol: decoTex('sprites/deco/arbol.png'), arbolOtono: decoTex('sprites/deco/arbol_otono.png'),
    roca: decoTex('sprites/deco/roca.png'), arbusto: decoTex('sprites/deco/arbusto.png'),
    flor: decoTex('sprites/deco/flor.png')
  };
  for (let i = 0; i < Q.decor; i++){
    const r = Math.random();
    const ang = Math.random()*Math.PI*2, rad = Math.sqrt(Math.random())*(ARENA_R - 2);
    const x0 = Math.cos(ang)*rad, z0 = Math.sin(ang)*rad;
    if (Math.hypot(x0, z0) < 22) continue;   // deja libre la zona de aparición
    if (pondWeight(x0, z0) > 0.01) continue;   // no pone decoración dentro del estanque
    const gy = terrainH(x0, z0);
    if (r < 0.45){                          // árboles
      const h = 5 + Math.random()*2;
      decoSprite(Math.random() < 0.2 ? T.arbolOtono : T.arbol, h*0.75, h, x0, gy, z0);
      const sh = makeShadow(h*0.5); sh.position.set(x0, gy + 0.02, z0); scene.add(sh);
    } else if (r < 0.65){                   // rocas
      const sc = 1.1 + Math.random()*0.6;
      decoSprite(T.roca, sc*1.3, sc*0.9, x0, gy, z0);
      const sh = makeShadow(sc*2.2); sh.position.set(x0, gy + 0.02, z0); scene.add(sh);
    } else if (r < 0.78){                   // arbustos
      const sc = 1.2 + Math.random()*0.5;
      decoSprite(T.arbusto, sc*1.4, sc, x0, gy, z0);
    } else {                                // flores
      decoSprite(T.flor, 0.8, 1.2, x0, gy, z0);
    }
  }
}

// ---------- Ambientación del pueblo: caminos, valla con huecos y habitantes en reposo ----------
const npcs = [];   // habitantes: solo se mueven (no atacan ni son enemigos)
function angDiff(a, b){
  let d = (a - b) % (2*Math.PI);
  if (d > Math.PI) d -= 2*Math.PI;
  if (d < -Math.PI) d += 2*Math.PI;
  return Math.abs(d);
}
function buildAmbience(){
  const paths = 8;
  const pathAngles = Array.from({length: paths}, (_, i) => i/paths*Math.PI*2);
  // caminos de tierra desde la plaza hacia las montañas
  const pathMat = new THREE.MeshBasicMaterial({color: 0xffffff, map: loadTex('textures/camino_pixel.png', 1, 5, true)});
  const L = 26 - 14;   // los caminos llegan hasta el borde llano del pueblo
  for (const a of pathAngles){
    const geo = new THREE.PlaneGeometry(2.6, L);
    geo.rotateX(-Math.PI/2);
    const m = new THREE.Mesh(geo, pathMat);
    const mid = 14 + L/2;
    m.position.set(Math.cos(a)*mid, 0.012, Math.sin(a)*mid);
    m.rotation.y = Math.PI/2 - a;
    scene.add(m);
  }
  // valla alrededor del pueblo, con huecos donde salen los caminos
  const FR = 21, N = 36;
  const postGeo = new THREE.BoxGeometry(0.25, 1.3, 0.25);
  const railGeo = (len) => new THREE.BoxGeometry(len, 0.14, 0.12);
  const fenceMat = new THREE.MeshStandardMaterial({color: 0x6d4c41, flatShading: true});
  const open = a => pathAngles.some(pa => angDiff(a, pa) < 0.12);
  const angs = Array.from({length: N}, (_, i) => i/N*2*Math.PI);
  for (const a of angs){
    if (open(a)) continue;
    const post = new THREE.Mesh(postGeo, fenceMat);
    post.position.set(Math.cos(a)*FR, 0.65, Math.sin(a)*FR);
    scene.add(post);
  }
  for (let i = 0; i < N; i++){
    const a0 = angs[i], a1 = angs[(i + 1) % N] + (i === N-1 ? 2*Math.PI : 0);
    if (open(a0) || open(a1 % (2*Math.PI))) continue;
    const dth = a1 - a0, am = a0 + dth/2;
    const chord = 2*FR*Math.sin(dth/2);
    solids.segs.push({ax: Math.cos(a0)*FR, az: Math.sin(a0)*FR, bx: Math.cos(a1)*FR, bz: Math.sin(a1)*FR, r: 0.15, h: 1.4});
    for (const h of [0.5, 1.0]){
      const rail = new THREE.Mesh(railGeo(chord), fenceMat);
      rail.position.set(Math.cos(am)*FR, h, Math.sin(am)*FR);
      rail.rotation.y = Math.atan2(-Math.cos(am), -Math.sin(am));
      scene.add(rail);
    }
  }
  // habitantes en reposo: sprites de la temporada 1 que no atacan
  const npcKeys = ['gomamon', 'patamon', 'palmon', 'gatomon', 'biyomon', 'gabumon'];
  npcKeys.forEach((k, i) => {
    const a = i/npcKeys.length*Math.PI*2 + 0.5, r = 7 + (i % 2)*3;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const sprite = billboard(CHARS[k].sprite, 1.8);
    sprite.position.set(x, 0.9, z);
    scene.add(sprite);
    const sh = makeShadow(1.4);
    sh.position.set(x, 0.02, z);
    scene.add(sh);
    npcs.push({sprite, base: 0.9, ph: i});
    solids.circles.push({x, z, r: 0.7, h: 2});
  });
}
buildAmbience();

let state = 'select';
let g = null;
let world = new THREE.Group();

const keys = {};
const overlay = document.getElementById('overlay');

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  audioInit();
  if (k === 'n'){ toggleMute(); return; }
  if (k === 'm'){ if (state === 'play') openMap(); else if (state === 'map') closeMap(); return; }
  if (state === 'map'){ if (k === 'escape') closeMap(); return; }
  if (state === 'gacha' || state === 'settings' || state === 'player'){ if (k === 'escape') showSelect(); return; }
  // Esc o P pausan y reanudan. Con el ratón bloqueado el navegador puede no entregar Esc:
  // en ese caso la pausa la dispara pointerlockchange (ver más abajo). P sirve en pantalla completa.
  if (k === 'escape' || k === 'p'){
    if (state === 'play'){ pauseGame(); return; }
    if (state === 'paused'){
      if (pauseConfirm && k === 'escape') showPause(false);   // Esc en la confirmación vuelve al menú de pausa
      else resumeGame();
      return;
    }
  }
  if (state === 'paused'){ if (k === 'enter' && !pauseConfirm) resumeGame(); return; }
  keys[k] = true;
  if (state === 'play' && k === 'shift') tryDash();
  if (state === 'play' && k === ' ' && g && g.p.y === 0) g.p.vy = 11;   // salto (altura ~2)
  if (state === 'play' && k === 'e' && g && g.nearChest) openChest(g.nearChest);
  const list = SEASONS.adventure.chars;
  if (state === 'select'){
    if (k === 'enter') showPicker('personaje');
  }
  else if (state === 'pick'){
    if (k.length === 1 && '123456789'.includes(k) && +k <= list.length){ selectedKey = list[+k-1]; showPicker(); }
    else if (k === 'arrowleft') pickMove(-1);
    else if (k === 'arrowright') pickMove(1);
    else if (k === 'enter') startGame(selectedKey);
    else if (k === 'escape') showSelect();
  }
  else if (state === 'levelup' && k.length === 1 && '123'.includes(k)) pickUpgrade(+k-1);

// ---------- Texturas procedurales (sin archivos externos) ----------
// Terreno procedural: hierba con matices, parches de tierra y claros (textura que se repite)
let chestTex = null;
function getChestTex(){
  if (chestTex) return chestTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < 4; i++){
    x.fillStyle = i % 2 ? '#7a4a22' : '#9a6432';
    x.fillRect(0, i*32, 128, 32);
    x.fillStyle = '#4e2e12'; x.fillRect(0, i*32, 128, 2);
  }
  x.fillStyle = '#c9a227';                                // bandas metálicas
  x.fillRect(0, 20, 128, 10); x.fillRect(0, 98, 128, 10); x.fillRect(56, 0, 12, 128);
  x.fillStyle = '#fff3a0'; x.fillRect(58, 56, 8, 12);    // cerradura
  chestTex = new THREE.CanvasTexture(c);
  chestTex.magFilter = THREE.NearestFilter;
  return chestTex;
}
function makeChest(){
  const mat = new THREE.MeshBasicMaterial({map: getChestTex()});
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.7), mat);
  body.position.y = 0.25;
  group.add(body);
  const pivot = new THREE.Group();          // bisagra en el borde trasero
  pivot.position.set(0, 0.5, -0.35);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.7), mat);
  lid.position.set(0, 0.1, 0.35);
  pivot.add(lid);
  group.add(pivot);
  group.add(makeShadow(1.3));
  return {group, pivot};
}

// ---------- Chispas de impacto ----------
const fxGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
let fx = [];
const hitColors = {basic: '#ff7043', fast: '#ce93d8', tank: '#bcaaa4'};
function burst(x, z, color){
  for (let i = 0; i < 7; i++){
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({color, transparent: true}));
    m.position.set(x, 0.8, z);
    world.add(m);
    const a = Math.random()*Math.PI*2, s = 3 + Math.random()*4;
    fx.push({m, vx: Math.cos(a)*s, vy: 3 + Math.random()*3, vz: Math.sin(a)*s, t: 0});
  }
}
function updateFx(dt){
  for (const f of fx){
    f.t += dt;
    f.vy -= 14*dt;
    f.m.position.x += f.vx*dt;
    f.m.position.z += f.vz*dt;
    f.m.position.y = Math.max(0.07, f.m.position.y + f.vy*dt);
    f.m.material.opacity = Math.max(0, 1 - f.t/0.45);
    f.m.rotation.x += dt*10;
  }
  fx = fx.filter(f => {
    if (f.t < 0.45) return true;
    world.remove(f.m); f.m.material.dispose(); return false;
  });
}

// ---------- Daño flotante ----------
function popText(x, z, n, color = '#ffeb3b', k = 0.6){
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const cx = c.getContext('2d');
  cx.font = 'bold 44px sans-serif'; cx.textAlign = 'center';
  cx.lineWidth = 7; cx.strokeStyle = '#000';
  cx.strokeText(String(n), 128, 66);
  cx.fillStyle = color; cx.fillText(String(n), 128, 66);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false});
  const s = new THREE.Sprite(mat);
  s.scale.set(2.8*k, 1.05*k, 1);
  s.position.set(x, 1.8, z);
  s.renderOrder = 10;
  world.add(s);
  g.texts.push({s, tex, mat, life: 0.9});
}

function digivolve(){
  const evo = EVO[g.ch.id];
  if (!evo || g.ch.evolved) return;
  g.ch.evolved = true;

  g.p.dmg *= 1.5;
  g.p.count += 1;
  g.evoAnim = {t: 0, dur: 2.6, swapped: false, sprite: spriteOf(g.ch.id, true), name: evo.name};
  shake = Math.max(shake, 0.5);
  sfx('evolve');

}

function getDigiviceTex(){
  if (digiviceTex) return digiviceTex;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const halo = x.createRadialGradient(128, 128, 20, 128, 128, 128);
  halo.addColorStop(0, 'rgba(120,220,255,0.7)');
  halo.addColorStop(1, 'rgba(120,220,255,0)');
  x.fillStyle = halo; x.fillRect(0, 0, 256, 256);
  const body = x.createLinearGradient(0, 30, 0, 226);
  body.addColorStop(0, '#eaffff'); body.addColorStop(0.5, '#4fc3f7'); body.addColorStop(1, '#0d3f8f');
  x.beginPath(); x.ellipse(128, 128, 96, 112, 0, 0, Math.PI*2);
  x.fillStyle = body; x.fill();
  x.lineWidth = 6; x.strokeStyle = '#bff1ff'; x.stroke();
  x.fillStyle = '#06142b'; x.fillRect(78, 88, 100, 80);            // pantalla
  x.strokeStyle = 'rgba(79,195,247,0.8)'; x.lineWidth = 2;
  for (let i = 1; i < 4; i++){ x.beginPath(); x.moveTo(78 + i*25, 88); x.lineTo(78 + i*25, 168); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,0.35)';                           // brillo
  x.beginPath(); x.ellipse(118, 100, 28, 8, -0.2, 0, Math.PI*2); x.fill();
  for (const bx of [36, 220]){                                      // botones laterales
    x.beginPath(); x.arc(bx, 128, 12, 0, Math.PI*2);
    x.fillStyle = '#29b6f6'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#e1f5fe'; x.stroke();
  }
  digiviceTex = new THREE.CanvasTexture(c);
  return digiviceTex;
}
// Digivice que aparece sobre el personaje con un haz de luz, gira y se apaga al evolucionar
function updateDigivice(a, p, dt){
  if (!a.dv){
    a.dv = new THREE.Sprite(new THREE.SpriteMaterial({map: getDigiviceTex(), transparent: true, depthWrite: false,
      depthTest: false, blending: THREE.AdditiveBlending, opacity: 0}));
    a.dv.renderOrder = 12;
    world.add(a.dv);
    a.beam = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 16, 20, 1, true),
      new THREE.MeshBasicMaterial({color: 0x66ccff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
        depthWrite: false, side: THREE.DoubleSide}));
    world.add(a.beam);
  }
  const t = a.t;
  const grow = Math.min(1, t/0.6);
  const fade = t > 0.6 ? Math.max(0, 1 - (t - 0.6)/1.4) : 1;
  const pulse = 0.85 + 0.15*Math.sin(t*30);
  a.dv.position.set(p.x, terrainH(p.x, p.z) + 3.4 + Math.sin(t*6)*0.15, p.z);
  a.dv.scale.setScalar((3.2 + 1.2*grow) * pulse);
  a.dv.material.rotation += dt*(1.5 + 4*grow);
  a.dv.material.opacity = Math.min(1, t/0.15) * fade;
  a.beam.position.set(p.x, terrainH(p.x, p.z) + 8*grow, p.z);
  a.beam.scale.set(1 + grow*1.5, Math.max(0.01, grow), 1 + grow*1.5);
  a.beam.material.opacity = 0.55 * fade * Math.min(1, t/0.2);
  if (t > 0.6 && !a.burst){ a.burst = true; spawnRing(p.x, p.z); spawnRing(p.x, p.z); }
}
function removeDigivice(a){
  if (a.dv){ world.remove(a.dv); a.dv.material.dispose(); }
  if (a.beam){ world.remove(a.beam); a.beam.geometry.dispose(); a.beam.material.dispose(); }
}

function animateEvo(dt){
  for (const r of rings){
    r.t += dt;
    r.mesh.scale.setScalar(1 + r.t*12);
    r.mesh.material.opacity = Math.max(0, 1 - r.t/0.7);
  }
  rings = rings.filter(r => {
    if (r.t < 0.7) return true;
    world.remove(r.mesh); return false;
  });
  screenFlash = Math.max(0, screenFlash - dt*1.5);
  document.getElementById('flash').style.opacity = screenFlash;

  const a = g && g.evoAnim;
  if (!a) return;
  a.t += dt;
  const m = g.playerMesh, p = g.p;
  // Malla de alambre (icosaedro) que crece alrededor del personaje y se desvanece
  if (!a.wire){
    a.wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshBasicMaterial({color: 0x4fc3f7, wireframe: true, transparent: true}));
    world.add(a.wire);
  }
  a.wire.scale.setScalar(a.t < 0.6 ? 1.2 + 2.5*(a.t/0.6) : 3.7 + 2*(a.t-0.6));
  a.wire.position.set(p.x, terrainH(p.x, p.z) + 1.1, p.z);
  a.wire.material.opacity = a.t < 0.6 ? 1 : Math.max(0, 1 - (a.t-0.6)/0.6);
  a.wire.rotation.y += dt*4;
  a.wire.rotation.x += dt*2;
  updateDigivice(a, p, dt);
  if (a.t < 0.6){
    const glow = 1 + 1.5*Math.pow(Math.sin(a.t*40), 2);
    m.material.color.setRGB(glow, glow, glow);
    m.scale.set(2.9 + 0.4*(a.t/0.6), 2.9 + 0.4*(a.t/0.6), 1);
    m.position.x = p.x + (Math.random()-0.5)*0.25;
    m.position.z = p.z + (Math.random()-0.5)*0.25;
  } else if (!a.swapped){
    a.swapped = true;
    m.material.map = tex(a.sprite);
    m.material.needsUpdate = true;
    spawnRing(p.x, p.z);
    popText(p.x, p.z, `¡${a.name}!`, '#ffd54f', 2.2);
    screenFlash = 1;
  } else {
    const e = Math.min(1, (a.t - 0.6) / 2.0);
    const s = 3.3 - 0.4*e;
    m.scale.set(s, s, 1);
    m.material.color.setRGB(1, 1, 1);
  }
  if (a.t >= a.dur){
    m.scale.set(2.9, 2.9, 1);
    m.material.color.setRGB(1, 1, 1);
    world.remove(a.wire);
    a.wire.geometry.dispose(); a.wire.material.dispose();
    removeDigivice(a);
    g.evoAnim = null;
  }
}

function hurt(e, dmg){
  e.hp -= dmg;
  popText(e.x, e.z, Math.round(dmg));
  burst(e.x, e.z, hitColors[e.kind] || '#ffe082');
  sfx('hit');
}

function openChest(c){
  if (!g || c.open) return;
  c.open = true; c.openT = 2;
  c.pivot.rotation.x = -1.5;
  const up = UPGRADES[Math.floor(Math.random()*UPGRADES.length)];
  up.f(g.p);
  g.p.hp = Math.min(g.p.maxHp, g.p.hp + 15);
  sfx('chest');
  announce('Cofre abierto', `${up.t} · +15 vida`, '#7cf29c');
}
function tryDash(){
  if (!g || g.dashCd > 0 || g.dash > 0) return;
  g.dash = 0.18;   // segundos de dash (invulnerable)
  g.dashCd = 2.5;  // cooldown
}
function dist2(ax, az, bx, bz){ return Math.hypot(ax-bx, az-bz); }

function spawnEnemy(){
  const t = g.t, r = Math.random(), a = Math.random()*Math.PI*2, R = 25;
  let kind = 'basic';
  if (t > 120 && r < 0.2) kind = 'tank';
  else if (t > 60 && r < 0.4) kind = 'fast';
  const d = ENEMY[kind], k = 1 + t/120;
  const mesh = billboard(d.sprite, d.scale);
  mesh.position.y = d.scale/2;
  world.add(mesh);
  const sp = clampArena(g.p.x + Math.cos(a)*R, g.p.z + Math.sin(a)*R, ARENA_R - 0.5);
  const shadow = Q.shadows ? makeShadow(d.r*2.2) : new THREE.Object3D();
  world.add(shadow);
  g.enemies.push({
    kind, mesh, shadow, x: sp[0], z: sp[1],
    hp: d.hp*k, max: d.hp*k, spd: d.spd, r: d.r, xp: d.xp, dmg: d.dmg, cd: 0
  });
}

function fireProjectile(x, z, vx, vz, dmg, life, color){
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({color}));
  mesh.position.set(x, 0.9 + terrainH(x, z), z);
  world.add(mesh);
  g.shots.push({x, z, vx, vz, dmg, life, mesh, r: 0.3});
  sfx('shoot');
}

function update(dt){
  const p = g.p, ch = g.ch;
  g.t += dt;

  // Movimiento (ejes del mundo)
  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup'])    mz -= 1;
  if (keys['s'] || keys['arrowdown'])  mz += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  g.dashCd = Math.max(0, g.dashCd - dt);
  if (g.dash > 0){
    g.dash -= dt;
    p.x += g.dir.x * 22 * dt;
    p.z += g.dir.z * 22 * dt;
  } else if (mx || mz){
    // Movimiento relativo a la cámara: W avanza hacia donde mira la cámara
    const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
    const wx = mx*cy + mz*sy, wz = -mx*sy + mz*cy;
    const L = Math.hypot(wx, wz);
    const k = waterSlow(p.x, p.z);   // dentro del estanque se camina más despacio
    p.x += wx/L * p.speed * k * dt;
    p.z += wz/L * p.speed * k * dt;
    g.dir = {x: wx/L, z: wz/L};
  }
  // Salto: gravedad simple
  if (p.y > 0 || p.vy !== 0){
    p.vy -= 30*dt;
    p.y += p.vy*dt;
    if (p.y <= 0){ p.y = 0; p.vy = 0; }
  }
  // El jugador no puede salir del escenario (las montañas empiezan en ARENA_R - 1)
  [p.x, p.z] = clampArena(p.x, p.z, ARENA_R - 2);
  resolveSolids(p, 0.5, p.y);   // casas, fuente, habitantes y vallas bloquean al jugador

  // Avisos de fase: hordas a los 45 s y aviso del jefe 15 s antes
  if (!g.hordeWarned && g.t >= 45){ g.hordeWarned = true; announce('¡HORDAS!', 'Más enemigos aparecen', '#ef5350'); }
  if (!g.bossWarned && g.t >= BOSS_AT - 15){ g.bossWarned = true; announce('Algo se acerca…', 'Devimon llega en 15 s', '#ce93d8'); }

  // Aparición
  g.spawnT -= dt;
  if (g.spawnT <= 0){
    spawnEnemy();
    if (g.t > 45 && g.enemies.length < Q.maxEnemies) spawnEnemy();   // hordas más densas tras 45 s
    g.spawnT = Math.max(0.15, 1.1 - g.t/150);
  }

  // Enemigos: persiguen y dañan por contacto
  for (const e of g.enemies){
    const dx = p.x - e.x, dz = p.z - e.z, d = Math.hypot(dx, dz) || 1;
    // Se paran a distancia de contacto (no se meten encima del jugador)
    if (d > e.r + 0.6){
      e.x += dx/d * e.spd * dt;
      e.z += dz/d * e.spd * dt;
    }
    [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);   // los enemigos también quedan dentro
    resolveSolids(e, e.r*0.8);                          // y no atraviesan casas ni vallas
    e.cd -= dt;
    if (d < e.r + 0.8 && g.dash <= 0){ p.hp -= e.dmg * dt; shake = Math.max(shake, 0.12); }
  }

  // Armas
  g.wCd -= dt;
  if (ch.kind === 'shot' && g.wCd <= 0 && g.enemies.length){
    g.wCd = ch.cd * p.cdMul;
    const sorted = [...g.enemies].sort((a,b) => dist2(a.x,a.z,p.x,p.z) - dist2(b.x,b.z,p.x,p.z));
    for (let i = 0; i < Math.min(p.count, sorted.length); i++){
      const e = sorted[i], d = dist2(e.x, e.z, p.x, p.z) || 1;
      fireProjectile(p.x, p.z, (e.x-p.x)/d*14, (e.z-p.z)/d*14, ch.dmg*p.dmg, 1.6, 0xffb74d);
    }
  }
  if (ch.kind === 'ring' && g.wCd <= 0){
    g.wCd = ch.cd * p.cdMul;
    const n = 6*p.count, off = Math.random()*Math.PI*2;
    for (let i = 0; i < n; i++){
      const an = off + i/n*Math.PI*2;
      fireProjectile(p.x, p.z, Math.cos(an)*9, Math.sin(an)*9, ch.dmg*p.dmg, 0.9, 0x4fc3f7);
    }
  }

  // Proyectiles
  for (const s of g.shots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 0.9 + terrainH(s.x, s.z), s.z);
    if (s.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp > 0 && dist2(s.x, s.z, e.x, e.z) < e.r + s.r){
        hurt(e, s.dmg); s.life = 0; break;
      }
    }
  }
  g.shots = g.shots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Cuchillas orbitales
  if (ch.kind === 'orbit'){
    g.orbitA += dt*3.2;
    const n = p.count + 1, R = 2.2*p.area;
    while (g.blades.length < n){
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), new THREE.MeshBasicMaterial({color:0xa5d6a7}));
      world.add(m); g.blades.push(m);
    }
    while (g.blades.length > n){ world.remove(g.blades.pop()); }
    for (let i = 0; i < n; i++){
      const an = g.orbitA + i*Math.PI*2/n;
      const bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      g.blades[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.cd <= 0 && dist2(bx, bz, e.x, e.z) < e.r + 0.5){
          hurt(e, ch.dmg*p.dmg); e.cd = 0.35;
        }
      }
    }
  } else if (g.blades.length){
    for (const m of g.blades) world.remove(m);
    g.blades = [];
  }

  // Muertes
  const dead = g.enemies.filter(e => e.hp <= 0);
  for (const e of dead){
    g.gems.push({x:e.x, z:e.z, v:e.xp, heal: Math.random() < 0.06, mesh: null});
    world.remove(e.mesh);
    world.remove(e.shadow);
  }
  if (dead.length) sfx('kill');
  g.kills += dead.length;
  if (dead.length){ g.combo += dead.length; g.comboT = 3; }
  g.comboT -= dt;
  if (g.comboT <= 0) g.combo = 0;
  g.enemies = g.enemies.filter(e => e.hp > 0);

  // Gemas de XP
  for (const gm of g.gems){
    if (!gm.mesh){
      gm.mesh = new THREE.Mesh(new THREE.OctahedronGeometry(gm.heal ? 0.32 : 0.25), new THREE.MeshBasicMaterial({color: gm.heal ? 0x66bb6a : 0x29b6f6}));
      world.add(gm.mesh);
    }
    const d = dist2(gm.x, gm.z, p.x, p.z), dd = d || 1;
    if (d < p.pickup){
      gm.x += (p.x-gm.x)/dd * 12*dt;
      gm.z += (p.z-gm.z)/dd * 12*dt;
    }
    gm.mesh.position.set(gm.x, 0.4 + terrainH(gm.x, gm.z), gm.z);
    gm.mesh.rotation.y += dt*3;
    if (d < 0.9){
      gm.taken = true; world.remove(gm.mesh);
      if (gm.heal){ p.hp = Math.min(p.maxHp, p.hp + 10); popText(gm.x, gm.z, '+10', '#7cf29c'); sfx('chest'); }
      else p.xp += gm.v;
    }
  }
  g.gems = g.gems.filter(gm => !gm.taken);

  // Cofres: aparecen cada 25 s y dan una mejora aleatoria al pasar por encima
  g.chestT -= dt;
  if (g.chestT <= 0){
    g.chestT = 25;
    const a = Math.random()*Math.PI*2, R = 10 + Math.random()*8;
    const [cx, cz] = clampArena(p.x + Math.cos(a)*R, p.z + Math.sin(a)*R, ARENA_R - 2);
    const {group, pivot} = makeChest();
    group.position.set(cx, terrainH(cx, cz), cz);
    world.add(group);
    g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false});
  }
  g.nearChest = null;
  let best = 2.0;
  for (const c of g.chests){
    if (c.open){
      c.openT -= dt;
      if (c.openT <= 0){ world.remove(c.group); c.gone = true; }
      continue;
    }
    const d = dist2(c.x, c.z, p.x, p.z);
    if (d < best){ best = d; g.nearChest = c; }
  }
  g.chests = g.chests.filter(c => !c.gone);
  if (g.flashT > 0) g.flashT -= dt;

  // Números de daño: suben y se desvanecen
  for (const t of g.texts){
    t.life -= dt;
    t.s.position.y += dt*1.2;
    t.mat.opacity = Math.max(0, t.life/0.7);
  }
  for (const t of g.texts.filter(t => t.life <= 0)){
    world.remove(t.s); t.tex.dispose(); t.mat.dispose();
  }
  g.texts = g.texts.filter(t => t.life > 0);

  // Jefe final: aparece a los 240 s y lanza anillos de proyectiles
  if (!g.bossSpawned && g.t >= BOSS_AT){
    g.bossSpawned = true;
    const mesh = billboard('sprites/devimon.png', 5);
    world.add(mesh);
    const shadow = makeShadow(5);
    world.add(shadow);
    g.boss = {kind: 'boss', boss: true, mesh, shadow, x: p.x + 14, z: p.z, hp: 900, max: 900,
              spd: 2.2, r: 2.4, xp: 40, dmg: 15, cd: 0};
    g.enemies.push(g.boss);
    g.bossShotT = 2;
    sfx('boss');
    announce('¡JEFE FINAL!', 'Devimon ha llegado', '#ce93d8');
  }
  if (g.boss && g.enemies.includes(g.boss)){
    g.bossShotT -= dt;
    // Aviso: un anillo rojo se encoge sobre el jefe 0.8 s antes de cada disparo
    if (g.bossShotT <= 0.8){
      if (!g.bossRing) g.bossRing = makeBossRing();
      const prog = 1 - Math.max(0, g.bossShotT) / 0.8;
      g.bossRing.position.set(g.boss.x, terrainH(g.boss.x, g.boss.z) + 0.15, g.boss.z);
      g.bossRing.scale.setScalar(1 + 6*(1 - prog));
      g.bossRing.material.opacity = 0.25 + 0.6*prog;
    }
    if (g.bossShotT <= 0){
      g.bossShotT = 2.5;
      clearBossRing();
      const b = g.boss;
      for (let i = 0; i < 10; i++){
        const an = i/10*Math.PI*2 + g.t;
        const shot = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({color: 0xff1744}));
        shot.position.set(b.x, 1 + terrainH(b.x, b.z), b.z);
        world.add(shot);
        g.eshots.push({x: b.x, z: b.z, vx: Math.cos(an)*6, vz: Math.sin(an)*6, life: 4, mesh: shot, dmg: 8});
      }
    }
  } else if (g.boss && !g.bossDown){
    g.bossDown = true;   // el jefe ha caído
    clearBossRing();
  }
  for (const s of g.eshots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 1 + terrainH(s.x, s.z), s.z);
    if (s.life > 0 && dist2(s.x, s.z, p.x, p.z) < 0.9 && g.dash <= 0){
      p.hp -= s.dmg; s.life = 0; shake = Math.max(shake, 0.3);
    }
  }
  g.eshots = g.eshots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Subida de nivel
  if (p.xp >= p.nextXp){
    p.xp -= p.nextXp;
    p.lvl++;
    p.nextXp = Math.floor(10*Math.pow(1.35, p.lvl-1));
    g.choices = [...UPGRADES].sort(() => Math.random()-0.5).slice(0,3);
    if (p.lvl >= 5) digivolve();
    g.pendingUp = true;
  }
  // Las mejoras aparecen cuando termina la animación de digievolución
  if (g.pendingUp && !g.evoAnim){
    g.pendingUp = false;
    openUpgrades();
  }

  // Fin
  if (p.hp <= 0){ p.hp = 0; endGame(false); }
  else if (g.bossDown) endGame(true);
}

function openUpgrades(){
  state = 'levelup';
  sfx('levelup');
  unlockMouse();   // hay que poder hacer clic en las mejoras
  const cat = {ofensiva:'Ofensiva', defensiva:'Defensiva', utilidad:'Utilidad'};
  showOverlay(`<h2>¡Nivel ${g.p.lvl}! Elige una mejora</h2>
    <p class="up-sub">Pulsa 1-3 o haz clic</p>
    <div class="row">${g.choices.map((c,i)=>`
      <div class="card ${c.k || 'utilidad'}" data-up="${i}">
        <span class="num">${i+1}</span>
        <span class="tag">${cat[c.k] || 'Mejora'}</span>
        <b>${c.t}</b>
        <p>${c.d || ''}</p>
      </div>`).join('')}</div>`);
  overlay.querySelectorAll('[data-up]').forEach(el => el.onclick = () => pickUpgrade(+el.dataset.up));
}

function pickUpgrade(i){
  if (state !== 'levelup') return;
  g.choices[i].f(g.p);
  hideOverlay();
  lockMouse();
  state = 'play';
}

function endGame(win){
  state = 'end';
  sfx(win ? 'victory' : 'defeat');
  const daily = loadDaily();
  const raw = Math.floor(g.kills/2 + g.t/10);
  const earned = Math.min(raw, Math.max(0, DAILY.runCap - daily.runBits));
  if (g.t >= 5) daily.runs += 1;
  daily.runBits += earned;
  let bonus = 0;
  if (!daily.claimed && daily.runs >= DAILY.runsGoal){ daily.claimed = true; bonus = DAILY.reward; }
  saveDaily(daily);
  SAVE.bits = SAVE.bits + earned + bonus;
  g.earned = earned + bonus;
  g.bonus = bonus;
  g.unlocked = recordRun(g.ch.id, g.kills, g.t);
  unlockMouse();
  saveRecord(win);

function syncMeshes(){
  const p = g.p;
  const gp = terrainH(p.x, p.z);
  g.playerMesh.position.set(p.x, gp + 1.1 + p.y, p.z);
  g.playerShadow.position.set(p.x, gp + 0.02, p.z);
  for (const e of g.enemies){
    const ge = terrainH(e.x, e.z);
    e.mesh.position.set(e.x, ge + e.mesh.scale.y/2, e.z);
    e.shadow.position.set(e.x, ge + 0.02, e.z);
  }
}
// Cámara orbital integrada con el ratón: el ratón bloqueado (pointer lock) gira la vista sin pulsar nada.
// Esc libera el ratón; al hacer clic de nuevo en la pantalla se vuelve a bloquear.
const camBase = new THREE.Vector3(0, 16, 11);
let camYaw = 0, camPitch = 0.9, camDist = 19.4;
const canvasEl = renderer.domElement;
// Algunos entornos (p. ej. paneles embebidos) rechazan el bloqueo: se ignora el error y el juego sigue
function lockMouse(onFail){
  const r = canvasEl.requestPointerLock();
  if (r && r.catch) r.catch(() => { if (onFail) onFail(); });
}
function unlockMouse(){
  const r = document.exitPointerLock();
  if (r && r.catch) r.catch(() => {});
}
canvasEl.addEventListener('mousedown', () => {
  if (state === 'play' && !document.pointerLockElement) lockMouse();
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvasEl) return;
  camYaw -= e.movementX*0.0025;
  camPitch = Math.max(0.2, Math.min(1.4, camPitch + e.movementY*0.0018));
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.max(10, Math.min(36, camDist + e.deltaY*0.02));
}, {passive: true});

function updateCamera(dt){
  const p = g.p;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  camBase.lerp(new THREE.Vector3(
    p.x + Math.sin(camYaw)*cp*camDist,
    terrainH(p.x, p.z) + 1.2 + sp*camDist,
    p.z + Math.cos(camYaw)*cp*camDist), Math.min(1, dt*10));
  shake = Math.max(0, shake - dt*2.5);
  const s = shake*shake*0.8;
  camera.position.set(
    camBase.x + (Math.random()-0.5)*s,
    camBase.y + (Math.random()-0.5)*s,
    camBase.z + (Math.random()-0.5)*s);
  camera.lookAt(p.x, terrainH(p.x, p.z) + 1.2 + p.y*0.5, p.z);
}

/* ---------- Música: pad ambiental sintetizado (Web Audio, sin archivos) ---------- */
const Music = {on: localStorage.getItem('digibonk3d-music') !== '0', nodes: null, timer: null};
function musicStart(){
  if (!Sfx.ctx || Music.nodes) return;
  const c = Sfx.ctx;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const out = c.createGain(); out.gain.value = 0;
  lp.connect(out); out.connect(c.destination);
  const voices = [0, 1, 2].map(() => {
    const o = c.createOscillator(); o.type = 'triangle';
    const g = c.createGain(); g.gain.value = 0.05;
    o.connect(g); g.connect(lp); o.start();
    return o;
  });
  const chords = [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]];
  let step = 0;
  const setChord = () => {
    const ch = chords[step++ % chords.length];
    voices.forEach((o, i) => o.frequency.setTargetAtTime(ch[i], c.currentTime, 0.8));
  };
  setChord();
  Music.timer = setInterval(setChord, 4000);
  out.gain.setTargetAtTime(0.6, c.currentTime, 1.5);
  Music.nodes = {voices, out};
}
function musicStop(){
  if (!Music.nodes) return;
  const {voices, out} = Music.nodes;
  out.gain.setTargetAtTime(0, Sfx.ctx.currentTime, 0.4);
  setTimeout(() => voices.forEach(o => { try { o.stop(); } catch(e){} }), 1500);
  clearInterval(Music.timer);
  Music.nodes = null;
}

/* ---------- Sonido: efectos sintetizados con Web Audio (sin archivos) ---------- */
const Sfx = {ctx:null, master:null, muted: localStorage.getItem('digibonk3d-sfx') === '0', last:{}, noiseBuf:null};
function audioInit(){
  if (Sfx.ctx){ if (Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  Sfx.ctx = new AC();
  Sfx.master = Sfx.ctx.createGain();
  Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  Sfx.master.connect(Sfx.ctx.destination);
  if (Music.on) musicStart();
  const len = Math.floor(Sfx.ctx.sampleRate * 0.5);
  Sfx.noiseBuf = Sfx.ctx.createBuffer(1, len, Sfx.ctx.sampleRate);
  const d = Sfx.noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
}
function tone(freq, dur, type, vol, slideTo, delay){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), gn = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(Sfx.master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, delay, hp){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const src = c.createBufferSource(); src.buffer = Sfx.noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
  const gn = c.createGain();
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(gn); gn.connect(Sfx.master);
  src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.05);
}
// Intervalo mínimo entre repeticiones para que los efectos frecuentes no saturen
const SFX_GAP = {shoot:70, hit:60, kill:40, hurt:250};
function sfx(name){
  const c = Sfx.ctx;
  if (!c || Sfx.muted || c.state !== 'running') return;
  if (SFX_GAP[name]){
    const now = performance.now();
    if (now - (Sfx.last[name] || 0) < SFX_GAP[name]) return;
    Sfx.last[name] = now;
  }
  switch (name){
    case 'shoot':   tone(880, .08, 'triangle', .07, 440); break;
    case 'hit':     noise(.05, .10, 0, 1500); break;
    case 'kill':    tone(520, .10, 'square', .06, 260); break;
    case 'hurt':    tone(170, .28, 'sawtooth', .16, 70); noise(.15, .06, 0, 300); break;
    case 'chest':   [523,659,784,1046].forEach((f,i) => tone(f, .16, 'triangle', .18, null, i*.07)); break;
    case 'levelup': [440,554,660,880].forEach((f,i) => tone(f, .18, 'square', .07, null, i*.08)); break;
    case 'evolve':  tone(220, 1.0, 'sawtooth', .10, 880); [523,659,784].forEach((f,i) => tone(f, .5, 'triangle', .14, null, .6 + i*.1)); break;
    case 'boss':    tone(65, 1.6, 'sawtooth', .16, 40); noise(1.2, .07, 0, 200); break;
    case 'victory': [523,659,784,1046,784,1046].forEach((f,i) => tone(f, .22, 'triangle', .18, null, i*.12)); break;
    case 'defeat':  tone(330, .6, 'triangle', .18, 110); tone(220, .9, 'triangle', .16, 55, .3); break;
  }
}
function toggleMute(silent){
  Sfx.muted = !Sfx.muted;
  localStorage.setItem('digibonk3d-sfx', Sfx.muted ? '0' : '1');
  if (Sfx.master) Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  if (!silent) announce(Sfx.muted ? 'Sonido desactivado' : 'Sonido activado', 'N para cambiarlo', '#7fd0ff');
}
addEventListener('pointerdown', audioInit);

/* ---------- Mapa 2D: minimapa en la esquina y mapa completo (tecla M) ---------- */
const VILLAGE_R = 14;   // radio aproximado del Pueblo Primario, en unidades del escenario
// Iconos: sprites del juego cargados una vez y reutilizados en el mapa
const iconCache = {};
function iconImg(src){
  if (!iconCache[src]){ const im = new Image(); im.src = src; iconCache[src] = im; }
  return iconCache[src];
}
function drawIcon(c, src, cx, cy, size){
  const im = iconImg(src);
  if (im.complete && im.naturalWidth) c.drawImage(im, cx - size/2, cy - size/2, size, size);
  else { c.fillStyle = '#ffffff'; c.beginPath(); c.arc(cx, cy, size/4, 0, Math.PI*2); c.fill(); }
}
function drawWorldMap(cv, size){
  if (!cv) return;
  const c = cv.getContext('2d');
  const R = size / 2, k = (R - 6) / ARENA_R;
  const X = x => R + x*k, Y = z => R + z*k;
  const u = size / 170;   // escala de los iconos según el tamaño del mapa
  c.clearRect(0, 0, size, size);
  c.fillStyle = '#4b5d72'; c.beginPath(); c.arc(R, R, R - 1, 0, Math.PI*2); c.fill();      // montañas
  c.fillStyle = '#3f7d3f'; c.beginPath(); c.arc(R, R, ARENA_R*k, 0, Math.PI*2); c.fill();  // prado
  c.fillStyle = 'rgba(215,168,110,.6)'; c.beginPath(); c.arc(X(0), Y(0), VILLAGE_R*k, 0, Math.PI*2); c.fill();
  c.fillStyle = '#2a7fb8'; c.beginPath(); c.arc(X(POND.x), Y(POND.z), POND.r*k, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff3d6'; c.font = `${Math.max(9, size/28)}px system-ui`; c.textAlign = 'center';
  c.fillText('Pueblo', X(0), Y(0) + 3);
  if (!g) return;
  // Cofres sin abrir: icono de regalo
  c.font = `${Math.max(12, 14*u)}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const ch of g.chests){
    if (ch.open) continue;
    c.fillText('🎁', X(ch.x), Y(ch.z));
  }
  // Enemigos: su propio sprite, en miniatura
  for (const e of g.enemies){
    if (e.boss) continue;
    const d = ENEMY[e.kind];
    drawIcon(c, d ? d.sprite : 'sprites/numemon.png', X(e.x), Y(e.z), (e.kind === 'tank' ? 16 : 12) * u);
  }
  // Jefe: Devimon
  if (g.boss && g.enemies.includes(g.boss)){
    drawIcon(c, 'sprites/devimon.png', X(g.boss.x), Y(g.boss.z), 26 * u);
  }
  // Jugador: el Digimon que estás usando
  const pc = X(g.p.x), py = Y(g.p.z);
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(pc, py, 12*u, 0, Math.PI*2); c.fill();
  drawIcon(c, spriteOf(g.ch.id, g.ch.evolved), pc, py, 24 * u);
}

// Cuatro skins por personaje. src: 'base' | 'logro' | 'gacha' | 'evento'

function loadJSON(k, def){ try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e){ return def; } }
let skinsOwned = loadJSON('digibonk3d-skins', {});      // {personaje: [ids de skin]}

// Progreso por personaje: partidas (de al menos 5 s) y bajas
function statsOf(key){ return loadJSON('digibonk3d-stats', {})[key] || {plays:0, kills:0}; }
function meetsReq(sk, st){
  return (!sk.req.plays || st.plays >= sk.req.plays) && (!sk.req.kills || st.kills >= sk.req.kills);
}
// Se llama al terminar cada partida: actualiza el progreso y devuelve las skins nuevas
function recordRun(key, kills, t){
  const all = loadJSON('digibonk3d-stats', {});
  const st = all[key] || {plays:0, kills:0};
  if (t >= 5) st.plays += 1;
  st.kills += kills;
  all[key] = st;
  localStorage.setItem('digibonk3d-stats', JSON.stringify(all));
  const unlocked = [];
  for (const sk of SKINS){
    if (sk.src === 'logro' && !ownedSkins(key).includes(sk.id) && meetsReq(sk, st)){
      grantSkin(key, sk.id); unlocked.push(`${sk.name} (${CHARS[key].name})`);
    }
  }
  if (t >= 5 && eventActive() && !ownedSkins(key).includes('festival')){
    grantSkin(key, 'festival'); unlocked.push(`Festival (${CHARS[key].name})`);
  }
  return unlocked;
}

// Sprites recoloreados o con efecto, generados en un canvas al arrancar
const skinURL = {};   // clave: personaje|evolucionado|skin
// Efecto glitch: desfase de canales R y B y algunas líneas desplazadas
function glitchPixels(x, w, h){
  const d = x.getImageData(0, 0, w, h), src = new Uint8ClampedArray(d.data), sh = Math.max(1, Math.round(w/64));
  for (let y = 0; y < h; y++){
    const rowShift = (y*37) % 23 === 0 ? sh*2 : 0;   // algunas filas se desplazan más
    for (let xx = 0; xx < w; xx++){
      const i = (y*w + xx) * 4;
      const xr = Math.min(w-1, Math.max(0, xx - sh - rowShift));
      const xb = Math.min(w-1, Math.max(0, xx + sh + rowShift));
      const ir = (y*w + xr) * 4, ib = (y*w + xb) * 4;
      d.data[i]   = src[ir];       // rojo desplazado a la izquierda
      d.data[i+1] = src[i+1];      // verde en su sitio
      d.data[i+2] = src[ib+2];     // azul desplazado a la derecha
      d.data[i+3] = src[i+3];
    }
  }
  x.putImageData(d, 0, 0);
}
function makeSkin(path, sk, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d');
    x.filter = sk.f || 'none';
    x.drawImage(img, 0, 0);
    x.filter = 'none';
    if (sk.fx === 'glitch') glitchPixels(x, c.width, c.height);
    try { cb(c.toDataURL('image/png')); } catch(e){}
  };
  img.src = path;
}
function buildSkins(){
  for (const key of SEASONS.adventure.chars){
    for (const evo of [false, true]){
      const path = evo ? EVO[key].sprite : CHARS[key].sprite;
      for (const sk of SKINS){
        if (sk.id === 'clasico') continue;
        makeSkin(path, sk, url => { skinURL[`${key}|${evo ? 1 : 0}|${sk.id}`] = url; });
      }
    }
  }
}

}

// Pesos por tipo de recompensa y por rareza
const CAT_WEIGHTS = [['skin', 35], ['frame', 20], ['title', 20], ['item', 25]];
function rollTier(){ const r = Math.random(); return r < 0.6 ? 'c' : r < 0.9 ? 'r' : 'e'; }
function pickCategory(){
  let tot = CAT_WEIGHTS.reduce((a, c) => a + c[1], 0), x = Math.random()*tot;
  for (const [k, w] of CAT_WEIGHTS){ if ((x -= w) < 0) return k; }
  return 'item';
}
// Devuelve una recompensa: {type, ...} o null si no queda nada de ese tipo
function rollReward(tier){
  const cat = pickCategory();
  if (cat === 'skin'){
    const pool = SEASONS.adventure.chars.filter(k => !ownedSkins(k).includes('cristal'));
    if (pool.length){ const key = pool[Math.floor(Math.random()*pool.length)]; return {type:'skin', key, sk: SKIN_BY_ID.cristal, tier:'e'}; }
  }
  if (cat === 'frame' || cat === 'skin'){
    const pool = FRAMES.filter(f => f.tier === tier && !inv.frames.includes(f.id));
    if (pool.length){ const f = pool[Math.floor(Math.random()*pool.length)]; return {type:'frame', f, tier: f.tier}; }
  }
  if (cat === 'title' || cat === 'frame' || cat === 'skin'){
    const pool = TITLES.filter(t => t.tier === tier && !inv.titles.includes(t.id));
    if (pool.length){ const t = pool[Math.floor(Math.random()*pool.length)]; return {type:'title', t, tier: t.tier}; }
  }
  const pool = ITEMS.filter(i => i.tier === tier);
  const it = pool[Math.floor(Math.random()*pool.length)];
  return {type:'item', it, tier: it.tier};
}
// Aplica la recompensa a la colección; los repetidos se convierten en Bits
function grantReward(r){
  if (r.type === 'skin'){
    grantSkin(r.key, 'cristal');
    return {...r, dup:false};
  }
  if (r.type === 'frame'){
    if (inv.frames.includes(r.f.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.frames.push(r.f.id); saveInv(); return {...r, dup:false};
  }
  if (r.type === 'title'){
    if (inv.titles.includes(r.t.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.titles.push(r.t.id); saveInv(); return {...r, dup:false};
  }
  inv.items[r.it.id] = (inv.items[r.it.id] || 0) + 1; saveInv();
  return {...r, dup:false};
}
// Tirada: 1 o 10. Con 10 se garantiza al menos una recompensa rara o épica
function doPulls(n){
  const cost = n === 10 ? PULL_COST_10 : PULL_COST;
  if (SAVE.bits < cost){
    announce('Bits insuficientes', `Necesitas ${cost} Bits`, '#ef5350');
    return;
  }
  SAVE.bits = SAVE.bits - cost;
  const tiers = Array.from({length: n}, () => rollTier());
  if (n === 10 && !tiers.some(t => t !== 'c')) tiers[9] = 'r';
  const results = [];
  for (const t of tiers){
    let r = rollReward(t);
    results.push(grantReward(r));
  }
  playPullAnimation(results);
}

/* ---------- Efectos de skin: bonus de estadísticas y aura alrededor del Digimon ---------- */
const dotTexCache = {};
function dotTex(kind, color){
  const k = kind + color;
  if (dotTexCache[k]) return dotTexCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = color;
  if (kind === 'star'){
    x.beginPath();
    for (let i = 0; i < 10; i++){ const r = i % 2 ? 6 : 14, a = -Math.PI/2 + i*Math.PI/5; x.lineTo(16 + Math.cos(a)*r, 16 + Math.sin(a)*r); }
    x.closePath(); x.fill();
  } else if (kind === 'shard'){
    x.beginPath(); x.moveTo(16, 2); x.lineTo(26, 16); x.lineTo(16, 30); x.lineTo(6, 16); x.closePath(); x.fill();
  } else {
    x.beginPath(); x.arc(16, 16, 9, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  dotTexCache[k] = t;
  return t;
}
// Bonus permanente: cada skin conseguida da su bonus a ese Digimon, equipada o no
function applySkinFx(key){
  const p = g.p;
  for (const id of ownedSkins(key)){
    const fx = SKIN_FX[id];
    if (!fx) continue;
    const b = fx.bonus;
    if (b.speed) p.speed *= b.speed;
    if (b.dmg) p.dmg *= b.dmg;
    if (b.pickup) p.pickup *= b.pickup;
    if (b.maxHp){ p.maxHp += b.maxHp; }
  }
  p.hp = p.maxHp;
}
function makeAura(skinId, key){
  const fx = SKIN_FX[skinId];
  if (!fx) return null;
  const group = new THREE.Group();
  world.add(group);
  const sprite = (map, color, scale) => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map, color: color || 0xffffff, transparent: true, depthWrite: false}));
    sp.scale.set(scale, scale, 1);
    group.add(sp);
    return sp;
  };
  let update = () => {};
  if (fx.aura === 'stars'){
    const st = Array.from({length: 6}, () => sprite(dotTex('star', '#d1a3ff'), 0xffffff, .45));
    update = t => st.forEach((s, i) => { const a = t*1.6 + i*Math.PI/3; s.position.set(Math.cos(a)*1.2, 2.2 + Math.sin(t*2 + i)*.15, Math.sin(a)*1.2); });
  } else if (fx.aura === 'shards'){
    const sh = Array.from({length: 6}, () => sprite(dotTex('shard', '#bff6ff'), 0xffffff, .4));
    update = t => sh.forEach((s, i) => { const a = -t + i*Math.PI/3; s.position.set(Math.cos(a)*1.0, 1.6 + Math.sin(t*3 + i)*.2, Math.sin(a)*1.0); });
  } else if (fx.aura === 'confetti'){
    const cols = ['#ffd54f', '#ff7043', '#81d4fa', '#aed581'];
    const cf = Array.from({length: 12}, (_, i) => sprite(dotTex('dot', cols[i % 4]), 0xffffff, .25));
    update = t => cf.forEach((s, i) => {
      const f = (t*0.5 + i/12) % 1;
      s.position.set(Math.sin(i*2.3)*1.1, .3 + f*2.4, Math.cos(i*1.7)*1.1);
      s.material.opacity = 1 - f;
    });
  } else if (fx.aura === 'ghost'){
    const url = spriteOf(key, false);
    const g1 = sprite(tex(url), 0xff4d6d, 2.2), g2 = sprite(tex(url), 0x4dd0ff, 2.2);
    g1.material.opacity = g2.material.opacity = .45;
    update = t => {
      const j = Math.sin(t*23) > .8 ? .14 : 0;   // parpadeo: el eco se separa de vez en cuando
      g1.position.set(-.12 - j, 1.1, 0);
      g2.position.set(.12 + j, 1.1, 0);
    };
  }
  return {group, update};
}

/* ---------- Equilibrio: perfil de cada Digimon según la dificultad ----------
   Valores iniciales basados en el daño por segundo (daño / recarga × multiplicador)
   y en la facilidad de cada estilo. Hay que ajustarlos con pruebas reales. */
const BALANCE = {
  palmon:  {dif:'Fácil',    hp:115, speed:5.6, dmgMul:1.00, why:'Cuchillas que giran alrededor: cubren a su alrededor sin apuntar'},
  gomamon: {dif:'Fácil',    hp:120, speed:5.4, dmgMul:0.80, why:'Mucha vida y ataques rápidos al más cercano: perdona errores'},
  gabumon: {dif:'Media',    hp:100, speed:6.0, dmgMul:1.60, why:'Onda en círculo: equilibrado, pero hay que colocarse entre enemigos'},
  gatomon: {dif:'Media',    hp:88,  speed:6.6, dmgMul:1.00, why:'Garras giratorias y velocidad alta: hay que mantenerse en movimiento'},
  biyomon: {dif:'Media',    hp:92,  speed:6.2, dmgMul:0.85, why:'Mucho daño por disparo, pero aguanta menos golpes'},
  patamon: {dif:'Difícil',  hp:84,  speed:7.0, dmgMul:0.75, why:'Muy rápido y de poco daño: exige buena posición y movimiento'}
};
function applyBalance(key){
  const b = BALANCE[key];
  if (!b) return;
  const p = g.p;
  p.maxHp = b.hp; p.hp = b.hp; p.speed = b.speed; p.dmg = b.dmgMul;
}

let frameNo = 0;
/* ---------- Agua: chapoteo, anillos y frenado dentro del estanque ---------- */
const waterFx = [];   // gotas y anillos: {m, vx, vy, vz, life, t, kind, r0}
const dropGeo = new THREE.SphereGeometry(0.07, 6, 6);
const ringGeo = new THREE.RingGeometry(0.82, 1, 32);
function waterSlow(x, z){ return 1 - 0.4*pondWeight(x, z); }
function splashAt(x, z, n){
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(dropGeo, new THREE.MeshBasicMaterial({color: 0xdff6ff, transparent: true}));
    m.position.set(x, POND.water + 0.05, z);
    scene.add(m);
    const a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*2.2;
    waterFx.push({m, kind: 'drop', vx: Math.cos(a)*sp, vy: 3.5 + Math.random()*2.5, vz: Math.sin(a)*sp, t: 0, life: 0.6});
  }
}
function addRipple(x, z, r0){
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: 0xeaf8ff, transparent: true, opacity: 0.8, depthWrite: false}));
  m.rotation.x = -Math.PI/2;
  m.position.set(x, POND.water + 0.04, z);
  m.scale.setScalar(r0);
  scene.add(m);
  waterFx.push({m, kind: 'ring', r0, t: 0, life: 0.8});
}
function updateWater(dt){
  for (let i = waterFx.length - 1; i >= 0; i--){
    const f = waterFx[i];
    f.t += dt;
    if (f.kind === 'drop'){
      f.vy -= 14*dt;
      f.m.position.x += f.vx*dt; f.m.position.z += f.vz*dt; f.m.position.y += f.vy*dt;
      f.m.material.opacity = Math.max(0, 1 - f.t/f.life);
    } else {
      const sc = f.r0 + f.t*1.9;
      f.m.scale.setScalar(sc);
      f.m.material.opacity = 0.8*Math.max(0, 1 - f.t/f.life);
    }
    if (f.t >= f.life){ scene.remove(f.m); waterFx.splice(i, 1); }
  }
  if (!g || state !== 'play') return;
  const p = g.p;
  const inside = pondWeight(p.x, p.z) > 0.6;
  if (inside && !g.inWater) splashAt(p.x, p.z, 14);              // entrada: salpicadura
  const moved = g.lastX !== undefined && Math.hypot(p.x - g.lastX, p.z - g.lastZ) > 0.01;
  if (inside && moved){                                          // al andar: anillos y gotas
    g.wakeT = (g.wakeT || 0) - dt;
    if (g.wakeT <= 0){ addRipple(p.x, p.z, 0.6); splashAt(p.x, p.z, 2); g.wakeT = 0.3; }
  }
  g.inWater = inside;
  g.lastX = p.x; g.lastZ = p.z;
}

// ---------- Bucle ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  if (state === 'play' && g){
    if (!g.evoAnim) update(dt);   // durante la digievolución el mundo se detiene y solo corre la animación
    if (g){
      syncMeshes(); updateCamera(dt); updateHUD();
      if (g.aura){ g.aura.group.position.set(g.p.x, terrainH(g.p.x, g.p.z) + g.p.y, g.p.z); g.aura.update(g.t); }
    }
  }
  animateEvo(dt);
  updateFx(dt);
  updateWater(dt);
  hurtT = Math.max(0, hurtT - dt);
  document.getElementById('hurt').style.opacity = (hurtT / 0.45) * 0.85;
  for (const n of npcs) n.sprite.position.y = n.base + Math.sin(now*0.003 + n.ph)*0.08;   // habitantes respiran
  frameNo++;
  if (state === 'play' && g && frameNo % Q.minimapEvery === 0) drawWorldMap(document.getElementById('minimap'), 170);
  if (state === 'map' && g) drawWorldMap(document.getElementById('bigmap'), 600);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildSkins();
showSelect();
requestAnimationFrame(frame);
</script>
</body>
