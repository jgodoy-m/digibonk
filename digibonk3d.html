<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DigiBonk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
/* HUD estilo Digivice: paneles azul oscuro con borde neón */
#hud{position:fixed;left:16px;top:16px;pointer-events:none}
.hud-card{display:flex;gap:14px;align-items:center;padding:10px 14px 10px 10px;border-radius:16px;
  background:linear-gradient(160deg,rgba(24,62,110,.94),rgba(8,18,40,.95));border:2px solid #7fd0ff;
  box-shadow:0 0 18px rgba(79,195,247,.35),inset 0 2px 0 rgba(255,255,255,.15)}
.hud-portrait{position:relative;width:66px;height:66px;border-radius:14px;display:grid;place-items:center;
  border:2px solid #7fd0ff;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.05))}
#pimg{width:54px;height:54px;image-rendering:pixelated}
.hud-lvl{position:absolute;right:-9px;bottom:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;
  background:#ffd54f;color:#1a1200;font-weight:900;font-size:13px;border:2px solid #1a1200}
.hud-main{min-width:250px}
.hud-name{font-weight:900;font-size:17px;letter-spacing:.5px;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.1}
.hud-hp{position:relative;width:250px;height:18px;margin-top:6px;border-radius:9px;background:#06141a;border:1px solid #3b78b0;overflow:hidden}
#hp{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#3fb950,#a6e35a);transition:width .15s}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px 2px #000}
.hud-chips{display:flex;gap:6px;margin-top:7px}
.chip{font-size:12px;padding:2px 9px;border-radius:9px;background:rgba(8,18,40,.85);border:1px solid #2d5f78;color:#cfe8ff;white-space:nowrap}
.chip b{color:#fff}
.chip.ready{border-color:#7cf29c;color:#7cf29c;box-shadow:0 0 8px rgba(124,242,156,.5)}
#timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:4px 18px;border-radius:10px;
  background:#0b1120;border:2px solid #ffd54f;box-shadow:0 0 14px rgba(255,213,79,.35);
  font-family:'Consolas',monospace;font-size:26px;font-weight:bold;color:#ffd54f;pointer-events:none}
#xp{position:fixed;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,#0288d1,#4fc3f7);box-shadow:0 0 10px #4fc3f7;pointer-events:none}
#xpTxt{position:fixed;left:16px;bottom:14px;font-size:12px;font-weight:bold;letter-spacing:.5px;color:#cfe8ff;text-shadow:0 1px 3px #000;pointer-events:none}
/* El temporizador avisa cuando falta menos de 30 s para el jefe */
#timer.urgent{color:#ff5252;border-color:#ff5252;box-shadow:0 0 18px rgba(255,82,82,.6);animation:timerPulse .8s ease-in-out infinite}
@keyframes timerPulse{50%{transform:translateX(-50%) scale(1.06)}}
#combo{position:fixed;right:24px;top:200px;padding:4px 14px;border-radius:10px;background:#ffd54f;color:#1a1200;
  font-weight:900;font-size:28px;box-shadow:0 0 14px rgba(255,213,79,.6);pointer-events:none}
#combo:empty{display:none}
/* Anuncios centrales (digievolución, cofres, hordas, jefe) */
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#banner b{display:block;font-size:46px;letter-spacing:3px;color:inherit;text-shadow:0 4px 0 #000,0 0 24px currentColor}
#banner small{display:block;margin-top:4px;font-size:15px;letter-spacing:1px;color:#e6f4ff;text-shadow:0 2px 4px #000}
#banner.show{animation:bannerIn 2.4s ease both}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.98)}}
/* Viñeta roja al recibir daño */
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(198,40,40,.9) 100%)}
/* Aviso flotante sobre el cofre cercano */
#prompt{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:none;padding:5px 12px;border-radius:10px;
  background:rgba(8,14,30,.92);border:2px solid #ffd54f;color:#ffd54f;font-weight:bold;font-size:14px;letter-spacing:.5px;
  pointer-events:none;white-space:nowrap;box-shadow:0 0 12px rgba(255,213,79,.4)}
#prompt kbd{display:inline-block;min-width:20px;padding:0 6px;margin-right:4px;border-radius:5px;background:#ffd54f;color:#1a1200;text-align:center}
/* Pantalla de inicio: el Digimon de la vista previa flota suavemente */
.preview img{animation:previewBob 2.6s ease-in-out infinite}
@keyframes previewBob{50%{transform:translateY(-6px)}}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,16,34,.75),rgba(0,0,0,.9));text-align:center}
#overlay.hidden{display:none}
#overlay.menu-mode{display:block;background:linear-gradient(90deg,rgba(4,7,16,.95) 0%,rgba(4,7,16,.75) 50%,rgba(4,7,16,.2) 100%)}
#overlay.menu-mode.hidden{display:none}
.menu{position:absolute;inset:0;display:grid;grid-template-columns:1fr 330px;grid-template-rows:1fr auto;gap:22px;padding:34px 40px 22px;box-sizing:border-box}
.m-left{align-self:center}
.logo{font-size:60px;font-weight:900;letter-spacing:2px;line-height:1;color:#fff;text-shadow:0 4px 0 #1565c0,0 0 24px rgba(79,195,247,.6);text-align:left}
.logo span{color:#ffd54f}
.logo em{font-style:normal;color:#4fc3f7;font-size:36px}
.sub{margin:8px 0 24px;color:#90caf9;font-size:15px;letter-spacing:1px;text-align:left}
.play{padding:16px 56px;font-size:26px;font-weight:900;letter-spacing:3px;border:0;border-radius:14px;cursor:pointer;color:#1a1200;background:linear-gradient(180deg,#ffe082,#ffb300);box-shadow:0 6px 0 #b27300,0 0 26px rgba(255,193,7,.45)}
.play:hover{transform:translateY(-2px)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #b27300}
.tiles{display:flex;gap:14px;margin-top:22px}
.tile{flex:1;padding:14px 16px;border-radius:12px;background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;text-align:left;min-width:0}
.tile b{display:block;color:#ffd54f;font-size:16px}
.tile small{display:block;opacity:.8;margin-top:4px;font-size:12px}
.tile.dis{opacity:.45;border-color:#38465f}
.m-right{align-self:center;background:rgba(8,14,30,.92);border:2px solid #4fc3f7;border-radius:14px;padding:16px 18px;box-shadow:0 0 18px rgba(79,195,247,.25);max-height:70vh;overflow:auto}
.m-right h3{margin:0 0 10px;color:#ffd54f;font-size:18px;letter-spacing:1px}
.rec{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid #1e2a44;font-size:13px}
.muted{opacity:.7;font-size:13px}
.m-bottom{grid-column:1/3;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;opacity:.85;text-align:left}
.picker{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.pick-card{width:150px;flex:0 0 150px;padding:12px;border-radius:12px;cursor:pointer;background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;text-align:center;transition:transform .12s}
.pick-card:hover{transform:translateY(-3px)}
.pick-card.sel{border-color:#ffd54f;box-shadow:0 0 18px rgba(255,213,79,.5)}
.pick-card img{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.pick-card b{color:#ffd54f;font-size:14px}
.pick-card small{display:block;opacity:.8;margin-top:4px;font-size:11px}
.legal{font-size:11px;opacity:.55;margin:0;text-align:left}
#overlay h1{margin:0 0 6px;font-size:44px;letter-spacing:2px;color:#4fc3f7;text-shadow:0 0 18px rgba(79,195,247,.6)}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.card{width:220px;padding:14px;border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .12s;
  background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;box-shadow:0 0 12px rgba(79,195,247,.25)}
.card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 22px rgba(79,195,247,.6)}
.card img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.card b{color:#ffd54f;font-size:17px}
.card small{display:block;opacity:.8;margin-top:6px;font-size:13px}
/* ---- Pantalla de inicio: vista previa del Digimon, stats y tecla de atajo ---- */
#overlay.menu-mode{background:radial-gradient(ellipse 90% 80% at 70% 40%,rgba(21,46,96,.55),rgba(4,7,16,.96) 70%)}
.menu{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;gap:26px 30px;padding:30px 40px 24px}
.m-left{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:26px;align-items:center}
.m-left .brand{min-width:0}
.preview{background:linear-gradient(170deg,rgba(30,42,68,.96),rgba(10,16,32,.96));border:2px solid #ffd54f;border-radius:18px;
  padding:18px;text-align:center;box-shadow:0 0 26px rgba(255,213,79,.25)}
.preview img{width:150px;height:150px;image-rendering:pixelated;display:block;margin:0 auto 8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.preview h2{margin:0;color:#ffd54f;font-size:24px;letter-spacing:1px}
.preview .pdesc{margin:6px 0 12px;font-size:13px;color:#cfe8ff;min-height:34px}
.stat{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:12px;margin:6px 0;text-align:left;color:#b0bec5}
.stat i{display:block;height:8px;border-radius:4px;background:#1b2740;overflow:hidden}
.stat i b{display:block;height:100%;background:linear-gradient(90deg,#0288d1,#4fc3f7);border-radius:4px}
.stat i b.warm{background:linear-gradient(90deg,#ff8f00,#ffd54f)}
.tiles{margin-top:18px}
.picker{padding:10px 4px 14px}
.pick-card{position:relative;width:118px;flex:0 0 118px;padding:10px 8px;cursor:pointer}
.pick-card.sel{transform:translateY(-4px)}
.pick-card img{width:60px;height:60px;margin:0 auto 4px}
.pick-card b{font-size:13px}
.pick-card small{font-size:10px;line-height:1.25;opacity:.75}
.pick-card .num{position:absolute;top:6px;left:8px;font-size:11px;color:#90caf9;font-weight:bold}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border-radius:5px;background:#16213a;border:1px solid #4fc3f7;
  border-bottom-width:3px;font-size:12px;font-weight:bold;text-align:center;color:#e3f2fd}
.hints{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#cfe8ff}
.hints span{white-space:nowrap}
.rec{align-items:center}
.rec.best{color:#ffd54f;font-weight:bold;background:linear-gradient(90deg,rgba(255,213,79,.12),transparent)}
.rec span:first-child{font-weight:bold}
.m-right h3 small{display:block;font-size:12px;opacity:.6;letter-spacing:0;margin-top:4px;color:#90caf9}
/* ---- Subida de nivel: tarjetas por categoría ---- */
.card{width:230px;text-align:left;position:relative;border-top-width:6px}
.card.ofensiva{border-color:#ef5350;border-top-color:#ef5350}
.card.defensiva{border-color:#66bb6a;border-top-color:#66bb6a}
.card.utilidad{border-color:#ab47bc;border-top-color:#ab47bc}
.card .tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:8px;margin-bottom:6px;color:#0b0f1a;font-weight:bold}
.card.ofensiva .tag{background:#ef5350}
.card.defensiva .tag{background:#66bb6a}
.card.utilidad .tag{background:#ab47bc;color:#fff}
.card .num{position:absolute;right:12px;top:14px;color:#90caf9;font-weight:bold;font-size:14px}
.card b{display:block;font-size:17px;padding-right:24px;text-align:left;color:#ffd54f}
.card p{margin:8px 0 0;font-size:13px;line-height:1.35;color:#dbe9ff;text-align:left}
#overlay h2{margin:0;font-size:24px;color:#ffd54f;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.up-sub{margin:6px 0 0;font-size:13px;color:#90caf9}
.card.sel-key{outline:2px dashed rgba(255,255,255,.25);outline-offset:4px}
/* ---- Pausa: Digivice azul (mismo diseño que la demo) ---- */
#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(ellipse at center,rgba(10,20,44,.45),rgba(3,6,14,.86));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20}
#pause.hidden{display:none}
.pz-device{position:relative;width:min(540px,94vw);max-height:96vh;overflow:hidden;padding:30px 36px 20px;
  border-radius:44% 44% 36% 36% / 14% 14% 10% 10%;color:#e6f4ff;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.4),transparent 35%),linear-gradient(160deg,#7fcaf3,#3d8fd1 32%,#1f5fa2 64%,#143f74);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -12px 22px rgba(0,20,50,.55),0 0 0 3px #0b1d3a,0 26px 60px rgba(0,0,0,.75)}
.pz-brand{text-align:center;font-weight:900;letter-spacing:6px;font-size:12px;color:#0d2a52;margin:-14px 0 6px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pz-bezel{background:linear-gradient(180deg,#0d2238,#071526);border-radius:26px;padding:12px;box-shadow:inset 0 3px 10px rgba(0,0,0,.8)}
.pz-lcd{position:relative;border-radius:18px;padding:14px 16px;background:radial-gradient(ellipse at 50% 0%,#2b4b52,#16292e 50%,#0a1518);box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.pz-title{width:max-content;margin:0 auto 4px;padding:4px 16px;border-radius:10px;font-weight:900;letter-spacing:2px;font-size:12px;color:#fff;
  background:linear-gradient(180deg,#3a94e0,#1d5ea8);border:1px solid #7fd0ff;text-shadow:0 1px 0 #0d2a52}
.pz-zone{text-align:center;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#bfe9d8}
.pz-st{color:#7cf29c}
.pz-close{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:2px solid #9fe3ff;background:#0a2a4d;color:#fff;cursor:pointer;font-size:13px}
.pz-close:hover{background:#15527f}
.pz-profile{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin-top:10px}
.pz-av{width:92px;height:92px;border-radius:14px;border:2px solid #7fd0ff;display:grid;place-items:center;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.04))}
.pz-av img{width:74px;height:74px;object-fit:contain;image-rendering:pixelated}
.pz-name{font-size:26px;font-weight:900;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.05}
.pz-quote{font-size:12px;font-style:italic;color:#bfe9ff;margin:2px 0 6px}
.pz-lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#bfe9ff;text-transform:uppercase;margin:5px 0 2px}
.pz-bar{height:13px;border-radius:7px;background:#06141a;border:1px solid #3b78b0;overflow:hidden;position:relative}
.pz-bar i{position:absolute;top:0;bottom:0;left:0;display:block;background:linear-gradient(90deg,#3fb950,#a6e35a)}
.pz-bar.evo i{background:linear-gradient(90deg,#8e24aa,#ffd54f)}
.pz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.pz-stats div{text-align:center;padding:6px 2px;border-radius:10px;background:rgba(8,26,34,.8);border:1px solid #2d5f78}
.pz-stats small{display:block;font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:#9ad3e8;line-height:1.2;min-height:20px}
.pz-stats b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.pz-btns{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:8px}
.pz-btn{padding:10px 6px;border-radius:12px;border:1px solid #7fd0ff;cursor:pointer;font:900 12px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;line-height:1.15;
  background:linear-gradient(180deg,#1e3a66,#0e1f3d);box-shadow:0 4px 0 #050b18}
.pz-btn small{display:block;font-size:9px;letter-spacing:.6px;font-weight:700;opacity:.85}
.pz-btn:hover{filter:brightness(1.12)}
.pz-btn:active{transform:translateY(2px)}
.pz-primary{background:linear-gradient(180deg,#7ef07e,#2fa84a 60%,#1c7a33);border-color:#bdf9c6;box-shadow:0 4px 0 #0f4a20}
.pz-danger{background:linear-gradient(180deg,#ff7a6b,#c62828 60%,#8e1b1b);border-color:#ffb3a8;box-shadow:0 4px 0 #4a0b0b}
.pz-confirm{text-align:center;padding:6px 0}
.pz-warn{font-size:17px;font-weight:bold;color:#ef9a9a;letter-spacing:.5px}
.pz-confirm p{margin:4px 0 12px;font-size:13px;color:#cfe8ff}
.pz-confirm .pz-btns{grid-template-columns:1fr 1fr}
.pz-keys{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:12px;font-size:11px;color:#cfe8ff}
.pz-keys span{white-space:nowrap}
.pz-keys .kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#f4f7fb,#b8c4d6);color:#1a2236;font:bold 10px ui-monospace,Menlo,monospace;border:1px solid #fff;box-shadow:0 2px 0 #55607a;text-align:center}
/* Viñeta suave del entorno */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(10,20,40,.45) 100%)}
/* Minimapa y mapa completo */
#minimap{position:fixed;right:16px;top:16px;width:170px;height:170px;border-radius:50%;border:3px solid #4fc3f7;
  box-shadow:0 0 14px rgba(79,195,247,.4);pointer-events:none;background:#16321f}
#mapview{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(4,8,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:15;cursor:pointer}
#mapview.open{display:flex}
#bigmap{width:min(72vh,600px);height:min(72vh,600px);border-radius:50%;border:3px solid #4fc3f7;box-shadow:0 0 30px rgba(79,195,247,.4)}
.mapleg{font-size:13px;color:#cfe8ff;text-align:center;background:rgba(6,14,26,.85);padding:6px 14px;border-radius:10px;border:1px solid #2d5f78}
/* Menú de inicio: fila de skins y monedas */
.menu-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px}
.mini-btn{padding:9px 16px;border-radius:12px;border:1px solid #7fd0ff;background:linear-gradient(180deg,#1e3a66,#0e1f3d);color:#fff;font-weight:bold;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 #050b18}
.mini-btn:hover{filter:brightness(1.15)}
.bits-chip{padding:7px 12px;border-radius:10px;background:#1b2a14;border:1px solid #7cf29c;color:#b9f6ca;font-weight:bold;white-space:nowrap}
.daily-chip{font-size:12px;color:#cfe8ff;opacity:.9}
.dif{padding:1px 7px;border-radius:7px;font-size:11px;color:#06101e}
.dif-Fácil{background:#7cf29c}.dif-Media{background:#ffd54f}.dif-Difícil{background:#ef5350;color:#fff}
/* Gacha de skins */
.gacha{width:min(880px,96vw);max-height:92vh;overflow:auto;padding:18px 22px;border-radius:18px;color:#e6f4ff;text-align:left;
  background:linear-gradient(170deg,rgba(24,36,64,.97),rgba(8,12,26,.97));border:2px solid #4fc3f7;box-shadow:0 0 30px rgba(79,195,247,.35)}
.g-head{display:flex;align-items:center;gap:14px}
.g-head h2{margin:0;flex:1;font-size:24px;color:#ffd54f;letter-spacing:1px}
.g-back{padding:7px 12px;border-radius:10px;border:1px solid #4fc3f7;background:#0e1f3d;color:#fff;cursor:pointer}
.g-bits{padding:6px 12px;border-radius:10px;background:#1b2a14;border:1px solid #7cf29c;color:#b9f6ca;font-weight:bold}
.g-top{display:grid;grid-template-columns:240px 1fr;gap:14px;margin:14px 0}
.g-pull,.g-result{border-radius:14px;padding:14px;background:rgba(8,20,40,.8);border:1px solid #2d5f78;text-align:center}
.g-cost{font-size:13px;color:#9fd4ff}

/* Ajustes */

/* Gacha: botones grandes, colección, animación de cápsula y resultados */
.pull-bar{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin:12px 0}
.pull-btn{padding:20px 12px;border-radius:20px;border:3px solid #fff;cursor:pointer;color:#1a1200;font-weight:900;letter-spacing:2px;font-size:24px;
  background:linear-gradient(180deg,#ffe082,#ffc94d);box-shadow:0 9px 0 #b27300}

.col-tile{padding:8px 6px;border-radius:14px;border:2px solid #2d5f78;background:rgba(8,20,40,.9);color:#cfe8ff;cursor:pointer;text-align:center;font-size:12px}

.col-equip b{color:#ffd54f}

/* Marcos del icono del Digimon (HUD) */
.hud-portrait.fr-bronce{border-color:#cd7f32;box-shadow:0 0 8px #cd7f32}
.hud-portrait.fr-digivice{border-color:#4fc3f7;box-shadow:0 0 12px #4fc3f7}
.hud-portrait.fr-neon{border-color:#ff4fd8;box-shadow:0 0 14px #ff4fd8}
.hud-portrait.fr-oro{border-color:#ffd54f;box-shadow:0 0 16px #ffd54f}
.rw-frame.fr-bronce{border:3px solid #cd7f32}.rw-frame.fr-digivice{border:3px solid #4fc3f7}
.rw-frame.fr-neon{border:3px solid #ff4fd8}.rw-frame.fr-oro{border:3px solid #ffd54f}
.hud-title{font-size:11px;color:#bfe9ff;letter-spacing:.5px;margin-top:2px;text-shadow:0 1px 2px #000}
/* Animación de la cápsula */
.pull-stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.capsule{position:relative;width:110px;height:110px;animation:capShake .9s ease-in-out both}
.cap-top,.cap-bot{position:absolute;left:0;width:110px;height:55px;border:3px solid #fff}
.cap-top{top:0;background:#ff3b3b;border-radius:55px 55px 0 0}
.cap-bot{bottom:0;background:#fff;border-radius:0 0 55px 55px}
.cap-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,160,.9),transparent 65%);animation:capGlow .9s ease-out both}
@keyframes capShake{0%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-12deg)}60%{transform:rotate(12deg)}75%{transform:scale(1.15)}100%{transform:scale(1.25);opacity:0}}
@keyframes capGlow{0%,70%{opacity:0}85%{opacity:1}100%{opacity:0}}
.pull-wait{color:#ffd54f;font-weight:bold;letter-spacing:2px}
/* Resultados de la tirada */
.pull-results{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(760px,94vw)}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.multi .pr-grid{grid-template-columns:repeat(5,1fr)}
.rw-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:18px;background:rgba(10,18,40,.95);border:3px solid #4fc3f7;color:#e6f4ff;text-align:center;animation:rwIn .45s cubic-bezier(.2,1.4,.4,1) both}
.rw-card img{width:64px;height:64px;image-rendering:pixelated}
.rw-card b{font-size:13px}
.rw-card small{font-size:11px;opacity:.85}
.rw-card.tier-r{border-color:#ce93d8;box-shadow:0 0 14px rgba(206,147,216,.6)}
.rw-card.tier-e{border-color:#ffd54f;box-shadow:0 0 22px rgba(255,213,79,.8);animation:rwIn .45s cubic-bezier(.2,1.4,.4,1) both,rwPulse 1.4s ease-in-out infinite}
@keyframes rwIn{from{opacity:0;transform:translateY(24px) scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes rwPulse{50%{box-shadow:0 0 30px rgba(255,213,79,1)}}
.pr-ok{padding:14px 40px;font-size:18px}

/* Fondo animado de los menús: a pantalla completa, detrás de la interfaz */
#menubg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;display:block}
#overlay{z-index:1}

/* Marcos: cada uno es un modelo de Digivice distinto */
.hud-portrait.fr-bronce,.rw-frame.fr-bronce{background:linear-gradient(160deg,#fff0bd,#d89a3e 55%,#8a5a1c);border:4px solid #5a3510;border-radius:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 12px rgba(216,154,62,.7)}
.hud-portrait.fr-digivice,.rw-frame.fr-digivice{background:linear-gradient(160deg,#d9f3ff,#2a7fd0 60%,#0d3f7a);border:4px solid #0b3d78;border-radius:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 14px rgba(79,195,247,.8)}
.hud-portrait.fr-dpower,.rw-frame.fr-dpower{background:linear-gradient(160deg,#e6ffc4,#4fb84a 60%,#1f5c22);border:4px solid #1f5c22;border-radius:14px 14px 22px 22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 14px rgba(120,230,110,.8)}
.hud-portrait.fr-neon,.rw-frame.fr-neon{background:linear-gradient(160deg,#2b0f3d,#14061f);border:4px solid #ff4fd8;border-radius:24px;box-shadow:0 0 16px #ff4fd8,inset 0 0 12px rgba(255,79,216,.5)}
.hud-portrait.fr-oro,.rw-frame.fr-oro{background:linear-gradient(160deg,#fff8d6,#e8b42a 55%,#7a5410);border:4px solid #7a5410;border-radius:18px;box-shadow:0 0 18px #ffd54f,inset 0 0 0 2px #fff3c4}
.hud-portrait[class*="fr-"]::after,.rw-frame[class*="fr-"]::after{content:"";position:absolute;right:-6px;top:-6px;width:10px;height:10px;border-radius:50%;background:#7cf29c;box-shadow:0 0 8px #7cf29c;border:2px solid #0a1428}
.hud-portrait.fr-neon::after{background:#ff4fd8;box-shadow:0 0 8px #ff4fd8}
.hud-portrait.fr-oro::after{background:#fff3c4;box-shadow:0 0 8px #ffd54f}
.hud-portrait.fr-digivice::after{background:#bfeaff;box-shadow:0 0 8px #4fc3f7}
.hud-portrait.fr-dpower::after{background:#e6ffc4}
.hud-portrait.fr-bronce::after{background:#ffe9a8}
.rw-frame{position:relative;border-radius:14px}
/* Registro de entrenador */
.reg-box{width:min(460px,92vw);padding:26px 28px;border-radius:24px;background:rgba(10,18,40,.96);border:3px solid #3a6fc4;text-align:center;color:#e6f4ff;font-family:'Orbitron',system-ui,sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.reg-logo{font-size:40px;margin-bottom:8px}
.reg-box h2{margin:6px 0;color:#ffd54f;font-size:20px}
.reg-box p{font-family:system-ui,sans-serif;font-size:13px;color:#9fd4ff;margin:6px 0 16px}
.reg-box input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #3a6fc4;background:#0a1428;color:#fff;font:700 18px 'Orbitron',system-ui,sans-serif;text-align:center;outline:none}
.reg-box input:focus{border-color:#ffd54f}
.reg-go{margin-top:16px;width:100%;font-size:22px;padding:14px}
.name-edit{display:flex;gap:8px;margin-top:8px}
.name-edit input{flex:1;padding:8px 10px;border-radius:10px;border:2px solid #3a6fc4;background:#0a1428;color:#fff;font:700 14px 'Orbitron',system-ui,sans-serif}

/* Código de guardado */
.sc-box{width:min(680px,94vw)}
.sc-p{font-family:system-ui,sans-serif;font-size:13px;color:#9fd4ff;margin:8px 0}
.sc-box textarea{width:100%;height:92px;padding:10px;border-radius:12px;border:2px solid #3a6fc4;background:#0a1428;color:#cfe8ff;font:12px ui-monospace,Menlo,monospace;resize:vertical;box-sizing:border-box}
.sc-row{display:flex;justify-content:flex-end;margin:8px 0 6px}
.sc-row .mini-btn.armed{background:linear-gradient(180deg,#ff7a6b,#e0463a);color:#fff}

/* Fondo de los menús: la ilustración con estrellas que parpadean */
#menuart{position:fixed;inset:0;z-index:0;background:#0a1830 url('ui/fondo-menu.jpg') center/cover no-repeat;overflow:hidden}
#menuart .stars{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 37% 9%,#cfe9ff,transparent),
    radial-gradient(2px 2px at 63% 22%,#fff,transparent),radial-gradient(1px 1px at 82% 14%,#ffe0ff,transparent),
    radial-gradient(1.5px 1.5px at 91% 34%,#fff,transparent),radial-gradient(1px 1px at 25% 42%,#cfe9ff,transparent);
  animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.45}100%{opacity:1}}
/* Registro: panel cyber con borde de circuito */
.reg-box{background:linear-gradient(180deg,rgba(8,26,40,.94),rgba(6,16,30,.96));border:2px solid #2ee6d6;border-radius:14px;
  box-shadow:0 0 26px rgba(46,230,214,.45),inset 0 0 30px rgba(46,230,214,.08);position:relative}
.reg-box::before,.reg-box::after{content:"";position:absolute;width:26px;height:26px;border:3px solid #2ee6d6;pointer-events:none}
.reg-box::before{top:-6px;left:-6px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.reg-box::after{bottom:-6px;right:-6px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.reg-logo{background:none;font-size:40px}
.reg-logo span{color:#ffe070;text-shadow:0 0 12px rgba(255,224,112,.6)}
.reg-logo{color:#fff;text-shadow:0 0 14px rgba(46,230,214,.7)}
.reg-box h2{color:#ffe070;text-shadow:0 0 10px rgba(255,224,112,.5)}
.reg-box input{border:2px solid #2ee6d6;background:rgba(4,14,24,.9);color:#bff7f1;box-shadow:0 0 12px rgba(46,230,214,.25)}
.reg-box input:focus{border-color:#7ff9ee;box-shadow:0 0 18px rgba(46,230,214,.6)}
.reg-logo{text-align:center}
#overlay:has(.reg-box){background:rgba(0,0,0,.12)}
/* Registro: panel opaco (no deja ver el panel de la ilustración) y campo dentro del marco */
.reg-box{background:#06121d;background-image:linear-gradient(180deg,rgba(46,230,214,.07),rgba(0,0,0,0))}
.reg-box input{box-sizing:border-box;max-width:100%}
.reg-guest{margin-top:12px;width:100%;padding:10px;font-size:12px;opacity:.85}

/* Perfil rediseñado y paneles opacos */
.picker-screen{background:linear-gradient(170deg,#14284a,#0a1224) !important}
.pf-hero{display:flex;gap:22px;align-items:center;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(30,60,100,.55),rgba(10,18,40,.8));border:2px solid #2d5f78}
.pf-av{width:150px;height:150px;flex:0 0 auto;display:grid;place-items:center;border-radius:20px;border:3px solid #3a6fc4;background:radial-gradient(circle,rgba(127,208,255,.3),rgba(127,208,255,.04))}
.pf-av img{width:120px;height:120px;image-rendering:pixelated}
.pf-id{flex:1;min-width:0}
.pf-label{font-size:11px;letter-spacing:3px;color:#9fd4ff;text-transform:uppercase}
.pf-name{font-size:30px;font-weight:900;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;margin:2px 0 8px;font-family:'Orbitron',system-ui,sans-serif}
.pf-tags{margin-bottom:10px}
.pf-tag{display:inline-block;padding:4px 12px;border-radius:20px;background:#ffd54f;color:#1a1200;font-weight:700;font-size:12px;margin:0 6px 6px 0;font-family:system-ui,sans-serif}
.pf-tag.alt{background:#2d5f78;color:#e6f4ff}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.pf-stat{padding:14px 8px;border-radius:16px;background:rgba(8,20,40,.92);border:1px solid #2d5f78;text-align:center}
.pf-stat .ic{display:block;font-size:20px;margin-bottom:4px;color:#ffd54f}
.pf-stat b{display:block;font-size:26px;color:#fff;font-family:system-ui,sans-serif;font-weight:800}
.pf-stat small{font-size:10px;letter-spacing:1px;color:#9fd4ff;text-transform:uppercase}
.pf-sec{margin:18px 0 8px;font-size:12px;letter-spacing:2px;color:#9fd4ff;text-transform:uppercase;font-family:'Orbitron',system-ui,sans-serif}
.pf-mission{padding:14px 16px;border-radius:16px;background:rgba(8,20,40,.92);border:1px solid #2d5f78}
.pf-bar{height:14px;border-radius:7px;background:#06141a;border:1px solid #3a6fc4;overflow:hidden;margin-bottom:8px}
.pf-bar i{display:block;height:100%;background:linear-gradient(180deg,#ffe082,#ffb300)}
.pf-mission small{color:#cfe8ff;font-family:system-ui,sans-serif;font-size:12px}
/* ===== Selección de Digimon (v2) ===== */
.picker-screen{background:radial-gradient(120% 90% at 75% 0%,#1d3a6e 0%,#0b1630 55%,#060d1d 100%) !important}
.pk-body{grid-template-columns:250px 1fr}
.pv-roster{gap:10px}
.pv-card{position:relative;display:grid;grid-template-columns:52px 1fr;align-items:center;gap:12px;padding:8px 12px 8px 12px;border-radius:16px;border:2px solid #1f3d63;background:linear-gradient(90deg,rgba(255,255,255,.05),transparent),#0b1a33;color:#e6f4ff;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s;--c:#4fc3f7}
.pv-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--c)}
.pv-card img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.pv-card:hover{transform:translateX(3px)}
.pv-card.sel{border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,transparent),transparent 75%),#0b1a33;box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}
.pv-num{position:absolute;right:10px;top:7px;font-size:11px;color:#7fa6cc;font-weight:bold}
.pv-meta{display:flex;flex-direction:column;gap:4px}
.pv-meta b{font-size:15px}
.pv-meta em{font-style:normal;font-size:11px;align-self:flex-start;padding:2px 9px;border-radius:99px;background:var(--c);color:#0b1a12;font-weight:bold}
.pv-stage{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:14px 18px;border-radius:18px;border:2px solid #2a5a8f;overflow:hidden;background:radial-gradient(55% 60% at 30% 42%,color-mix(in srgb,var(--c,#4fc3f7) 30%,transparent),transparent 70%),linear-gradient(180deg,#10244a,#071024)}
.pv-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pv-tag{font-size:12px;letter-spacing:.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.07);color:#cfe9ff}
.pv-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;min-height:0;align-items:center}
.pv-spot{display:flex;align-items:center;justify-content:center;position:relative;height:100%}
.pv-spot::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,#ffd54f) 40%,transparent),transparent 65%)}
.pv-hero{position:relative;z-index:1;width:150px;height:150px;object-fit:contain;image-rendering:pixelated;animation:pvBob 2.4s ease-in-out infinite}
@keyframes pvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pv-info{display:flex;flex-direction:column;gap:8px}
.pv-info h2{margin:0;font-size:30px;color:#ffd54f}
.pv-desc{margin:0;color:#e6f4ff;font-size:14px}
.pv-stats{display:grid;gap:6px}
.pv-why{margin:0;font-size:12px;color:#9fd4ff;line-height:1.4}
.pv-evo{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:6px;border-top:1px solid #2a5a8f;flex-wrap:wrap}
.pv-node{display:flex;flex-direction:column;align-items:center;gap:4px}
.pv-node img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
.pv-node small{font-size:12px;color:#cfe9ff;font-weight:bold}
.pv-arrow{font-size:12px;color:#ffd54f;font-weight:bold;letter-spacing:.5px}
.pv-note{font-size:11px;color:#7fa6cc;width:100%;text-align:center}
.pv-foot{font-size:11px;color:#7fa6cc;text-align:center}

/* ===== Vestidor de skins (v2) ===== */
.tc-n{--tc:#9e9e9e}
.tc-c{--tc:#81c784}
.tc-r{--tc:#4fc3f7}
.tc-e{--tc:#ce93d8}
.tc-l{--tc:#ffd23f}
.sv-room{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.sv-title{font-size:20px;color:#ffd54f;font-weight:900;letter-spacing:1px}
.sv-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;flex:1;min-height:0}
.sv-show{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:20px;border:3px solid var(--tc);background:radial-gradient(70% 45% at 50% 35%,color-mix(in srgb,var(--tc) 40%,transparent),transparent 72%),#081428;box-shadow:0 0 28px color-mix(in srgb,var(--tc) 35%,transparent);min-height:0}
.sv-show-top{width:100%;display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--tc);font-weight:bold}
.sv-spot{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.sv-hero{width:170px;height:170px;object-fit:contain;image-rendering:pixelated;animation:pvBob 2.4s ease-in-out infinite}
.sv-show h3{margin:0;font-size:22px}
.sv-show p{margin:0;text-align:center;font-size:13px;color:#b9dcff;min-height:34px}
.sv-req{font-size:11px;color:#8fb3d9}
.sv-equip{margin-top:4px;padding:10px 22px;border-radius:14px;border:0;font-weight:900;letter-spacing:1px;cursor:pointer;color:#0f2a05;background:linear-gradient(180deg,#eaffb0,#8be04a);box-shadow:0 5px 0 #2e6b13}
.sv-equip:disabled{background:#1a2c4a;color:#7fa6cc;box-shadow:none;cursor:default}
.sv-equip:not(:disabled):active{transform:translateY(3px)}
.sv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start;overflow:auto;padding:2px}
.sv-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px 8px 10px;border-radius:16px;border:2px solid var(--tc);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 60%),#0a1830;color:#e6f4ff;cursor:pointer;transition:transform .12s,box-shadow .12s}
.sv-card:hover{transform:translateY(-3px)}
.sv-card.locked{border-style:dashed;opacity:.9}
.sv-card.foc{box-shadow:0 0 0 2px #fff inset,0 0 18px var(--tc)}
.sv-card.eq::after{content:"EN USO";position:absolute;right:6px;bottom:6px;font-size:9px;font-weight:900;letter-spacing:.8px;padding:2px 6px;border-radius:6px;background:var(--tc);color:#0a1020}
.sv-tier{position:absolute;left:8px;top:7px;font-size:10px;color:var(--tc);font-weight:bold;letter-spacing:.6px;text-transform:uppercase}
.sv-img{width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.sv-img img{width:80px;height:80px;object-fit:contain;image-rendering:pixelated}
.sv-card b{font-size:13px}
.sv-card small{font-size:11px;color:#8fb3d9;text-align:center}
.sv-bar{display:block;width:100%;height:6px;border-radius:3px;background:#1a2c4a;overflow:hidden;margin-top:3px}
.sv-bar u{display:block;height:100%;background:var(--tc)}
.sv-bar.big{height:8px;width:80%}
/* ===== Gacha v2: escaparate, tiradas y probabilidades ===== */
.gacha.gx{width:min(1100px,96vw);max-height:94vh;padding:16px 20px}
.gx-top{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;margin-top:12px}
.gx-show{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;border:3px solid #3a6fc4;background:radial-gradient(70% 60% at 50% 35%,rgba(206,147,216,.28),transparent 70%),linear-gradient(180deg,#1b2d6b,#0a1430)}
.gx-show-head{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#bfe9ff;font-weight:bold}
.gx-stage-wrap{display:flex;align-items:center;gap:10px}
.gx-stage{flex:1;min-height:250px;display:flex;align-items:center;justify-content:center}
.gx-arrow{width:44px;height:64px;border-radius:14px;border:2px solid #4fc3f7;background:rgba(8,20,40,.85);color:#e6f4ff;font-size:30px;cursor:pointer;flex:none}
.gx-arrow:hover{background:#17335e}
.gx-card{width:min(300px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px 16px;border-radius:22px;border:3px solid var(--gc);background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 22%,transparent),rgba(6,14,30,.92) 65%);box-shadow:0 0 28px color-mix(in srgb,var(--gc) 45%,transparent);animation:gxIn .4s ease-out}
@keyframes gxIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.gx-badge{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--gc);color:#0a1020;font-weight:900}
.gx-art{width:150px;height:150px;display:flex;align-items:center;justify-content:center;animation:gxFloat 2.6s ease-in-out infinite}
.gx-art img{width:140px;height:140px;object-fit:contain;image-rendering:pixelated}
.gx-art .rw-frame,.gx-art .rw-title,.gx-art .rw-item{transform:scale(2.2)}
@keyframes gxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gx-card b{font-size:17px;text-align:center}
.gx-card small{font-size:12px;color:#b9dcff}
.gx-pulls{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.gx-pull{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;border-radius:18px;border:0;cursor:pointer;color:#1a1200;background:linear-gradient(180deg,#ffe082,#ffb300);box-shadow:0 6px 0 #b27300;font-weight:900}
.gx-pull span{font-size:22px;letter-spacing:1.5px}
.gx-pull small{font-size:12px;font-weight:bold;opacity:.85}
.gx-pull10{background:linear-gradient(180deg,#d1c4e9,#9575cd);box-shadow:0 6px 0 #4a2f8a;color:#120a24}
.gx-pull:active{transform:translateY(4px);box-shadow:0 2px 0 #b27300}
.gx-odds{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;border:3px solid #3a6fc4;background:rgba(8,20,40,.92);font-size:14px}
.gx-odds h3{margin:0 0 4px;color:#ffd54f;font-size:20px}
.gx-odds h4{margin:10px 0 2px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#8fb3d9}
.gx-prow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #2a4a7a}
.gx-prow b{color:#fff}
.gx-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}

/* ===== Impacto en partida: BONK, radar de bordes, contorno y HUD tipo Digivice ===== */
#edgeCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

#bonkFill{height:100%;width:0;background:linear-gradient(90deg,#ff8f00,#ffd54f);transition:width .3s ease-out}
#bonkBar.ready{border-color:#ffd54f;box-shadow:0 0 14px #ffd54f}
#bonkBar.ready #bonkFill{animation:bonkPulse .6s ease-in-out infinite alternate}
#bonkTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 1px 2px #000}
@keyframes bonkPulse{from{filter:brightness(1)}to{filter:brightness(1.7)}}
#xp{box-shadow:0 0 12px #4fc3f7,0 0 26px #29b6f6}
.hud-card{box-shadow:inset 0 0 0 2px #b0bec5,inset 0 0 0 4px #263238,0 6px 18px rgba(0,0,0,.55)}
#hudDash.flash{animation:dashFlash .5s ease-out}
@keyframes dashFlash{0%{background:#fff;color:#000;box-shadow:0 0 0 #fff}100%{background:transparent;box-shadow:0 0 18px #4fc3f7}}
/* ===== Tema v3 "Digivice OS": sin rayas, paneles biselados, naranja + azul digital ===== */
:root{--dv-cyan:#3de0ff;--dv-org:#ff8a1e;--dv-yel:#ffd23f;--dv-navy:#06102b;--ch:16px}
.picker-screen,.gacha,.help-box,.m3-board,.set-box,.sc-box{
  border:3px solid transparent !important;border-radius:0 !important;
  background:linear-gradient(180deg,#0d2260,#060f2a) padding-box,linear-gradient(135deg,var(--dv-cyan),#1b4fd6 45%,var(--dv-org)) border-box !important;
  clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch));
  box-shadow:none !important}
#overlay:has(.picker-screen),#overlay:has(.gacha),#overlay:has(.help-box){filter:drop-shadow(0 0 22px rgba(61,224,255,.35))}
.pk-head,.m3-board header,.g-head,.set-head{background:linear-gradient(180deg,#ffb347,#ff7a00) !important;border-radius:0 !important;padding:10px 14px !important;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.pk-head h2,.g-head h2,.set-head h2,#overlay .pk-head h2{color:#1a0d00 !important;text-shadow:0 1px 0 rgba(255,255,255,.45) !important;font-family:'Orbitron',system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase}
.g-head .g-bits{background:#06102b;border:2px solid var(--dv-yel);color:var(--dv-yel);border-radius:0;padding:6px 12px;font-weight:900}
.g-back,.pk-tab,.mini-btn{border-radius:0 !important;border:2px solid var(--dv-cyan) !important;background:#06102b !important;color:#dff8ff !important;font-family:'Orbitron',system-ui,sans-serif;font-size:12px;letter-spacing:1px;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);transition:background .15s,transform .15s}
.g-back:hover,.pk-tab:hover,.mini-btn:hover{background:#12357a !important;transform:translateY(-1px)}
.pk-tab.on{background:linear-gradient(180deg,#fff3c4,var(--dv-yel)) !important;color:#1a0d00 !important;border-color:#fff !important;box-shadow:none !important}
/* Botones principales: naranja Digimon, biselados */
.m3-play,.pk-start,.gx-pull,.g-btn,.sv-equip:not(:disabled){
  background:linear-gradient(180deg,#ffc061 0%,#ff8a1e 45%,#e85d00 100%) !important;color:#fff !important;border:0 !important;border-radius:0 !important;
  text-shadow:0 2px 0 #7a2c00;box-shadow:none !important;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  transition:filter .15s,transform .15s}
.m3-play:hover,.pk-start:hover,.gx-pull:hover,.g-btn:hover{filter:brightness(1.12) saturate(1.1);transform:translateY(-2px)}
.m3-play:active,.pk-start:active,.gx-pull:active,.g-btn:active{transform:translateY(2px)}
.gx-pull10{background:linear-gradient(180deg,#7ff0ff 0%,#1fa8ff 45%,#1257d6 100%) !important;text-shadow:0 2px 0 #062a6b}
.gx-pull small{color:#fff;opacity:.95}
.pk-start{color:#fff !important}
/* Menú principal */
#overlay.menu-mode{backdrop-filter:blur(2px);background:
  radial-gradient(ellipse 30% 36% at 50% 50%,rgba(4,9,26,.96) 55%,rgba(4,9,26,0) 100%),
  linear-gradient(90deg,rgba(4,9,26,.82) 0%,rgba(4,9,26,.25) 55%,rgba(4,9,26,.55) 100%) !important}
.m3-logo,.dvl-logo{font-family:'Orbitron',system-ui,sans-serif;font-weight:900;font-style:italic;letter-spacing:2px;transform:skewX(-6deg);
  color:#fff;-webkit-text-stroke:2px #0a2a8a;paint-order:stroke fill;text-shadow:0 5px 0 #0a2a8a,0 0 26px rgba(61,224,255,.7)}
.m3-logo span,.dvl-logo span{background:linear-gradient(180deg,#fff3a0,#ffb300 55%,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #7a2c00;text-shadow:none;filter:drop-shadow(0 5px 0 #7a2c00)}
.m3-sub{color:var(--dv-cyan) !important;letter-spacing:6px !important;text-transform:uppercase}
.m3-play{min-height:150px}
.m3-play-text b{font-family:'Orbitron',system-ui,sans-serif;font-style:italic;font-size:46px;letter-spacing:4px;text-shadow:0 4px 0 #7a2c00}
.m3-play-img{filter:drop-shadow(0 0 14px rgba(255,255,255,.75));animation:pvBob 2.4s ease-in-out infinite}
.m3-tile{border-radius:0 !important;border:2px solid transparent !important;background:linear-gradient(180deg,#0f2a6e,#071436) padding-box,linear-gradient(135deg,var(--dv-cyan),#1b4fd6) border-box !important;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .15s,filter .15s}
.m3-tile:hover{transform:translateY(-4px);filter:brightness(1.35)}
.m3-tile b{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:1px}
.m3-trainer{border-radius:0 !important;border:2px solid var(--dv-cyan) !important;background:#06102b !important;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);cursor:pointer}
.m3-board header b{color:#1a0d00;font-family:'Orbitron',system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px}
.lb-row{border-radius:0 !important}
.lb-row.top{background:linear-gradient(90deg,rgba(255,210,63,.25),transparent) !important;border-color:var(--dv-yel) !important}
/* Tarjetas y fichas interiores sin esquinas redondas */
.pv-card,.sv-card,.col-tile,.g-skin,.pl-tile,.gx-card,.sv-show,.pv-stage,.gx-show,.gx-odds,.pk-right,.card{border-radius:0 !important}
.pv-card.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent),transparent 80%),#0b1a33 !important}
.pk-right{border:0 !important;background:transparent !important;padding:0 !important}
.gx-show,.gx-odds,.sv-show,.pv-stage{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}

/* ===== Login: Digivice ===== */
#overlay:has(.dvl){background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(4,9,26,.55),rgba(4,9,26,.1)) !important}
.dvl{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:'Orbitron',system-ui,sans-serif}
.dvl-logo{font-size:64px;line-height:1}
.dvl-tag{font-size:12px;letter-spacing:5px;color:#fff;background:#0a2a8a;padding:4px 14px;margin:6px 0 10px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.dvl-device{position:relative;width:min(640px,94vw);padding:34px 92px 38px;box-sizing:border-box;
  border-radius:120px 120px 150px 150px / 110px 110px 130px 130px;
  background:radial-gradient(120% 90% at 30% 10%,#ffffff 0%,#dbe9f7 30%,#9db8d6 70%,#6f8db3 100%);
  box-shadow:inset 0 -14px 24px rgba(20,50,100,.45),inset 0 8px 10px rgba(255,255,255,.9),0 18px 0 #3d5a85,0 30px 50px rgba(0,0,0,.6),0 0 60px rgba(61,224,255,.45);
  animation:dvlIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dvlIn{from{transform:translateY(40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.dvl-ant{position:absolute;left:70px;top:-26px;width:22px;height:44px;border-radius:10px 10px 0 0;background:linear-gradient(90deg,#c9d9ec,#7f9cc2);box-shadow:inset 0 4px 4px #fff}
.dvl-bezel{background:#0b1736;padding:10px;border-radius:18px;box-shadow:inset 0 0 0 3px #ff8a1e,0 2px 0 #fff}
.dvl-screen{background:linear-gradient(180deg,#cfe3bf,#a9c79a);border-radius:10px;padding:16px 18px 18px;color:#14301a;text-align:center;box-shadow:inset 0 0 18px rgba(20,48,26,.45)}
.dvl-boot{font-size:11px;letter-spacing:3px;opacity:.75;animation:dvlBlink 1.2s steps(2) infinite}
@keyframes dvlBlink{50%{opacity:.35}}
.dvl-screen h2{margin:8px 0 2px;font-size:20px;color:#14301a;letter-spacing:1px}
.dvl-screen p{margin:0 0 10px;font:600 12px system-ui,sans-serif;color:#2c4f33}
.dvl-screen input{width:100%;box-sizing:border-box;padding:10px;border:0;border-bottom:4px solid #14301a;background:rgba(20,48,26,.12);color:#14301a;font:900 22px 'Orbitron',system-ui,sans-serif;text-align:center;outline:none;letter-spacing:2px}
.dvl-screen input::placeholder{color:rgba(20,48,26,.45)}
.dvl-screen input:focus{background:rgba(20,48,26,.22)}
.dvl-go{margin-top:14px;width:100%;padding:13px;border:0;cursor:pointer;font:900 17px 'Orbitron',system-ui,sans-serif;letter-spacing:2px;color:#fff;
  background:linear-gradient(180deg,#ffc061,#ff8a1e 45%,#e85d00);text-shadow:0 2px 0 #7a2c00;border-radius:8px;box-shadow:0 5px 0 #7a2c00;transition:filter .15s,transform .1s}
.dvl-go:hover{filter:brightness(1.12)}
.dvl-go:active{transform:translateY(4px);box-shadow:0 1px 0 #7a2c00}
.dvl-btn{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4f7be0,#0a2a8a 70%);box-shadow:0 4px 0 #061a57,inset 0 2px 3px rgba(255,255,255,.6)}
.dvl-btn.b1{left:26px;top:50%;margin-top:-22px}
.dvl-btn.b2{right:26px;top:38%;margin-top:-22px}
.dvl-btn.b3{right:26px;top:66%;margin-top:-22px}
.dvl-guest{margin-top:22px;padding:8px 18px;border:2px solid var(--dv-cyan);background:rgba(6,16,43,.9);color:#dff8ff;font:700 11px 'Orbitron',system-ui,sans-serif;letter-spacing:1px;cursor:pointer;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.dvl-guest:hover{background:#12357a}
.dvl-screen h2{color:#14301a !important;text-shadow:none !important}
/* ===== Tarjeta de entrenador ===== */
.pl3{width:min(1060px,96vw) !important}
.pl3-body{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;min-height:0}
.pl3-left{display:flex;flex-direction:column;align-items:center;gap:12px}
.pl3-right{overflow:auto;padding-right:6px}
.pl3-right h3{margin:10px 0 8px;font:900 14px 'Orbitron',system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--dv-cyan)}
.tc{position:relative;width:320px;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden;
  background:linear-gradient(160deg,#ff9d3c 0%,#ff7a00 34%,#0d2a7a 34.5%,#071640 100%);border:3px solid #fff;border-radius:18px;
  box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 30px rgba(61,224,255,.35);transition:transform .12s ease-out;will-change:transform}
.tc-shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--sx,30%) var(--sy,20%),rgba(255,255,255,.38),transparent 45%)}
.tc-top{width:100%;display:flex;justify-content:space-between;font:900 10px 'Orbitron',system-ui,sans-serif;letter-spacing:1.5px;color:#1a0d00}
.tc .pf-av{margin-top:10px}
.tc-name{width:100%;box-sizing:border-box;text-align:center;background:transparent;border:0;border-bottom:2px dashed rgba(255,255,255,.35);color:#fff;font:900 24px 'Orbitron',system-ui,sans-serif;outline:none;padding:4px}
.tc-name:hover,.tc-name:focus{border-bottom-color:var(--dv-yel);background:rgba(255,255,255,.08)}
.tc-title{font:700 12px 'Orbitron',system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#1a0d00;background:var(--dv-yel);padding:4px 14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tc-stats{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.tc-stats span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#9fd4ff;background:rgba(0,0,0,.35);padding:6px 2px}
.tc-stats b{font:900 17px 'Orbitron',system-ui,sans-serif;color:#fff}
.pl3-avs{display:flex;gap:8px}
.tc-avb{width:46px;height:46px;padding:2px;border:2px solid #2a4a8a;background:#06102b;cursor:pointer;border-radius:50%;overflow:hidden;transition:transform .12s}
.tc-avb img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;border-radius:50%}
.tc-avb:hover{transform:scale(1.15)}
.tc-avb.on{border-color:var(--dv-yel);box-shadow:0 0 12px var(--dv-yel)}
.pl3-frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tc-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border:2px solid #2a4a8a;background:#081a4a;color:#e6f4ff;cursor:pointer;transition:transform .12s,border-color .12s}
.tc-opt:hover:not(.locked),.tc-row:hover:not(.locked){transform:translateY(-3px);border-color:var(--dv-cyan)}
.tc-opt.eq,.tc-row.eq{border-color:var(--dv-yel);background:linear-gradient(180deg,rgba(255,210,63,.22),#081a4a);box-shadow:0 0 14px rgba(255,210,63,.4)}
.tc-opt.locked,.tc-row.locked{opacity:.5;cursor:default;border-style:dashed}
.tc-opt small{font-size:11px}
.pl3-titles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:10px 12px;border:2px solid #2a4a8a;background:#081a4a;color:#e6f4ff;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s}
.tc-row b{font:700 13px 'Orbitron',system-ui,sans-serif;grid-column:1/3}
.tc-row small{font-size:11px;color:#9fd4ff;grid-column:1/3}
.tc-row em{font-style:normal;font-size:11px;color:#fff}

/* ===== Animación de tirada ===== */
#overlay:has(.pa),#overlay:has(.pr3){background:radial-gradient(circle at 50% 45%,#12296e 0%,#040a1f 70%) !important}
.pa{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;--lc:var(--dv-cyan)}
.pa.charged{--lc:var(--pc)}
.pa-rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--lc) 26%,transparent) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle,transparent 9%,#000 30%,transparent 62%);mask:radial-gradient(circle,transparent 9%,#000 30%,transparent 62%);opacity:.0;animation:paSpin 9s linear infinite;transition:opacity .5s}
.pa.charged .pa-rays{opacity:1}
@keyframes paSpin{to{transform:rotate(360deg)}}
.pa-ring{position:absolute;width:300px;height:300px;border-radius:50%;border:6px solid var(--lc);box-shadow:0 0 40px var(--lc),inset 0 0 40px var(--lc);animation:paRing 1.1s ease-out infinite;transition:border-color .3s,box-shadow .3s}
.pa-ring.r2{animation-delay:.55s}
@keyframes paRing{from{transform:scale(.35);opacity:1}to{transform:scale(1.5);opacity:0}}
.pa-dv{position:relative;width:210px;height:150px;border-radius:60px 60px 72px 72px / 52px 52px 62px 62px;
  background:radial-gradient(120% 90% at 30% 10%,#fff,#dbe9f7 30%,#9db8d6 70%,#6f8db3);box-shadow:inset 0 -8px 14px rgba(20,50,100,.45),0 8px 0 #3d5a85,0 0 50px var(--lc);
  display:flex;align-items:center;justify-content:center;animation:paShake .5s linear infinite}
.pa.charged .pa-dv{animation-duration:.14s}
@keyframes paShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-2deg)}75%{transform:translate(3px,-2px) rotate(2deg)}}
.pa-lcd{width:96px;height:66px;border-radius:8px;background:#0b1736;box-shadow:inset 0 0 0 3px var(--dv-org);display:flex;align-items:center;justify-content:center}
.pa-lcd i{width:34px;height:34px;background:var(--lc);transform:rotate(45deg);box-shadow:0 0 24px var(--lc);animation:paPulse .5s ease-in-out infinite alternate;transition:background .3s}
@keyframes paPulse{from{transform:rotate(45deg) scale(.6)}to{transform:rotate(45deg) scale(1.1)}}
.pa-dv b{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4f7be0,#0a2a8a 70%)}
.pa-dv b:nth-of-type(1){left:14px;top:50%;margin-top:-10px}
.pa-dv b:nth-of-type(2){right:14px;top:36%;margin-top:-10px}
.pa-dv b:nth-of-type(3){right:14px;top:66%;margin-top:-10px}
.pa-flash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,var(--pc) 40%,transparent 75%);opacity:0;transform:scale(.2);pointer-events:none}
.pa.burst .pa-flash{animation:paBurst .65s ease-in forwards}
.pa.burst .pa-dv{animation:paUp .6s ease-in forwards}
@keyframes paBurst{to{opacity:1;transform:scale(3)}}
@keyframes paUp{to{transform:translateY(-60px) scale(1.6);opacity:0}}
.pa-txt{position:absolute;bottom:18%;margin:0;font:900 18px 'Orbitron',system-ui,sans-serif;letter-spacing:3px;color:var(--lc);text-shadow:0 0 16px var(--lc);transition:color .3s}
.pa-skip{position:absolute;right:24px;bottom:24px;padding:8px 16px;cursor:pointer}
.pr3{display:flex;flex-direction:column;align-items:center;gap:22px}
.pr3-grid{display:grid;grid-template-columns:repeat(1,220px);gap:14px;justify-content:center}
.pr3.multi .pr3-grid{grid-template-columns:repeat(5,150px)}
.pc{perspective:900px;width:220px;height:300px;padding:0;border:0;background:none;cursor:pointer;animation:pcDeal .45s cubic-bezier(.2,1.3,.4,1) both}
.pr3.multi .pc{width:150px;height:205px}
@keyframes pcDeal{from{transform:translateY(-70px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.pc-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.pc.open .pc-in{transform:rotateY(180deg)}
.pc:not(.open):hover .pc-in{transform:rotateY(14deg) translateY(-6px)}
.pc-back,.pc-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:14px}
.pc-back{background:radial-gradient(circle,#1b4fd6,#06102b 75%);border:4px solid var(--dv-org);box-shadow:0 0 18px rgba(61,224,255,.5)}
.pc-back i{width:38%;aspect-ratio:1;background:var(--dv-cyan);transform:rotate(45deg);box-shadow:0 0 22px var(--dv-cyan),inset 0 0 0 8px #06102b}
.pc-front{transform:rotateY(180deg);padding:10px;color:#fff;text-align:center;border:4px solid var(--pc);
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 45%,#06102b),#06102b 70%);box-shadow:0 0 26px var(--pc)}
.pc-front em{font:900 10px 'Orbitron',system-ui,sans-serif;font-style:normal;letter-spacing:2px;text-transform:uppercase;background:var(--pc);color:#06102b;padding:3px 10px;border-radius:99px}
.pc-front img{width:58%;image-rendering:pixelated;object-fit:contain}
.pc-front b{font-size:13px}
.pc-front small{font-size:11px;color:#dff8ff}
.pc.open.t-e .pc-front,.pc.open.t-l .pc-front{animation:pcEpic 1s ease-in-out infinite alternate}
.pc.open.t-l{animation:pcLeg .6s ease-out}
@keyframes pcLeg{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes pcEpic{from{box-shadow:0 0 22px var(--pc)}to{box-shadow:0 0 60px var(--pc),0 0 110px var(--pc)}}
.pr3-act{display:flex;gap:14px;align-items:center}
.pr3-act .mini-btn{padding:10px 18px;cursor:pointer}

const ARENA_R = 110;  // radio del escenario: el mapa tiene límite circular con montañas
// Dos zonas: el bosque inicial y el pantano de datos (a partir de 300 s). El jefe final está al final de la zona 2.
const ZONES = [
  {name:'Bosque Inicial',   at:0,   fog:0xbcd9e8, sky:['#4d86c9', '#a9d4ee', '#d8efff'], tint:0xffffff, color:'#ffd54f'},

];

// Recorta un punto al círculo de radio m (para aparecer y moverse dentro del escenario)
function clampArena(x, z, m){
  const r = Math.hypot(x, z);
  return r > m ? [x*m/r, z*m/r] : [x, z];
}
// Terreno: el pueblo (centro) es llano y el resto del mapa tiene colinas suaves
const smooth01 = t => { t = Math.min(1, Math.max(0, t)); return t*t*(3 - 2*t); };
// Estanque al suroeste: cuenca plana con agua; se funde con el terreno alrededor
const POND = {x: -38, z: 22, r: 6, water: -0.35, bed: -0.9};
function pondWeight(x, z){
  const d = Math.hypot(x - POND.x, z - POND.z);
  return 1 - smooth01((d - POND.r)/3);
}
function terrainH(x, z){
  const r = Math.hypot(x, z);
  const flat = smooth01((r - 26)/14);                 // 0 en el pueblo, 1 fuera
  const edge = 1 - smooth01((r - (ARENA_R - 18))/8);  // vuelve a 0 junto a las montañas
  const hills = 4.5*Math.sin(x*0.05 + 1.3)*Math.cos(z*0.043) + 3*Math.sin((x - z)*0.11 + 0.7) + 1.5*Math.cos(x*0.13 + z*0.09);
  const base = hills * flat * edge;
  // Cerca del estanque la orilla queda por encima del agua; el cuenco baja hasta POND.bed
  const d = Math.hypot(x - POND.x, z - POND.z);
  const near = 1 - smooth01((d - (POND.r + 6))/6);
  const shore = Math.max(base, POND.water + 0.45);
  const hn = base*(1 - near) + shore*near;
  const t = smooth01((d - POND.r)/1.6);
  return POND.bed*(1 - t) + hn*t;
}
// Hitboxes: círculos (casas, fuente, habitantes) y segmentos (vallas)
const solids = {circles: [], segs: []};
// Empuja un objeto {x, z} fuera de los sólidos, teniendo en cuenta su radio
function resolveSolids(o, rad, height = 0){
  for (const c of solids.circles){
    if (height >= c.h) continue;   // por encima de la altura del objeto se puede saltar
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), min = rad + c.r;
    if (d < min){
      if (d > 1e-6){ o.x = c.x + dx/d*min; o.z = c.z + dz/d*min; }
      else { o.x = c.x + min; }
    }
  }
  for (const s of solids.segs){
    if (height >= s.h) continue;
    const vx = s.bx - s.ax, vz = s.bz - s.az, len2 = vx*vx + vz*vz;
    const t = Math.min(1, Math.max(0, ((o.x - s.ax)*vx + (o.z - s.az)*vz)/len2));
    const px = s.ax + vx*t, pz = s.az + vz*t;
    const dx = o.x - px, dz = o.z - pz, d = Math.hypot(dx, dz), min = rad + s.r;
    if (d < min){
      if (d > 1e-6){ o.x = px + dx/d*min; o.z = pz + dz/d*min; }
      else { o.x = px + min; }
    }
  }
}

}

// ---------- Escena ----------
// ---------- Calidad: se elige al cargar (cambiarla recarga la página) ----------
function qualityChoice(){ return localStorage.getItem('digibonk3d-quality') || 'auto'; }
function autoIsLow(){ return (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4; }
const QUALITY = {
  alta: {dpr: 2, aa: true,  maxEnemies: 120, shadows: true,  decor: 500, minimapEvery: 2},
  baja: {dpr: 1, aa: false, maxEnemies: 50,  shadows: false, decor: 175, minimapEvery: 4}
};
const Q = QUALITY[qualityChoice() === 'alta' || (qualityChoice() === 'auto' && !autoIsLow()) ? 'alta' : 'baja'];
function qualityLabel(){
  const c = qualityChoice();
  return c === 'auto' ? `Auto (${Q === QUALITY.alta ? 'alta' : 'baja'})` : (c === 'alta' ? 'Alta' : 'Baja');
}
const renderer = new THREE.WebGLRenderer({antialias: Q.aa});
// Estilo de época (PlayStation): se renderiza a baja resolución y se amplía sin suavizar
const RETRO_SCALE = Q === QUALITY.alta ? 1 : 2;   // alta: resolución completa y nítida; baja: la mitad
renderer.setPixelRatio(RETRO_SCALE === 1 ? Math.min(devicePixelRatio, Q.dpr) : 1);
function applyRetroSize(){
  const w = Math.max(160, Math.floor(innerWidth / RETRO_SCALE));
  const h = Math.max(120, Math.floor(innerHeight / RETRO_SCALE));
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = innerWidth + 'px';
  renderer.domElement.style.height = innerHeight + 'px';
  renderer.domElement.style.imageRendering = 'pixelated';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = skyTexture();
scene.fog = new THREE.Fog(0xbcd9e8, 110, 250);
function skyTexture(stops = ZONES[0].sky){
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, stops[0]); gr.addColorStop(.6, stops[1]); gr.addColorStop(1, stops[2]);
  x.fillStyle = gr; x.fillRect(0, 0, 4, 256);
  return new THREE.CanvasTexture(c);
}
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x1a2233, 1.0));

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 280);
applyRetroSize();

const TERRAIN_SIZE = ARENA_R*2 + 20, TERRAIN_SEG = 240;
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI/2);
{
  const pos = terrainGeo.attributes.position;
  // Fuera del escenario el suelo baja con suavidad: así la línea donde nace la montaña queda limpia
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const k = smooth01((Math.hypot(x, z) - ARENA_R) / 5);
    pos.setY(i, terrainH(x, z)*(1 - k) + (-1.5)*k);
  }
}
terrainGeo.computeVertexNormals();
// Color por zona: tierra alrededor del pueblo, bosque más oscuro hacia las montañas y variación suave
function zoneTint(x, z){
  const r = Math.hypot(x, z);
  const dirt = 1 - smooth01((r - 14)/12);
  const edgeDark = smooth01((r - (ARENA_R - 26))/16);
  const n = 0.93 + 0.07*Math.sin(x*0.09)*Math.cos(z*0.07);
  const k = 1 - edgeDark*0.25;
  let R = n*k, G = n*(1 - edgeDark*0.15), B = n*(1 - edgeDark*0.2);
  R = R*(1 - dirt) + 1.05*dirt; G = G*(1 - dirt) + 0.86*dirt; B = B*(1 - dirt) + 0.6*dirt;
  return [R, G, B];
}
{
  const pos = terrainGeo.attributes.position, col = new Float32Array(pos.count*3);
  for (let i = 0; i < pos.count; i++) col.set(zoneTint(pos.getX(i), pos.getZ(i)), i*3);
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}
// Texturas de archivo (textures/*.png): se repiten sin costuras
const loader = new THREE.TextureLoader();
// Ajusta la repetición a la proporción real de la imagen para que no se deforme
function loadTex(path, rx, ry, pixel = false){
  const t = loader.load(path, tex => tex.repeat.set(rx, ry * (tex.image.width / tex.image.height)));
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  if (pixel) t.magFilter = THREE.NearestFilter;   // pixel art: bordes nítidos
  return t;
}

}
// Montañas altas que cierran el escenario (dos anillos, el exterior más alto)
function buildMountains(){
  // Una sola malla continua de crestas: no hay conos que se crucen, así que no parpadea
  const SEG = 480, rBase = ARENA_R + 16, rPeak = ARENA_R + 5;
  const H = a => 40 + 12*Math.sin(a*5 + 1.3) + 6*Math.sin(a*11 + 0.4) + 3*Math.sin(a*23);
  const rock = new THREE.Color(0x4b5a73), snow = new THREE.Color(0xe8f1ff);
  const pos = [], col = [];
  const pt = (r, h, a) => [Math.cos(a)*r, h, Math.sin(a)*r];
  const colorAt = h => rock.clone().lerp(snow, THREE.MathUtils.smoothstep(h, 30, 38));
  for (let i = 0; i < SEG; i++){
    const a0 = i/SEG*Math.PI*2, a1 = (i+1)/SEG*Math.PI*2;
    const h0 = H(a0), h1 = H(a1), hm = H((a0+a1)/2) * 1.08;
    const b0 = pt(rBase, -3, a0), b1 = pt(rBase, -3, a1);   // la base se hunde bajo el suelo: sin superficies coincidentes
    const t0 = pt(rPeak, h0, a0), t1 = pt(rPeak, h1, a1), tm = pt(rPeak - 4, hm, (a0+a1)/2);
    // dos caras por segmento: base exterior -> pico
    const faces = [[b0, b1, tm], [b0, tm, t0], [b1, t1, tm], [b1, tm, t0]];
    for (const f of faces){
      for (const v of f){
        pos.push(v[0], v[1], v[2]);
        const c = colorAt(v[1]); col.push(c.r, c.g, c.b);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, flatShading: true, roughness: 0.9, side: THREE.DoubleSide}));
  scene.add(mesh);
}

}

// ---------- Recursos ----------
const texCache = {};
function tex(url){
  if (!texCache[url]){
    texCache[url] = loader.load(url);
    texCache[url].magFilter = THREE.NearestFilter;
  }
  return texCache[url];
}
const spriteMats = {};
function billboard(url, scale, shared = true){
  let mat = shared ? spriteMats[url] : null;
  if (!mat){ mat = new THREE.SpriteMaterial({map: tex(url), transparent: true}); if (shared) spriteMats[url] = mat; }
  const s = new THREE.Sprite(mat);
  s.scale.set(scale, scale, 1);
  return s;
}

  grd.addColorStop(0.6, 'rgba(0,0,0,0.15)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = grd; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// ---------- Entorno: árboles, rocas y flores (texturas procedurales) ----------
function propTex(kind){
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  if (kind === 'tree'){
    c.width = 64; c.height = 96;
    x.fillStyle = '#5d4037'; x.fillRect(28, 60, 8, 36);
    x.fillStyle = '#2e7d32';
    for (const [a, b, r] of [[32,36,26],[20,50,18],[44,50,18],[32,22,18]]){ x.beginPath(); x.arc(a, b, r, 0, Math.PI*2); x.fill(); }
    x.fillStyle = '#43a047'; x.beginPath(); x.arc(26, 28, 7, 0, Math.PI*2); x.fill();
  } else if (kind === 'rock'){
    c.width = c.height = 48;
    x.fillStyle = '#616161'; x.beginPath(); x.ellipse(24, 34, 20, 12, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = '#9e9e9e'; x.beginPath(); x.ellipse(19, 28, 8, 5, 0, 0, Math.PI*2); x.fill();
  } else {
    c.width = c.height = 32;
    x.fillStyle = '#2e7d32'; x.fillRect(15, 16, 2, 16);
    x.fillStyle = ['#ff8a80','#fff176','#f48fb1'][Math.random()*3 | 0];
    x.beginPath(); x.arc(16, 12, 5, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; return t;
}
// Decoración 2D integrada en el 3D: sprites de pixel art que siempre miran a la cámara
function decoTex(file){
  const t = loader.load(file);
  t.magFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function decoSprite(tex, w, h, x, y, z){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, alphaTest: 0.5}));
  sp.scale.set(w, h, 1);
  sp.position.set(x, y + h/2, z);
  scene.add(sp);
  return sp;
}
function buildEnvironment(){
  const T = {
    arbol: decoTex('sprites/deco/arbol.png'), arbolOtono: decoTex('sprites/deco/arbol_otono.png'),
    roca: decoTex('sprites/deco/roca.png'), arbusto: decoTex('sprites/deco/arbusto.png'),
    flor: decoTex('sprites/deco/flor.png')
  };
  for (let i = 0; i < Q.decor; i++){
    const r = Math.random();
    const ang = Math.random()*Math.PI*2, rad = Math.sqrt(Math.random())*(ARENA_R - 2);
    const x0 = Math.cos(ang)*rad, z0 = Math.sin(ang)*rad;
    if (Math.hypot(x0, z0) < 22) continue;   // deja libre la zona de aparición
    if (pondWeight(x0, z0) > 0.01) continue;   // no pone decoración dentro del estanque
    const gy = terrainH(x0, z0);
    if (r < 0.45){                          // árboles
      const h = 5 + Math.random()*2;
      decoSprite(Math.random() < 0.2 ? T.arbolOtono : T.arbol, h*0.75, h, x0, gy, z0);
      const sh = makeShadow(h*0.5); sh.position.set(x0, gy + 0.02, z0); scene.add(sh);
    } else if (r < 0.65){                   // rocas
      const sc = 1.1 + Math.random()*0.6;
      decoSprite(T.roca, sc*1.3, sc*0.9, x0, gy, z0);
      const sh = makeShadow(sc*2.2); sh.position.set(x0, gy + 0.02, z0); scene.add(sh);
    } else if (r < 0.78){                   // arbustos
      const sc = 1.2 + Math.random()*0.5;
      decoSprite(T.arbusto, sc*1.4, sc, x0, gy, z0);
    } else {                                // flores
      decoSprite(T.flor, 0.8, 1.2, x0, gy, z0);
    }
  }
}
buildEnvironment();

// ---------- Pueblo Primario: la primera zona de Digimon Adventure (plaza con pozo y casas de madera) ----------
function buildVillage(){
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshBasicMaterial({color: 0x9c7b4f}));
  plaza.rotation.x = -Math.PI/2;

  const well = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.5, 1.2, 12),
    new THREE.MeshStandardMaterial({color: 0x9e9e9e, flatShading: true}));
  well.position.y = 0.6;
  scene.add(well);
  solids.circles.push({x: 0, z: 0, r: 1.5, h: 1.2});   // la fuente del pueblo bloquea el paso
  const water = new THREE.Mesh(new THREE.CircleGeometry(1.2, 12), new THREE.MeshBasicMaterial({color: 0x29b6f6}));
  water.rotation.x = -Math.PI/2;
  water.position.y = 1.21;
  scene.add(water);
  // casas de madera alrededor de la plaza
  const wood = new THREE.MeshStandardMaterial({map: loadTex('textures/madera_pixel.png', 1, 1, true), flatShading: true});
  const roofMat = new THREE.MeshStandardMaterial({map: loadTex('textures/tejado_pixel.png', 2, 2, true), flatShading: true});
  for (let i = 0; i < 7; i++){
    const a = i/7*Math.PI*2 + 0.3, R = 17;
    const x = Math.cos(a)*R, z = Math.sin(a)*R;
    const house = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 2.8), wood);
    body.position.y = 1.2;
    house.add(body);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.4, 1.6, 4), roofMat);
    roof.position.y = 3.2;
    roof.rotation.y = Math.PI/4;
    house.add(roof);
    house.position.set(x, 0, z);
    house.rotation.y = -a;
    scene.add(house);
    solids.circles.push({x, z, r: 2.3, h: 4});
    const sh = makeShadow(4.5);
    sh.position.set(x, 0.02, z);
    scene.add(sh);
  }
}

// ---------- Ambientación del pueblo: caminos, valla con huecos y habitantes en reposo ----------
const npcs = [];   // habitantes: solo se mueven (no atacan ni son enemigos)
function angDiff(a, b){
  let d = (a - b) % (2*Math.PI);
  if (d > Math.PI) d -= 2*Math.PI;
  if (d < -Math.PI) d += 2*Math.PI;
  return Math.abs(d);
}
function buildAmbience(){
  const paths = 8;
  const pathAngles = Array.from({length: paths}, (_, i) => i/paths*Math.PI*2);
  // caminos de tierra desde la plaza hacia las montañas
  const pathMat = new THREE.MeshBasicMaterial({color: 0xffffff, map: loadTex('textures/camino_pixel.png', 1, 5, true)});
  const L = 26 - 14;   // los caminos llegan hasta el borde llano del pueblo
  for (const a of pathAngles){
    const geo = new THREE.PlaneGeometry(2.6, L);
    geo.rotateX(-Math.PI/2);
    const m = new THREE.Mesh(geo, pathMat);
    const mid = 14 + L/2;
    m.position.set(Math.cos(a)*mid, 0.012, Math.sin(a)*mid);
    m.rotation.y = Math.PI/2 - a;
    scene.add(m);
  }
  // valla alrededor del pueblo, con huecos donde salen los caminos
  const FR = 21, N = 36;
  const postGeo = new THREE.BoxGeometry(0.25, 1.3, 0.25);
  const railGeo = (len) => new THREE.BoxGeometry(len, 0.14, 0.12);
  const fenceMat = new THREE.MeshStandardMaterial({color: 0x6d4c41, flatShading: true});
  const open = a => pathAngles.some(pa => angDiff(a, pa) < 0.12);
  const angs = Array.from({length: N}, (_, i) => i/N*2*Math.PI);
  for (const a of angs){
    if (open(a)) continue;
    const post = new THREE.Mesh(postGeo, fenceMat);
    post.position.set(Math.cos(a)*FR, 0.65, Math.sin(a)*FR);
    scene.add(post);
  }
  for (let i = 0; i < N; i++){
    const a0 = angs[i], a1 = angs[(i + 1) % N] + (i === N-1 ? 2*Math.PI : 0);
    if (open(a0) || open(a1 % (2*Math.PI))) continue;
    const dth = a1 - a0, am = a0 + dth/2;
    const chord = 2*FR*Math.sin(dth/2);
    solids.segs.push({ax: Math.cos(a0)*FR, az: Math.sin(a0)*FR, bx: Math.cos(a1)*FR, bz: Math.sin(a1)*FR, r: 0.15, h: 1.4});
    for (const h of [0.5, 1.0]){
      const rail = new THREE.Mesh(railGeo(chord), fenceMat);
      rail.position.set(Math.cos(am)*FR, h, Math.sin(am)*FR);
      rail.rotation.y = Math.atan2(-Math.cos(am), -Math.sin(am));
      scene.add(rail);
    }
  }
  // habitantes en reposo: sprites de la temporada 1 que no atacan
  const npcKeys = ['gomamon', 'patamon', 'palmon', 'gatomon', 'biyomon', 'gabumon'];
  npcKeys.forEach((k, i) => {
    const a = i/npcKeys.length*Math.PI*2 + 0.5, r = 7 + (i % 2)*3;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const sprite = billboard(CHARS[k].sprite, 1.8);
    sprite.position.set(x, 0.9, z);
    scene.add(sprite);
    const sh = makeShadow(1.4);
    sh.position.set(x, 0.02, z);
    scene.add(sh);
    npcs.push({sprite, base: 0.9, ph: i});
    solids.circles.push({x, z, r: 0.7, h: 2});
  });
}
buildAmbience();

let state = 'select';

const keys = {};
const overlay = document.getElementById('overlay');

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  audioInit();
  if (state === 'savecode'){ if (k === 'escape') showSettings(); return; }
  if (state === 'register') return;
  if (k === 'n'){ toggleMute(); return; }
  if (k === 'm'){ if (state === 'play') openMap(); else if (state === 'map') closeMap(); return; }
  if (state === 'map'){ if (k === 'escape') closeMap(); return; }
  if (k === 'q' && state === 'play'){ bonkRelease(); return; }
  if (state === 'help'){ if (k === 'escape') showSelect(); if (k === 'arrowright') tutoStep(1); if (k === 'arrowleft') tutoStep(-1); return; }
  if (state === 'gacha' || state === 'settings' || state === 'player'){ if (k === 'escape') showSelect(); return; }
  // Esc o P pausan y reanudan. Con el ratón bloqueado el navegador puede no entregar Esc:
  // en ese caso la pausa la dispara pointerlockchange (ver más abajo). P sirve en pantalla completa.
  if (k === 'escape' || k === 'p'){
    if (state === 'play'){ pauseGame(); return; }
    if (state === 'paused'){
      if (pauseConfirm && k === 'escape') showPause(false);   // Esc en la confirmación vuelve al menú de pausa
      else resumeGame();
      return;
    }
  }
  if (state === 'paused'){ if (k === 'enter' && !pauseConfirm) resumeGame(); return; }
  keys[k] = true;
  if (state === 'play' && k === 'shift') tryDash();
  if (state === 'play' && k === ' ' && g && g.p.y === 0) g.p.vy = 11;   // salto (altura ~2)
  if (state === 'play' && k === 'e' && g && g.nearChest) openChest(g.nearChest);
  const list = SEASONS.adventure.chars;
  if (state === 'select'){
    if (k === 'enter') showPicker('personaje');
  }
  else if (state === 'pick'){
    if (k.length === 1 && '123456789'.includes(k) && +k <= list.length){ selectedKey = list[+k-1]; showPicker(); }
    else if (k === 'arrowleft') pickMove(-1);
    else if (k === 'arrowright') pickMove(1);
    else if (k === 'enter') startGame(selectedKey);
    else if (k === 'escape') showSelect();
  }
  else if (state === 'levelup' && k.length === 1 && '123'.includes(k)) pickUpgrade(+k-1);
  else if (state === 'end' && (k === 'enter' || k === 'r')) showSelect();
});

const pauseEl = document.getElementById('pause');
function pauseGame(){
  if (state !== 'play' || !g) return;
  state = 'paused';

  unlockMouse();

}

  if (state !== 'paused') return;

/* ---------- Código de guardado: lleva el progreso a otro navegador ---------- */
const SAVE_KEYS = ['digibonk3d-bits', 'digibonk3d-skins', 'digibonk3d-equip', 'digibonk3d-stats', 'digibonk3d-daily',
  'digibonk3d-inv', 'digibonk3d-extra', 'digibonk3d-evo', 'digibonk3d-name', 'digibonk3d-records', 'digibonk3d-ach', 'digibonk3d-avatar'];
function makeSaveCode(){
  const data = {};
  for (const k of SAVE_KEYS){ const v = localStorage.getItem(k); if (v !== null) data[k] = v; }
  return 'DBK1-' + btoa(unescape(encodeURIComponent(JSON.stringify({v: 1, data}))));
}
function readSaveCode(code){
  const t = (code || '').trim();
  if (!t.startsWith('DBK1-')) throw new Error('El código debe empezar por DBK1-');
  let obj;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))); }
  catch(e){ throw new Error('El código está incompleto o alterado'); }
  if (!obj || obj.v !== 1 || typeof obj.data !== 'object') throw new Error('Formato no válido');
  const out = {};
  for (const k of SAVE_KEYS){
    if (k in obj.data){
      if (typeof obj.data[k] !== 'string') throw new Error('Dato no válido');
      out[k] = obj.data[k];
    }
  }
  if (!Object.keys(out).length) throw new Error('El código no contiene progreso');
  return out;
}
let scArmed = false;
function showSaveCode(){
  state = 'savecode';
  setHud(false);
  scArmed = false;
  showOverlay(`
    <div class="settings sc-box">
      <header class="set-head"><button class="g-back" id="scBack">← Volver</button><h2>Código de guardado</h2></header>

      <textarea id="scOut" readonly>${makeSaveCode()}</textarea>

      <textarea id="scIn" placeholder="DBK1-..."></textarea>

    </div>`);
  document.getElementById('scBack').onclick = () => showSettings();
