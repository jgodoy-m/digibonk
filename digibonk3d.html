// ---------- Lógica ----------
// ---------- Texturas procedurales (sin archivos externos) ----------
// Terreno procedural: hierba con matices, parches de tierra y claros (textura que se repite)
let chestTex = null;
function getChestTex(){
  if (chestTex) return chestTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < 4; i++){
    x.fillStyle = i % 2 ? '#7a4a22' : '#9a6432';
    x.fillRect(0, i*32, 128, 32);
    x.fillStyle = '#4e2e12'; x.fillRect(0, i*32, 128, 2);
  }
  x.fillStyle = '#c9a227';                                // bandas metálicas
  x.fillRect(0, 20, 128, 10); x.fillRect(0, 98, 128, 10); x.fillRect(56, 0, 12, 128);
  x.fillStyle = '#fff3a0'; x.fillRect(58, 56, 8, 12);    // cerradura
  chestTex = new THREE.CanvasTexture(c);
  chestTex.magFilter = THREE.NearestFilter;
  return chestTex;
}
function makeChest(){
  const mat = new THREE.MeshBasicMaterial({map: getChestTex()});
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.7), mat);
  body.position.y = 0.25;
  group.add(body);
  const pivot = new THREE.Group();          // bisagra en el borde trasero
  pivot.position.set(0, 0.5, -0.35);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.7), mat);
  lid.position.set(0, 0.1, 0.35);
  pivot.add(lid);
  group.add(pivot);
  group.add(makeShadow(1.3));
  return {group, pivot};
}

// ---------- Chispas de impacto ----------
const fxGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
let fx = [];
const hitColors = {basic: '#ff7043', fast: '#ce93d8', tank: '#bcaaa4'};
function burst(x, z, color){
  for (let i = 0; i < 7; i++){
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({color, transparent: true}));
    m.position.set(x, 0.8, z);
    world.add(m);
    const a = Math.random()*Math.PI*2, s = 3 + Math.random()*4;
    fx.push({m, vx: Math.cos(a)*s, vy: 3 + Math.random()*3, vz: Math.sin(a)*s, t: 0});
  }
}
function updateFx(dt){
  for (const f of fx){
    f.t += dt;
    f.vy -= 14*dt;
    f.m.position.x += f.vx*dt;
    f.m.position.z += f.vz*dt;
    f.m.position.y = Math.max(0.07, f.m.position.y + f.vy*dt);
    f.m.material.opacity = Math.max(0, 1 - f.t/0.45);
    f.m.rotation.x += dt*10;
  }
  fx = fx.filter(f => {
    if (f.t < 0.45) return true;
    world.remove(f.m); f.m.material.dispose(); return false;
  });
}

// ---------- Daño flotante ----------
function popText(x, z, n, color = '#ffeb3b', k = 0.6){
  if (g && g.texts && g.texts.length > 45) return;   // límite de textos flotantes en pantalla
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const cx = c.getContext('2d');
  cx.font = 'bold 44px sans-serif'; cx.textAlign = 'center';
  cx.lineWidth = 7; cx.strokeStyle = '#000';
  cx.strokeText(String(n), 128, 66);
  cx.fillStyle = color; cx.fillText(String(n), 128, 66);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false});
  const s = new THREE.Sprite(mat);
  s.scale.set(2.8*k, 1.05*k, 1);
  s.position.set(x, 1.8, z);
  s.renderOrder = 10;
  world.add(s);
  g.texts.push({s, tex, mat, life: 0.9});
}

function digivolve(){
  const evo = EVO[g.ch.id];
  if (!evo || g.ch.evolved) return;
  g.ch.evolved = true;
  recordEvolve(g.ch.id);
  g.p.dmg *= 1.5;
  g.p.count += 1;
  g.evoAnim = {t: 0, dur: 2.6, swapped: false, sprite: spriteOf(g.ch.id, true), name: evo.name};
  shake = Math.max(shake, 0.5);
  sfx('evolve');
  announce(evo.name + '!', 'Digievolución completa · +50% daño', '#ffd54f');
}

// Animación de digievolución: 0-0.6 s brillo y temblor, cambio de sprite con destello y anillo, 0.6-1.6 s asentamiento
let screenFlash = 0;
let shake = 0;          // intensidad de la sacudida de cámara
let rings = [];
// Anillo que se expande: radius = radio final en unidades del mundo; life = duración en segundos
function spawnRing(x, z, color = 0xffd54f, radius = null, life = 0.7){
  const mesh = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.7, 32),
    new THREE.MeshBasicMaterial({color, transparent: true, depthWrite: false}));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0.05 + terrainH(x, z), z);
  world.add(mesh);
  const grow = radius ? (radius/0.7 - 1)/life : 12;
  rings.push({mesh, t: 0, life, grow});
}
// ---------- Digivice de la digievolución (dispositivo azul brillante generado con canvas) ----------
let digiviceTex = null;
function getDigiviceTex(){
  if (digiviceTex) return digiviceTex;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const halo = x.createRadialGradient(128, 128, 20, 128, 128, 128);
  halo.addColorStop(0, 'rgba(120,220,255,0.7)');
  halo.addColorStop(1, 'rgba(120,220,255,0)');
  x.fillStyle = halo; x.fillRect(0, 0, 256, 256);
  const body = x.createLinearGradient(0, 30, 0, 226);
  body.addColorStop(0, '#eaffff'); body.addColorStop(0.5, '#4fc3f7'); body.addColorStop(1, '#0d3f8f');
  x.beginPath(); x.ellipse(128, 128, 96, 112, 0, 0, Math.PI*2);
  x.fillStyle = body; x.fill();
  x.lineWidth = 6; x.strokeStyle = '#bff1ff'; x.stroke();
  x.fillStyle = '#06142b'; x.fillRect(78, 88, 100, 80);            // pantalla
  x.strokeStyle = 'rgba(79,195,247,0.8)'; x.lineWidth = 2;
  for (let i = 1; i < 4; i++){ x.beginPath(); x.moveTo(78 + i*25, 88); x.lineTo(78 + i*25, 168); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,0.35)';                           // brillo
  x.beginPath(); x.ellipse(118, 100, 28, 8, -0.2, 0, Math.PI*2); x.fill();
  for (const bx of [36, 220]){                                      // botones laterales
    x.beginPath(); x.arc(bx, 128, 12, 0, Math.PI*2);
    x.fillStyle = '#29b6f6'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#e1f5fe'; x.stroke();
  }
  digiviceTex = new THREE.CanvasTexture(c);
  return digiviceTex;
}
// Digivice que aparece sobre el personaje con un haz de luz, gira y se apaga al evolucionar
function updateDigivice(a, p, dt){
  if (!a.dv){
    a.dv = new THREE.Sprite(new THREE.SpriteMaterial({map: getDigiviceTex(), transparent: true, depthWrite: false,
      depthTest: false, blending: THREE.AdditiveBlending, opacity: 0}));
    a.dv.renderOrder = 12;
    world.add(a.dv);
    a.beam = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 16, 20, 1, true),
      new THREE.MeshBasicMaterial({color: 0x66ccff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
        depthWrite: false, side: THREE.DoubleSide}));
    world.add(a.beam);
  }
  const t = a.t;
  const grow = Math.min(1, t/0.6);
  const fade = t > 0.6 ? Math.max(0, 1 - (t - 0.6)/1.4) : 1;
  const pulse = 0.85 + 0.15*Math.sin(t*30);
  a.dv.position.set(p.x, terrainH(p.x, p.z) + 3.4 + Math.sin(t*6)*0.15, p.z);
  a.dv.scale.setScalar((3.2 + 1.2*grow) * pulse);
  a.dv.material.rotation += dt*(1.5 + 4*grow);
  a.dv.material.opacity = Math.min(1, t/0.15) * fade;
  a.beam.position.set(p.x, terrainH(p.x, p.z) + 8*grow, p.z);
  a.beam.scale.set(1 + grow*1.5, Math.max(0.01, grow), 1 + grow*1.5);
  a.beam.material.opacity = 0.55 * fade * Math.min(1, t/0.2);
  if (t > 0.6 && !a.burst){ a.burst = true; spawnRing(p.x, p.z); spawnRing(p.x, p.z); }
}
function removeDigivice(a){
  if (a.dv){ world.remove(a.dv); a.dv.material.dispose(); }
  if (a.beam){ world.remove(a.beam); a.beam.geometry.dispose(); a.beam.material.dispose(); }
}

function animateEvo(dt){
  for (const r of rings){
    r.t += dt;
    r.mesh.scale.setScalar(1 + r.t*r.grow);
    r.mesh.material.opacity = Math.max(0, 1 - r.t/r.life);
  }
  rings = rings.filter(r => {
    if (r.t < r.life) return true;
    world.remove(r.mesh); return false;
  });
  screenFlash = Math.max(0, screenFlash - dt*1.5);
  document.getElementById('flash').style.opacity = screenFlash;

  const a = g && g.evoAnim;
  if (!a) return;
  a.t += dt;
  const m = g.playerMesh, p = g.p;
  // Malla de alambre (icosaedro) que crece alrededor del personaje y se desvanece
  if (!a.wire){
    a.wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshBasicMaterial({color: 0x4fc3f7, wireframe: true, transparent: true}));
    world.add(a.wire);
  }
  a.wire.scale.setScalar(a.t < 0.6 ? 1.2 + 2.5*(a.t/0.6) : 3.7 + 2*(a.t-0.6));
  a.wire.position.set(p.x, terrainH(p.x, p.z) + 1.1, p.z);
  a.wire.material.opacity = a.t < 0.6 ? 1 : Math.max(0, 1 - (a.t-0.6)/0.6);
  a.wire.rotation.y += dt*4;
  a.wire.rotation.x += dt*2;
  updateDigivice(a, p, dt);
  if (a.t < 0.6){
    const glow = 1 + 1.5*Math.pow(Math.sin(a.t*40), 2);
    m.material.color.setRGB(glow, glow, glow);
    m.scale.set(2.9 + 0.4*(a.t/0.6), 2.9 + 0.4*(a.t/0.6), 1);
    m.position.x = p.x + (Math.random()-0.5)*0.25;
    m.position.z = p.z + (Math.random()-0.5)*0.25;
  } else if (!a.swapped){
    a.swapped = true;
    m.material.map = tex(a.sprite);
    m.material.needsUpdate = true;
    spawnRing(p.x, p.z);
    popText(p.x, p.z, `¡${a.name}!`, '#ffd54f', 2.2);
    screenFlash = 1;
  } else {
    const e = Math.min(1, (a.t - 0.6) / 2.0);
    const s = 3.3 - 0.4*e;
    m.scale.set(s, s, 1);
    m.material.color.setRGB(1, 1, 1);
  }
  if (a.t >= a.dur){
    m.scale.set(2.9, 2.9, 1);
    m.material.color.setRGB(1, 1, 1);
    world.remove(a.wire);
    a.wire.geometry.dispose(); a.wire.material.dispose();
    removeDigivice(a);
    g.evoAnim = null;
  }
}

// BONK: al estar cargado (100%), libera una onda que daña y empuja a los enemigos cercanos y borra los proyectiles del jefe
function addBonk(v){
  const was = g.bonk;
  g.bonk = Math.min(100, g.bonk + v);
  if (was < 100 && g.bonk >= 100) sfx('ready');
}
function bonkRelease(){
  if (!g || g.bonk < 100) return;
  g.bonk = 0;
  const p = g.p, R = 14;
  for (const e of g.enemies){
    const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz);
    if (d > R) continue;
    e.hp -= 80;
    [e.x, e.z] = clampArena(e.x + dx/(d || 1)*6, e.z + dz/(d || 1)*6, ARENA_R - 0.5);
    popText(e.x, e.z, 80, '#ffd54f', 0.7);
  }
  for (const s of g.eshots) s.life = 0;   // el bucle de proyectiles retira las bolas del jefe
  shake = Math.max(shake, 0.8);
  spawnRing(p.x, p.z, 0xffd54f, 14, 0.5);
  screenFlash = 0.6;
  sfx('evolve');
  announce('¡BONK!', 'Onda de choque', '#ffd54f');
}
function hurt(e, dmg){
  // 12% de golpes críticos: doble daño, número naranja y sacudida ligera
  const crit = Math.random() < g.p.critChance;
  if (crit){ dmg *= g.p.critMul; shake = Math.max(shake, 0.2); }
  e.hp -= dmg;
  popText(e.x, e.z, Math.round(dmg), crit ? '#ffb300' : '#ffffff', crit ? 0.8 : 0.55);
  burst(e.x, e.z, hitColors[e.kind] || '#ffe082');
  sfx('hit');
}

function openChest(c){
  if (!g || c.open) return;
  c.open = true; c.openT = 2;
  c.pivot.rotation.x = -1.5;
  const up = UPGRADES[Math.floor(Math.random()*UPGRADES.length)];
  up.f(g.p);
  g.p.hp = Math.min(g.p.maxHp, g.p.hp + 15);
  sfx('chest');
  announce('Cofre abierto', `${up.t} · +15 vida`, '#7cf29c');
}
function tryDash(){
  if (!g || g.dashCd > 0 || g.dash > 0) return;
  g.dash = 0.18;   // segundos de dash (invulnerable)
  g.dashCd = 2.5;  // cooldown
}
function dist2(ax, az, bx, bz){ return Math.hypot(ax-bx, az-bz); }

function spawnEnemy(forced){
  const t = g.t, r = Math.random(), a = Math.random()*Math.PI*2, R = 25;
  let kind = 'basic';
  const z2 = g.zone >= 2;   // la zona 2 trae más tanques y rápidos
  if (forced) kind = forced;
  else if (t > 120 && r < (z2 ? 0.3 : 0.2)) kind = 'tank';
  else if (t > 60 && r < (z2 ? 0.5 : 0.4)) kind = 'fast';
  const d = ENEMY[kind], k = 1 + t/90;
  const mesh = billboard(d.sprite, d.scale);
  mesh.position.y = d.scale/2;
  world.add(mesh);
  const sp = clampArena(g.p.x + Math.cos(a)*R, g.p.z + Math.sin(a)*R, ARENA_R - 0.5);
  const shadow = Q.shadows ? makeShadow(d.r*2.2) : new THREE.Object3D();
  world.add(shadow);
  g.enemies.push({
    kind, mesh, shadow, x: sp[0], z: sp[1],
    hp: d.hp*k, max: d.hp*k, spd: d.spd, r: d.r, xp: d.xp, dmg: d.dmg*(1 + t/300), cd: 0
  });
}

// Imán total: objeto que cae del 2% de los enemigos y se recoge pasando por encima
function spawnMagnetDrop(x, z){
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.14, 8, 18), new THREE.MeshBasicMaterial({color: 0xff4081}));
  mesh.rotation.x = Math.PI/2;
  world.add(mesh);
  g.drops.push({x, z, mesh, taken: false});
}
function fireProjectile(x, z, vx, vz, dmg, life, color){
  const mesh = new THREE.Mesh(SPROJ_GEO, matFor(color));
  mesh.position.set(x, 0.9 + terrainH(x, z), z);
  world.add(mesh);
  g.shots.push({x, z, vx, vz, dmg, life, mesh, r: 0.3});
  sfx('shoot');
}

function update(dt){
  const p = g.p, ch = g.ch;
  g.t += dt;

  // Movimiento (ejes del mundo)
  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup'])    mz -= 1;
  if (keys['s'] || keys['arrowdown'])  mz += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  g.dashCd = Math.max(0, g.dashCd - dt);
  if (g.dash > 0){
    g.dash -= dt;
    p.x += g.dir.x * 22 * dt;
    p.z += g.dir.z * 22 * dt;
  } else if (mx || mz){
    // Movimiento relativo a la cámara: W avanza hacia donde mira la cámara
    const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
    const wx = mx*cy + mz*sy, wz = -mx*sy + mz*cy;
    const L = Math.hypot(wx, wz);
    const k = waterSlow(p.x, p.z);   // dentro del estanque se camina más despacio
    p.x += wx/L * p.speed * k * dt;
    p.z += wz/L * p.speed * k * dt;
    g.dir = {x: wx/L, z: wz/L};
  }
  // Salto: gravedad simple
  if (p.y > 0 || p.vy !== 0){
    p.vy -= 30*dt;
    p.y += p.vy*dt;
    if (p.y <= 0){ p.y = 0; p.vy = 0; }
  }
  // El jugador no puede salir del escenario (las montañas empiezan en ARENA_R - 1)
  [p.x, p.z] = clampArena(p.x, p.z, ARENA_R - 2);
  resolveSolids(p, 0.5, p.y);   // casas, fuente, habitantes y vallas bloquean al jugador

  // Avisos de fase: hordas a los 45 s y aviso del jefe 15 s antes
  if (g.zone < 2 && g.t >= ZONE2_AT) setZone(2);
  if (!g.hordeWarned && g.t >= 45){ g.hordeWarned = true; announce('¡HORDAS!', 'Más enemigos aparecen', '#ef5350'); }
  if (!g.bossWarned && g.t >= BOSS_AT - 15){ g.bossWarned = true; announce('Algo se acerca…', 'Devimon llega en 15 s', '#ce93d8'); }

  // Aparición
  g.spawnT -= dt;
  if (g.spawnT <= 0){
    spawnEnemy();
    // Presión creciente: tras 45 s salen más enemigos por tanda (1 extra, +1 cada 90 s, máximo 3)
    const extra = g.t > 45 ? Math.min(3, 1 + Math.floor(g.t/90)) : 0;
    for (let i = 0; i < extra && g.enemies.length < Q.maxEnemies; i++) spawnEnemy();
    g.spawnT = Math.max(0.12, 0.9 - g.t/120);
  }

  // Élites: cada 45 s desde el minuto 1; a partir del minuto 5 salen de dos en dos
  g.eliteT -= dt;
  if (g.eliteT <= 0){
    g.eliteT = 45;
    const n = g.t >= 300 ? 2 : 1;
    for (let i = 0; i < n; i++) spawnEnemy('elite');
    announce('¡Élite!', n > 1 ? 'Dos Digimon élite se acercan' : 'Un Digimon élite se acerca', '#ff7043');
  }

  // Enemigos: persiguen y dañan por contacto
  for (const e of g.enemies){
    const dx = p.x - e.x, dz = p.z - e.z, d = Math.hypot(dx, dz) || 1;
    // Se paran a distancia de contacto (no se meten encima del jugador)
    if (d > e.r + 0.6){
      e.x += dx/d * e.spd * dt;
      e.z += dz/d * e.spd * dt;
    }
    [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);   // los enemigos también quedan dentro
    resolveSolids(e, e.r*0.8);                          // y no atraviesan casas ni vallas
    e.cd -= dt;
    if (d < e.r + 0.8 && g.dash <= 0){ p.hp -= e.dmg * dt; shake = Math.max(shake, 0.12); }
  }

  // Armas
  g.wCd -= dt;
  if (ch.kind === 'shot' && g.wCd <= 0 && g.enemies.length){
    g.wCd = ch.cd * p.cdMul;
    const sorted = [...g.enemies].sort((a,b) => dist2(a.x,a.z,p.x,p.z) - dist2(b.x,b.z,p.x,p.z));
    for (let i = 0; i < Math.min(p.count, sorted.length); i++){
      const e = sorted[i], d = dist2(e.x, e.z, p.x, p.z) || 1;
      fireProjectile(p.x, p.z, (e.x-p.x)/d*14, (e.z-p.z)/d*14, ch.dmg*p.dmg, 1.6, 0xffb74d);
    }
  }
  if (ch.kind === 'ring' && g.wCd <= 0){
    g.wCd = ch.cd * p.cdMul;
    const n = 6*p.count, off = Math.random()*Math.PI*2;
    for (let i = 0; i < n; i++){
      const an = off + i/n*Math.PI*2;
      fireProjectile(p.x, p.z, Math.cos(an)*9, Math.sin(an)*9, ch.dmg*p.dmg, 0.9, 0x4fc3f7);
    }
  }

  // Proyectiles
  for (const s of g.shots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 0.9 + terrainH(s.x, s.z), s.z);
    if (s.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp > 0 && dist2(s.x, s.z, e.x, e.z) < e.r + s.r){
        hurt(e, s.dmg); s.life = 0; break;
      }
    }
  }
  g.shots = g.shots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Cuchillas orbitales
  if (ch.kind === 'orbit'){
    g.orbitA += dt*3.2;
    const n = p.count + 1, R = 2.2*p.area;
    while (g.blades.length < n){
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), new THREE.MeshBasicMaterial({color:0xa5d6a7}));
      world.add(m); g.blades.push(m);
    }
    while (g.blades.length > n){ world.remove(g.blades.pop()); }
    for (let i = 0; i < n; i++){
      const an = g.orbitA + i*Math.PI*2/n;
      const bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      g.blades[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.cd <= 0 && dist2(bx, bz, e.x, e.z) < e.r + 0.5){
          hurt(e, ch.dmg*p.dmg); e.cd = 0.35;
        }
      }
    }
  } else if (g.blades.length){
    for (const m of g.blades) world.remove(m);
    g.blades = [];
  }

  updateSkills(dt);

  // Muertes
  const dead = g.enemies.filter(e => e.hp <= 0);
  for (const e of dead){
    g.gems.push({x:e.x, z:e.z, v:e.xp, heal: Math.random() < 0.06, mesh: null});
    if (Math.random() < 0.02) spawnMagnetDrop(e.x, e.z);   // 2%: imán total
    world.remove(e.mesh);
    world.remove(e.shadow);
  }
  if (dead.length) sfx('kill');
  if (dead.length){
    shake = Math.max(shake, Math.min(0.5, 0.1*dead.length));
    if (dead.some(e => e.kind === 'elite' || e.boss)) shake = Math.max(shake, 0.7);
    addBonk(0.35*dead.length);
  }
  g.kills += dead.length;
  if (dead.length){ g.combo += dead.length; g.comboT = 3; }
  g.comboT -= dt;
  if (g.comboT <= 0) g.combo = 0;
  g.enemies = g.enemies.filter(e => e.hp > 0);

  // Imán total: al recogerlo, todas las gemas del mapa vuelan hacia el jugador
  for (const dr of g.drops){
    dr.mesh.rotation.y += dt*4;
    dr.mesh.position.set(dr.x, 0.6 + terrainH(dr.x, dr.z) + Math.sin(g.t*4)*0.1, dr.z);
    if (!dr.taken && dist2(dr.x, dr.z, p.x, p.z) < 1.4){
      dr.taken = true; world.remove(dr.mesh);
      for (const gm of g.gems) gm.attract = true;
      announce('¡Imán total!', 'Toda la experiencia del mapa va hacia ti', '#ff4081');
      sfx('chest');
    }
  }
  g.drops = g.drops.filter(dr => !dr.taken);

  // Gemas de XP
  for (const gm of g.gems){
    if (!gm.mesh){
      gm.mesh = new THREE.Mesh(gm.heal ? GEM_HEAL_GEO : GEM_GEO, matFor(gm.heal ? 0x66bb6a : 0x29b6f6));
      world.add(gm.mesh);
    }
    const d = dist2(gm.x, gm.z, p.x, p.z), dd = d || 1;
    if (d < p.pickup || gm.attract){
      const sp = gm.attract ? Math.max(12, d*8) : 12;   // con el imán total se acercan en pocos segundos
      gm.x += (p.x-gm.x)/dd * sp*dt;
      gm.z += (p.z-gm.z)/dd * sp*dt;
    }
    gm.mesh.position.set(gm.x, 0.4 + terrainH(gm.x, gm.z), gm.z);
    gm.mesh.rotation.y += dt*3;
    if (d < 0.9){
      gm.taken = true; world.remove(gm.mesh);
      if (gm.heal){ p.hp = Math.min(p.maxHp, p.hp + 10); popText(gm.x, gm.z, '+10', '#7cf29c'); sfx('chest'); }
      else { p.xp += gm.v; addBonk(0.02); }
    }
  }
  g.gems = g.gems.filter(gm => !gm.taken);

  // Cofres: aparecen cada 25 s y dan una mejora aleatoria al pasar por encima
  g.chestT -= dt;
  if (g.chestT <= 0){
    g.chestT = 25;
    const a = Math.random()*Math.PI*2, R = 10 + Math.random()*8;
    const [cx, cz] = clampArena(p.x + Math.cos(a)*R, p.z + Math.sin(a)*R, ARENA_R - 2);
    const {group, pivot} = makeChest();
    group.position.set(cx, terrainH(cx, cz), cz);
    world.add(group);
    g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false});
  }
  g.nearChest = null;
  let best = 2.0;
  for (const c of g.chests){
    if (c.open){
      c.openT -= dt;
      if (c.openT <= 0){ world.remove(c.group); c.gone = true; }
      continue;
    }
    const d = dist2(c.x, c.z, p.x, p.z);
    if (d < best){ best = d; g.nearChest = c; }
  }
  g.chests = g.chests.filter(c => !c.gone);
  if (g.flashT > 0) g.flashT -= dt;

  // Números de daño: suben y se desvanecen
  for (const t of g.texts){
    t.life -= dt;
    t.s.position.y += dt*1.2;
    t.mat.opacity = Math.max(0, t.life/0.7);
  }
  for (const t of g.texts.filter(t => t.life <= 0)){
    world.remove(t.s); t.tex.dispose(); t.mat.dispose();
  }
  g.texts = g.texts.filter(t => t.life > 0);

  // Jefe final: aparece a los 240 s y lanza anillos de proyectiles
  if (!g.bossSpawned && g.t >= BOSS_AT){
    g.bossSpawned = true;
    const mesh = billboard('sprites/devimon.png', 5);
    world.add(mesh);
    const shadow = makeShadow(5);
    world.add(shadow);
    g.boss = {kind: 'boss', boss: true, mesh, shadow, x: p.x + 14, z: p.z, hp: 1300, max: 1300,
              spd: 2.2, r: 2.4, xp: 40, dmg: 15, cd: 0};
    g.enemies.push(g.boss);
    g.bossShotT = 2;
    sfx('boss');
    announce('¡JEFE FINAL!', 'Devimon ha llegado', '#ce93d8');
  }
  if (g.boss && g.enemies.includes(g.boss)){
    g.bossShotT -= dt;
    // Aviso: un anillo rojo se encoge sobre el jefe 0.8 s antes de cada disparo
    if (g.bossShotT <= 0.8){
      if (!g.bossRing) g.bossRing = makeBossRing();
      const prog = 1 - Math.max(0, g.bossShotT) / 0.8;
      g.bossRing.position.set(g.boss.x, terrainH(g.boss.x, g.boss.z) + 0.15, g.boss.z);
      g.bossRing.scale.setScalar(1 + 6*(1 - prog));
      g.bossRing.material.opacity = 0.25 + 0.6*prog;
    }
    if (g.bossShotT <= 0){
      g.bossShotT = 2.5;
      clearBossRing();
      const b = g.boss;
      for (let i = 0; i < 10; i++){
        const an = i/10*Math.PI*2 + g.t;
        const shot = new THREE.Mesh(SPROJ_GEO, matFor(0xff1744));
        shot.position.set(b.x, 1 + terrainH(b.x, b.z), b.z);
        world.add(shot);
        g.eshots.push({x: b.x, z: b.z, vx: Math.cos(an)*6, vz: Math.sin(an)*6, life: 4, mesh: shot, dmg: 8});
      }
    }
  } else if (g.boss && !g.bossDown){
    g.bossDown = true;   // el jefe ha caído
    clearBossRing();
  }
  for (const s of g.eshots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 1 + terrainH(s.x, s.z), s.z);
    if (s.life > 0 && dist2(s.x, s.z, p.x, p.z) < 0.9 && g.dash <= 0){
      p.hp -= s.dmg; s.life = 0; shake = Math.max(shake, 0.3);
    }
  }
  g.eshots = g.eshots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Subida de nivel
  if (p.xp >= p.nextXp){
    p.xp -= p.nextXp;
    p.lvl++;
    p.nextXp = Math.floor(10*Math.pow(1.35, p.lvl-1));
    g.choices = upgradeChoices();
    if (p.lvl >= EVO_LEVEL) digivolve();
    g.pendingUp = true;
  }
  // Las mejoras aparecen cuando termina la animación de digievolución
  if (g.pendingUp && !g.evoAnim){
    g.pendingUp = false;
    openUpgrades();
  }

  // Fin
  if (p.hp <= 0){ p.hp = 0; endGame(false); }
  else if (g.bossDown) endGame(true);
}

// Radar de bordes: flechas en el borde de la pantalla hacia cofres y jefe que están fuera de vista
function drawEdgeMarkers(){
  const cv = document.getElementById('edgeCv');
  if (!cv) return;
  if (cv.width !== innerWidth || cv.height !== innerHeight){ cv.width = innerWidth; cv.height = innerHeight; }
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  if (state !== 'play' || !g) return;
  const targets = g.chests.filter(ch => !ch.open && !ch.gone).map(ch => ({x: ch.x, z: ch.z, col: '#ffd54f'}));
  if (g.boss && g.enemies.includes(g.boss)) targets.push({x: g.boss.x, z: g.boss.z, col: '#ce93d8'});
  const W = cv.width, H = cv.height, cx = W/2, cy = H/2;
  for (const t of targets){
    const v = new THREE.Vector3(t.x, terrainH(t.x, t.z) + 1.5, t.z).project(camera);
    const sx = (v.x + 1)/2*W, sy = (1 - v.y)/2*H;
    const inside = v.z < 1 && sx > 40 && sx < W - 40 && sy > 40 && sy < H - 40;
    if (inside) continue;
    let dx = sx - cx, dy = sy - cy;
    if (v.z > 1){ dx = -dx; dy = -dy; }          // detrás de la cámara: la flecha apunta al lado correcto
    const k = Math.min((cx - 40)/Math.abs(dx || 1e-6), (cy - 40)/Math.abs(dy || 1e-6));
    const px = cx + dx*k, py = cy + dy*k;
    c.save(); c.translate(px, py); c.rotate(Math.atan2(dy, dx));
    c.fillStyle = t.col; c.strokeStyle = '#000'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(16, 0); c.lineTo(-9, -11); c.lineTo(-9, 11); c.closePath(); c.fill(); c.stroke();
    c.restore();
    c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 3; c.font = 'bold 13px system-ui'; c.textAlign = 'center';
    const d = Math.round(Math.hypot(t.x - g.p.x, t.z - g.p.z));
    c.strokeText(d + ' m', px, py - 16); c.fillText(d + ' m', px, py - 16);
  }
}
// ---------- Habilidades de ataque: se eligen al subir de nivel (hasta nivel 3) ----------
const SKILLS = {
  aura:     {name:'Aura de Datos',         k:'defensiva', d:'Anillo digital alrededor del Digimon: daña cada 0,25 s a quien entra en él.'},
  tornado:  {name:'Tornado Bit',           k:'defensiva', d:'Bits que giran a tu alrededor: empujan enemigos y frenan proyectiles del jefe.'},
  pulso:    {name:'Onda de Pulso',         k:'defensiva', d:'Onda de 360° cada pocos segundos que empuja a toda la horda.'},
  espiral:  {name:'Disparo Espiral',       k:'ofensiva',  d:'Proyectil rápido que atraviesa a los enemigos (2 al nivel 1).'},
  cuchilla: {name:'Cuchilla Persiguiente', k:'ofensiva',  d:'Hojas de energía que buscan al enemigo más fuerte de la pantalla.'},
  laser:    {name:'Rayo Láser',            k:'ofensiva',  d:'Haz neón hacia el enemigo más cercano; atraviesa a los que están en línea.'},
  mina:     {name:'Mina Digital',          k:'utilidad',  d:'Dejas minas al moverte; explotan en área cuando un enemigo las pisa.'},
  meteoro:  {name:'Lluvia de Meteoros',    k:'ofensiva',  d:'Impactos aleatorios cerca de ti, avisados con un círculo en el suelo.'}
};
const SKILL_MAX = 3;
function addSkill(id){ g.skills[id] = Math.min(SKILL_MAX, (g.skills[id] || 0) + 1); }
// Opciones del nivel: mejoras base + habilidades que aún no están al máximo
function upgradeChoices(){
  const pool = [...UPGRADES];
  for (const id of Object.keys(SKILLS)){
    const lv = g.skills[id] || 0;
    if (lv >= SKILL_MAX) continue;
    const s = SKILLS[id];
    pool.push({t: `${s.name} · ${lv ? 'Nivel ' + (lv + 1) : 'Nueva'}`, k: s.k, d: s.d, f: () => addSkill(id)});
  }
  return pool.sort(() => Math.random() - 0.5).slice(0, 3);
}
// Materiales y geometrías compartidos (evitan crear objetos en cada disparo o impacto)
const matCache = {};
function matFor(color){ return matCache[color] || (matCache[color] = new THREE.MeshBasicMaterial({color})); }
const RING_GEO = new THREE.RingGeometry(0.96, 1, 48);
const GEM_GEO = new THREE.OctahedronGeometry(0.25), GEM_HEAL_GEO = new THREE.OctahedronGeometry(0.32);
const BIT_GEO = new THREE.SphereGeometry(0.3, 10, 10), BIT_MAT = new THREE.MeshBasicMaterial({color: 0xe040fb});
const SPROJ_GEO = new THREE.SphereGeometry(0.28, 8, 8);
const BEAM_GEO = new THREE.BoxGeometry(0.22, 0.22, 1), BEAM_MAT = new THREE.MeshBasicMaterial({color: 0x40c4ff, transparent: true, opacity: 0.85, depthWrite: false});
const MINE_GEO = new THREE.CylinderGeometry(0.42, 0.42, 0.12, 14), MINE_MAT = new THREE.MeshBasicMaterial({color: 0xff7043});
function newSkillState(){
  return {aura: null, auraT: 0, bits: [], spin: 0, pulseT: 1.5, spiralT: 0.3, bladeT: 1.0, laserT: 1.2,
    lastMine: {x: 0, z: 0}, mines: [], meteorT: 1.5, meteors: [], beams: [], proj: []};
}
// Enemigo más fuerte (más vida máxima) dentro del radio
function strongestIn(x, z, R){
  let best = null, bm = -1;
  for (const e of g.enemies){
    if (e.hp <= 0 || e.max <= bm) continue;
    if (dist2(x, z, e.x, e.z) <= R*R){ best = e; bm = e.max; }
  }
  return best;
}
function nearestIn(x, z, R){
  let best = null, bd = R*R;
  for (const e of g.enemies){
    if (e.hp <= 0) continue;
    const d = dist2(x, z, e.x, e.z);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
function spawnSProj(x, z, vx, vz, dmg, life, pierce, homing, color, target = null){
  const mesh = new THREE.Mesh(SPROJ_GEO, matFor(color));
  world.add(mesh);
  g.sk.proj.push({x, z, vx, vz, dmg, life, pierce, homing, target, hit: new Set(), mesh});
}
function dropMine(x, z, lv){
  const mesh = new THREE.Mesh(MINE_GEO, MINE_MAT);
  mesh.position.set(x, 0.1 + terrainH(x, z), z);
  world.add(mesh);
  g.sk.mines.push({x, z, life: 14, mesh, lv});
}
// Aplica una habilidad activa cada frame: lo que cada una hace está en el bloque de abajo
function updateSkills(dt){
  const p = g.p, S = g.sk, L = g.skills, ar = p.area, dm = p.dmg, cm = p.cdMul;
  const lv = id => L[id] || 0;

  // Aura de Datos: anillo que daña a los enemigos que entran
  if (lv('aura')){
    const R = (2.6 + 0.9*lv('aura')) * ar;
    if (!S.aura){
      S.aura = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: 0x4fc3f7, transparent: true, opacity: 0.4, depthWrite: false}));
      S.aura.rotation.x = -Math.PI/2;
      world.add(S.aura);
    }
    S.aura.scale.setScalar(R);
    S.aura.position.set(p.x, terrainH(p.x, p.z) + 0.06, p.z);
    S.auraT -= dt;
    if (S.auraT <= 0){
      S.auraT = 0.25;
      const dmg = (3 + 1.5*lv('aura')) * dm;
      for (const e of g.enemies) if (e.hp > 0 && dist2(p.x, p.z, e.x, e.z) < (R + e.r)*(R + e.r)) hurt(e, dmg);
    }
  }

  // Tornado Bit: bits que giran, empujan y frenan proyectiles del jefe
  const nT = lv('tornado') ? lv('tornado') + 1 : 0;
  while (S.bits.length < nT){ const m = new THREE.Mesh(BIT_GEO, BIT_MAT); world.add(m); S.bits.push(m); }
  while (S.bits.length > nT) world.remove(S.bits.pop());
  if (nT){
    S.spin += dt*3.2;
    const R = 3.4*ar;
    for (const e of g.enemies) if (e.tcd > 0) e.tcd -= dt;
    for (let i = 0; i < nT; i++){
      const an = S.spin + i*Math.PI*2/nT, bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      S.bits[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.hp <= 0) continue;
        const dx = e.x - bx, dz = e.z - bz, d = Math.hypot(dx, dz);
        if (d < e.r + 0.9){
          if (!(e.tcd > 0)){ hurt(e, (4 + 2*lv('tornado')) * dm); e.tcd = 0.5; }
          const push = 1.2/(d || 1); e.x += dx*push; e.z += dz*push;
          [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);
        }
      }
    }
    for (const s of g.eshots){
      if (s.life > 0 && S.bits.some(m => dist2(s.x, s.z, m.position.x, m.position.z) < 1.6)) s.life = 0;
    }
  }

  // Onda de Pulso: anillo de 360° que daña y empuja
  if (lv('pulso')){
    S.pulseT -= dt;
    if (S.pulseT <= 0){
      const L2 = lv('pulso');
      S.pulseT = (3.2 - 0.4*L2) * cm;
      const R = (6.5 + 1.5*L2) * ar;
      spawnRing(p.x, p.z, 0x4fc3f7, R, 0.5);
      for (const e of g.enemies){
        if (e.hp <= 0) continue;
        const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz);
        if (d < R + e.r){
          hurt(e, (8 + 3*L2) * dm);
          const push = 5/(d || 1); e.x += dx*push; e.z += dz*push;
          [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);
        }
      }
    }
  }

  // Disparo Espiral: al enemigo más cercano; atraviesa varios
  if (lv('espiral')){
    S.spiralT -= dt;
    if (S.spiralT <= 0){
      const t = nearestIn(p.x, p.z, 40);
      if (t){
        S.spiralT = 0.9 * cm;
        const d = Math.hypot(t.x - p.x, t.z - p.z) || 1;
        spawnSProj(p.x, p.z, (t.x - p.x)/d*24, (t.z - p.z)/d*24, (7 + 3*lv('espiral')) * dm, 1.8, 1 + lv('espiral'), false, 0xffe082);
      } else S.spiralT = 0.2;
    }
  }

  // Cuchilla Persiguiente: hojas que se dirigen al enemigo más fuerte
  if (lv('cuchilla')){
    S.bladeT -= dt;
    if (S.bladeT <= 0){
      S.bladeT = 1.6 * cm;
      const n = 2*lv('cuchilla') + (p.count - 1);
      const base = Math.random()*Math.PI*2;
      for (let i = 0; i < n; i++){
        const an = base + i*Math.PI*2/n;
        spawnSProj(p.x, p.z, Math.cos(an)*10, Math.sin(an)*10, (6 + 2*lv('cuchilla')) * dm, 4, 1, true, 0xce93d8, strongestIn(p.x, p.z, 45));
      }
    }
  }

  // Rayo Láser: haz hacia el enemigo más cercano; daña a todos los que están en la línea
  if (lv('laser')){
    S.laserT -= dt;
    if (S.laserT <= 0){
      const t = nearestIn(p.x, p.z, 36);
      if (t){
        const L2 = lv('laser'), len = 18;
        S.laserT = 2.8 * cm;
        const dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz) || 1, ux = dx/d, uz = dz/d;
        for (const e of g.enemies){
          if (e.hp <= 0) continue;
          const ex = e.x - p.x, ez = e.z - p.z, along = ex*ux + ez*uz;
          if (along < 0 || along > len) continue;
          if (Math.abs(ex*uz - ez*ux) < e.r + 0.5) hurt(e, (12 + 4*L2) * dm);
        }
        const beam = new THREE.Mesh(BEAM_GEO, BEAM_MAT);
        beam.position.set(p.x + ux*len/2, 0.9 + terrainH(p.x, p.z), p.z + uz*len/2);
        beam.rotation.y = Math.atan2(ux, uz);
        beam.scale.z = len;
        world.add(beam);
        S.beams.push({m: beam, t: 0});
      } else S.laserT = 0.25;
    }
  }
  for (const b of S.beams) b.t += dt;
  S.beams = S.beams.filter(b => { if (b.t < 0.18) return true; world.remove(b.m); return false; });

  // Mina Digital: se deja una mina cada 2,2 m recorridos; explota al pisarla un enemigo
  if (lv('mina')){
    const L2 = lv('mina');
    if (dist2(p.x, p.z, S.lastMine.x, S.lastMine.z) > 2.2*2.2 && S.mines.length < 14 + 4*L2){
      dropMine(p.x, p.z, L2);
      S.lastMine = {x: p.x, z: p.z};
    }
    for (const m of S.mines){
      if (m.life <= 0) continue;
      m.life -= dt;
      const trig = g.enemies.some(e => e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (e.r + 1.2)*(e.r + 1.2));
      if (m.life <= 0 || trig){
        const R = (2.6 + 0.6*m.lv) * ar;
        m.life = 0;
        spawnRing(m.x, m.z, 0xff7043, R, 0.45);
        burst(m.x, m.z, 0xff7043);
        for (const e of g.enemies) if (e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (R + e.r)*(R + e.r)) hurt(e, (18 + 6*m.lv) * dm);
      }
    }
    S.mines = S.mines.filter(m => { if (m.life > 0) return true; world.remove(m.mesh); return false; });
  }

  // Lluvia de Meteoros: aviso en el suelo y después impacto en área
  if (lv('meteoro')){
    S.meteorT -= dt;
    if (S.meteorT <= 0){
      const L2 = lv('meteoro');
      S.meteorT = 2.6 * cm;
      for (let i = 0; i < L2 + 1; i++){
        const an = Math.random()*Math.PI*2, rr = Math.sqrt(Math.random())*13;
        const [mx, mz] = clampArena(p.x + Math.cos(an)*rr, p.z + Math.sin(an)*rr, ARENA_R - 2);
        const R = 2.6 * ar;
        const wm = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: 0xff5252, transparent: true, opacity: 0.6, depthWrite: false}));
        wm.rotation.x = -Math.PI/2;
        wm.position.set(mx, terrainH(mx, mz) + 0.07, mz);
        wm.scale.setScalar(R);
        world.add(wm);
        S.meteors.push({x: mx, z: mz, t: 0, R, mesh: wm, dmg: (14 + 5*L2) * dm});
      }
    }
    for (const m of S.meteors){
      m.t += dt;
      m.mesh.material.opacity = 0.35 + 0.35*Math.sin(m.t*18);
      if (m.t >= 0.7 && !m.done){
        m.done = true;
        for (const e of g.enemies) if (e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (m.R + e.r)*(m.R + e.r)) hurt(e, m.dmg);
        spawnRing(m.x, m.z, 0xff5252, m.R, 0.4);
        burst(m.x, m.z, 0xff5252);
      }
    }
    S.meteors = S.meteors.filter(m => { if (!m.done) return true; world.remove(m.mesh); return false; });
  }

  // Proyectiles de Espiral y Cuchilla: avanzan, las cuchillas giran hacia su objetivo y atraviesan según su alcance
  for (const pr of S.proj){
    if (pr.homing){
      if (!pr.target || pr.target.hp <= 0) pr.target = strongestIn(pr.x, pr.z, 60);
      if (pr.target){
        const dx = pr.target.x - pr.x, dz = pr.target.z - pr.z, d = Math.hypot(dx, dz) || 1;
        const sp = Math.hypot(pr.vx, pr.vz) || 16, k = Math.min(1, dt*4);
        pr.vx += ((dx/d)*sp - pr.vx)*k;
        pr.vz += ((dz/d)*sp - pr.vz)*k;
      }
    }
    pr.x += pr.vx*dt; pr.z += pr.vz*dt; pr.life -= dt;
    pr.mesh.position.set(pr.x, 0.9 + terrainH(pr.x, pr.z), pr.z);
    if (pr.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp <= 0 || pr.hit.has(e)) continue;
      if (dist2(pr.x, pr.z, e.x, e.z) < (e.r + 0.3)*(e.r + 0.3)){
        hurt(e, pr.dmg);
        pr.hit.add(e);
        if (--pr.pierce <= 0){ pr.life = 0; break; }
      }
    }
  }
  S.proj = S.proj.filter(pr => { if (pr.life > 0) return true; world.remove(pr.mesh); return false; });
}
function openUpgrades(){
  state = 'levelup';
  sfx('levelup');
  document.getElementById('flash').animate([{opacity: .75}, {opacity: 0}], {duration: 520});
  unlockMouse();   // hay que poder hacer clic en las mejoras
  const cat = {ofensiva:'Ofensiva', defensiva:'Defensiva', utilidad:'Utilidad'};
  showOverlay(`<h2>¡Nivel ${g.p.lvl}! Elige una mejora</h2>
    <p class="up-sub">Pulsa 1-3 o haz clic</p>
    <div class="row">${g.choices.map((c,i)=>`
      <div class="card ${c.k || 'utilidad'}" data-up="${i}">
        <span class="num">${i+1}</span>
        <span class="tag">${cat[c.k] || 'Mejora'}</span>
        <b>${c.t}</b>
        <p>${c.d || ''}</p>
      </div>`).join('')}</div>`);
  overlay.querySelectorAll('[data-up]').forEach(el => el.onclick = () => pickUpgrade(+el.dataset.up));
}

function pickUpgrade(i){
  if (state !== 'levelup') return;
  g.choices[i].f(g.p);
  hideOverlay();
  lockMouse();
  state = 'play';
}

function endGame(win){
  state = 'end';
  sfx(win ? 'victory' : 'defeat');
  const daily = loadDaily();
  const raw = Math.floor(g.kills/2 + g.t/10);
  const earned = Math.min(raw, Math.max(0, DAILY.runCap - daily.runBits));
  if (g.t >= 5) daily.runs += 1;
  daily.runBits += earned;
  let bonus = 0;
  if (!daily.claimed && daily.runs >= DAILY.runsGoal){ daily.claimed = true; bonus = DAILY.reward; }
  saveDaily(daily);
  SAVE.bits = SAVE.bits + earned + bonus;
  g.earned = earned + bonus;
  g.bonus = bonus;
  g.unlocked = recordRun(g.ch.id, g.kills, g.t);
  g.newTitles = checkAchievements(win);
  unlockMouse();
  saveRecord(win);
  showOverlay(`<h1>${win ? '¡Sobreviviste!' : 'Has caído'}</h1>
    <p>Nivel ${g.p.lvl} · Bajas ${g.kills} · Tiempo ${Math.floor(g.t)} s · ${ZONES[g.zone - 1].name}</p>
    <p>+${g.earned} Bits</p>
    ${g.bonus ? `<p>¡Misión diaria completada! +${g.bonus} Bits</p>` : ''}
    ${g.unlocked.length ? `<p>¡Skin nueva: ${g.unlocked.join(', ')}!</p>` : ''}

}

// ---------- Cámara y sincronización ----------
function syncMeshes(){
  const p = g.p;
  const gp = terrainH(p.x, p.z);
  g.playerMesh.position.set(p.x, gp + 1.1 + p.y, p.z);
  g.playerShadow.position.set(p.x, gp + 0.02, p.z);
  if (g.hiRing) g.hiRing.position.set(p.x, gp + 0.03, p.z);
  for (const e of g.enemies){
    const ge = terrainH(e.x, e.z);
    e.mesh.position.set(e.x, ge + e.mesh.scale.y/2, e.z);
    e.shadow.position.set(e.x, ge + 0.02, e.z);
  }
}
// Cámara orbital integrada con el ratón: el ratón bloqueado (pointer lock) gira la vista sin pulsar nada.
// Esc libera el ratón; al hacer clic de nuevo en la pantalla se vuelve a bloquear.
const camBase = new THREE.Vector3(0, 16, 11);
let camYaw = 0, camPitch = 0.9, camDist = 19.4;
const canvasEl = renderer.domElement;
// Algunos entornos (p. ej. paneles embebidos) rechazan el bloqueo: se ignora el error y el juego sigue
function lockMouse(onFail){
  const r = canvasEl.requestPointerLock();
  if (r && r.catch) r.catch(() => { if (onFail) onFail(); });
}
function unlockMouse(){
  const r = document.exitPointerLock();
  if (r && r.catch) r.catch(() => {});
}
canvasEl.addEventListener('mousedown', () => {
  if (state === 'play' && !document.pointerLockElement) lockMouse();
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvasEl) return;
  camYaw -= e.movementX*0.0025;
  camPitch = Math.max(0.2, Math.min(1.4, camPitch + e.movementY*0.0018));
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.max(10, Math.min(36, camDist + e.deltaY*0.02));
}, {passive: true});

function updateCamera(dt){
  const p = g.p;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  // La cámara no sale del escenario: así el muro de piedra y las montañas nunca se interponen
  const [camX, camZ] = clampArena(p.x + Math.sin(camYaw)*cp*camDist, p.z + Math.cos(camYaw)*cp*camDist, ARENA_R - 4);
  camBase.lerp(new THREE.Vector3(camX, terrainH(p.x, p.z) + 1.2 + sp*camDist, camZ), Math.min(1, dt*10));
  shake = Math.max(0, shake - dt*2.5);
  const s = shake*shake*0.8;
  camera.position.set(
    camBase.x + (Math.random()-0.5)*s,
    camBase.y + (Math.random()-0.5)*s,
    camBase.z + (Math.random()-0.5)*s);
  camera.lookAt(p.x, terrainH(p.x, p.z) + 1.2 + p.y*0.5, p.z);
}
// Anuncio central con animación: título grande y subtítulo

/* ---------- Música: tema original de aventura (sintetizado, sin archivos ni melodías existentes) ---------- */
const Music = {on: localStorage.getItem('digibonk3d-music') !== '0', nodes: null};
// Melodía propia en la menor/do mayor: 8 compases de corcheas (MIDI, null = silencio)
const TUNE_BPM = 150;
const TUNE_LEAD = [
  [69,69,72,69,76,74,72,null], [65,65,69,65,69,67,65,64], [67,67,72,67,64,62,60,null], [62,64,67,71,74,null,67,69],
  [69,72,76,72,69,64,69,null], [65,69,72,69,65,69,72,null], [67,72,76,74,72,67,64,60], [62,67,71,74,67,71,74,null]
];
// Raíz del acorde de cada compás (Am F C G Am F G C) y el bajo sube raíz, quinta, octava, quinta
const TUNE_ROOT = [45, 41, 48, 43, 45, 41, 43, 48];
function midiHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function musicStart(){
  if (!Sfx.ctx || Music.nodes) return;
  const c = Sfx.ctx;
  const out = c.createGain(); out.gain.value = 0;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  lp.connect(out); out.connect(c.destination);
  out.gain.setTargetAtTime(0.32, c.currentTime, 0.6);
  const eighth = 60 / TUNE_BPM / 2;
  const nodes = {out, stopped: false, timer: null};
  const tone = (m, t, dur, type, vol) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = midiHz(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t + dur + 0.05);
  };
  const kick = t => {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.16);
  };
  const hat = (t, vol) => {
    if (!Sfx.noiseBuf) return;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = Sfx.noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.3); s.stop(t + 0.06);
  };
  let step = 0, next = c.currentTime + 0.1;
  const schedule = () => {
    if (nodes.stopped) return;
    while (next < c.currentTime + 0.3){
      const bar = (step >> 3) & 7, pos = step & 7;
      const r = TUNE_ROOT[bar];
      const bassM = [r, r + 7, r + 12, r + 7][pos & 3];
      tone(TUNE_LEAD[bar][pos], next, eighth * 0.85, 'square', 0.05);
      tone(bassM, next, eighth * 0.9, 'triangle', 0.3);
      if ((pos & 3) === 0) kick(next);
      if (pos === 2 || pos === 6) hat(next, 0.05);
      else if (pos & 1) hat(next, 0.02);
      next += eighth; step++;
    }
  };
  schedule();
  nodes.timer = setInterval(schedule, 60);
  Music.nodes = nodes;
}
function musicStop(){
  if (!Music.nodes) return;
  const {out, timer} = Music.nodes;
  Music.nodes.stopped = true;
  clearInterval(timer);
  out.gain.setTargetAtTime(0, Sfx.ctx.currentTime, 0.3);
  setTimeout(() => { try { out.disconnect(); } catch(e){} }, 1200);
  Music.nodes = null;
}

/* ---------- Sonido: efectos sintetizados con Web Audio (sin archivos) ---------- */
const Sfx = {ctx:null, master:null, muted: localStorage.getItem('digibonk3d-sfx') === '0', last:{}, noiseBuf:null};
function audioInit(){
  if (Sfx.ctx){ if (Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  Sfx.ctx = new AC();
  Sfx.master = Sfx.ctx.createGain();
  Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  Sfx.master.connect(Sfx.ctx.destination);
  if (Music.on) musicStart();
  const len = Math.floor(Sfx.ctx.sampleRate * 0.5);
  Sfx.noiseBuf = Sfx.ctx.createBuffer(1, len, Sfx.ctx.sampleRate);
  const d = Sfx.noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
}
function tone(freq, dur, type, vol, slideTo, delay){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), gn = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(Sfx.master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, delay, hp){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const src = c.createBufferSource(); src.buffer = Sfx.noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
  const gn = c.createGain();
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(gn); gn.connect(Sfx.master);
  src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.05);
}
// Intervalo mínimo entre repeticiones para que los efectos frecuentes no saturen
const SFX_GAP = {shoot:70, hit:60, kill:40, hurt:250};
function sfx(name){
  const c = Sfx.ctx;
  if (!c || Sfx.muted || c.state !== 'running') return;
  if (SFX_GAP[name]){
    const now = performance.now();
    if (now - (Sfx.last[name] || 0) < SFX_GAP[name]) return;
    Sfx.last[name] = now;
  }
  switch (name){
    case 'shoot':   tone(880, .08, 'triangle', .07, 440); break;
    case 'hit':     noise(.05, .10, 0, 1500); break;
    case 'kill':    tone(520, .10, 'square', .06, 260); break;
    case 'hurt':    tone(170, .28, 'sawtooth', .16, 70); noise(.15, .06, 0, 300); break;
    case 'chest':   [523,659,784,1046].forEach((f,i) => tone(f, .16, 'triangle', .18, null, i*.07)); break;
    case 'ready':   tone(1568, .10, 'square', .05); tone(2349, .16, 'triangle', .06, null, .07); break;
    case 'levelup': [440,554,660,880].forEach((f,i) => tone(f, .18, 'square', .07, null, i*.08)); break;
    case 'evolve':  tone(220, 1.0, 'sawtooth', .10, 880); [523,659,784].forEach((f,i) => tone(f, .5, 'triangle', .14, null, .6 + i*.1)); break;
    case 'boss':    tone(65, 1.6, 'sawtooth', .16, 40); noise(1.2, .07, 0, 200); break;
    case 'victory': [523,659,784,1046,784,1046].forEach((f,i) => tone(f, .22, 'triangle', .18, null, i*.12)); break;
    case 'defeat':  tone(330, .6, 'triangle', .18, 110); tone(220, .9, 'triangle', .16, 55, .3); break;
  }
}
function toggleMute(silent){
  Sfx.muted = !Sfx.muted;
  localStorage.setItem('digibonk3d-sfx', Sfx.muted ? '0' : '1');
  if (Sfx.master) Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  if (!silent) announce(Sfx.muted ? 'Sonido desactivado' : 'Sonido activado', 'N para cambiarlo', '#7fd0ff');
}
addEventListener('pointerdown', audioInit);

/* ---------- Mapa 2D: minimapa en la esquina y mapa completo (tecla M) ---------- */
const VILLAGE_R = 14;   // radio aproximado del Pueblo Primario, en unidades del escenario
// Iconos: sprites del juego cargados una vez y reutilizados en el mapa
const iconCache = {};
function iconImg(src){
  if (!iconCache[src]){ const im = new Image(); im.src = src; iconCache[src] = im; }
  return iconCache[src];
}
function drawIcon(c, src, cx, cy, size){
  const im = iconImg(src);
  if (im.complete && im.naturalWidth) c.drawImage(im, cx - size/2, cy - size/2, size, size);
  else { c.fillStyle = '#ffffff'; c.beginPath(); c.arc(cx, cy, size/4, 0, Math.PI*2); c.fill(); }
}
function drawWorldMap(cv, size){
  if (!cv) return;
  const c = cv.getContext('2d');
  const R = size / 2, k = (R - 6) / ARENA_R;
  const X = x => R + x*k, Y = z => R + z*k;
  const u = size / 170;   // escala de los iconos según el tamaño del mapa
  c.clearRect(0, 0, size, size);
  c.fillStyle = '#4b5d72'; c.beginPath(); c.arc(R, R, R - 1, 0, Math.PI*2); c.fill();      // montañas
  c.fillStyle = '#3f7d3f'; c.beginPath(); c.arc(R, R, ARENA_R*k, 0, Math.PI*2); c.fill();  // prado
  c.fillStyle = 'rgba(215,168,110,.6)'; c.beginPath(); c.arc(X(0), Y(0), VILLAGE_R*k, 0, Math.PI*2); c.fill();
  c.fillStyle = '#2a7fb8'; c.beginPath(); c.arc(X(POND.x), Y(POND.z), POND.r*k, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff3d6'; c.font = `${Math.max(9, size/28)}px system-ui`; c.textAlign = 'center';
  c.fillText('Pueblo', X(0), Y(0) + 3);
  if (!g) return;
  // Cofres sin abrir: icono de regalo
  c.font = `${Math.max(12, 14*u)}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const ch of g.chests){
    if (ch.open) continue;
    c.fillText('🎁', X(ch.x), Y(ch.z));
  }
  // Enemigos: su propio sprite, en miniatura
  for (const e of g.enemies){
    if (e.boss) continue;
    const d = ENEMY[e.kind];
    drawIcon(c, d ? d.sprite : 'sprites/numemon.png', X(e.x), Y(e.z), (e.kind === 'tank' ? 16 : 12) * u);
  }
  // Jefe: Devimon
  if (g.boss && g.enemies.includes(g.boss)){
    drawIcon(c, 'sprites/devimon.png', X(g.boss.x), Y(g.boss.z), 26 * u);
  }
  // Jugador: el Digimon que estás usando
  const pc = X(g.p.x), py = Y(g.p.z);
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(pc, py, 12*u, 0, Math.PI*2); c.fill();
  drawIcon(c, spriteOf(g.ch.id, g.ch.evolved), pc, py, 24 * u);
}

   desc:'Juega durante el evento'}

function loadJSON(k, def){ try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e){ return def; } }
let skinsOwned = loadJSON('digibonk3d-skins', {});      // {personaje: [ids de skin]}
let skinEquipped = loadJSON('digibonk3d-equip', {});    // {personaje: id de skin}
function ownedSkins(key){ return ['clasico', ...(skinsOwned[key] || [])]; }
function equipSkin(key, id){
  if (!ownedSkins(key).includes(id)) return;
  skinEquipped[key] = id;
  localStorage.setItem('digibonk3d-equip', JSON.stringify(skinEquipped));
}
function grantSkin(key, id){

// Progreso por personaje: partidas (de al menos 5 s) y bajas
function statsOf(key){ return loadJSON('digibonk3d-stats', {})[key] || {plays:0, kills:0}; }
function meetsReq(sk, st){
  return (!sk.req.plays || st.plays >= sk.req.plays) && (!sk.req.kills || st.kills >= sk.req.kills);
}
// Se llama al terminar cada partida: actualiza el progreso y devuelve las skins nuevas
function recordRun(key, kills, t){
  const all = loadJSON('digibonk3d-stats', {});
  const st = all[key] || {plays:0, kills:0};
  if (t >= 5) st.plays += 1;
  st.kills += kills;
  all[key] = st;
  localStorage.setItem('digibonk3d-stats', JSON.stringify(all));
  const unlocked = [];
  for (const sk of SKINS){
    if (sk.src === 'logro' && !ownedSkins(key).includes(sk.id) && meetsReq(sk, st)){
      grantSkin(key, sk.id); unlocked.push(`${sk.name} (${CHARS[key].name})`);
    }
  }
  if (t >= 5 && eventActive() && !ownedSkins(key).includes('festival')){
    grantSkin(key, 'festival'); unlocked.push(`Festival (${CHARS[key].name})`);
  }
  return unlocked;
}

// Sprites recoloreados o con efecto, generados en un canvas al arrancar
const skinURL = {};   // clave: personaje|evolucionado|skin
// Efecto glitch: desfase de canales R y B y algunas líneas desplazadas
function glitchPixels(x, w, h){
  const d = x.getImageData(0, 0, w, h), src = new Uint8ClampedArray(d.data), sh = Math.max(1, Math.round(w/64));
  for (let y = 0; y < h; y++){
    const rowShift = (y*37) % 23 === 0 ? sh*2 : 0;   // algunas filas se desplazan más
    for (let xx = 0; xx < w; xx++){
      const i = (y*w + xx) * 4;
      const xr = Math.min(w-1, Math.max(0, xx - sh - rowShift));
      const xb = Math.min(w-1, Math.max(0, xx + sh + rowShift));
      const ir = (y*w + xr) * 4, ib = (y*w + xb) * 4;
      d.data[i]   = src[ir];       // rojo desplazado a la izquierda
      d.data[i+1] = src[i+1];      // verde en su sitio
      d.data[i+2] = src[ib+2];     // azul desplazado a la derecha
      d.data[i+3] = src[i+3];
    }
  }
  x.putImageData(d, 0, 0);
}
function makeSkin(path, sk, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d');
    x.filter = sk.f || 'none';
    x.drawImage(img, 0, 0);
    x.filter = 'none';
    if (sk.fx === 'glitch') glitchPixels(x, c.width, c.height);
    try { cb(c.toDataURL('image/png')); } catch(e){}
  };
  img.src = path;
}
function buildSkins(){
  for (const key of SEASONS.adventure.chars){
    for (const evo of [false, true]){
      const path = evo ? EVO[key].sprite : CHARS[key].sprite;
      for (const sk of SKINS){
        if (sk.id === 'clasico') continue;
        makeSkin(path, sk, url => { skinURL[`${key}|${evo ? 1 : 0}|${sk.id}`] = url; });
      }
    }
  }
}
// Sprite a usar para un personaje con su skin (o el original si aún no está lista)
function spriteWith(key, evolved, skinId){
  const base = evolved ? EVO[key].sprite : CHARS[key].sprite;
  if (!skinId || skinId === 'clasico') return base;
  return skinURL[`${key}|${evolved ? 1 : 0}|${skinId}`] || base;
}
function spriteOf(key, evolved){ return spriteWith(key, evolved, skinEquipped[key]); }

/* ---------- Icono del jugador: solo la cabeza del Digimon ---------- */
const headCache = {};
function headUrl(src){
  if (headCache[src]) return headCache[src] === 'pending' ? src : headCache[src];
  headCache[src] = 'pending';
  const im = new Image();
  im.onload = () => {
    const w = im.naturalWidth, h = im.naturalHeight;
    const c = document.createElement('canvas'); c.width = 96; c.height = 96;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    // recorte de la parte superior centrada: la cabeza
    x.drawImage(im, w*0.2, 0, w*0.6, h*0.58, 0, 0, 96, 96);
    headCache[src] = c.toDataURL('image/png');
  };
  im.src = src;
  return src;
}

// Títulos: solo cosmética (no dan bonus). Se consiguen con el gacha o con logros (ver checkAchievements)

  {id:'novato',     name:'Novato',           tier:'c', how:'Termina tu primera partida'},
  {id:'cazador',    name:'Cazador de bajas', tier:'c', how:'Acumula 300 bajas en total'},

// Progreso de logros guardado en 'digibonk3d-ach'
function loadAch(){ return loadJSON('digibonk3d-ach', {runs: 0, zone2: false, boss: false}); }
// Tras cada partida concede los títulos cuyo logro se ha cumplido (una sola vez). Devuelve los nuevos.
function checkAchievements(win){
  const ach = loadAch();
  if (g.t >= 5) ach.runs += 1;
  if (g.zone >= 2) ach.zone2 = true;
  if (win && g.bossDown) ach.boss = true;
  localStorage.setItem('digibonk3d-ach', JSON.stringify(ach));
  const all = loadJSON('digibonk3d-stats', {});
  const totalKills = Object.values(all).reduce((a, s) => a + (s.kills || 0), 0);
  const met = {novato: ach.runs >= 1, cazador: totalKills >= 300, explorador: ach.zone2, maestro: ach.boss};
  const won = [];
  for (const t of TITLES){
    if (met[t.id] && !inv.titles.includes(t.id)){ inv.titles.push(t.id); won.push(t); }
  }
  if (won.length) saveInv();
  return won;
}
const ITEMS = [
  {id:'pocion',   name:'Poción digital',   icon:'🧪', tier:'c', desc:'Empiezas la partida con +20 PS'},
  {id:'iman',     name:'Imán de datos',    icon:'🧲', tier:'c', desc:'Empiezas con +30% de imán'},

  {id:'nucleo',   name:'Núcleo digital',   icon:'💠', tier:'e', desc:'Empiezas con +25% de daño'}
];
const TIER_NAME = {c:'Común', r:'Rara', e:'Épica', l:'Legendaria'};
const TIER_CLASS = {c:'c', r:'r', e:'e', l:'l'};
let inv = loadJSON('digibonk3d-inv', {frames: [], titles: [], items: {}});
let extra = loadJSON('digibonk3d-extra', {frame: null, title: null, item: null});
function saveInv(){ localStorage.setItem('digibonk3d-inv', JSON.stringify(inv)); }
function saveExtra(){ localStorage.setItem('digibonk3d-extra', JSON.stringify(extra)); }
function equipExtra(kind, id){
  if (kind === 'frame' && inv.frames.includes(id)) extra.frame = id;
  if (kind === 'title' && inv.titles.includes(id)) extra.title = id;
  if (kind === 'item' && (inv.items[id] || 0) > 0) extra.item = id;
  saveExtra();
}
function unequipExtra(kind){
  if (kind === 'frame') extra.frame = null;
  if (kind === 'title') extra.title = null;
  if (kind === 'item') extra.item = null;
  saveExtra();
}
// Objeto equipado: se gasta al empezar la partida
function applyRunItem(){
  if (!extra.item || (inv.items[extra.item] || 0) <= 0) return;
  const p = g.p, id = extra.item;
  if (id === 'pocion'){ p.hp = Math.min(p.maxHp, p.hp + 20); }
  if (id === 'iman') p.pickup *= 1.3;
  if (id === 'cadencia') p.cdMul *= 0.85;
  if (id === 'nucleo') p.dmg *= 1.25;
  inv.items[id] -= 1;
  if (inv.items[id] <= 0){ delete inv.items[id]; extra.item = null; saveExtra(); }
  saveInv();
}
// Marco del icono del Digimon en el HUD
function frameClass(){ return extra.frame ? ' fr-' + extra.frame : ''; }

// Pesos por tipo de recompensa y por rareza
// La rareza se decide primero. Legendaria = skin Cristal; el resto reparte entre marco, título y objeto
const TIER_ODDS = {c: 60, r: 28, e: 10, l: 2};
const CAT_WEIGHTS = [['frame', 30], ['title', 25], ['item', 45]];
function rollTier(){
  let x = Math.random()*100;
  for (const t of ['c', 'r', 'e', 'l']){ if ((x -= TIER_ODDS[t]) < 0) return t; }
  return 'c';
}
function pickCategory(){
  let tot = CAT_WEIGHTS.reduce((a, c) => a + c[1], 0), x = Math.random()*tot;
  for (const [k, w] of CAT_WEIGHTS){ if ((x -= w) < 0) return k; }
  return 'item';
}
// Devuelve una recompensa: {type, ...} o null si no queda nada de ese tipo
// Si no quedan recompensas de ese nivel, baja al inmediatamente inferior (los objetos no tienen épicos)
const TIER_DOWN = {l: 'e', e: 'r', r: 'c', c: 'c'};
function unownedPool(list, tier, owned){
  let t = tier;
  for (;;){
    const pool = list.filter(x => x.tier === t && !owned(x));
    if (pool.length || t === 'c') return pool;
    t = TIER_DOWN[t];
  }
}
function pickOne(pool){ return pool[Math.floor(Math.random()*pool.length)]; }
// Devuelve una recompensa: {type, ...}. Legendaria da una skin Cristal que no tengas (si ya las tienes todas, cae a épica)
function rollReward(tier){
  if (tier === 'l'){
    const keys = SEASONS.adventure.chars.filter(k => !ownedSkins(k).includes('cristal'));
    if (keys.length) return {type:'skin', key: pickOne(keys), sk: SKIN_BY_ID.cristal, tier:'l'};
    tier = 'e';
  }
  const cat = pickCategory();
  if (cat === 'frame'){
    const pool = unownedPool(FRAMES, tier, f => inv.frames.includes(f.id));
    if (pool.length){ const f = pickOne(pool); return {type:'frame', f, tier: f.tier}; }
  }
  if (cat !== 'item'){
    const pool = unownedPool(TITLES, tier, t => inv.titles.includes(t.id));
    if (pool.length){ const t = pickOne(pool); return {type:'title', t, tier: t.tier}; }
  }
  const it = pickOne(unownedPool(ITEMS, tier, () => false));
  return {type:'item', it, tier: it.tier};
}
// Aplica la recompensa a la colección; los repetidos se convierten en Bits
function grantReward(r){
  if (r.type === 'skin'){
    grantSkin(r.key, 'cristal');
    return {...r, dup:false};
  }
  if (r.type === 'frame'){
    if (inv.frames.includes(r.f.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.frames.push(r.f.id); saveInv(); return {...r, dup:false};
  }
  if (r.type === 'title'){
    if (inv.titles.includes(r.t.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.titles.push(r.t.id); saveInv(); return {...r, dup:false};
  }
  inv.items[r.it.id] = (inv.items[r.it.id] || 0) + 1; saveInv();
  return {...r, dup:false};
}
// Tirada: 1 o 10. Con 10 se garantiza al menos una recompensa rara o épica
function doPulls(n){
  const cost = n === 10 ? PULL_COST_10 : PULL_COST;
  if (SAVE.bits < cost){
    announce('Bits insuficientes', `Necesitas ${cost} Bits`, '#ef5350');
    return;
  }
  SAVE.bits = SAVE.bits - cost;
  const tiers = Array.from({length: n}, () => rollTier());
  if (n === 10 && !tiers.some(t => t !== 'c')) tiers[9] = 'r';
  const results = [];
  for (const t of tiers){
    let r = rollReward(t);
    results.push(grantReward(r));
  }
  playPullAnimation(results);
}
const PULL_COST_10 = 900;

/* ---------- Efectos de skin: bonus de estadísticas y aura alrededor del Digimon ---------- */
const dotTexCache = {};
function dotTex(kind, color){
  const k = kind + color;
  if (dotTexCache[k]) return dotTexCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = color;
  if (kind === 'star'){
    x.beginPath();
    for (let i = 0; i < 10; i++){ const r = i % 2 ? 6 : 14, a = -Math.PI/2 + i*Math.PI/5; x.lineTo(16 + Math.cos(a)*r, 16 + Math.sin(a)*r); }
    x.closePath(); x.fill();
  } else if (kind === 'shard'){
    x.beginPath(); x.moveTo(16, 2); x.lineTo(26, 16); x.lineTo(16, 30); x.lineTo(6, 16); x.closePath(); x.fill();
  } else {
    x.beginPath(); x.arc(16, 16, 9, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  dotTexCache[k] = t;
  return t;
}
// Bonus permanente: cada skin conseguida da su bonus a ese Digimon, equipada o no
function applySkinFx(key){
  const p = g.p;
  for (const id of ownedSkins(key)){
    const fx = SKIN_FX[id];
    if (!fx) continue;
    const b = fx.bonus;
    if (b.speed) p.speed *= b.speed;
    if (b.dmg) p.dmg *= b.dmg;
    if (b.pickup) p.pickup *= b.pickup;
    if (b.maxHp){ p.maxHp += b.maxHp; }
  }
  p.hp = p.maxHp;
}
function makeAura(skinId, key){
  const fx = SKIN_FX[skinId];
  if (!fx) return null;
  const group = new THREE.Group();
  world.add(group);
  const sprite = (map, color, scale) => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map, color: color || 0xffffff, transparent: true, depthWrite: false}));
    sp.scale.set(scale, scale, 1);
    group.add(sp);
    return sp;
  };
  let update = () => {};
  if (fx.aura === 'stars'){
    const st = Array.from({length: 6}, () => sprite(dotTex('star', '#d1a3ff'), 0xffffff, .45));
    update = t => st.forEach((s, i) => { const a = t*1.6 + i*Math.PI/3; s.position.set(Math.cos(a)*1.2, 2.2 + Math.sin(t*2 + i)*.15, Math.sin(a)*1.2); });
  } else if (fx.aura === 'shards'){
    const sh = Array.from({length: 6}, () => sprite(dotTex('shard', '#bff6ff'), 0xffffff, .4));
    update = t => sh.forEach((s, i) => { const a = -t + i*Math.PI/3; s.position.set(Math.cos(a)*1.0, 1.6 + Math.sin(t*3 + i)*.2, Math.sin(a)*1.0); });
  } else if (fx.aura === 'confetti'){
    const cols = ['#ffd54f', '#ff7043', '#81d4fa', '#aed581'];
    const cf = Array.from({length: 12}, (_, i) => sprite(dotTex('dot', cols[i % 4]), 0xffffff, .25));
    update = t => cf.forEach((s, i) => {
      const f = (t*0.5 + i/12) % 1;
      s.position.set(Math.sin(i*2.3)*1.1, .3 + f*2.4, Math.cos(i*1.7)*1.1);
      s.material.opacity = 1 - f;
    });
  } else if (fx.aura === 'ghost'){
    const url = spriteOf(key, false);
    const g1 = sprite(tex(url), 0xff4d6d, 2.2), g2 = sprite(tex(url), 0x4dd0ff, 2.2);
    g1.material.opacity = g2.material.opacity = .45;
    update = t => {
      const j = Math.sin(t*23) > .8 ? .14 : 0;   // parpadeo: el eco se separa de vez en cuando
      g1.position.set(-.12 - j, 1.1, 0);
      g2.position.set(.12 + j, 1.1, 0);
    };
  }
  return {group, update};
}

/* ---------- Equilibrio: perfil de cada Digimon según la dificultad ----------
   Valores iniciales basados en el daño por segundo (daño / recarga × multiplicador)
   y en la facilidad de cada estilo. Hay que ajustarlos con pruebas reales. */
const BALANCE = {
  palmon:  {dif:'Fácil',    hp:115, speed:5.6, dmgMul:1.00, why:'Cuchillas que giran alrededor: cubren a su alrededor sin apuntar'},
  gomamon: {dif:'Fácil',    hp:120, speed:5.4, dmgMul:0.80, why:'Mucha vida y ataques rápidos al más cercano: perdona errores'},
  gabumon: {dif:'Media',    hp:100, speed:6.0, dmgMul:1.60, why:'Onda en círculo: equilibrado, pero hay que colocarse entre enemigos'},
  gatomon: {dif:'Media',    hp:88,  speed:6.6, dmgMul:1.00, why:'Garras giratorias y velocidad alta: hay que mantenerse en movimiento'},
  biyomon: {dif:'Media',    hp:92,  speed:6.2, dmgMul:0.85, why:'Mucho daño por disparo, pero aguanta menos golpes'},
  patamon: {dif:'Difícil',  hp:84,  speed:7.0, dmgMul:0.75, why:'Muy rápido y de poco daño: exige buena posición y movimiento'}
};
function applyBalance(key){
  const b = BALANCE[key];
  if (!b) return;
  const p = g.p;
  p.maxHp = b.hp; p.hp = b.hp; p.speed = b.speed; p.dmg = b.dmgMul;

let frameNo = 0;
/* ---------- Agua: chapoteo, anillos y frenado dentro del estanque ---------- */
const waterFx = [];   // gotas y anillos: {m, vx, vy, vz, life, t, kind, r0}
const dropGeo = new THREE.SphereGeometry(0.07, 6, 6);
const ringGeo = new THREE.RingGeometry(0.82, 1, 32);
function waterSlow(x, z){ return 1 - 0.4*pondWeight(x, z); }
function splashAt(x, z, n){
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(dropGeo, new THREE.MeshBasicMaterial({color: 0xdff6ff, transparent: true}));
    m.position.set(x, POND.water + 0.05, z);
    scene.add(m);
    const a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*2.2;
    waterFx.push({m, kind: 'drop', vx: Math.cos(a)*sp, vy: 3.5 + Math.random()*2.5, vz: Math.sin(a)*sp, t: 0, life: 0.6});
  }
}
function addRipple(x, z, r0){
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: 0xeaf8ff, transparent: true, opacity: 0.8, depthWrite: false}));
  m.rotation.x = -Math.PI/2;
  m.position.set(x, POND.water + 0.04, z);
  m.scale.setScalar(r0);
  scene.add(m);
  waterFx.push({m, kind: 'ring', r0, t: 0, life: 0.8});
}
function updateWater(dt){
  for (let i = waterFx.length - 1; i >= 0; i--){
    const f = waterFx[i];
    f.t += dt;
    if (f.kind === 'drop'){
      f.vy -= 14*dt;
      f.m.position.x += f.vx*dt; f.m.position.z += f.vz*dt; f.m.position.y += f.vy*dt;
      f.m.material.opacity = Math.max(0, 1 - f.t/f.life);
    } else {
      const sc = f.r0 + f.t*1.9;
      f.m.scale.setScalar(sc);
      f.m.material.opacity = 0.8*Math.max(0, 1 - f.t/f.life);
    }
    if (f.t >= f.life){ scene.remove(f.m); waterFx.splice(i, 1); }
  }
  if (!g || state !== 'play') return;
  const p = g.p;
  const inside = pondWeight(p.x, p.z) > 0.6;
  if (inside && !g.inWater) splashAt(p.x, p.z, 14);              // entrada: salpicadura
  const moved = g.lastX !== undefined && Math.hypot(p.x - g.lastX, p.z - g.lastZ) > 0.01;
  if (inside && moved){                                          // al andar: anillos y gotas
    g.wakeT = (g.wakeT || 0) - dt;
    if (g.wakeT <= 0){ addRipple(p.x, p.z, 0.6); splashAt(p.x, p.z, 2); g.wakeT = 0.3; }
  }
  g.inWater = inside;
  g.lastX = p.x; g.lastZ = p.z;
}

/* ---------- Fondo animado del menú: bosque en pixel art con movimiento ---------- */
const menuBg = {cv: null, ctx: null, t: 0, trees: [], parts: [], dig: [], img: {}};
function menuImg(src){

function drawSprite(c, src, x, y, w, h, flip){

  if (flip){ c.translate(x + w, y); c.scale(-1, 1); c.drawImage(im, 0, 0, w, h); }
  else c.drawImage(im, x, y, w, h);
  c.restore();
}

  const cast = SEASONS.adventure.chars;
  cast.forEach((key, i) => menuBg.dig.push({key, x: i*58 - 20, sp: (i % 2 ? 1 : -1) * (7 + i*1.3), ph: i*1.1}));
  const loop = (now) => { drawMenuBg(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  let last = performance.now();
  menuBg.lastT = last;
}
function drawMenuBg(){
  const c = menuBg.ctx, W = 320, H = 180;
  if (!c || menuBg.cv.style.display === 'none') return;
  const now = performance.now();
  const dt = Math.min(0.05, (now - (menuBg.lastT || now)) / 1000);
  menuBg.lastT = now;
  menuBg.t += dt;
  const t = menuBg.t;
  // Cielo: turquesa, verde y un resplandor violeta
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d6b6e'); sky.addColorStop(0.45, '#2fb08a'); sky.addColorStop(0.72, '#8fdc6a'); sky.addColorStop(1, '#4fae4a');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  const glow = c.createRadialGradient(250, 30, 4, 250, 30, 150);
  glow.addColorStop(0, 'rgba(230,150,255,.45)'); glow.addColorStop(1, 'rgba(230,150,255,0)');
  c.fillStyle = glow; c.fillRect(0, 0, W, H);
  // Haces de luz que se desplazan
  c.fillStyle = 'rgba(255,255,220,.10)';
  for (let i = 0; i < 4; i++){
    const x = ((i*95 + t*14) % 420) - 60;
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 26, 0); c.lineTo(x - 40, H); c.lineTo(x - 66, H); c.closePath(); c.fill();
  }
  // Árboles en tres capas, con viento
  for (const tr of menuBg.trees){
    const depth = [0.5, 0.8, 1.15][tr.layer];
    const w = 22*depth, h = 30*depth;
    const y = [92, 116, 146][tr.layer] - h;
    const sway = Math.sin(t*1.3 + tr.ph) * (0.6 + tr.layer*0.6);
    drawSprite(c, tr.src, tr.x + sway - w/2, y, w, h, false);
  }
  // Suelo con franjas que se mueven
  const ground = c.createLinearGradient(0, 140, 0, H);
  ground.addColorStop(0, '#6fd45a'); ground.addColorStop(1, '#2e8f3a');
  c.fillStyle = ground; c.fillRect(0, 140, W, H - 140);
  c.fillStyle = 'rgba(20,80,30,.25)';
  for (let x = -20; x < W + 20; x += 28){ c.fillRect(((x + t*18) % (W + 40)) - 20, 146, 12, 2); c.fillRect(((x + t*12 + 9) % (W + 40)) - 20, 162, 10, 2); }
  // Caminos luminosos que parpadean
  c.setLineDash([5, 7]); c.lineDashOffset = -t*22;
  c.strokeStyle = 'rgba(126,247,255,.85)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-5, 178); c.quadraticCurveTo(120, 150, 170, 128); c.quadraticCurveTo(230, 110, 340, 118); c.stroke();
  c.setLineDash([]);
  // Partículas que suben
  for (const p of menuBg.parts){
    p.y -= p.v*dt; p.x += Math.sin(t + p.ph)*0.15;
    if (p.y < -4){ p.y = H + 4; p.x = Math.random()*W; }
    c.globalAlpha = 0.55 + 0.45*Math.sin(t*2 + p.ph);
    c.fillStyle = p.c; c.fillRect(p.x|0, p.y|0, 2, 2);
  }
  c.globalAlpha = 1;
  // Digimon caminando de un lado a otro, con las skins equipadas
  for (const d of menuBg.dig){
    d.x += d.sp*dt;
    if (d.x > W + 30) d.x = -30;
    if (d.x < -30) d.x = W + 30;
    const bob = Math.abs(Math.sin(t*6 + d.ph)) * 3;
    drawSprite(c, spriteOf(d.key, false), d.x, 142 - bob - 26, 26, 26, d.sp < 0);
  }
  // Viñeta para enfocar el centro
  const v = c.createRadialGradient(W/2, H/2, 60, W/2, H/2, 220);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,20,30,.45)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}
initMenuBg();

// ---------- Bucle ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  if (state === 'play' && g){
    if (!g.evoAnim) update(dt);   // durante la digievolución el mundo se detiene y solo corre la animación
    if (g){
      syncMeshes(); updateCamera(dt); updateHUD(); drawEdgeMarkers();
      if (g.aura){ g.aura.group.position.set(g.p.x, terrainH(g.p.x, g.p.z) + g.p.y, g.p.z); g.aura.update(g.t); }
    }
  }
  animateEvo(dt);
  updateFx(dt);
  updateWater(dt);
  hurtT = Math.max(0, hurtT - dt);
  document.getElementById('hurt').style.opacity = (hurtT / 0.45) * 0.85;
  for (const n of npcs) n.sprite.position.y = n.base + Math.sin(now*0.003 + n.ph)*0.08;   // habitantes respiran
  frameNo++;
  if (state === 'play' && g && frameNo % Q.minimapEvery === 0) drawWorldMap(document.getElementById('minimap'), 170);
  if (state === 'map' && g) drawWorldMap(document.getElementById('bigmap'), 600);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildSkins();
if (trainerName) showSelect(); else showRegister();
// Modo demo (solo para grabar los vídeos del tutorial con ?demo=1): expone el estado y atajos de escena
if (new URLSearchParams(location.search).has('demo')){
  window.__dbk = {
    get g(){ return g; }, get state(){ return state; }, get scene(){ return scene; },
    startGame, spawnEnemy, spawnMagnetDrop, setZone, showGacha, addSkill, upgradeChoices,
    nearChest(){
      const p = g.p, a = p.dir ? Math.atan2(p.dir.z, p.dir.x) : 0;
      const [cx, cz] = clampArena(p.x + Math.cos(a)*3, p.z + Math.sin(a)*3, ARENA_R - 2);
      const {group, pivot} = makeChest();
      group.position.set(cx, terrainH(cx, cz), cz);
      world.add(group);
      g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false});
    }
  };
}
requestAnimationFrame(frame);
</script>
