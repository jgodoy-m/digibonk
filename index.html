];
function initShrines(){
  g.shrines = [];
  for (let i = 0; i < 3; i++){   // 3 santuarios por partida
    const type = SHRINE_TYPES[Math.floor(Math.random()*SHRINE_TYPES.length)];   // tipo al azar entre todos
    const a = Math.random()*Math.PI*2, R = 22 + Math.random()*68;
    const [x, z] = clampArena(Math.cos(a)*R, Math.sin(a)*R, ARENA_R - 6);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 2.2, 10), new THREE.MeshBasicMaterial({color: type.col}));
    mesh.position.set(x, 1.1 + terrainH(x, z), z);
    world.add(mesh);
    g.shrines.push({x, z, type, mesh, used: false});
  }
}
// Para cargar un santuario hay que quedarse dentro de su círculo unos 3 segundos; si te alejas, la carga baja
const SHRINE_CHARGE = 3, SHRINE_RANGE = 2.2;
// Aviso con la cuenta atrás mientras se carga un santuario
function shrineHud(sh){
  let el = document.getElementById('shrineHud');
  if (!el){
    el = document.createElement('div');
    el.id = 'shrineHud';
    el.style.cssText = 'position:fixed;left:50%;bottom:92px;transform:translateX(-50%);min-width:280px;padding:10px 16px;border-radius:12px;background:rgba(8,14,30,.94);border:2px solid #ffd54f;color:#fff;font:700 14px system-ui,sans-serif;text-align:center;z-index:9;pointer-events:none';
    el.innerHTML = '<div id="shrineTxt"></div><div style="height:10px;margin-top:6px;border-radius:5px;background:#1b2740;overflow:hidden"><div id="shrineBar" style="height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#fff59d)"></div></div>';
    document.body.appendChild(el);
  }
  if (!sh){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.style.borderColor = '#' + sh.type.col.toString(16).padStart(6, '0');
  const left = Math.max(0, SHRINE_CHARGE - sh.charge);
  document.getElementById('shrineTxt').textContent = `${sh.type.name} · ${left > 0.05 ? 'mantente dentro: ' + left.toFixed(1) + ' s' : '¡listo!'}`;
  document.getElementById('shrineBar').style.width = (100 * sh.charge / SHRINE_CHARGE).toFixed(0) + '%';
}
function updateShrines(dt){
  if (!g.shrines) initShrines();
  let charging = null;
  for (const sh of g.shrines){
    if (sh.used) continue;
    const inside = dist2(sh.x, sh.z, g.p.x, g.p.z) < SHRINE_RANGE;   // dist2 ya es la distancia (no al cuadrado)
    sh.charge = Math.max(0, Math.min(SHRINE_CHARGE, (sh.charge || 0) + (inside ? dt : -dt*0.5)));
    sh.mesh.scale.y = 1 + 0.6 * (sh.charge / SHRINE_CHARGE);   // el santuario crece mientras se carga
    if (inside && sh.charge > 0 && !sh.used) charging = sh;
    if (inside && sh.charge >= SHRINE_CHARGE){
      sh.used = true; world.remove(sh.mesh);
      sh.type.apply(g);
      announce(sh.type.name, sh.type.text, '#' + sh.type.col.toString(16).padStart(6, '0'));
      sfx('ready');
    }
  }
  shrineHud(charging);
}
function spawnChest(p){
  const a = Math.random()*Math.PI*2, R = 10 + Math.random()*8;
  const [cx, cz] = clampArena(p.x + Math.cos(a)*R, p.z + Math.sin(a)*R, ARENA_R - 2);
  const {group, pivot} = makeChest();
  group.position.set(cx, terrainH(cx, cz), cz);
  world.add(group);
  g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false});
}
// Imán total: objeto que cae del 2% de los enemigos y se recoge pasando por encima
function spawnMagnetDrop(x, z){
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.14, 8, 18), new THREE.MeshBasicMaterial({color: 0xff4081}));
  mesh.rotation.x = Math.PI/2;
  world.add(mesh);
  g.drops.push({x, z, mesh, taken: false});
}
function fireProjectile(x, z, vx, vz, dmg, life, color){
  const mesh = new THREE.Mesh(SPROJ_GEO, matFor(color));
  mesh.position.set(x, 0.9 + terrainH(x, z), z);
  world.add(mesh);
  g.shots.push({x, z, vx, vz, dmg, life, mesh, r: 0.3});
  sfx('shoot');
}

function update(dt){
  const p = g.p, ch = g.ch;
  g.t += dt;

  // Movimiento (ejes del mundo)
  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup'])    mz -= 1;
  if (keys['s'] || keys['arrowdown'])  mz += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  g.dashCd = Math.max(0, g.dashCd - dt);
  if (g.dash > 0){
    g.dash -= dt;
    p.x += g.dir.x * 22 * dt;
    p.z += g.dir.z * 22 * dt;
  } else if (mx || mz){
    // Movimiento relativo a la cámara: W avanza hacia donde mira la cámara
    const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
    const wx = mx*cy + mz*sy, wz = -mx*sy + mz*cy;
    const L = Math.hypot(wx, wz);
    const k = waterSlow(p.x, p.z) * (g.inSlow ? 0.5 : 1);   // estanque y zona de concierto de Etemon frenan
    p.x += wx/L * p.speed * k * dt;
    p.z += wz/L * p.speed * k * dt;
    g.dir = {x: wx/L, z: wz/L};
  }
  // Salto: gravedad simple
  if (p.y > 0 || p.vy !== 0){
    p.vy -= 30*dt;
    p.y += p.vy*dt;
    if (p.y <= 0){ p.y = 0; p.vy = 0; }
  }
  // El jugador no puede salir del escenario (las montañas empiezan en ARENA_R - 1)
  [p.x, p.z] = clampArena(p.x, p.z, ARENA_R - 2);
  resolveSolids(p, 0.5, p.y);   // los obstáculos del mapa bloquean al jugador

  // Avisos de fase: hordas a los 45 s y aviso del jefe 15 s antes
  if (g.zone < 2 && g.t >= ZONE2_AT) setZone(2);
  if (!g.hordeWarned && g.t >= 45){ g.hordeWarned = true; announce('¡HORDAS!', 'Más enemigos aparecen', '#ef5350'); }
  if (g.mode !== 'surv' && !g.bossWarned && g.t >= BOSS_AT - 15){ g.bossWarned = true; announce('Algo se acerca…', 'Piedmon llega en 15 s', '#ce93d8'); }

  // Quedarse quieto: tras 2,5 s sin moverte, los enemigos salen más deprisa y más cerca
  const mvd = Math.hypot(g.p.x - (g.lastPx ?? g.p.x), g.p.z - (g.lastPz ?? g.p.z));
  g.idleT = mvd > 0.02 ? 0 : (g.idleT || 0) + dt;
  g.lastPx = g.p.x; g.lastPz = g.p.z;
  if (g.idleT > 2.5 && !g.idleWarned){ g.idleWarned = true; announce('¡Muévete!', 'Los enemigos se acercan si te quedas quieto', '#ef5350'); }
  if (g.idleT <= 2.5) g.idleWarned = false;

  // Aparición
  g.spawnT -= dt * (g.idleT > 2.5 ? 1.8 : 1);
  if (g.spawnT <= 0){
    spawnEnemy();
    // Presión creciente: tras 45 s salen más enemigos por tanda (1 extra, +1 cada 90 s, máximo 3)
    const extra = g.t > 45 ? Math.min(3, 1 + Math.floor(diffT(g.t)/90)) : 0;
    for (let i = 0; i < extra && g.enemies.length < MAX_ENEMIES; i++) spawnEnemy();
    g.spawnT = Math.max(DIFF.spawnMin, (0.9 - diffT(g.t)/180) * diffMul('spawn')) * ((g.mod && g.mod.spawnMul) || 1);
  }

  // Minijefes en sus minutos
  while (g.miniI < MINIS.length && g.t >= MINIS[g.miniI].at) spawnMini(MINIS[g.miniI++]);
  // Fase extra: un jefe especial cada 40 s
  if (g.extraOn && !g.extraSpawned && g.t >= g.extraNext){ spawnSpecial(); g.extraSpawned = true; }

  // Élites: cada 45 s desde el minuto 1; a partir del minuto 5 salen de dos en dos
  g.eliteT -= dt;
  if (g.eliteT <= 0){
    g.eliteT = eliteGap();
    const n = g.t >= 300 ? 2 : 1;
    for (let i = 0; i < n; i++) spawnEnemy('elite');
    announce('¡Élite!', n > 1 ? 'Dos Digimon élite se acercan' : 'Un Digimon élite se acerca', '#ff7043');
  }

  // Enemigos: persiguen y dañan por contacto
  if (g.critT > 0) g.critT -= dt;
  for (const e of g.enemies){
    if (e.frozenT > 0){ e.frozenT -= dt; continue; }   // congelado o atrapado por el Bonk: ni se mueve ni daña
    const dx = p.x - e.x, dz = p.z - e.z, d = Math.hypot(dx, dz) || 1;
    if (e.golden){ [e.x, e.z] = clampArena(e.x - dx/d*e.spd*dt, e.z - dz/d*e.spd*dt, ARENA_R - 2); continue; }   // el Numemon dorado huye
    // Se paran a distancia de contacto (no se meten encima del jugador)
    if (d > e.r + 0.6){
      e.x += dx/d * e.spd * dt;
      e.z += dz/d * e.spd * dt;
    }
    [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);   // los enemigos también quedan dentro
    resolveSolids(e, e.r*0.8);                          // y no atraviesan casas ni vallas
    e.cd -= dt;
    if (d < e.r + 0.8 && g.dash <= 0){ p.hp -= e.dmg * foeMul(e) * (p.armor || 1) * dt; shake = Math.max(shake, 0.12); }
  }

  // Armas
  g.wCd -= dt;
  if (ch.kind === 'shot' && g.wCd <= 0 && g.enemies.length){
    g.wCd = ch.cd * p.cdMul; g.atkT = 0.26;
    const sorted = [...g.enemies].sort((a,b) => dist2(a.x,a.z,p.x,p.z) - dist2(b.x,b.z,p.x,p.z));
    for (let i = 0; i < Math.min(p.count, sorted.length); i++){
      const e = sorted[i], d = dist2(e.x, e.z, p.x, p.z) || 1;
      fireProjectile(p.x, p.z, (e.x-p.x)/d*14, (e.z-p.z)/d*14, ch.dmg*p.dmg, 1.6, 0xffb74d);
    }
  }
  if (ch.kind === 'ring' && g.wCd <= 0){
    g.wCd = ch.cd * p.cdMul; g.atkT = 0.26;
    const n = 6*p.count, off = Math.random()*Math.PI*2;
    for (let i = 0; i < n; i++){
      const an = off + i/n*Math.PI*2;
      fireProjectile(p.x, p.z, Math.cos(an)*9, Math.sin(an)*9, ch.dmg*p.dmg, 0.9, 0x4fc3f7);
    }
  }

  // Proyectiles
  for (const s of g.shots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 0.9 + terrainH(s.x, s.z), s.z);
    if (s.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp > 0 && dist2(s.x, s.z, e.x, e.z) < e.r + s.r){
        hurt(e, s.dmg); s.life = 0; break;
      }
    }
  }
  g.shots = g.shots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Cuchillas orbitales
  if (ch.kind === 'orbit'){
    g.orbitA += dt*3.2;
    const n = p.count + 1, R = 2.2*p.area;
    while (g.blades.length < n){
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), new THREE.MeshBasicMaterial({color:0xa5d6a7}));
      world.add(m); g.blades.push(m);
    }
    while (g.blades.length > n){ world.remove(g.blades.pop()); }
    for (let i = 0; i < n; i++){
      const an = g.orbitA + i*Math.PI*2/n;
      const bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      g.blades[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.cd <= 0 && dist2(bx, bz, e.x, e.z) < e.r + 0.5){
          hurt(e, ch.dmg*p.dmg); e.cd = 0.35;
        }
      }
    }
  } else if (g.blades.length){
    for (const m of g.blades) world.remove(m);
    g.blades = [];
  }

  updateSkills(dt);

  // Muertes
  const dead = g.enemies.filter(e => e.hp <= 0);
  for (const e of dead){
    if (g.p.lifesteal && !(g.mod && g.mod.noHeal)) g.p.hp = Math.min(g.p.maxHp, g.p.hp + g.p.lifesteal);
    g.gems.push({x:e.x, z:e.z, v:e.xp*(1 + g.t/400), heal: !(g.mod && g.mod.noHeal) && Math.random() < 0.10, mesh: null});   // las bajas valen más según avanza la partida
    // 2% por baja, pero con enfriamiento de 45 s y un solo imán en el mapa a la vez
    if ((g.magnetT || 0) <= 0 && Math.random() < 0.02){ spawnMagnetDrop(e.x, e.z); g.magnetT = 45; }
    // Tickets de tirada: 25% de cada élite y 3 seguros del jefe
    if (e.kind === 'elite' && Math.random() < 0.25){ g.tix++; popText(e.x, e.z, '+1 ticket', '#3de0ff', 1); }
    if (e.kind === 'mini'){ g.tix++; announce('¡' + e.name + ' derrotado!', '+1 ticket de tirada · cofre dorado', '#3de0ff'); spawnChestAt(e.x, e.z, true); if (!e.special){ (g.minisKilled || (g.minisKilled = [])).push(e.name); grantEmblem(); } }
    if (e.kind === 'elite' && Math.random() < 0.3) spawnChestAt(e.x, e.z, true);   // 30% de las élites dejan un cofre dorado
    if (e.boss) g.tix += 3;
    world.remove(e.mesh);
    world.remove(e.shadow);
  }
  if (dead.length) sfx('kill');
  if (dead.length){
    shake = Math.max(shake, Math.min(0.5, 0.1*dead.length));
    if (dead.some(e => e.kind === 'elite' || e.kind === 'mini' || e.boss)) shake = Math.max(shake, 0.7);
    addBonk(0.35*dead.length);
  }
  g.kills += dead.length;
  if (dead.length){ g.combo += dead.length; g.comboT = 3; }
  g.comboT -= dt;
  if (g.comboT <= 0) g.combo = 0;
  g.enemies = g.enemies.filter(e => e.hp > 0);

  // Imán total: al recogerlo, todas las gemas del mapa vuelan hacia el jugador
  for (const dr of g.drops){
    dr.mesh.rotation.y += dt*4;
    dr.mesh.position.set(dr.x, 0.6 + terrainH(dr.x, dr.z) + Math.sin(g.t*4)*0.1, dr.z);
    if (!dr.taken && dist2(dr.x, dr.z, p.x, p.z) < 1.4){
      dr.taken = true; world.remove(dr.mesh);
      for (const gm of g.gems) gm.attract = true;
      announce('¡Imán total!', 'Toda la experiencia del mapa va hacia ti', '#ff4081');
      sfx('chest');
    }
  }
  g.drops = g.drops.filter(dr => !dr.taken);

  // Gemas de XP
  for (const gm of g.gems){
    if (!gm.mesh){
      gm.mesh = new THREE.Mesh(gm.heal ? GEM_HEAL_GEO : GEM_GEO, matFor(gm.heal ? 0x66bb6a : 0x29b6f6));
      world.add(gm.mesh);
    }
    const d = dist2(gm.x, gm.z, p.x, p.z), dd = d || 1;
    if (d < p.pickup || gm.attract){
      const sp = gm.attract ? Math.max(12, d*8) : 12;   // con el imán total se acercan en pocos segundos
      gm.x += (p.x-gm.x)/dd * sp*dt;
      gm.z += (p.z-gm.z)/dd * sp*dt;
    }
    gm.mesh.position.set(gm.x, 0.4 + terrainH(gm.x, gm.z), gm.z);
    gm.mesh.rotation.y += dt*3;
    if (d < 0.9){
      gm.taken = true; world.remove(gm.mesh);
      if (gm.heal){ p.hp = Math.min(p.maxHp, p.hp + 10); popText(gm.x, gm.z, '+10', '#7cf29c'); sfx('chest'); }
      else { p.xp += gm.v * (g.labXp || 1); addBonk(0.02); }
    }
  }
  g.gems = g.gems.filter(gm => !gm.taken);

  updateShrines(dt);
  updateBossMechanics(dt);
  updateMapEvent(dt);
  updateSupport(dt);
  updateEmergency(dt);
  if (g.regen && !(g.mod && g.mod.noHeal)) p.hp = Math.min(p.maxHp, p.hp + g.regen*dt);
  // Cofres: aparecen cada 50 s (máximo 2 vivos) y dan una mejora aleatoria al pasar por encima
  g.chestT -= dt;
  g.magnetT = Math.max(0, (g.magnetT || 0) - dt);
  if (g.chestT <= 0){
    g.chestT = 50;
    // Como mucho 2 cofres vivos a la vez: si ya hay dos en el mapa, no sale otro
    if (g.chests.filter(c => !c.gone && !c.open).length < 2) spawnChest(p);
  }
  g.nearChest = null;
  let best = 2.0;
  for (const c of g.chests){
    if (c.open){
      c.openT -= dt;
      if (c.openT <= 0){ world.remove(c.group); c.gone = true; }
      continue;
    }
    const d = dist2(c.x, c.z, p.x, p.z);
    if (d < best){ best = d; g.nearChest = c; }
  }
  g.chests = g.chests.filter(c => !c.gone);
  if (g.flashT > 0) g.flashT -= dt;

  // Números de daño: suben y se desvanecen
  for (const t of g.texts){
    t.life -= dt;
    t.s.position.y += dt*1.2;
    t.mat.opacity = Math.max(0, t.life/0.7);
  }
  for (const t of g.texts.filter(t => t.life <= 0)){
    world.remove(t.s); t.tex.dispose(); t.mat.dispose();
  }
  g.texts = g.texts.filter(t => t.life > 0);

  // Jefe final: aparece a los 240 s y lanza anillos de proyectiles
  if (g.mode !== 'surv' && !g.bossSpawned && g.t >= BOSS_AT){
    g.bossSpawned = true;
    const mesh = billboard('sprites/adventure/piedmon.png', 5.4);
    world.add(mesh);
    const shadow = makeShadow(5);
    world.add(shadow);
    g.boss = {kind: 'boss', boss: true, mesh, shadow, x: p.x + 14, z: p.z, hp: 2400*evoHp(), max: 2400*evoHp(),
              spd: 2.2, r: 2.4, xp: 40, dmg: 15, cd: 0};
    g.enemies.push(g.boss);
    g.bossShotT = 2;
    sfx('boss');
    announce('¡JEFE FINAL!', 'Piedmon, líder de los Dark Masters', '#ce93d8');
  }
  if (g.boss && g.enemies.includes(g.boss)){
    g.bossShotT -= dt;
    // Aviso: un anillo rojo se encoge sobre el jefe 0.8 s antes de cada disparo
    if (g.bossShotT <= 0.8){
      if (!g.bossRing) g.bossRing = makeBossRing();
      const prog = 1 - Math.max(0, g.bossShotT) / 0.8;
      g.bossRing.position.set(g.boss.x, terrainH(g.boss.x, g.boss.z) + 0.15, g.boss.z);
      g.bossRing.scale.setScalar(1 + 6*(1 - prog));
      g.bossRing.material.opacity = 0.25 + 0.6*prog;
    }
    if (g.bossShotT <= 0){
      g.bossShotT = 2.5;
      clearBossRing();
      const b = g.boss;
      for (let i = 0; i < 10; i++){
        const an = i/10*Math.PI*2 + g.t;
        const shot = new THREE.Mesh(SPROJ_GEO, matFor(0xff1744));
        shot.position.set(b.x, 1 + terrainH(b.x, b.z), b.z);
        world.add(shot);
        g.eshots.push({x: b.x, z: b.z, vx: Math.cos(an)*6, vz: Math.sin(an)*6, life: 4, mesh: shot, dmg: 8});
      }
    }
  } else if (g.boss && !g.bossDown){
    g.bossDown = true;   // el jefe ha caído
    clearBossRing();
    // Jefe especial: 10% de que aparezca uno más, de entre tus Digimon desbloqueados
    if (specialPool().length && Math.random() < SPECIAL_CHANCE){
      g.extraOn = true; g.extraNext = g.t + 4; g.extraSpawned = false;
      announce('¡Algo se mueve!', 'Un jefe especial aparece', '#ffd54f');
    }
  }
  for (const s of g.eshots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 1 + terrainH(s.x, s.z), s.z);
    if (s.life > 0 && dist2(s.x, s.z, p.x, p.z) < 0.9 && g.dash <= 0){
      p.hp -= s.dmg * (p.armor || 1); s.life = 0; shake = Math.max(shake, 0.3);
    }
  }
  g.eshots = g.eshots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Subida de nivel
  if (p.xp >= p.nextXp){
    p.xp -= p.nextXp;
    p.lvl++;
    p.nextXp = Math.floor(10 + 4*(p.lvl - 1) + 0.35*(p.lvl - 1)*(p.lvl - 1));   // curva para 20 minutos: nivel 54 alcanzable hacia el minuto 19
    g.choices = upgradeChoices();
    const evoAt = evoLevelFor(g.ch.id, g.ch.evolved | 0);
    if (evoAt && p.lvl >= evoAt && (g.ch.evolved | 0) < EVO_LINE[g.ch.id].length) digivolve();
    g.pendingUp = true;
  }
  // Las mejoras aparecen cuando termina la animación de digievolución
  if (g.pendingUp && !g.evoAnim){
    g.pendingUp = false;
    openUpgrades();
  }

  // Fin
  if (p.hp <= 0 && g.revives > 0){
    // Segunda oportunidad del Laboratorio: vuelve con media vida y aparta a la horda
    g.revives--; p.hp = Math.round(p.maxHp * 0.5);
    for (const e of g.enemies){ if (e.boss || e.kind === 'mini') continue; const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz) || 1; if (d < 10) [e.x, e.z] = clampArena(e.x + dx/d*8, e.z + dz/d*8, ARENA_R - 0.5); }
    spawnRing(p.x, p.z, 0x7cf29c, 10, 0.6); screenFlash = 0.5;
    announce('¡Segunda oportunidad!', 'Laboratorio · 50% de vida', '#7cf29c');
  }
  if (p.hp <= 0){ p.hp = 0; endGame(false); }
  else if (g.bossDown && (!g.extraOn || (g.extraSpawned && !g.enemies.some(e => e.special && e.hp > 0)))) endGame(true);
}

// Radar de bordes: flechas en el borde de la pantalla hacia cofres y jefe que están fuera de vista
function drawEdgeMarkers(){
  const cv = document.getElementById('edgeCv');
  if (!cv) return;
  if (cv.width !== innerWidth || cv.height !== innerHeight){ cv.width = innerWidth; cv.height = innerHeight; }
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  if (state !== 'play' || !g) return;
  const targets = g.chests.filter(ch => !ch.open && !ch.gone).map(ch => ({x: ch.x, z: ch.z, col: '#ffd54f'}));
  if (g.boss && g.enemies.includes(g.boss)) targets.push({x: g.boss.x, z: g.boss.z, col: '#ce93d8'});
  if (g.ev) for (const n of g.ev.nodes || [{x: g.ev.foe.x, z: g.ev.foe.z}]) if (!n.done) targets.push({x: n.x, z: n.z, col: '#7cf29c'});
  for (const e of g.enemies) if (e.kind === 'elite' || e.kind === 'mini') targets.push({x: e.x, z: e.z, col: e.kind === 'mini' ? '#ce93d8' : '#ff7043'});
  const W = cv.width, H = cv.height, cx = W/2, cy = H/2;
  for (const t of targets){
    const v = new THREE.Vector3(t.x, terrainH(t.x, t.z) + 1.5, t.z).project(camera);
    const sx = (v.x + 1)/2*W, sy = (1 - v.y)/2*H;
    const inside = v.z < 1 && sx > 40 && sx < W - 40 && sy > 40 && sy < H - 40;
    if (inside) continue;
    let dx = sx - cx, dy = sy - cy;
    if (v.z > 1){ dx = -dx; dy = -dy; }          // detrás de la cámara: la flecha apunta al lado correcto
    const k = Math.min((cx - 40)/Math.abs(dx || 1e-6), (cy - 40)/Math.abs(dy || 1e-6));
    const px = cx + dx*k, py = cy + dy*k;
    c.save(); c.translate(px, py); c.rotate(Math.atan2(dy, dx));
    c.fillStyle = t.col; c.strokeStyle = '#000'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(16, 0); c.lineTo(-9, -11); c.lineTo(-9, 11); c.closePath(); c.fill(); c.stroke();
    c.restore();
    c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 3; c.font = 'bold 13px system-ui'; c.textAlign = 'center';
    const d = Math.round(Math.hypot(t.x - g.p.x, t.z - g.p.z));
    c.strokeText(d + ' m', px, py - 16); c.fillText(d + ' m', px, py - 16);
  }
}
// ---------- Habilidades de ataque: se eligen al subir de nivel (hasta nivel 3) ----------
const SKILLS = {
  aura:     {name:'Aura de Datos',         k:'defensiva', d:'Anillo digital alrededor del Digimon: daña cada 0,25 s a quien entra en él.'},
  tornado:  {name:'Tornado Bit',           k:'defensiva', d:'Bits que giran a tu alrededor: empujan enemigos y frenan proyectiles del jefe.'},
  pulso:    {name:'Onda de Pulso',         k:'defensiva', d:'Onda de 360° cada pocos segundos que empuja a toda la horda.'},
  espiral:  {name:'Disparo Espiral',       k:'ofensiva',  d:'Proyectil rápido que atraviesa a los enemigos (2 al nivel 1).'},
  cuchilla: {name:'Cuchilla Persiguiente', k:'ofensiva',  d:'Hojas de energía que buscan al enemigo más fuerte de la pantalla.'},
  laser:    {name:'Rayo Láser',            k:'ofensiva',  d:'Haz neón hacia el enemigo más cercano; atraviesa a los que están en línea.'},
  mina:     {name:'Mina Digital',          k:'utilidad',  d:'Dejas minas al moverte; explotan en área cuando un enemigo las pisa.'},
  meteoro:  {name:'Lluvia de Meteoros',    k:'ofensiva',  d:'Impactos aleatorios cerca de ti, avisados con un círculo en el suelo.'}
};
const SKILL_MAX = 3;      // niveles por habilidad
const SKILL_K = 0.8;      // factor de daño de las habilidades: regulado para partidas de 20 minutos
const SKILL_SLOTS = 3;   // habilidades distintas que puedes llevar en una partida
// Cada Digimon tiene su propio grupo de 4 ataques (de los 8 disponibles)
const CHAR_SKILLS = {
  agumon:   ['espiral', 'laser', 'meteoro', 'mina'],
  gabumon:  ['cuchilla', 'pulso', 'aura', 'tornado'],
  palmon:   ['mina', 'tornado', 'aura', 'pulso'],
  gatomon:  ['cuchilla', 'laser', 'espiral', 'pulso'],
  gomamon:  ['pulso', 'tornado', 'espiral', 'mina'],
  patamon:  ['aura', 'meteoro', 'pulso', 'laser'],
  biyomon:  ['meteoro', 'espiral', 'cuchilla', 'aura'],
  tentomon: ['laser', 'mina', 'meteoro', 'tornado']
};
function addSkill(id){ g.skills[id] = Math.min(SKILL_MAX, (g.skills[id] || 0) + 1); }
// Opciones del nivel: mejoras base + ataques de este Digimon (máximo SKILL_SLOTS distintos por partida)
function upgradeChoices(){
  const pool = [...UPGRADES];
  const mine = CHAR_SKILLS[g.ch.id] || Object.keys(SKILLS).slice(0, 4);
  const owned = Object.keys(g.skills).filter(id => g.skills[id] > 0);
  for (const id of mine){
    const lv = g.skills[id] || 0;
    if (lv >= SKILL_MAX) continue;
    if (!lv && owned.length >= SKILL_SLOTS) continue;   // ya llevas el máximo de ataques distintos
    const s = SKILLS[id];
    pool.push({t: `${s.name} · ${lv ? 'Nivel ' + (lv + 1) : 'Nueva'}`, name: s.name, skill: id, lv, k: s.k, d: s.d, f: () => addSkill(id)});
  }
  // Las cartas desterradas en esta partida no vuelven a salir
  const picks = pool.filter(c => !upRes().banned.includes(upKey(c))).sort(() => Math.random() - 0.5).slice(0, 3)
    .map(c => !c.skill && Math.random() < 0.18 ? {...c, rare: true} : c);   // carta rara: la mejora pasiva cuenta doble
  const evo = g.chestPick ? [] : evoSkillCards();   // si hay una evolución disponible, ocupa la primera carta
  if (evo.length) picks[0] = evo[0];
  return picks;
}
// Recursos de la subida de nivel por partida: refrescar 2, saltar 2, desterrar 1
function upRes(){ return g.upRes || (g.upRes = {rer: 2, skip: 2, ban: 1, banned: []}); }
function upKey(c){ return c.skill ? 'skill:' + c.skill : 'up:' + c.t; }
function rerollUp(){
  const r = upRes(); if (r.rer <= 0 || state !== 'levelup') return;
  r.rer--; g.upMode = null;
  g.choices = upgradeChoices(); openUpgrades();
}
function skipUp(){
  const r = upRes(); if (r.skip <= 0 || state !== 'levelup') return;
  r.skip--; SAVE.bits = SAVE.bits + 15; g.chestPick = null;
  announce('+15 Bits', 'Carta saltada', '#ffd54f');
  hideOverlay(); lockMouse(); state = 'play';
}
function toggleBanish(){
  if (upRes().ban <= 0 || state !== 'levelup') return;
  g.upMode = g.upMode === 'ban' ? null : 'ban'; openUpgrades();
}
function banishUp(i){
  const r = upRes(); if (r.ban <= 0 || state !== 'levelup') return;
  r.ban--; r.banned.push(upKey(g.choices[i])); g.upMode = null;
  g.choices = upgradeChoices(); openUpgrades();
}
// Materiales y geometrías compartidos (evitan crear objetos en cada disparo o impacto)
const matCache = {};
function matFor(color){ return matCache[color] || (matCache[color] = new THREE.MeshBasicMaterial({color})); }
const RING_GEO = new THREE.RingGeometry(0.96, 1, 48);
const GEM_GEO = new THREE.OctahedronGeometry(0.25), GEM_HEAL_GEO = new THREE.OctahedronGeometry(0.32);
const BIT_GEO = new THREE.SphereGeometry(0.3, 10, 10), BIT_MAT = new THREE.MeshBasicMaterial({color: 0xe040fb});
const SPROJ_GEO = new THREE.SphereGeometry(0.28, 8, 8);
const BEAM_GEO = new THREE.BoxGeometry(0.22, 0.22, 1), BEAM_MAT = new THREE.MeshBasicMaterial({color: 0x40c4ff, transparent: true, opacity: 0.85, depthWrite: false});
const MINE_GEO = new THREE.CylinderGeometry(0.42, 0.42, 0.12, 14), MINE_MAT = new THREE.MeshBasicMaterial({color: 0xff7043});
function newSkillState(){
  return {aura: null, auraT: 0, bits: [], spin: 0, pulseT: 1.5, spiralT: 0.3, bladeT: 1.0, laserT: 1.2,
    lastMine: {x: 0, z: 0}, mines: [], meteorT: 1.5, meteors: [], beams: [], proj: []};
}
// Enemigo más fuerte (más vida máxima) dentro del radio
function strongestIn(x, z, R){
  let best = null, bm = -1;
  for (const e of g.enemies){
    if (e.hp <= 0 || e.max <= bm) continue;
    if (dist2(x, z, e.x, e.z) <= R*R){ best = e; bm = e.max; }
  }
  return best;
}
function nearestIn(x, z, R){
  let best = null, bd = R*R;
  for (const e of g.enemies){
    if (e.hp <= 0) continue;
    const d = dist2(x, z, e.x, e.z);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
function spawnSProj(x, z, vx, vz, dmg, life, pierce, homing, color, target = null){
  const mesh = new THREE.Mesh(SPROJ_GEO, matFor(color));
  world.add(mesh);
  g.sk.proj.push({x, z, vx, vz, dmg, life, pierce, homing, target, hit: new Set(), mesh, src: dmgSrc});
}
function dropMine(x, z, lv){
  const mesh = new THREE.Mesh(MINE_GEO, MINE_MAT);
  mesh.position.set(x, 0.1 + terrainH(x, z), z);
  world.add(mesh);
  g.sk.mines.push({x, z, life: 14, mesh, lv});
}
// Aplica una habilidad activa cada frame: lo que cada una hace está en el bloque de abajo
function updateSkills(dt){
  const p = g.p, S = g.sk, L = g.skills, ar = p.area, dm = p.dmg * SKILL_K, cm = p.cdMul;
  const lv = id => L[id] || 0;

  dmgSrc = 'aura';
  // Aura de Datos: anillo que daña a los enemigos que entran
  if (lv('aura')){
    const R = (2.6 + 0.9*lv('aura')) * ar;
    if (!S.aura){
      S.aura = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: 0x4fc3f7, transparent: true, opacity: 0.4, depthWrite: false}));
      S.aura.rotation.x = -Math.PI/2;
      world.add(S.aura);
    }
    S.aura.scale.setScalar(R);
    S.aura.position.set(p.x, terrainH(p.x, p.z) + 0.06, p.z);
    S.auraT -= dt;
    if (S.auraT <= 0){
      S.auraT = 0.3;
      const dmg = (1.5 + 0.8*lv('aura')) * dm;
      for (const e of g.enemies) if (e.hp > 0 && dist2(p.x, p.z, e.x, e.z) < (R + e.r)*(R + e.r)) hurt(e, dmg);
    }
  }

  dmgSrc = 'tornado';
  // Tornado Bit: bits que giran, empujan y frenan proyectiles del jefe
  const nT = lv('tornado') ? lv('tornado') + 1 : 0;
  while (S.bits.length < nT){ const m = new THREE.Mesh(BIT_GEO, BIT_MAT); world.add(m); S.bits.push(m); }
  while (S.bits.length > nT) world.remove(S.bits.pop());
  if (nT){
    S.spin += dt*3.2;
    const R = 3.4*ar;
    for (const e of g.enemies) if (e.tcd > 0) e.tcd -= dt;
    for (let i = 0; i < nT; i++){
      const an = S.spin + i*Math.PI*2/nT, bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      S.bits[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.hp <= 0) continue;
        const dx = e.x - bx, dz = e.z - bz, d = Math.hypot(dx, dz);
        if (d < e.r + 0.9){
          if (!(e.tcd > 0)){ hurt(e, (3 + 1.5*lv('tornado')) * dm); e.tcd = 0.5; }
          const push = 1.2/(d || 1); e.x += dx*push; e.z += dz*push;
          [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);
        }
      }
    }
    for (const s of g.eshots){
      if (s.life > 0 && S.bits.some(m => dist2(s.x, s.z, m.position.x, m.position.z) < 1.6)) s.life = 0;
    }
  }

  dmgSrc = 'pulso';
  // Onda de Pulso: anillo de 360° que daña y empuja
  if (lv('pulso')){
    S.pulseT -= dt;
    if (S.pulseT <= 0){
      const L2 = lv('pulso');
      S.pulseT = (3.2 - 0.4*L2) * cm;
      const R = (6.5 + 1.5*L2) * ar;
      spawnRing(p.x, p.z, 0x4fc3f7, R, 0.5);
      for (const e of g.enemies){
        if (e.hp <= 0) continue;
        const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz);
        if (d < R + e.r){
          hurt(e, (6 + 2*L2) * dm);
          const push = 5/(d || 1); e.x += dx*push; e.z += dz*push;
          [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);
        }
      }
    }
  }

  dmgSrc = 'espiral';
  // Disparo Espiral: al enemigo más cercano; atraviesa varios
  if (lv('espiral')){
    S.spiralT -= dt;
    if (S.spiralT <= 0){
      const t = nearestIn(p.x, p.z, 40);
      if (t){
        S.spiralT = 0.9 * cm;
        const d = Math.hypot(t.x - p.x, t.z - p.z) || 1;
        spawnSProj(p.x, p.z, (t.x - p.x)/d*24, (t.z - p.z)/d*24, (7 + 3*lv('espiral')) * dm, 1.8, 1 + lv('espiral'), false, 0xffe082);
      } else S.spiralT = 0.2;
    }
  }

  dmgSrc = 'cuchilla';
  // Cuchilla Persiguiente: hojas que se dirigen al enemigo más fuerte
  if (lv('cuchilla')){
    S.bladeT -= dt;
    if (S.bladeT <= 0){
      S.bladeT = 1.6 * cm;
      const n = 2*lv('cuchilla') + (p.count - 1);
      const base = Math.random()*Math.PI*2;
      for (let i = 0; i < n; i++){
        const an = base + i*Math.PI*2/n;
        spawnSProj(p.x, p.z, Math.cos(an)*10, Math.sin(an)*10, (6 + 2*lv('cuchilla')) * dm, 4, 1, true, 0xce93d8, strongestIn(p.x, p.z, 45));
      }
    }
  }

  dmgSrc = 'laser';
  // Rayo Láser: haz hacia el enemigo más cercano; daña a todos los que están en la línea
  if (lv('laser')){
    S.laserT -= dt;
    if (S.laserT <= 0){
      const t = nearestIn(p.x, p.z, 36);
      if (t){
        const L2 = lv('laser'), len = 18;
        S.laserT = 2.8 * cm;
        const dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz) || 1, ux = dx/d, uz = dz/d;
        for (const e of g.enemies){
          if (e.hp <= 0) continue;
          const ex = e.x - p.x, ez = e.z - p.z, along = ex*ux + ez*uz;
          if (along < 0 || along > len) continue;
          if (Math.abs(ex*uz - ez*ux) < e.r + 0.5) hurt(e, (12 + 4*L2) * dm);
        }
        const beam = new THREE.Mesh(BEAM_GEO, BEAM_MAT);
        beam.position.set(p.x + ux*len/2, 0.9 + terrainH(p.x, p.z), p.z + uz*len/2);
        beam.rotation.y = Math.atan2(ux, uz);
        beam.scale.z = len;
        world.add(beam);
        S.beams.push({m: beam, t: 0});
      } else S.laserT = 0.25;
    }
  }
  for (const b of S.beams) b.t += dt;
  S.beams = S.beams.filter(b => { if (b.t < 0.18) return true; world.remove(b.m); return false; });

  dmgSrc = 'mina';
  // Mina Digital: se deja una mina cada 2,2 m recorridos; explota al pisarla un enemigo
  if (lv('mina')){
    const L2 = lv('mina');
    if (dist2(p.x, p.z, S.lastMine.x, S.lastMine.z) > 2.2*2.2 && S.mines.length < 14 + 4*L2){
      dropMine(p.x, p.z, L2);
      S.lastMine = {x: p.x, z: p.z};
    }
    for (const m of S.mines){
      if (m.life <= 0) continue;
      m.life -= dt;
      const trig = g.enemies.some(e => e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (e.r + 1.2)*(e.r + 1.2));
      if (m.life <= 0 || trig){
        const R = (2.6 + 0.6*m.lv) * ar;
        m.life = 0;
        spawnRing(m.x, m.z, 0xff7043, R, 0.45);
        burst(m.x, m.z, 0xff7043);
        for (const e of g.enemies) if (e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (R + e.r)*(R + e.r)) hurt(e, (12 + 4*m.lv) * dm);
      }
    }
    S.mines = S.mines.filter(m => { if (m.life > 0) return true; world.remove(m.mesh); return false; });
  }

  dmgSrc = 'meteoro';
  // Lluvia de Meteoros: aviso en el suelo y después impacto en área
  if (lv('meteoro')){
    S.meteorT -= dt;
    if (S.meteorT <= 0){
      const L2 = lv('meteoro');
      S.meteorT = 2.6 * cm;
      for (let i = 0; i < L2 + 1; i++){
        const an = Math.random()*Math.PI*2, rr = Math.sqrt(Math.random())*13;
        const [mx, mz] = clampArena(p.x + Math.cos(an)*rr, p.z + Math.sin(an)*rr, ARENA_R - 2);
        const R = 2.6 * ar;
        const wm = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: 0xff5252, transparent: true, opacity: 0.6, depthWrite: false}));
        wm.rotation.x = -Math.PI/2;
        wm.position.set(mx, terrainH(mx, mz) + 0.07, mz);
        wm.scale.setScalar(R);
        world.add(wm);
        S.meteors.push({x: mx, z: mz, t: 0, R, mesh: wm, dmg: (10 + 3*L2) * dm});
      }
    }
    for (const m of S.meteors){
      m.t += dt;
      m.mesh.material.opacity = 0.35 + 0.35*Math.sin(m.t*18);
      if (m.t >= 0.7 && !m.done){
        m.done = true;
        for (const e of g.enemies) if (e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (m.R + e.r)*(m.R + e.r)) hurt(e, m.dmg);
        spawnRing(m.x, m.z, 0xff5252, m.R, 0.4);
        burst(m.x, m.z, 0xff5252);
      }
    }
    S.meteors = S.meteors.filter(m => { if (!m.done) return true; world.remove(m.mesh); return false; });
  }

  // Proyectiles de Espiral y Cuchilla: avanzan, las cuchillas giran hacia su objetivo y atraviesan según su alcance
  for (const pr of S.proj){
    if (pr.homing){
      if (!pr.target || pr.target.hp <= 0) pr.target = strongestIn(pr.x, pr.z, 60);
      if (pr.target){
        const dx = pr.target.x - pr.x, dz = pr.target.z - pr.z, d = Math.hypot(dx, dz) || 1;
        const sp = Math.hypot(pr.vx, pr.vz) || 16, k = Math.min(1, dt*4);
        pr.vx += ((dx/d)*sp - pr.vx)*k;
        pr.vz += ((dz/d)*sp - pr.vz)*k;
      }
    }
    pr.x += pr.vx*dt; pr.z += pr.vz*dt; pr.life -= dt;
    pr.mesh.position.set(pr.x, 0.9 + terrainH(pr.x, pr.z), pr.z);
    if (pr.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp <= 0 || pr.hit.has(e)) continue;
      if (dist2(pr.x, pr.z, e.x, e.z) < (e.r + 0.3)*(e.r + 0.3)){
        dmgSrc = pr.src; hurt(e, pr.dmg);
        pr.hit.add(e);
        if (--pr.pierce <= 0){ pr.life = 0; break; }
      }
    }
  }
  S.proj = S.proj.filter(pr => { if (pr.life > 0) return true; world.remove(pr.mesh); return false; });
  dmgSrc = 'base';
}

function pickUpgrade(i){
  if (state !== 'levelup') return;
  const ch = g.choices[i];
  ch.f(g.p);
  if (g.chestPick && g.chestPick.gold && !ch.evo) ch.f(g.p);
  if (ch.rare) ch.f(g.p);
  if (!ch.skill && !ch.evo){ g.upTaken = g.upTaken || {}; g.upTaken[ch.t] = (g.upTaken[ch.t] || 0) + 1; }   // cofre dorado: la carta cuenta dos veces
  g.chestPick = null;
  hideOverlay();
  lockMouse();
  state = 'play';
}

function endGame(win){
  state = 'end';
  sfx(win ? 'victory' : 'defeat');
  const daily = loadDaily();
  const raw = Math.floor((g.kills/2 + g.t/10) * labMul('bits') * 1.25 * (g.mode === 'surv' ? 1.5 : 1));   // +25% por el modificador semanal
  const earned = Math.min(raw, Math.max(0, DAILY.runCap - daily.runBits));
  if (g.t >= 5) daily.runs += 1;
  daily.runBits += earned;
  let bonus = 0;
  if (!daily.claimed && daily.runs >= DAILY.runsGoal){ daily.claimed = true; bonus = DAILY.reward; g.tix += DAILY.rewardTix; g.dailyTix = DAILY.rewardTix; }
  // Toda partida larga da al menos un ticket, aunque no caiga ningún jefe
  if (g.t >= DAILY.runTixAt && g.tix < DAILY.runTix) g.tix = DAILY.runTix;
  saveDaily(daily);
  SAVE.bits = SAVE.bits + earned + bonus + (g.extraBits || 0);
  addTickets('std', g.tix);   // élites y jefe: monedero del permanente
  g.earned = earned + bonus + (g.extraBits || 0);
  g.bonus = bonus;
  g.unlocked = recordRun(g.ch.id, g.kills, g.t);
  g.newTitles = checkAchievements(win);
  g.newDigis = checkUnlocks();
  g.survBest = g.mode === 'surv' ? recordSurv(g.ch.id, g.t) : null;
  g.encDone = checkEncargos();
  unlockMouse();
  saveRecord(win);
  // Resumen de la partida: cifras, daño por habilidad y recompensas
  const dmgRows = Object.entries(g.dmgBy).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const dmgMax = dmgRows.length ? dmgRows[0][1] : 1;
  const dmgName = k => k === 'base' ? `Ataque de ${g.ch.name}` : (SKILLS[k] ? SKILLS[k].name : k);
  const rewards = [`<li><b>+${g.earned - g.bonus - (g.extraBits || 0)}</b> Bits</li>`];
  if (g.extraBits) rewards.push(`<li><b>+${g.extraBits}</b> Bits de eventos del mapa</li>`);
  if (g.emblems && g.emblems.length) rewards.push(`<li>Emblemas: <b>${g.emblems.length}/8</b></li>`);
  if (g.bonus) rewards.push(`<li><b>+${g.bonus}</b> Bits y <b>+${g.dailyTix}</b> tickets · misión diaria completada</li>`);
  if (g.tix) rewards.push(`<li><b>+${g.tix}</b> tickets de tirada</li>`);
  for (const u of g.unlocked) rewards.push(`<li>Skin nueva: <b>${u}</b></li>`);
  for (const tl of g.newTitles) rewards.push(`<li>Título desbloqueado: <b>${tl.name}</b></li>`);
  for (const d of g.newDigis) rewards.push(`<li>Digimon desbloqueado: <b>${d}</b></li>`);
  for (const e of g.encDone) rewards.push(`<li>Encargo cumplido: <b>${e}</b> · +${ENC_REWARD.bits} Bits y +${ENC_REWARD.tix} ticket</li>`);
  if (g.survBest) rewards.push(`<li>¡Nuevo récord de Supervivencia con ${g.ch.name}!</li>`);
  const endKey = g.ch.id;
  showOverlay(`
    <div class="end3 ${win ? 'win' : 'lose'}">
      <h1>${g.mode === 'surv' ? 'FIN DE LA SUPERVIVENCIA' : win ? '¡VICTORIA!' : 'HAS CAÍDO'}</h1>
      <p class="end3-sub">${g.mode === 'surv' ? `Has aguantado ${fmtTime(Math.floor(g.t))} · récord con ${g.ch.name}: ${fmtTime(Math.floor(survBest(g.ch.id)))}` : win ? 'Piedmon ha sido derrotado' : `${stageName(g.ch.id, g.ch.evolved)} vuelve al Laboratorio`} · ${ZONES[g.zone - 1].name}</p>
      <div class="end3-cells">
        <span><b>${fmtTime(Math.floor(g.t))}</b>Tiempo</span><span><b>${g.p.lvl}</b>Nivel</span><span><b>${g.kills}</b>Bajas</span><span><b>${Object.keys(g.skills).length}</b>Habilidades</span>
      </div>
      <div class="end3-cols">
        <section><h3>Daño por ataque</h3>
          ${dmgRows.map(([k, v], i) => `<div class="end3-bar" style="animation-delay:${.15 + i*.08}s"><span>${svgIcon(k)}${dmgName(k)}</span><i><u style="width:${Math.round(v/dmgMax*100)}%"></u></i><em>${Math.round(v)}</em></div>`).join('') || '<p class="muted">Sin daño registrado</p>'}
        </section>
        <section><h3>Recompensas</h3><ul class="end3-rw">${rewards.join('')}</ul></section>
      </div>
      <div class="end3-act"><button class="g-btn" id="endAgain">Otra partida</button><button class="mini-btn" id="endMenu">Menú (Enter)</button></div>
    </div>`);
  overlay.onclick = null;
  document.getElementById('endAgain').onclick = () => startGame(endKey);
  document.getElementById('endMenu').onclick = () => showSelect();

}

// ---------- Cámara y sincronización ----------
function syncMeshes(){
  const p = g.p;
  const gp = terrainH(p.x, p.z);
  g.playerMesh.position.set(p.x, gp + 1.1 + p.y, p.z);
  g.playerShadow.position.set(p.x, gp + 0.02, p.z);
  if (g.hiRing) g.hiRing.position.set(p.x, gp + 0.03, p.z);
  for (const e of g.enemies){
    const ge = terrainH(e.x, e.z);
    e.mesh.position.set(e.x, ge + e.mesh.scale.y/2, e.z);
    e.shadow.position.set(e.x, ge + 0.02, e.z);
  }
}
// Cámara orbital integrada con el ratón: el ratón bloqueado (pointer lock) gira la vista sin pulsar nada.
// Esc libera el ratón; al hacer clic de nuevo en la pantalla se vuelve a bloquear.
const camBase = new THREE.Vector3(0, 16, 11);
let camYaw = 0, camPitch = 0.9, camDist = 19.4;
const canvasEl = renderer.domElement;
// Algunos entornos (p. ej. paneles embebidos) rechazan el bloqueo: se ignora el error y el juego sigue
function lockMouse(onFail){
  const r = canvasEl.requestPointerLock();
  if (r && r.catch) r.catch(() => { if (onFail) onFail(); });
}
function unlockMouse(){
  const r = document.exitPointerLock();
  if (r && r.catch) r.catch(() => {});
}
canvasEl.addEventListener('mousedown', () => {
  if (state === 'play' && !document.pointerLockElement) lockMouse();
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvasEl) return;
  camYaw -= e.movementX*0.0025;
  camPitch = Math.max(0.2, Math.min(1.4, camPitch + e.movementY*0.0018));
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.max(10, Math.min(36, camDist + e.deltaY*0.02));
}, {passive: true});

function updateCamera(dt){
  const p = g.p;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  // La cámara no sale del escenario: así el muro de piedra y las montañas nunca se interponen
  const [camX, camZ] = clampArena(p.x + Math.sin(camYaw)*cp*camDist, p.z + Math.cos(camYaw)*cp*camDist, ARENA_R - 4);
  camBase.lerp(new THREE.Vector3(camX, terrainH(p.x, p.z) + 1.2 + sp*camDist, camZ), Math.min(1, dt*10));
  shake = Math.max(0, shake - dt*2.5);
  const s = shake*shake*0.8;
  camera.position.set(
    camBase.x + (Math.random()-0.5)*s,
    camBase.y + (Math.random()-0.5)*s,
    camBase.z + (Math.random()-0.5)*s);
  camera.lookAt(p.x, terrainH(p.x, p.z) + 1.2 + p.y*0.5, p.z);
}

  document.querySelector('.hud-hp').classList.toggle('low', p.hp < p.maxHp*0.3);
  const tt = TITLES.find(t => t.id === extra.title);
  document.getElementById('hudTitle').textContent = tt ? tt.name : '';
  const zn = document.getElementById('zoneName');
  if (zn.textContent !== ZONES[g.zone - 1].name) zn.textContent = ZONES[g.zone - 1].name;

  document.getElementById('hudLvl').textContent = p.lvl;
  const kc = document.getElementById('hudKillsChip'); if (!kc.dataset.ic){ kc.dataset.ic = 1; kc.innerHTML = HUD_IC.kills + '<b id="hudKills">0</b>'; }
  document.getElementById('hudKills').textContent = g.kills;
  const dash = document.getElementById('hudDash');
  dash.innerHTML = HUD_IC.dash + (g.dashCd > 0 ? `Dash ${g.dashCd.toFixed(1)} s` : 'Dash listo');
  dash.classList.toggle('ready', g.dashCd <= 0);
  const dashReady = g.dashCd <= 0;
  if (dashReady && !g.dashReady && g.t > 1){
    sfx('ready');
    dash.classList.remove('flash'); void dash.offsetWidth; dash.classList.add('flash');
  }
  g.dashReady = dashReady;
  const sbKey = Object.keys(g.skills).map(k => k + g.skills[k]).join(',');
  if (g.sbKey !== sbKey){
    g.sbKey = sbKey;
    document.getElementById('skillBar').innerHTML = Object.keys(g.skills).map(k => `<span class="sb-i ${SKILLS[k].k}" title="${SKILLS[k].name}">${svgIcon(k)}<em>${g.skills[k]}</em></span>`).join('');
  }
  const bf = document.getElementById('bonkFill'), bbar = document.getElementById('bonkBar');

    bf.style.width = Math.min(100, g.bonk).toFixed(1) + '%';

  }
  // Daño recibido: activa la viñeta roja (se desvanece en frame)
  if (g.lastHp !== undefined && p.hp < g.lastHp - 0.01){ hurtT = 0.45; sfx('hurt'); }

  } else bb.style.display = 'none';
}

/* ---------- Música: tema original de aventura (sintetizado, sin archivos ni melodías existentes) ---------- */
const Music = {on: localStorage.getItem('digibonk3d-music') !== '0', nodes: null};
// Melodía propia en la menor/do mayor: 8 compases de corcheas (MIDI, null = silencio)
const TUNE_BPM = 150;
const TUNE_LEAD = [
  [69,69,72,69,76,74,72,null], [65,65,69,65,69,67,65,64], [67,67,72,67,64,62,60,null], [62,64,67,71,74,null,67,69],
  [69,72,76,72,69,64,69,null], [65,69,72,69,65,69,72,null], [67,72,76,74,72,67,64,60], [62,67,71,74,67,71,74,null]
];
// Raíz del acorde de cada compás (Am F C G Am F G C) y el bajo sube raíz, quinta, octava, quinta
const TUNE_ROOT = [45, 41, 48, 43, 45, 41, 43, 48];
function midiHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
// Música de fondo: pista MP3 en bucle (audio/). Si el archivo no carga, se usa el bucle sintetizado
const MUSIC_FILE = 'audio/together-we-are-strong.mp3';
function musicStart(){
  if (!Music.file){
    Music.file = new Audio(MUSIC_FILE);
    Music.file.loop = true;
    Music.file.volume = 0.5;
    Music.file.onerror = () => { Music.file = null; if (Music.on && !Music.nodes) musicSynth(); };
  }
  Music.file.muted = Sfx.muted;
  const p = Music.file.play();
  if (p && p.catch) p.catch(() => {});
}
function musicStop(){
  if (Music.file) Music.file.pause();
  musicSynth(true);
}
function musicSynth(stopOnly){
  if (stopOnly) return musicSynthStop();
  if (!Sfx.ctx || Music.nodes) return;
  const c = Sfx.ctx;
  const out = c.createGain(); out.gain.value = 0;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  lp.connect(out); out.connect(c.destination);
  out.gain.setTargetAtTime(0.32, c.currentTime, 0.6);
  const eighth = 60 / TUNE_BPM / 2;
  const nodes = {out, stopped: false, timer: null};
  const tone = (m, t, dur, type, vol) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = midiHz(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t + dur + 0.05);
  };
  const kick = t => {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.16);
  };
  const hat = (t, vol) => {
    if (!Sfx.noiseBuf) return;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = Sfx.noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.3); s.stop(t + 0.06);
  };
  let step = 0, next = c.currentTime + 0.1;
  const schedule = () => {
    if (nodes.stopped) return;
    while (next < c.currentTime + 0.3){
      const bar = (step >> 3) & 7, pos = step & 7;
      const r = TUNE_ROOT[bar];
      const bassM = [r, r + 7, r + 12, r + 7][pos & 3];
      tone(TUNE_LEAD[bar][pos], next, eighth * 0.85, 'square', 0.05);
      tone(bassM, next, eighth * 0.9, 'triangle', 0.3);
      if ((pos & 3) === 0) kick(next);
      if (pos === 2 || pos === 6) hat(next, 0.05);
      else if (pos & 1) hat(next, 0.02);
      next += eighth; step++;
    }
  };
  schedule();
  nodes.timer = setInterval(schedule, 60);
  Music.nodes = nodes;
}
function musicSynthStop(){

/* ---------- Sonido: efectos sintetizados con Web Audio (sin archivos) ---------- */
const Sfx = {ctx:null, master:null, muted: localStorage.getItem('digibonk3d-sfx') === '0', last:{}, noiseBuf:null};
function audioInit(){
  if (Sfx.ctx){ if (Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  Sfx.ctx = new AC();
  Sfx.master = Sfx.ctx.createGain();
  Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  Sfx.master.connect(Sfx.ctx.destination);
  if (Music.on) musicStart();
  const len = Math.floor(Sfx.ctx.sampleRate * 0.5);
  Sfx.noiseBuf = Sfx.ctx.createBuffer(1, len, Sfx.ctx.sampleRate);
  const d = Sfx.noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
}
function tone(freq, dur, type, vol, slideTo, delay){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), gn = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(Sfx.master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, delay, hp){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const src = c.createBufferSource(); src.buffer = Sfx.noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
  const gn = c.createGain();
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(gn); gn.connect(Sfx.master);
  src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.05);
}
// Intervalo mínimo entre repeticiones para que los efectos frecuentes no saturen
const SFX_GAP = {shoot:70, hit:60, kill:40, hurt:250, uiHover:50};
function sfx(name){
  const c = Sfx.ctx;
  if (!c || Sfx.muted || c.state !== 'running') return;
  if (SFX_GAP[name]){
    const now = performance.now();
    if (now - (Sfx.last[name] || 0) < SFX_GAP[name]) return;
    Sfx.last[name] = now;
  }
  switch (name){
    case 'shoot':   tone(880, .08, 'triangle', .07, 440); break;
    case 'hit':     noise(.05, .10, 0, 1500); break;
    case 'kill':    tone(520, .10, 'square', .06, 260); break;
    case 'hurt':    tone(170, .28, 'sawtooth', .16, 70); noise(.15, .06, 0, 300); break;
    case 'chest':   [523,659,784,1046].forEach((f,i) => tone(f, .16, 'triangle', .18, null, i*.07)); break;
    case 'uiHover': tone(1320, .03, 'square', .018); break;
    case 'uiClick': tone(880, .05, 'square', .04, 1320); break;
    case 'ready':   tone(1568, .10, 'square', .05); tone(2349, .16, 'triangle', .06, null, .07); break;
    case 'levelup': [440,554,660,880].forEach((f,i) => tone(f, .18, 'square', .07, null, i*.08)); break;
    case 'evolve':  tone(220, 1.0, 'sawtooth', .10, 880); [523,659,784].forEach((f,i) => tone(f, .5, 'triangle', .14, null, .6 + i*.1)); break;
    case 'boss':    tone(65, 1.6, 'sawtooth', .16, 40); noise(1.2, .07, 0, 200); break;
    case 'victory': [523,659,784,1046,784,1046].forEach((f,i) => tone(f, .22, 'triangle', .18, null, i*.12)); break;
    case 'defeat':  tone(330, .6, 'triangle', .18, 110); tone(220, .9, 'triangle', .16, 55, .3); break;
  }
}
function toggleMute(silent){
  Sfx.muted = !Sfx.muted;
  localStorage.setItem('digibonk3d-sfx', Sfx.muted ? '0' : '1');
  if (Sfx.master) Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  if (Music.file) Music.file.muted = Sfx.muted;
  if (!silent) announce(Sfx.muted ? 'Sonido desactivado' : 'Sonido activado', 'N para cambiarlo', '#7fd0ff');
}

// Iconos: sprites del juego cargados una vez y reutilizados en el mapa
const iconCache = {};
function iconImg(src){
  if (!iconCache[src]){ const im = new Image(); im.src = src; iconCache[src] = im; }
  return iconCache[src];
}
function drawIcon(c, src, cx, cy, size){
  const im = iconImg(src);
  if (im.complete && im.naturalWidth) c.drawImage(im, cx - size/2, cy - size/2, size, size);
  else { c.fillStyle = '#ffffff'; c.beginPath(); c.arc(cx, cy, size/4, 0, Math.PI*2); c.fill(); }
}
function drawWorldMap(cv, size){
  if (!cv) return;
  const c = cv.getContext('2d');
  const R = size / 2, k = (R - 6) / ARENA_R;
  const X = x => R + x*k, Y = z => R + z*k;
  const u = size / 170;   // escala de los iconos según el tamaño del mapa
  c.clearRect(0, 0, size, size);
  c.fillStyle = '#4b5d72'; c.beginPath(); c.arc(R, R, R - 1, 0, Math.PI*2); c.fill();      // montañas
  c.fillStyle = '#3f7d3f'; c.beginPath(); c.arc(R, R, ARENA_R*k, 0, Math.PI*2); c.fill();  // prado
  c.fillStyle = '#2a7fb8'; c.beginPath(); c.arc(X(POND.x), Y(POND.z), POND.r*k, 0, Math.PI*2); c.fill();
  if (!g) return;
  // Cofres sin abrir: icono de regalo
  c.font = `${Math.max(12, 14*u)}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const ch of g.chests){
    if (ch.open) continue;
    c.fillText('🎁', X(ch.x), Y(ch.z));
  }
  // Enemigos: su propio sprite, en miniatura
  for (const e of g.enemies){
    if (e.boss) continue;
    const d = {...ENEMY[e.kind], sprite: e.sprite || ENEMY[e.kind].sprite};
    drawIcon(c, d ? d.sprite : 'sprites/numemon.png', X(e.x), Y(e.z), (e.kind === 'tank' ? 16 : 12) * u);
  }
  // Jefe final
  if (g.boss && g.enemies.includes(g.boss)){
    drawIcon(c, 'sprites/adventure/piedmon.png', X(g.boss.x), Y(g.boss.z), 26 * u);
  }
  // Jugador: el Digimon que estás usando
  const pc = X(g.p.x), py = Y(g.p.z);
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(pc, py, 12*u, 0, Math.PI*2); c.fill();
  drawIcon(c, spriteOf(g.ch.id, g.ch.evolved), pc, py, 24 * u);
}

  for (const e of g.enemies){
    if (e.kind !== 'mini' || e.special || e.hp <= 0) continue;

    h.t -= dt;

    if (h.kind === 'slow'){ if (inside) g.inSlow = true; h.mesh.material.opacity = 0.32 * Math.min(1, h.t); }

}

}
function endMapEvent(ok){
  const ev = g.ev; g.ev = null; evHud(null);
  for (const n of ev.nodes || []){ world.remove(n.mesh); world.remove(n.ring); }
  if (ev.kind === 'golden'){
    if (ok){ g.extraBits = (g.extraBits || 0) + 80; g.tix++; announce('¡Numemon dorado atrapado!', '+80 Bits y +1 ticket', '#ffd54f'); }
    else { const e = ev.foe; e.gone = true; world.remove(e.mesh); world.remove(e.shadow); g.enemies = g.enemies.filter(x => x !== e); announce('El Numemon dorado ha huido', '', '#9e9e9e'); }
    return;
  }
  if (!ok){ announce('Evento fallido', 'Se acabó el tiempo', '#ef5350'); return; }
  const last = ev.nodes[ev.nodes.length - 1];
  spawnChestAt(last.x, last.z, true);
  if (ev.kind === 'corrupt'){ g.extraBits = (g.extraBits || 0) + 60; announce('¡Datos limpios!', '+60 Bits y un cofre dorado', '#e040fb'); }
  else announce('¡Nodo defendido!', 'Un cofre dorado aparece en el nodo', '#7cf29c');
}
function updateMapEvent(dt){
  if (g.evT === undefined) g.evT = 150;
  if (!g.ev){
    if (g.t >= g.evT && !g.bossSpawned){
      // Si un jefe llega o acaba de llegar (menos de 30 s), el evento espera
      const near = MINIS.some(m => Math.abs(m.at - g.t) < 30) || (g.mode !== 'surv' && BOSS_AT - g.t < 30);
      if (near){ g.evT = g.t + 10; return; }
      g.evT = g.t + 200; startMapEvent();
    }
    return;
  }
  const ev = g.ev, p = g.p;
  ev.t -= dt;
  for (const n of ev.nodes || []) n.mesh.rotation.y += dt*2;
  if (ev.kind === 'defend'){
    const n = ev.nodes[0];
    if (dist2(n.x, n.z, p.x, p.z) < 6) n.prog += dt;
    ev.spawnT -= dt;
    if (ev.spawnT <= 0){ ev.spawnT = 2; spawnEnemy(); const m = g.enemies[g.enemies.length - 1]; const a = Math.random()*Math.PI*2; [m.x, m.z] = clampArena(n.x + Math.cos(a)*12, n.z + Math.sin(a)*12, ARENA_R - 0.5); }
    evHud(`Defiende el nodo: ${Math.min(20, n.prog).toFixed(0)}/20 s · quedan ${Math.ceil(ev.t)} s`);
    if (n.prog >= 20) return endMapEvent(true);
  } else if (ev.kind === 'corrupt'){
    for (const n of ev.nodes){
      if (n.done) continue;
      if (dist2(n.x, n.z, p.x, p.z) < 2.5) n.prog += dt;
      if (n.prog >= 1.5){ n.done = true; world.remove(n.mesh); world.remove(n.ring); burst(n.x, n.z, '#e040fb'); sfx('chest'); }
    }
    const done = ev.nodes.filter(n => n.done).length;
    evHud(`Datos corruptos: ${done}/3 nodos · quedan ${Math.ceil(ev.t)} s`);
    if (done === 3) return endMapEvent(true);
  } else {
    const e = ev.foe;
    evHud(`Numemon dorado · quedan ${Math.ceil(ev.t)} s`);
    if (e.hp <= 0) return endMapEvent(true);
  }
  if (ev.t <= 0) endMapEvent(false);
}

function updateSupport(dt){

/* ---------- Encargos: 3 al día, se cumplen dentro de una partida ---------- */
const ENC_REWARD = {bits: 100, tix: 1};
const ENC_TYPES = [
  {id:'kills', ns:[200, 300, 400], t: n => `Derrota a ${n} enemigos en una partida`, ok: (n) => g.kills >= n},
  {id:'nodash', ns:[5, 8, 10], t: n => `Llega al minuto ${n} sin usar el dash`, ok: (n) => !g.dashUsed && g.t >= n*60},
  {id:'chests', ns:[3, 4, 5], t: n => `Abre ${n} cofres en una partida`, ok: (n) => (g.chestsOpened || 0) >= n},
  {id:'bonk', ns:[2, 3, 4], t: n => `Usa el Bonk ${n} veces en una partida`, ok: (n) => (g.bonks || 0) >= n},
  {id:'level', ns:[15, 20, 25], t: n => `Llega al nivel ${n}`, ok: (n) => g.p.lvl >= n},
  {id:'mini', ns:[0, 1, 2], t: n => `Derrota a ${MINIS[n].name}`, ok: (n) => (g.minisKilled || []).includes(MINIS[n].name)},
  {id:'with', ns:null, t: k => `Aguanta 10 minutos con ${CHARS[k].name}`, ok: (k) => g.ch.id === k && g.t >= 600}
];
// Generador con semilla del día: todos los jugadores ven los mismos encargos ese día
function dayRng(){ let h = 2166136261; for (const ch of dayKey()) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function loadEncargos(){
  const st = loadJSON('digibonk3d-enc', null);
  if (st && st.day === dayKey()) return st;
  const rnd = dayRng(), types = [...ENC_TYPES].sort(() => rnd() - 0.5).slice(0, 3);
  const opened = SEASONS.adventure.chars.filter(k => isUnlocked(k));
  const list = types.map(tp => ({id: tp.id, n: tp.ns ? tp.ns[Math.floor(rnd()*tp.ns.length)] : opened[Math.floor(rnd()*opened.length)], done: false}));
  const fresh = {day: dayKey(), list};
  localStorage.setItem('digibonk3d-enc', JSON.stringify(fresh));
  return fresh;
}
function encText(e){ const tp = ENC_TYPES.find(x => x.id === e.id); return tp ? tp.t(e.n) : e.id; }
// Al terminar la partida: marca los encargos cumplidos y da la recompensa. Devuelve sus textos
function checkEncargos(){
  const st = loadEncargos(), won = [];
  for (const e of st.list){
    const tp = ENC_TYPES.find(x => x.id === e.id);
    if (e.done || !tp || !tp.ok(e.n)) continue;
    e.done = true; won.push(encText(e));
    SAVE.bits = SAVE.bits + ENC_REWARD.bits; addTickets('std', ENC_REWARD.tix);
  }
  localStorage.setItem('digibonk3d-enc', JSON.stringify(st));
  return won;
}

const LAB_BY_ID = Object.fromEntries(LAB.map(u => [u.id, u]));

const labCosts = u => u.costs || LAB_COSTS;
function labLevels(){ return loadJSON('digibonk3d-lab', {}); }
function labLv(id){ return Math.min(labMax(LAB_BY_ID[id]), labLevels()[id] | 0); }

function recordRun(key, kills, t){
  const all = loadJSON('digibonk3d-stats', {});

  if (t >= 5) st.plays += 1;

  const unlocked = [];
  for (const sk of SKINS){
    if (sk.src === 'logro' && skinHasArt(key, 0, sk.id) && !ownsAt(key, 0, sk.id) && meetsReq(sk, st)){

  }

// Sprites recoloreados o con efecto, generados en un canvas al arrancar
const skinURL = {};   // clave: personaje|evolucionado|skin
// Efecto glitch: desfase de canales R y B y algunas líneas desplazadas
function glitchPixels(x, w, h){
  const d = x.getImageData(0, 0, w, h), src = new Uint8ClampedArray(d.data), sh = Math.max(1, Math.round(w/64));
  for (let y = 0; y < h; y++){
    const rowShift = (y*37) % 23 === 0 ? sh*2 : 0;   // algunas filas se desplazan más
    for (let xx = 0; xx < w; xx++){
      const i = (y*w + xx) * 4;
      const xr = Math.min(w-1, Math.max(0, xx - sh - rowShift));
      const xb = Math.min(w-1, Math.max(0, xx + sh + rowShift));
      const ir = (y*w + xr) * 4, ib = (y*w + xb) * 4;
      d.data[i]   = src[ir];       // rojo desplazado a la izquierda
      d.data[i+1] = src[i+1];      // verde en su sitio
      d.data[i+2] = src[ib+2];     // azul desplazado a la derecha
      d.data[i+3] = src[i+3];
    }
  }
  x.putImageData(d, 0, 0);
}
function buildSkins(){
  for (const key of SEASONS.adventure.chars){
    for (let st = 0; st <= EVO_LINE[key].length; st++){
      const path = st ? EVO_LINE[key][st - 1].sprite : CHARS[key].sprite;
      for (const sk of SKINS){
        if (sk.id === 'clasico') continue;
        // hoja animada de la skin (importada con sprites/anim/importar_hoja.py); sin hoja, la skin usa el sprite base
        if (ANIM_IDS.has(`${key}_${st}_${sk.id}`)) skinURL[`${key}|${st}|${sk.id}`] = `sprites/anim/${key}_${st}_${sk.id}.png`;
      }
    }
  }
}
// Sprite a usar para un personaje con su skin (o el original si aún no está lista)
function spriteWith(key, evolved, skinId){
  const st = +evolved || 0;   // etapa: 0 inicial, 1-3 digievoluciones (true cuenta como 1)
  const base = st ? EVO_LINE[key][st - 1].sprite : CHARS[key].sprite;
  if (!skinId || skinId === 'clasico') return base;
  return skinURL[`${key}|${st}|${skinId}`] || base;
}
function spriteOf(key, evolved){ const st = +evolved || 0; return spriteWith(key, st, equippedAt(key, st)); }

/* ---------- Icono del jugador: solo la cabeza del Digimon ---------- */
const headCache = {};
const headListeners = {};
function headUrl(src, onReady){
  if (headCache[src] && headCache[src] !== 'pending'){ if (onReady) onReady(headCache[src]); return headCache[src]; }
  if (onReady) (headListeners[src] ||= []).push(onReady);
  if (headCache[src]) return src;
  headCache[src] = 'pending';
  const im = new Image();
  im.onload = () => {
    // Las hojas animadas son ANIM_N fotogramas en horizontal (ancho ≈ 5 × alto): el icono usa el primero
    const fr = im.naturalWidth / im.naturalHeight > ANIM_N - 1 ? ANIM_N : 1;
    const fw = Math.floor(im.naturalWidth / fr), h = im.naturalHeight;
    // Caja real del Digimon dentro del fotograma (píxeles con alfa)
    const probe = document.createElement('canvas'); probe.width = fw; probe.height = h;
    const pc = probe.getContext('2d', {willReadFrequently: true});
    pc.drawImage(im, 0, 0, fw, h, 0, 0, fw, h);
    const d = pc.getImageData(0, 0, fw, h).data;
    let x0 = fw, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < fw; x++){
      if (d[(y*fw + x)*4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0){ x0 = 0; y0 = 0; x1 = fw - 1; y1 = h - 1; }
    // Cabeza: la mitad superior de la caja, cuadrada y centrada
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    // Centro de la cabeza: centro de masa de los píxeles de la mitad superior
    const hh = bh * 0.5, side = hh * 1.65;
    let mx = 0, my = 0, mn = 0;
    for (let y = y0; y < y0 + hh; y++) for (let x = x0; x <= x1; x++){
      if (d[(y*fw + x)*4 + 3] > 40){ mx += x; my += y; mn++; }
    }
    const cx = mn ? mx/mn : x0 + bw/2, cy = mn ? my/mn : y0 + hh/2;
    const c = document.createElement('canvas'); c.width = 96; c.height = 96;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    x.drawImage(im, cx - side/2, cy - side/2, side, side, 0, 0, 96, 96);
    headCache[src] = c.toDataURL('image/png');
    for (const cb of headListeners[src] || []) cb(headCache[src]);
    delete headListeners[src];
  };
  im.onerror = () => { delete headCache[src]; delete headListeners[src]; };
  im.src = sheetOf(src) || src;
  return src;
}

    if (tab === 'frame') return [{id: '', name: 'Sin marco', tier: 'c'}, ...FRAMES.filter(f => !f.weekly && !f.seasonal)].map(f => {

    }).join('');

    if (pFrame) equipExtra('frame', pFrame); else unequipExtra('frame');
    if (pTitle) equipExtra('title', pTitle); else unequipExtra('title');
    close(); sfx('ready'); showPlayer();
  };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });

// Progreso de logros guardado en 'digibonk3d-ach'
function loadAch(){ return loadJSON('digibonk3d-ach', {runs: 0, zone2: false, boss: false}); }

const TIER_NAME = {c:'Común', r:'Rara', e:'Épica', l:'Legendaria'};

let inv = loadJSON('digibonk3d-inv', {frames: [], titles: [], items: {}});

// Marco del icono del Digimon en el HUD
function frameClass(){ return extra.frame ? ' fr-' + extra.frame : ''; }

// Pesos por tipo de recompensa y por rareza
// Banners del gacha: cada uno tiene su skin legendaria. El de evento solo aparece mientras dura el evento
// Banner permanente: cada semana destaca una línea evolutiva distinta (sus skins galácticas)
const WEEK_MS = 7 * 86400000;
// Número de semana con cambio los lunes (el 1970-01-05 fue lunes; 4 días después del 1 de enero de 1970)
const weekNum = () => Math.floor((Date.now() - 4 * 86400000) / WEEK_MS);
function weeklyIndex(){ const n = SEASONS.adventure.chars.length; return ((weekNum() % n) + n) % n; }
function weeklyDigimon(){ return SEASONS.adventure.chars[weeklyIndex()]; }
// Marco y título exclusivos del banner activo (null si el banner no tiene)
function bannerFrame(){
  if (gxBanner === 'std') return {frame: 'wk' + weeklyIndex(), title: 'wk' + weeklyIndex()};
  if (BANNERS[gxBanner] && BANNERS[gxBanner].event) return {frame: 'navidad', title: 'navidad'};
  return null;
}
// Misión semanal: 5 tiradas en la semana dan 1 ticket
const WEEK_PULLS = 5;
function weekState(){
  const w = weekNum(), st = loadJSON('digibonk3d-weekly', {});
  return st.week === w ? st : {week: w, pulls: 0, claimed: false};
}
function addWeekPulls(n){
  const st = weekState();
  st.pulls += n;
  let done = false;
  if (!st.claimed && st.pulls >= WEEK_PULLS){ st.claimed = true; done = true; addTickets('std', 1); }
  localStorage.setItem('digibonk3d-weekly', JSON.stringify(st));
  return done;
}
// Tres banners: el permanente con las skins galácticas y dos de Navidad (Papá Noel y Reno, solo con el evento activo)
const BANNERS = {
  std:      {name: 'Digivice Estándar', sub: 'Skins galáctica y holográfica', skins: ['galactico', 'holografica'], weekly: true},
  navidadP: {name: EVENT.name, sub: 'Skin Papá Noel · tiempo limitado', skins: ['festival'], event: true},
  navidadR: {name: EVENT.name, sub: 'Skin Reno · tiempo limitado', skins: ['reno'], event: true}
};
// Nombre que se muestra a la skin destacada de cada banner
const FEATURED_NAME = {galactico: 'Aventurero', holografica: 'Holográfico', festival: 'Papá Noel', reno: 'Reno'};
// Skins que da un banner: [{key, st, sk}]. El permanente solo tiene la línea de la semana
function bannerPool(bn = gxBanner){
  const b = BANNERS[bn];
  const out = [];
  // solo entran las skins que ya tienen hoja dibujada
  const add = (key, times, sk) => { for (let t = 0; t < times; t++) for (let st = 0; st < stageCount(key); st++) if (skinHasArt(key, st, sk.id)) out.push({key, st, sk}); };
  const all = () => { for (const sk of b.skins.map(id => SKIN_BY_ID[id])) for (const key of SEASONS.adventure.chars) add(key, 1, sk); };
  if (b.weekly){
    const chars = SEASONS.adventure.chars, i = weeklyIndex();
    const second = chars[(i + 3) % chars.length];
    for (const sk of b.skins.map(id => SKIN_BY_ID[id])){ add(weeklyDigimon(), 2, sk); add(second, 1, sk); }
    if (!out.length) all();   // la línea de la semana aún no tiene skins: entran las que haya
  } else all();
  return out;
}
let gxBanner = 'std';
// Garantía: si pasan PITY_AT tiradas sin legendaria, la siguiente lo es. Una legendaria repetida devuelve Bits
const PITY_AT = 100, LEG_DUP_REFUND = 200;
// Garantía por banner: el permanente cada 100 tiradas, cada Navidad cada 50 (contadores separados)
const PITY_BY_BANNER = {std: 100, navidadP: 50, navidadR: 50};
const pityAt = bn => PITY_BY_BANNER[bn] || 100;
const pityKey = bn => bn === 'std' ? 'digibonk3d-pity' : 'digibonk3d-pity-' + bn;
const pityCount = (bn = gxBanner) => +(localStorage.getItem(pityKey(bn)) || 0);
// Un banner de evento solo se muestra si está activo y tiene alguna skin dibujada
function bannerOpen(bn){ return !BANNERS[bn].event || (eventActive() && bannerPool(bn).length > 0); }
function bannerSkins(){ if (!bannerOpen(gxBanner)) gxBanner = 'std'; return BANNERS[gxBanner].skins.map(id => SKIN_BY_ID[id]); }
function bannerSkin(){ return bannerSkins()[0]; }
// La rareza se decide primero. Legendaria = skin; el resto reparte entre marco, título y objeto
const TIER_ODDS = {c: 60, r: 26, e: 12, l: 2};
// Reparto de lo que no es legendaria: marcos, títulos, tickets y Bits
const CAT_WEIGHTS = [['frame', 32], ['title', 28], ['ticket', 10], ['bits', 30]];
// Bits según rareza: común 30, rara 80, épica 160. Tickets: siempre 1 por drop
const BITS_BY_TIER = {c: 30, r: 80, e: 160};
// Tickets por banner: peso del drop (en el reparto no legendario) y cantidad por drop.
// El permanente da poco; los promocionales dan más para tirar en su evento.
const TICKET_DROP = {w: 10, amt: 1};   // todos los banners: mismo peso y cantidad de ticket por drop
function ticketRule(){ return TICKET_DROP; }
function rollTier(){
  let x = Math.random()*100;
  for (const t of ['c', 'r', 'e', 'l']){ if ((x -= TIER_ODDS[t]) < 0) return t; }
  return 'c';
}
function pickCategory(){
  const W = CAT_WEIGHTS.map(([k, w]) => [k, k === 'ticket' ? ticketRule().w : w]);
  let tot = W.reduce((a, c) => a + c[1], 0), x = Math.random()*tot;
  for (const [k, w] of W){ if ((x -= w) < 0) return k; }
  return 'title';
}
// Devuelve una recompensa: {type, ...} o null si no queda nada de ese tipo
// Si no quedan recompensas de ese nivel, baja al inmediatamente inferior (los objetos no tienen épicos)
const TIER_DOWN = {l: 'e', e: 'r', r: 'c', c: 'c'};
function unownedPool(list, tier, owned){
  let t = tier;
  for (;;){
    const pool = list.filter(x => x.tier === t && !owned(x));
    if (pool.length || t === 'c') return pool;
    t = TIER_DOWN[t];
  }
}
function pickOne(pool){ return pool[Math.floor(Math.random()*pool.length)]; }
// Devuelve una recompensa: {type, ...}. Legendaria da una skin de un Digimon
function rollReward(tier){
  if (tier === 'l'){
    // Banner de temporada: 50% una de sus skins y 50% la del banner permanente. Puede salir repetida,
    // pero tras una repetida la siguiente legendaria es nueva seguro (mientras quede alguna por conseguir)
    const pool = bannerPool();
    if (!pool.length) return {type:'bits', amount: LEG_DUP_REFUND, tier:'l'};   // aún no hay skins dibujadas para este banner
    if (localStorage.getItem('digibonk3d-legnew') === '1'){
      const fresh = pool.filter(e => !ownsAt(e.key, e.st, e.sk.id));
      if (fresh.length){
        // respeta el 50/50 si en la mitad que toca queda algo nuevo
        const f = pickOne(fresh);
        return {type:'skin', key: f.key, st: f.st, sk: f.sk, tier:'l'};
      }
    }
    const key = pickOne(SEASONS.adventure.chars);
    const pick = pickOne(pool);
    return {type:'skin', key: pick.key, st: pick.st, sk: pick.sk, tier:'l'};
  }
  const cat = pickCategory();
  if (cat === 'ticket') return {type:'ticket', amount: ticketRule().amt, tier};
  if (cat === 'bits') return {type:'bits', amount: BITS_BY_TIER[tier] || 30, tier};
  // Banner permanente: parte de las tiradas de marco o título dan el de la semana
  // Marcos y títulos del banner: la semana en el permanente, Navidad en sus banners
  const bf = bannerFrame();
  if (bf && Math.random() < 0.3){
    if (cat === 'frame' && !inv.frames.includes(bf.frame)) return {type:'frame', f: FRAMES.find(f => f.id === bf.frame), tier:'e'};
    if (cat === 'title' && !inv.titles.includes(bf.title)) return {type:'title', t: TITLES.find(t => t.id === bf.title), tier:'e'};
  }
  if (cat === 'frame'){
    const pool = unownedPool(FRAMES.filter(f => !f.weekly && !f.seasonal), tier, f => inv.frames.includes(f.id));
    if (pool.length){ const f = pickOne(pool); return {type:'frame', f, tier: f.tier}; }
  }
  {
    const pool = unownedPool(TITLES.filter(t => !t.weekly && !t.seasonal), tier, t => inv.titles.includes(t.id));
    if (pool.length){ const t = pickOne(pool); return {type:'title', t, tier: t.tier}; }
  }
  // Sin marcos ni títulos nuevos: Bits
  return {type:'bits', amount: BITS_BY_TIER[tier] || 30, tier};
}
// Aplica la recompensa a la colección; los repetidos se convierten en Bits
function grantReward(r){
  if (r.type === 'skin'){
    if (ownsAt(r.key, r.st, r.sk.id)){
      SAVE.bits = SAVE.bits + LEG_DUP_REFUND;
      localStorage.setItem('digibonk3d-legnew', '1');   // la siguiente legendaria será nueva
      return {...r, dup:true, refund: LEG_DUP_REFUND};
    }
    localStorage.removeItem('digibonk3d-legnew');
    grantSkinAt(r.key, r.st, r.sk.id);
    return {...r, dup:false};
  }
  if (r.type === 'frame'){
    if (inv.frames.includes(r.f.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.frames.push(r.f.id); saveInv(); return {...r, dup:false};
  }
  if (r.type === 'title'){
    if (inv.titles.includes(r.t.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.titles.push(r.t.id); saveInv(); return {...r, dup:false};
  }
  if (r.type === 'bits'){ SAVE.bits = SAVE.bits + r.amount; return {...r, dup:false}; }
  if (r.type === 'ticket'){ addTickets(gxBanner, r.amount); return {...r, dup:false}; }   // el ticket es del banner en el que tiraste
  return {...r, dup:false};
}
// Tirada: 1 o 10. Con 10 se garantiza al menos una recompensa rara o épica
function doPulls(n){
  if (usableTickets(gxBanner) < n){ announce('Tickets insuficientes', `Necesitas ${n} ${n === 1 ? 'ticket' : 'tickets'}. Se consiguen jugando`, '#ef5350'); return; }
  spendUsable(gxBanner, n);
  const tiers = Array.from({length: n}, () => rollTier());
  if (n === 10 && !tiers.some(t => t !== 'c')) tiers[9] = 'r';
  // Contador de garantía: se reinicia con cada legendaria y fuerza una en la tirada número PITY_AT
  let pity = pityCount(gxBanner);
  for (let i = 0; i < tiers.length; i++){
    pity++;
    if (tiers[i] !== 'l' && pity >= pityAt(gxBanner)) tiers[i] = 'l';
    if (tiers[i] === 'l') pity = 0;
  }
  localStorage.setItem(pityKey(gxBanner), String(pity));
  if (gxBanner === 'std' && n === 10){ addTickets('std', 1); announce('+1 ticket', '10 tiradas en el banner permanente', '#3de0ff'); }
  if (addWeekPulls(n)) announce('Misión semanal completada', '+1 ticket por 5 tiradas esta semana', '#ffd54f');
  const results = [];
  for (const t of tiers){
    let r = rollReward(t);
    results.push(grantReward(r));
  }
  playPullAnimation(results);
}
// Animación de tirada: el Digivice se carga, su luz adelanta la mejor rareza, estalla y reparte las cartas boca abajo

/* ---------- Efectos de skin: bonus de estadísticas y aura alrededor del Digimon ---------- */
const dotTexCache = {};
function dotTex(kind, color){
  const k = kind + color;
  if (dotTexCache[k]) return dotTexCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = color;
  if (kind === 'star'){
    x.beginPath();
    for (let i = 0; i < 10; i++){ const r = i % 2 ? 6 : 14, a = -Math.PI/2 + i*Math.PI/5; x.lineTo(16 + Math.cos(a)*r, 16 + Math.sin(a)*r); }
    x.closePath(); x.fill();
  } else if (kind === 'shard'){
    x.beginPath(); x.moveTo(16, 2); x.lineTo(26, 16); x.lineTo(16, 30); x.lineTo(6, 16); x.closePath(); x.fill();
  } else {
    x.beginPath(); x.arc(16, 16, 9, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  dotTexCache[k] = t;
  return t;
}
// Bonus permanente: cada skin conseguida da su bonus a ese Digimon, equipada o no
function applySkinFx(key){
  const p = g.p;
  for (const id of ownedSkins(key)){
    const fx = SKIN_FX[id];
    if (!fx) continue;
    const b = fx.bonus;
    if (b.speed) p.speed *= b.speed;
    if (b.dmg) p.dmg *= b.dmg;
    if (b.pickup) p.pickup *= b.pickup;
    if (b.maxHp){ p.maxHp += b.maxHp; }
  }
  p.hp = p.maxHp;
}
function makeAura(skinId, key){
  const fx = SKIN_FX[skinId];
  if (!fx) return null;
  const group = new THREE.Group();
  world.add(group);
  const sprite = (map, color, scale) => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map, color: color || 0xffffff, transparent: true, depthWrite: false}));
    sp.scale.set(scale, scale, 1);
    group.add(sp);
    return sp;
  };
  let update = () => {};
  if (fx.aura === 'stars'){
    const st = Array.from({length: 6}, () => sprite(dotTex('star', '#d1a3ff'), 0xffffff, .45));
    update = t => st.forEach((s, i) => { const a = t*1.6 + i*Math.PI/3; s.position.set(Math.cos(a)*1.2, 2.2 + Math.sin(t*2 + i)*.15, Math.sin(a)*1.2); });
  } else if (fx.aura === 'shards'){
    const sh = Array.from({length: 6}, () => sprite(dotTex('shard', '#bff6ff'), 0xffffff, .4));
    update = t => sh.forEach((s, i) => { const a = -t + i*Math.PI/3; s.position.set(Math.cos(a)*1.0, 1.6 + Math.sin(t*3 + i)*.2, Math.sin(a)*1.0); });
  } else if (fx.aura === 'confetti'){
    const cols = ['#ffd54f', '#ff7043', '#81d4fa', '#aed581'];
    const cf = Array.from({length: 12}, (_, i) => sprite(dotTex('dot', cols[i % 4]), 0xffffff, .25));
    update = t => cf.forEach((s, i) => {
      const f = (t*0.5 + i/12) % 1;
      s.position.set(Math.sin(i*2.3)*1.1, .3 + f*2.4, Math.cos(i*1.7)*1.1);
      s.material.opacity = 1 - f;
    });
  } else if (fx.aura === 'ghost'){
    const url = spriteOf(key, false);
    const g1 = sprite(tex(url), 0xff4d6d, 2.2), g2 = sprite(tex(url), 0x4dd0ff, 2.2);
    g1.material.opacity = g2.material.opacity = .45;
    update = t => {
      const j = Math.sin(t*23) > .8 ? .14 : 0;   // parpadeo: el eco se separa de vez en cuando
      g1.position.set(-.12 - j, 1.1, 0);
      g2.position.set(.12 + j, 1.1, 0);
    };
  }
  return {group, update};
}

function waterSlow(x, z){ return 1 - 0.4*pondWeight(x, z); }
function splashAt(x, z, n){

function addRipple(x, z, r0){
