<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digibonk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;left:16px;top:16px;pointer-events:none}
.hud-card{display:flex;gap:14px;align-items:center;padding:10px 14px 10px 10px;border-radius:16px;
  background:linear-gradient(160deg,rgba(24,62,110,.94),rgba(8,18,40,.95));border:2px solid #7fd0ff}
.hud-portrait{position:relative;width:66px;height:66px;border-radius:14px;display:grid;place-items:center;
  border:2px solid #7fd0ff;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.05))}
#pimg{width:54px;height:54px;image-rendering:pixelated}
.hud-lvl{position:absolute;right:-9px;bottom:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;
  background:#ffd54f;color:#1a1200;font-weight:900;font-size:13px;border:2px solid #1a1200}
.hud-main{min-width:250px}
.hud-name{font-weight:900;font-size:17px;letter-spacing:.5px;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.1}
.hud-hp{position:relative;width:250px;height:18px;margin-top:6px;border-radius:9px;background:#06141a;border:1px solid #3b78b0;overflow:hidden}
#hp{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#3fb950,#a6e35a);transition:width .15s}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px 2px #000}
.hud-chips{display:flex;gap:6px;margin-top:7px}
.chip{font-size:12px;padding:2px 9px;border-radius:9px;background:rgba(8,18,40,.85);border:1px solid #2d5f78;color:#cfe8ff;white-space:nowrap}
.chip b{color:#fff}
.chip.ready{border-color:#7cf29c;color:#7cf29c;box-shadow:0 0 8px rgba(124,242,156,.5)}
#timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:4px 18px;border-radius:10px;
  background:#0b1120;border:2px solid #ffd54f;box-shadow:0 0 14px rgba(255,213,79,.35);
  font-family:'Consolas',monospace;font-size:26px;font-weight:bold;color:#ffd54f;pointer-events:none}
#xp{position:fixed;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,#0288d1,#4fc3f7);pointer-events:none}
#xpTxt{position:fixed;left:16px;bottom:14px;font-size:12px;font-weight:bold;letter-spacing:.5px;color:#cfe8ff;text-shadow:0 1px 3px #000;pointer-events:none}
#hudTop{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px 8px;min-width:300px;border-radius:14px;background:linear-gradient(180deg,rgba(26,46,92,.96),rgba(8,14,30,.96));border:2px solid #4fc3f7;box-shadow:0 0 18px rgba(79,195,247,.35),inset 0 2px 0 rgba(255,255,255,.12);pointer-events:none;z-index:6}
#hudTop #timer{position:static;transform:none;animation:none;padding:0 14px;border-radius:8px;font-size:24px;line-height:1.2}
#hudTop #timer.urgent{animation:none}
#hudZone{font:800 11px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#9fe3ff;white-space:nowrap}
#hudChips{display:flex;gap:6px;white-space:nowrap}
#hudChips span{padding:2px 10px;border-radius:9px;background:rgba(8,14,30,.85);border:1px solid #2d5f78;color:#fff;font:700 12px system-ui,sans-serif}
#hudChips b{color:#ffd54f}
#timer.urgent{color:#ff5252;border-color:#ff5252;box-shadow:0 0 18px rgba(255,82,82,.6);animation:timerPulse .8s ease-in-out infinite}
@keyframes timerPulse{50%{transform:translateX(-50%) scale(1.06)}}
#combo{position:fixed;right:24px;top:200px;padding:4px 14px;border-radius:10px;background:#ffd54f;color:#1a1200;
  font-weight:900;font-size:28px;box-shadow:0 0 14px rgba(255,213,79,.6);pointer-events:none}
#combo:empty{display:none}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#banner b{display:block;font-size:46px;letter-spacing:3px;color:inherit;text-shadow:0 4px 0 #000,0 0 24px currentColor}
#banner small{display:block;margin-top:4px;font-size:15px;letter-spacing:1px;color:#e6f4ff;text-shadow:0 2px 4px #000}
#banner.show{animation:bannerIn 2.4s ease both}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.98)}}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(198,40,40,.9) 100%)}
#prompt{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:none;padding:5px 12px;border-radius:10px;
  background:rgba(8,14,30,.92);border:2px solid #ffd54f;color:#ffd54f;font-weight:bold;font-size:14px;letter-spacing:.5px;
  pointer-events:none;white-space:nowrap;box-shadow:0 0 12px rgba(255,213,79,.4)}
#prompt kbd{display:inline-block;min-width:20px;padding:0 6px;margin-right:4px;border-radius:5px;background:#ffd54f;color:#1a1200;text-align:center}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,16,34,.75),rgba(0,0,0,.9));text-align:center}
#overlay.hidden{display:none}
#overlay.menu-mode{display:block}
#overlay.menu-mode.hidden{display:none}
.logo{font-size:60px;font-weight:900;letter-spacing:2px;line-height:1;color:#fff;text-align:left}
.logo span{color:#ffd54f}
.logo em{font-style:normal;color:#4fc3f7;font-size:36px}
.sub{margin:8px 0 24px;color:#90caf9;font-size:15px;letter-spacing:1px;text-align:left}
.play{font-weight:900;cursor:pointer}
.play:hover{transform:translateY(-2px)}
.tiles{display:flex;gap:14px}
.muted{opacity:.7;font-size:13px}
.legal{font-size:11px;opacity:.55;margin:0;text-align:left}
#overlay h1{margin:0 0 6px;font-size:44px;letter-spacing:2px;color:#4fc3f7;text-shadow:0 0 18px rgba(79,195,247,.6)}
.card{padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;
  background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;box-shadow:0 0 12px rgba(79,195,247,.25)}
.card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 22px rgba(79,195,247,.6)}
.card img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.card small{display:block;opacity:.8;margin-top:6px;font-size:13px}
.tiles{margin-top:18px}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border-radius:5px;background:#16213a;border:1px solid #4fc3f7;
  border-bottom-width:3px;font-size:12px;font-weight:bold;text-align:center;color:#e3f2fd}
.card{width:230px;text-align:left;position:relative;border-top-width:6px}
.card.ofensiva{border-color:#ef5350;border-top-color:#ef5350}
.card.defensiva{border-color:#66bb6a;border-top-color:#66bb6a}
.card.utilidad{border-color:#ab47bc;border-top-color:#ab47bc}
.card .tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:8px;margin-bottom:6px;color:#0b0f1a;font-weight:bold}
.card.ofensiva .tag{background:#ef5350}
.card.defensiva .tag{background:#66bb6a}
.card.utilidad .tag{background:#ab47bc;color:#fff}
.card b{display:block;font-size:17px;padding-right:24px;text-align:left;color:#ffd54f}
.card p{margin:8px 0 0;font-size:13px;line-height:1.35;color:#dbe9ff;text-align:left}
#overlay h2{margin:0;font-size:24px;color:#ffd54f;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(ellipse at center,rgba(10,20,44,.45),rgba(3,6,14,.86));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20}

.pz-device{position:relative;width:min(540px,94vw);max-height:96vh;overflow:hidden;padding:30px 36px 20px;
  border-radius:44% 44% 36% 36% / 14% 14% 10% 10%;color:#e6f4ff;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.4),transparent 35%),linear-gradient(160deg,#7fcaf3,#3d8fd1 32%,#1f5fa2 64%,#143f74);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -12px 22px rgba(0,20,50,.55),0 0 0 3px #0b1d3a,0 26px 60px rgba(0,0,0,.75)}
.pz-brand{text-align:center;font-weight:900;letter-spacing:6px;font-size:12px;color:#0d2a52;margin:-14px 0 6px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pz-bezel{background:linear-gradient(180deg,#0d2238,#071526);border-radius:26px;padding:12px;box-shadow:inset 0 3px 10px rgba(0,0,0,.8)}

.pz-title{width:max-content;margin:0 auto 4px;padding:4px 16px;border-radius:10px;font-weight:900;letter-spacing:2px;font-size:12px;color:#fff;

.pz-st{color:#7cf29c}

.pz-close:hover{background:#15527f}
.pz-profile{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin-top:10px}
.pz-av{width:92px;height:92px;border-radius:14px;border:2px solid #7fd0ff;display:grid;place-items:center;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.04))}
.pz-av img{width:74px;height:74px;object-fit:contain;image-rendering:pixelated}
.pz-av .pz-anim{width:84px;height:84px;background-size:500% 100%;background-position:0 50%}
.pz-name{font-size:26px;font-weight:900;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.05}
.pz-quote{font-size:12px;font-style:italic;color:#bfe9ff;margin:2px 0 6px}
.pz-lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#bfe9ff;text-transform:uppercase;margin:5px 0 2px}
.pz-bar{height:13px;border-radius:7px;background:#06141a;border:1px solid #3b78b0;overflow:hidden;position:relative}
.pz-bar i{position:absolute;top:0;bottom:0;left:0;display:block;background:linear-gradient(90deg,#3fb950,#a6e35a)}
.pz-bar.evo i{background:linear-gradient(90deg,#8e24aa,#ffd54f)}
.pz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.pz-stats div{text-align:center;padding:6px 2px;border-radius:10px;background:rgba(8,26,34,.8);border:1px solid #2d5f78}
.pz-stats small{display:block;font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:#9ad3e8;line-height:1.2;min-height:20px}
.pz-stats b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.pz-btns{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:8px}
.pz-btn{padding:10px 6px;border-radius:12px;border:1px solid #7fd0ff;cursor:pointer;font:900 12px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;line-height:1.15;
  background:linear-gradient(180deg,#1e3a66,#0e1f3d);box-shadow:0 4px 0 #050b18}
.pz-btn small{display:block;font-size:9px;letter-spacing:.6px;font-weight:700;opacity:.85}
.pz-btn:hover{filter:brightness(1.12)}
.pz-btn:active{transform:translateY(2px)}
.pz-primary{background:linear-gradient(180deg,#7ef07e,#2fa84a 60%,#1c7a33);border-color:#bdf9c6;box-shadow:0 4px 0 #0f4a20}
.pz-danger{background:linear-gradient(180deg,#ff7a6b,#c62828 60%,#8e1b1b);border-color:#ffb3a8;box-shadow:0 4px 0 #4a0b0b}
.pz-confirm{text-align:center;padding:6px 0}
.pz-warn{font-size:17px;font-weight:bold;color:#ef9a9a;letter-spacing:.5px}
.pz-confirm p{margin:4px 0 12px;font-size:13px;color:#cfe8ff}
.pz-confirm .pz-btns{grid-template-columns:1fr 1fr}
.pz-keys{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:12px;font-size:11px;color:#cfe8ff}
.pz-keys span{white-space:nowrap}
.pz-keys .kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#f4f7fb,#b8c4d6);color:#1a2236;font:bold 10px ui-monospace,Menlo,monospace;border:1px solid #fff;box-shadow:0 2px 0 #55607a;text-align:center}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(10,20,40,.45) 100%)}
#minimap{position:fixed;right:16px;top:16px;width:170px;height:170px;border-radius:14px;border:3px solid #4fc3f7;
  box-shadow:0 0 14px rgba(79,195,247,.4);pointer-events:none;background:#16321f}
#mapview{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(4,8,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:15;cursor:pointer}
#mapview.open{display:flex}
#bigmap{width:min(72vh,600px);height:min(72vh,600px);border-radius:18px;border:3px solid #4fc3f7;box-shadow:0 0 30px rgba(79,195,247,.4)}
.mapleg{font-size:13px;color:#cfe8ff;text-align:center;background:rgba(6,14,26,.85);padding:6px 14px;border-radius:10px;border:1px solid #2d5f78}
.mini-btn{padding:9px 16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #050b18}
.mini-btn:hover{filter:brightness(1.15)}
.gacha{width:min(880px,96vw);max-height:92vh;overflow:auto;padding:18px 22px;color:#e6f4ff;text-align:left}
.g-back{padding:7px 12px;cursor:pointer}
.g-btn{margin:10px 0 6px;padding:12px 28px;cursor:pointer;font-weight:900;letter-spacing:2px}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.picker-screen{width:min(1000px,96vw);height:min(640px,92vh);display:flex;flex-direction:column;gap:12px;padding:16px 18px;color:#e6f4ff;text-align:left}
.pk-head{display:flex;align-items:center;gap:14px}
.pk-head h2{margin:0;flex:1;font-size:24px}
.pk-tab{padding:8px 16px;font-weight:bold;cursor:pointer}
.pk-start{cursor:pointer;font-weight:900;letter-spacing:1.5px}
.pk-hint{font-size:12px;color:#9fd4ff}
.play{background:linear-gradient(180deg,#ff5a5a,#ff3b3b);color:#fff;border:4px solid #fff;
  box-shadow:0 9px 0 #7a1010,0 0 0 4px #2a0c0c;text-shadow:0 3px 0 #7a1010;font-size:32px;padding:18px 70px;border-radius:18px;letter-spacing:4px}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #7a1010,0 0 0 4px #2a0c0c}
.logo{text-shadow:0 5px 0 #1d4fa0,0 0 26px rgba(79,195,247,.7)}
.pk-tab{border-width:2px}
.pk-start{font-size:20px;padding:14px 40px}
.settings{width:min(640px,94vw);padding:18px 22px;border-radius:22px;background:rgba(10,18,40,.95);border:3px solid #3a6fc4;color:#e6f4ff;text-align:left;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.set-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#overlay .set-head h2{margin:0;flex:1;font-size:24px;color:#ffd54f}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid #1e2a44}

.set-seg-wrap{display:flex;gap:6px}
.set-seg{padding:8px 14px;border-radius:12px;border:2px solid #3a6fc4;background:rgba(8,20,40,.9);color:#cfe8ff;font-weight:bold;cursor:pointer}

.set-toggle.on{border-color:#7cf29c;background:linear-gradient(180deg,#3fb950,#2e9a3e);color:#fff}
.rw-frame{width:44px;height:44px;margin:0 auto 4px;background:#1a2440}
.rw-title{font-size:30px;line-height:44px;height:44px}

.hud-title{font-size:11px;color:#bfe9ff;letter-spacing:.5px;margin-top:2px;text-shadow:0 1px 2px #000}
.help-box{width:min(640px,94vw);padding:18px 22px;color:#e6f4ff}
.tuto-screen{text-align:center;margin-top:10px}

.rw-frame{position:relative;border-radius:14px}

/* ===== Sistema común de pantallas: mismo fondo, marco, cabecera, botones y márgenes en todos los menús ===== */
:root{--ui-panel:linear-gradient(150deg,#256cbb 0%,#082f77 49%,#061c4c 100%);--ui-line:#9aefff;--ui-card:rgba(6,24,64,.82);--ui-card-line:#2f6fb3;--ui-text:#eaf6ff;--ui-muted:#a9c6e6;--ui-gold:#ffd54f;--ui-top:28px;--ui-bot:28px;--ui-radius:10px}
/* Fondo de los menús: escenario limpio del Digimundo, desenfocado y oscurecido (la imagen anterior tenía un formulario dibujado) */
#menuart{background:#061433 url('ui/mundo_digital_solo_escenario.jpg') center/cover no-repeat;filter:blur(4px) brightness(.5) saturate(1.1);transform:scale(1.06)}
/* Márgenes iguales arriba y abajo: la barra superior reserva su hueco y el panel nunca toca los bordes */

#overlay.has-top:not(.menu-mode){--ui-top:76px;padding-top:var(--ui-top)}
#overlay:not(.menu-mode)>:is(.picker-screen,.settings,.help-box,.lab-screen,.end3){flex:none;box-sizing:border-box;max-height:calc(100dvh - var(--ui-top) - var(--ui-bot))}
#overlay:not(.menu-mode)>.picker-screen{width:min(1040px,96vw)}
#overlay:not(.menu-mode)>:is(.settings,.help-box){width:min(690px,94vw)}
#overlay:not(.menu-mode)>.settings.sc-box{width:min(730px,94vw)}
#overlay:not(.menu-mode)>.picker-screen.pk2{height:min(680px,calc(100dvh - var(--ui-top) - var(--ui-bot)))}
#overlay:not(.menu-mode):has(>:is(.dvl2,.pa,.pr3,.tr11)){padding:0}
/* Primer compañero: ficha arriba y los 8 Digimon en una rejilla debajo, sin huecos vacíos */
#overlay:not(.menu-mode)>.pk2-starter{height:auto;width:min(900px,96vw)}
.pk2-starter .pk2-body{display:flex;flex-direction:column;gap:14px}
.pk2-starter .pk2-right{width:auto}
.pk2-starter .pk2-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.pk2-starter .pk2-foot{justify-content:center}
/* Laboratorio con el mismo marco y cabecera que Ajustes o Colección */
#overlay:not(.menu-mode)>.lab-screen{width:min(1080px,96vw);max-width:none;margin:0;padding:18px 22px 20px;overflow:auto;text-align:left;color:var(--ui-text);background:var(--ui-panel);border:3px solid var(--ui-line);border-radius:8px;box-shadow:inset 0 3px #b5ffff76,0 8px 0 #03163d,0 0 22px #21afff7c;outline:2px solid #267dbb;outline-offset:3px}
.lab-top{padding:8px 14px;border:2px solid #c3fdff;border-radius:var(--ui-radius);background:linear-gradient(90deg,#6ee2f4,#147fbf);box-shadow:0 3px #0b3976;color:#06234b}
#overlay .lab-head h2{color:#07315c;text-shadow:0 1px #d5ffff;font-family:'Orbitron',system-ui,sans-serif;font-size:24px;letter-spacing:1px;text-transform:uppercase}
.lab-head small{color:#0b3976;font-weight:600}
.lab-host{width:48px;height:48px;background:#06234b}
.lab-bits{background:#06102b;border:2px solid var(--ui-gold);color:var(--ui-gold);font-family:'Orbitron',system-ui,sans-serif;font-size:16px}
.lab-say{margin:14px 0;background:var(--ui-card);border-left-color:var(--ui-gold)}
.lab-card{text-align:left;background:var(--ui-card);border:1px solid var(--ui-card-line);border-radius:var(--ui-radius)}
.lab-ic{background:#0f3a7a}
.lab-txt p{color:var(--ui-muted)}
.lab-foot{align-items:center;margin-top:16px}
.lab-foot .g-btn{margin:0}
/* Ficha de jugador con la paleta Digivice (antes gris Nord, distinta del resto) */
.pl4 .real-world{background:#061433 url('ui/mundo_digital_solo_escenario.jpg') center/cover no-repeat!important;filter:blur(4px) brightness(.5) saturate(1.1)!important;transform:scale(1.06)}
.pl4 .pl5-hero,.pl4 .pl4-stat,.pl4 .pl5-panel{background:var(--ui-panel)!important;border:2px solid var(--ui-line)!important;border-radius:var(--ui-radius)!important;box-shadow:inset 0 2px #b5ffff55,0 5px 0 #03163d!important}
.pl4 .pl4-stat{background:var(--ui-card)!important;border-color:var(--ui-card-line)!important;box-shadow:inset 0 1px #b5ffff33!important}
.pl4 .pl4-banner b{font-family:'Orbitron',system-ui,sans-serif!important;text-transform:uppercase;letter-spacing:1px;color:#fff!important}
.pl4 .pl4-banner small,.pl4 .pl4-stat small,.pl4 .pl5-panel h3 small,.pl4 .pl5-rn small,.pl4 .pl4-ach small,.pl4 .pl4-empty{color:var(--ui-muted)!important}
.pl4 .pl4-title-badge{background:var(--ui-gold)!important;color:#2a1a00!important}
.pl4 .pl4-chips span,.pl4 .pl4-chips span:first-child{background:#06234b!important;color:var(--ui-text)!important}
.pl4 .pl4-chips span:last-child{background:#147fbf!important}
.pl4 .pl4-stat i,.pl4 .pl5-medal.ok i{color:var(--ui-line)}
.pl4 .pl4-ach u,.pl4 .pl5-acc.win{background:var(--ui-gold)!important}
.pl4 .pl4-ach i{background:#06234b!important}
.pl4 .pl5-rec,.pl4 .pl5-right .pl4-ach{border-bottom:1px solid #ffffff1f!important}
.pl4 .pl5-medal b,.pl4 .pl5-rv,.pl4 .pl5-rt{color:var(--ui-muted)!important}
.pl4 .pl5-medal.ok b{color:var(--ui-gold)!important}
.pl4 .g-back,.pl4 .pl4-chg,.pl4 .pl5-share{background:#06102b!important;border:2px solid #3de0ff!important;border-radius:0!important;color:#dff8ff!important;font:12px 'Orbitron',system-ui,sans-serif!important;letter-spacing:1px!important;padding:7px 12px!important}
.pl4 .pl4-chg:hover,.pl4 .g-back:hover{border-color:var(--ui-gold)!important}
.pl4 .pl4-wrap{padding:28px 32px!important}
.pl4 .pl4-top{margin-bottom:20px!important}
/* Títulos de cabecera alineados igual en todas las pantallas */
#overlay .help-box .set-head h2{text-align:left}
/* Botones de ajustes en una sola línea */
.settings .set-row :is(button,.mini-btn){white-space:nowrap}
/* Inicio de sesión: separador suave en lugar de la línea naranja */
.dvl-scene{border-right:0}
.dvl-scene::after{content:'';position:absolute;right:0;top:12%;bottom:12%;width:2px;background:linear-gradient(180deg,transparent,#3de0ff88,transparent)}
/* Subida de nivel en móvil: las cartas no quedan bajo el temporizador ni sobre la barra Bonk */
@media (max-width:760px){#overlay:not(.menu-mode):has(>.lv3){--ui-top:104px;--ui-bot:16px;padding-top:var(--ui-top)}body:has(#overlay:not(.hidden)>.lv3) :is(#bonkBar,#xpTxt){visibility:hidden}}

/* Encargos y logros (ventanas del menú) */
.enc-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.enc-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(19,41,77,.65);border:1px solid #2c4a78;font-size:14px;line-height:1.35}
.enc-row b{font-size:18px;text-align:center}
.enc-row span{text-align:left}
.ach-prog{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-style:normal}
.enc-row small{color:#b9f6ca;font-weight:700;white-space:nowrap}
.enc-row.done{border-color:#7cf29c;opacity:.85}
.enc-row.done span{text-decoration:line-through}
.enc-row.done span strong{text-decoration:none}
.enc-note{font-size:12px;color:#9fb3d1;margin:6px 0 0}
.ach-bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:#22385e;overflow:hidden;vertical-align:middle}
.ach-bar u{display:block;height:100%;background:#ffd54f}
.ach-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#cdd5e6;margin-bottom:6px}

/* Digimon de apoyo (selector) */
.sup-pick h3{margin:0 0 6px}
.sup-row{display:flex;flex-wrap:wrap;gap:6px}
.sup-btn{padding:5px 10px;border-radius:999px;border:1px solid #2c4a78;background:#0e1f3d;color:#cdd5e6;font:600 12px system-ui,sans-serif;cursor:pointer}
.sup-btn.on{background:#ffd54f;color:#1b1300;border-color:#ffd54f}
.sup-note{margin:6px 0 0;font-size:11px;color:#9fb3d1}

/* ===================== HUD en partida · estilo Material (superficies, elevación, color por función) ===================== */
:root{--h-surf:rgba(14,18,30,.74);--h-surf2:rgba(255,255,255,.07);--h-line:rgba(255,255,255,.10);--h-txt:#eef3ff;--h-mut:#a9b6d3;
  --h-hp:#4cd97b;--h-hp2:#22b35a;--h-low:#ff5d6c;--h-xp:#6aa8ff;--h-xp2:#3d7bff;--h-bonk:#ffb547;--h-bonk2:#ff7a1a;
  --h-elev:0 10px 28px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.28);--h-font:'Roboto','Inter',system-ui,-apple-system,sans-serif}
#hud{left:16px;top:18px}
.hud-card{gap:12px;padding:10px 16px 10px 10px;border-radius:24px;background:var(--h-surf)!important;border:1px solid var(--h-line)!important;
  box-shadow:var(--h-elev)!important;backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3)}
.hud-portrait:not([class*="fr-"]){width:62px;height:62px;border-radius:50%!important;background:radial-gradient(circle at 50% 35%,#2b3b66,#121a30)!important;
  border:0!important;box-shadow:0 0 0 3px var(--h-xp),0 0 0 6px rgba(106,168,255,.18)!important}
.hud-lvl{right:-6px!important;bottom:-6px!important;min-width:28px!important;height:28px!important;border-radius:14px!important;background:var(--h-xp)!important;
  color:#06122e!important;border:3px solid #0e1220!important;font:900 13px var(--h-font)!important;box-shadow:none!important}
.hud-main{min-width:240px}
.hud-name{font:800 16px var(--h-font)!important;color:var(--h-txt)!important;text-shadow:none!important;letter-spacing:.2px!important}
.hud-title{font:500 11px var(--h-font)!important;color:var(--h-mut)!important;text-shadow:none!important}
.hud-hp{width:240px!important;height:16px!important;margin-top:7px!important;border-radius:8px!important;background:rgba(0,0,0,.38)!important;border:0!important;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.hud-hp #hp{border-radius:8px;background:linear-gradient(180deg,var(--h-hp),var(--h-hp2))!important;box-shadow:0 0 10px rgba(76,217,123,.45)!important}
.hud-hp.low #hp{background:linear-gradient(180deg,#ff7b86,var(--h-low))!important;box-shadow:0 0 12px rgba(255,93,108,.6)!important;animation:hpLow .9s ease-in-out infinite alternate}
@keyframes hpLow{to{filter:brightness(1.35)}}
.hud-hp #hpTxt{font:800 11px var(--h-font)!important;letter-spacing:.3px;color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.6)!important}
.hud-chips{gap:6px!important;margin-top:8px!important}
.hud-chips .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px!important;border-radius:10px!important;background:var(--h-surf2)!important;
  border:0!important;color:var(--h-txt)!important;font:700 12px var(--h-font)!important;box-shadow:none!important}
.hud-chips .chip svg,#hudChips svg{width:14px;height:14px;fill:currentColor;flex:none}
.hic{width:16px;height:16px;image-rendering:pixelated;flex:none;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
#hudDash{color:var(--h-mut)!important}
#hudDash.ready{background:rgba(106,168,255,.20)!important;color:#cfe0ff!important}
/* Barra de experiencia: a todo lo ancho, arriba */
#xp{top:0!important;bottom:auto!important;height:6px!important;border-radius:0 4px 4px 0;background:linear-gradient(90deg,var(--h-xp2),var(--h-xp))!important;
  box-shadow:0 0 10px rgba(106,168,255,.8)!important;z-index:7;transition:width .25s ease-out}
#xpTrack{position:fixed;left:0;right:0;top:0;height:6px;background:rgba(0,0,0,.35);pointer-events:none;z-index:6}
#xpTxt{left:20px!important;top:112px!important;bottom:auto!important;padding:3px 10px;border-radius:10px;background:var(--h-surf);color:var(--h-mut)!important;
  font:700 11px var(--h-font)!important;text-shadow:none!important;box-shadow:var(--h-elev)}
#xpTxt:empty{display:none}
/* Reloj y contadores: una píldora central */
#hudTop{top:16px!important;padding:8px 18px 9px!important;min-width:260px!important;gap:5px!important;border-radius:22px!important;background:var(--h-surf)!important;
  border:1px solid var(--h-line)!important;box-shadow:var(--h-elev)!important;backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3)}
#hudTop #timer{font:900 30px/1.05 var(--h-font)!important;letter-spacing:1px;color:#fff!important;background:none!important;border:0!important;box-shadow:none!important;
  text-shadow:none!important;font-variant-numeric:tabular-nums}
#hudTop #timer.urgent{color:var(--h-low)!important;animation:timerPulse .8s ease-in-out infinite!important}
#hudZone{font:700 10px var(--h-font)!important;letter-spacing:1.6px!important;color:var(--h-mut)!important}
#hudChips span{display:inline-flex;align-items:center;gap:5px;padding:3px 10px!important;border-radius:10px!important;background:var(--h-surf2)!important;border:0!important;
  font:700 12px var(--h-font)!important;color:var(--h-txt)!important}
#hudChips b{color:var(--h-txt)!important}
#hudChips .c-tix{color:#7fd8ff}#hudChips .c-shr{color:#c8a6ff}
#zoneName{display:none}
/* Minimapa */
#minimap{top:18px!important;right:18px!important;border:0!important;box-shadow:0 0 0 3px rgba(255,255,255,.14),var(--h-elev)!important}
/* Bonk: botón circular que se llena */
#bonkBar{left:auto!important;right:28px!important;bottom:28px!important;transform:none!important;width:96px!important;height:96px!important;border-radius:50%!important;
  border:0!important;overflow:visible!important;background:conic-gradient(var(--h-bonk) calc(var(--p,0)*1%),rgba(255,255,255,.10) 0)!important;
  box-shadow:var(--h-elev)!important;transition:transform .2s}
#bonkBar::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2a2f45,#12162a);box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
#bonkFill{display:none!important}
#bonkTxt{flex-direction:column;gap:1px;font:900 15px var(--h-font)!important;letter-spacing:1px!important;color:var(--h-bonk)!important;text-shadow:none!important;z-index:1}
#bonkTxt small{font:800 12px var(--h-font);color:var(--h-txt);letter-spacing:.5px}
#bonkBar.ready{background:conic-gradient(var(--h-bonk),var(--h-bonk2),var(--h-bonk))!important;animation:bonkFab 1s ease-in-out infinite;box-shadow:0 0 0 6px rgba(255,181,71,.25),0 0 30px rgba(255,140,30,.7)!important}
#bonkBar.ready::before{background:radial-gradient(circle at 50% 30%,#ffcf73,#ff8a1f)}
#bonkBar.ready #bonkTxt{color:#2a1200!important}#bonkBar.ready #bonkTxt small{color:#2a1200}
@keyframes bonkFab{50%{transform:scale(1.06)}}
/* Habilidades: fichas redondeadas abajo a la izquierda */
#skillBar{left:20px!important;bottom:24px!important;gap:8px!important}
.sb-i{width:48px!important;height:48px!important;border-radius:16px!important;border:0!important;background:var(--h-surf)!important;box-shadow:var(--h-elev),inset 0 0 0 2px currentColor!important;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sb-i{--c:var(--dv-cyan)}.sb-i.ofensiva{--c:var(--dv-org)}.sb-i.utilidad{--c:#5ee08a}
.sb-i em{right:-5px!important;bottom:-5px!important;min-width:20px!important;height:20px!important;line-height:20px!important;border-radius:10px;font:900 11px var(--h-font)!important;
  background:var(--c)!important;color:#0e1220!important;box-shadow:0 0 0 2px #0e1220}
#hudKillsChip{display:none!important}
.hud-lvl{min-width:24px!important;height:24px!important;right:-8px!important;bottom:-8px!important;font-size:12px!important}
/* Avisos de evento y combo */
#evHud{top:124px!important;border-radius:16px!important;border:0!important;background:var(--h-surf)!important;box-shadow:var(--h-elev),inset 0 0 0 1px rgba(124,242,156,.5)!important;
  color:var(--h-txt)!important;font:700 13px var(--h-font)!important;padding:8px 16px!important;backdrop-filter:blur(12px)}
#combo{border-radius:16px!important;font-family:var(--h-font)!important;box-shadow:var(--h-elev)!important}
#bossbar{top:118px!important;height:14px!important;border-radius:8px;border:0!important;background:rgba(0,0,0,.45)!important;overflow:visible;box-shadow:var(--h-elev)!important}
#bosshp{border-radius:8px;background:linear-gradient(90deg,#b05cff,#e48bff)!important}
#bossbar::before{top:-18px!important;font:800 11px var(--h-font)!important;letter-spacing:2px!important;color:#e7c6ff!important}
#bossbar::before{content:attr(data-label)!important}
#bossbar{top:162px!important}


/* Gacha: animación del Digihuevo (partículas PNG con máscara; el color sale de --pc) */
.ga{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--pc) 26%,#0a1030) 0%,#050816 62%,#000 100%);transition:background .4s}
.ga i,.ga-rays,.ga-sigil,.ga-glow,.ga-wave,.ga-bolt{pointer-events:none}
.ga-rain{position:absolute;inset:0;opacity:.7}
.ga-rain i{position:absolute;top:-40px;width:var(--s);height:var(--s);background:var(--pc);-webkit-mask:url(ui/gacha/star_04.png) center/contain no-repeat;mask:url(ui/gacha/star_04.png) center/contain no-repeat;animation:gaRain linear infinite}
@keyframes gaRain{to{transform:translateY(110vh)}}
.ga-rays{position:absolute;width:170vmax;height:170vmax;opacity:0;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--pc) 34%,transparent) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);animation:gaSpin 9s linear infinite;transition:opacity .5s}
.ga.hot .ga-rays,.ga.legend .ga-rays{opacity:1}.ga.legend .ga-rays{animation-duration:3.5s}
@keyframes gaSpin{to{transform:rotate(360deg)}}
.ga-sigil{position:absolute;width:min(70vmin,520px);height:min(70vmin,520px);background:var(--pc);-webkit-mask:url(ui/gacha/magic_03.png) center/contain no-repeat;mask:url(ui/gacha/magic_03.png) center/contain no-repeat;opacity:.55;animation:gaSpin 14s linear infinite reverse}
.ga-glow{position:absolute;width:min(56vmin,420px);height:min(56vmin,420px);background:var(--pc);-webkit-mask:url(ui/gacha/circle_05.png) center/contain no-repeat;mask:url(ui/gacha/circle_05.png) center/contain no-repeat;opacity:.55;animation:gaPulse 1.2s ease-in-out infinite}
.ga.hot .ga-glow{opacity:.85}.ga.legend .ga-glow{opacity:1;animation-duration:.5s}
@keyframes gaPulse{50%{transform:scale(1.12)}}
.ga-egg{position:relative;z-index:2;width:min(30vmin,216px);aspect-ratio:48/60;animation:gaDrop .75s cubic-bezier(.3,1.5,.5,1) both}
.ga-egg img{width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 0 18px var(--pc)) drop-shadow(0 10px 0 #0006)}
.ga-egg.wob{animation:gaWob .55s ease-in-out}
.ga.legend .ga-egg{animation:gaShake .09s linear infinite}
@keyframes gaDrop{from{transform:translateY(-75vh) scale(.6)}to{transform:none}}
@keyframes gaWob{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg) translateY(-6px)}70%{transform:rotate(-6deg)}100%{transform:none}}
@keyframes gaShake{25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}
.ga-bolt{position:absolute;z-index:1;width:min(40vmin,300px);height:min(60vmin,440px);background:#fff8c8;-webkit-mask:url(ui/gacha/spark_05.png) center/contain no-repeat;mask:url(ui/gacha/spark_05.png) center/contain no-repeat;opacity:0}
.ga-bolt.b1{left:calc(50% - min(34vmin,250px))}.ga-bolt.b2{right:calc(50% - min(34vmin,250px));transform:scaleX(-1)}
.ga.legend .ga-bolt{animation:gaBolt .35s steps(2) infinite}
@keyframes gaBolt{0%{opacity:0}50%{opacity:1}}
.ga-wave{position:absolute;z-index:3;width:120px;height:120px;background:var(--pc);-webkit-mask:url(ui/gacha/light_02.png) center/contain no-repeat;mask:url(ui/gacha/light_02.png) center/contain no-repeat;opacity:0}
.ga-sparks{position:absolute;left:50%;top:50%;z-index:3}
.ga-sparks i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);background:var(--pc);-webkit-mask:url(ui/gacha/star_06.png) center/contain no-repeat;mask:url(ui/gacha/star_06.png) center/contain no-repeat;opacity:0}
.ga-flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0}
.ga.burst .ga-egg{animation:gaPop .45s ease-in forwards}
.ga.burst .ga-wave{animation:gaWave .8s ease-out forwards}
.ga.burst .ga-sparks i{animation:gaSpark .9s cubic-bezier(.1,.8,.3,1) forwards}
.ga.burst .ga-flash{animation:gaFlash .7s ease-out forwards}
@keyframes gaPop{40%{transform:scale(1.25)}100%{transform:scale(1.6);opacity:0;filter:brightness(4)}}
@keyframes gaWave{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(9)}}
@keyframes gaSpark{0%{opacity:1;transform:translate(0,0) scale(.4)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(160deg)}}
@keyframes gaFlash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
.ga-txt{position:absolute;z-index:5;bottom:15vh;left:0;right:0;margin:0;text-align:center;font:900 clamp(20px,3.4vw,36px) 'Orbitron',system-ui,sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 0 16px var(--pc),0 3px 0 #000}
.ga.legend .ga-txt{color:#ffe27a;animation:gaPulse .5s infinite}
.ga-n{position:absolute;z-index:5;bottom:10vh;left:0;right:0;margin:0;text-align:center;font:700 13px system-ui;color:#b9c9ea;opacity:.85}
.ga .pa-skip{position:absolute;z-index:6;right:24px;bottom:24px}
body:has(.ga) #topbar{display:none!important}
/* Elección de mapa y dificultad */
.ms{width:min(1120px,96vw);max-height:94vh;overflow:auto;padding:16px 20px;color:#e6f4ff;text-align:left}
.ms-maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
.ms-card{appearance:none;cursor:pointer;display:flex;flex-direction:column;padding:0;border-radius:16px;overflow:hidden;border:3px solid #2d5f9c;background:#0a1d44;color:#fff;font:inherit;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.ms-card:hover{transform:translateY(-3px)}
.ms-card.on{border-color:#7ff3ff;box-shadow:0 0 0 3px #7ff3ff55,0 0 26px #3de0ff88}
.ms-art{position:relative;height:150px;background:var(--floor) 0 0/48px 48px repeat;image-rendering:pixelated;overflow:hidden}
.ms-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0a1d44)}
.ms-art em{position:absolute;left:10px;top:8px;z-index:2;padding:2px 9px;border-radius:99px;background:#0a1d44d9;border:1px solid #7ff3ff;font:900 11px system-ui;letter-spacing:2px;font-style:normal}
.ms-deco{position:absolute;bottom:10px;width:64px;height:64px;image-rendering:pixelated;z-index:1}.ms-deco.d1{left:14px}.ms-deco.d2{left:70px;bottom:26px;width:48px;height:48px;opacity:.9}
.ms-boss{position:absolute;right:8px;bottom:0;height:136px;max-width:60%;object-fit:contain;image-rendering:pixelated;z-index:1;filter:drop-shadow(0 4px 6px #000a)}
.ms-txt{display:flex;flex-direction:column;gap:4px;padding:10px 14px 14px}
.ms-txt b{font:900 italic 20px system-ui;text-shadow:0 2px 0 #020f30}.ms-txt small{color:#9fdcff;font-weight:700;font-size:12px}
.ms-txt p{margin:2px 0;font-size:12.5px;line-height:1.35;color:#d9ecff;min-height:50px}
.ms-tags{display:flex;flex-wrap:wrap;gap:5px}.ms-tags i{font-style:normal;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff30}
.ms-rec{font-size:11.5px;color:#ffe9a0;margin-top:4px}
.ms-dsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-top:14px;align-items:stretch}
.ms-diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ms-diff{appearance:none;cursor:pointer;border-radius:12px;border:2px solid color-mix(in srgb,var(--dc) 55%,transparent);background:#0a1d44;color:#fff;padding:10px;font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px}
.ms-diff b{font:900 16px system-ui;color:var(--dc)}.ms-diff small{font-size:11px;opacity:.85}
.ms-diff.on{background:color-mix(in srgb,var(--dc) 22%,#0a1d44);border-color:var(--dc);box-shadow:0 0 16px color-mix(in srgb,var(--dc) 50%,transparent)}
.ms-table{border-radius:12px;padding:10px 14px;background:#06143a;border:2px solid var(--dc)}
.ms-table>b{font:900 17px system-ui;color:var(--dc);margin-right:8px}.ms-table>span{font-size:13px}
.ms-table ul{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ms-table li{font-size:12px;background:#ffffff0d;border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between;gap:6px}.ms-table li em{font-style:normal;font-weight:900;color:var(--dc)}
.ms-table small{font-size:11px;color:#9fb8d8;line-height:1.35;display:block}
@media (max-width:760px){.ms{padding:10px}.ms-maps{grid-template-columns:1fr;gap:10px}.ms-art{height:110px}.ms-boss{height:104px}.ms-txt p{min-height:0}.ms-dsec{grid-template-columns:1fr}.ms-table ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
