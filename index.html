<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digibonk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;left:16px;top:16px;pointer-events:none}
.hud-card{display:flex;gap:14px;align-items:center;padding:10px 14px 10px 10px;border-radius:16px;
  background:linear-gradient(160deg,rgba(24,62,110,.94),rgba(8,18,40,.95));border:2px solid #7fd0ff}
.hud-portrait{position:relative;width:66px;height:66px;border-radius:14px;display:grid;place-items:center;
  border:2px solid #7fd0ff;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.05))}
#pimg{width:54px;height:54px;image-rendering:pixelated}
.hud-lvl{position:absolute;right:-9px;bottom:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;
  background:#ffd54f;color:#1a1200;font-weight:900;font-size:13px;border:2px solid #1a1200}
.hud-main{min-width:250px}
.hud-name{font-weight:900;font-size:17px;letter-spacing:.5px;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.1}
.hud-hp{position:relative;width:250px;height:18px;margin-top:6px;border-radius:9px;background:#06141a;border:1px solid #3b78b0;overflow:hidden}
#hp{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#3fb950,#a6e35a);transition:width .15s}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px 2px #000}
.hud-chips{display:flex;gap:6px;margin-top:7px}
.chip{font-size:12px;padding:2px 9px;border-radius:9px;background:rgba(8,18,40,.85);border:1px solid #2d5f78;color:#cfe8ff;white-space:nowrap}
.chip b{color:#fff}
.chip.ready{border-color:#7cf29c;color:#7cf29c;box-shadow:0 0 8px rgba(124,242,156,.5)}
#timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:4px 18px;border-radius:10px;
  background:#0b1120;border:2px solid #ffd54f;box-shadow:0 0 14px rgba(255,213,79,.35);
  font-family:'Consolas',monospace;font-size:26px;font-weight:bold;color:#ffd54f;pointer-events:none}
#xp{position:fixed;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,#0288d1,#4fc3f7);pointer-events:none}
#xpTxt{position:fixed;left:16px;bottom:14px;font-size:12px;font-weight:bold;letter-spacing:.5px;color:#cfe8ff;text-shadow:0 1px 3px #000;pointer-events:none}
#hudTop{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px 8px;min-width:300px;border-radius:14px;background:linear-gradient(180deg,rgba(26,46,92,.96),rgba(8,14,30,.96));border:2px solid #4fc3f7;box-shadow:0 0 18px rgba(79,195,247,.35),inset 0 2px 0 rgba(255,255,255,.12);pointer-events:none;z-index:6}
#hudTop #timer{position:static;transform:none;animation:none;padding:0 14px;border-radius:8px;font-size:24px;line-height:1.2}
#hudTop #timer.urgent{animation:none}
#hudZone{font:800 11px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#9fe3ff;white-space:nowrap}
#hudChips{display:flex;gap:6px;white-space:nowrap}
#hudChips span{padding:2px 10px;border-radius:9px;background:rgba(8,14,30,.85);border:1px solid #2d5f78;color:#fff;font:700 12px system-ui,sans-serif}
#hudChips b{color:#ffd54f}
#timer.urgent{color:#ff5252;border-color:#ff5252;box-shadow:0 0 18px rgba(255,82,82,.6);animation:timerPulse .8s ease-in-out infinite}
@keyframes timerPulse{50%{transform:translateX(-50%) scale(1.06)}}
#combo{position:fixed;right:24px;top:200px;padding:4px 14px;border-radius:10px;background:#ffd54f;color:#1a1200;
  font-weight:900;font-size:28px;box-shadow:0 0 14px rgba(255,213,79,.6);pointer-events:none}
#combo:empty{display:none}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#banner b{display:block;font-size:46px;letter-spacing:3px;color:inherit;text-shadow:0 4px 0 #000,0 0 24px currentColor}
#banner small{display:block;margin-top:4px;font-size:15px;letter-spacing:1px;color:#e6f4ff;text-shadow:0 2px 4px #000}
#banner.show{animation:bannerIn 2.4s ease both}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.98)}}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(198,40,40,.9) 100%)}
#prompt{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:none;padding:5px 12px;border-radius:10px;
  background:rgba(8,14,30,.92);border:2px solid #ffd54f;color:#ffd54f;font-weight:bold;font-size:14px;letter-spacing:.5px;
  pointer-events:none;white-space:nowrap;box-shadow:0 0 12px rgba(255,213,79,.4)}
#prompt kbd{display:inline-block;min-width:20px;padding:0 6px;margin-right:4px;border-radius:5px;background:#ffd54f;color:#1a1200;text-align:center}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,16,34,.75),rgba(0,0,0,.9));text-align:center}
#overlay.hidden{display:none}
#overlay.menu-mode{display:block}
#overlay.menu-mode.hidden{display:none}
.logo{font-size:60px;font-weight:900;letter-spacing:2px;line-height:1;color:#fff;text-align:left}
.logo span{color:#ffd54f}
.logo em{font-style:normal;color:#4fc3f7;font-size:36px}
.sub{margin:8px 0 24px;color:#90caf9;font-size:15px;letter-spacing:1px;text-align:left}
.play{font-weight:900;cursor:pointer}
.play:hover{transform:translateY(-2px)}
.tiles{display:flex;gap:14px}
.muted{opacity:.7;font-size:13px}
.legal{font-size:11px;opacity:.55;margin:0;text-align:left}
#overlay h1{margin:0 0 6px;font-size:44px;letter-spacing:2px;color:#4fc3f7;text-shadow:0 0 18px rgba(79,195,247,.6)}
.card{padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;
  background:linear-gradient(160deg,#1e2a44,#0e1528);border:2px solid #4fc3f7;box-shadow:0 0 12px rgba(79,195,247,.25)}
.card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 22px rgba(79,195,247,.6)}
.card img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.card small{display:block;opacity:.8;margin-top:6px;font-size:13px}
.tiles{margin-top:18px}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border-radius:5px;background:#16213a;border:1px solid #4fc3f7;
  border-bottom-width:3px;font-size:12px;font-weight:bold;text-align:center;color:#e3f2fd}
.card{width:230px;text-align:left;position:relative;border-top-width:6px}
.card.ofensiva{border-color:#ef5350;border-top-color:#ef5350}
.card.defensiva{border-color:#66bb6a;border-top-color:#66bb6a}
.card.utilidad{border-color:#ab47bc;border-top-color:#ab47bc}
.card .tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:8px;margin-bottom:6px;color:#0b0f1a;font-weight:bold}
.card.ofensiva .tag{background:#ef5350}
.card.defensiva .tag{background:#66bb6a}
.card.utilidad .tag{background:#ab47bc;color:#fff}
.card b{display:block;font-size:17px;padding-right:24px;text-align:left;color:#ffd54f}
.card p{margin:8px 0 0;font-size:13px;line-height:1.35;color:#dbe9ff;text-align:left}
#overlay h2{margin:0;font-size:24px;color:#ffd54f;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(ellipse at center,rgba(10,20,44,.45),rgba(3,6,14,.86));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20}
#pause.hidden{display:none}
.pz-device{position:relative;width:min(540px,94vw);max-height:96vh;overflow:hidden;padding:30px 36px 20px;
  border-radius:44% 44% 36% 36% / 14% 14% 10% 10%;color:#e6f4ff;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.4),transparent 35%),linear-gradient(160deg,#7fcaf3,#3d8fd1 32%,#1f5fa2 64%,#143f74);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -12px 22px rgba(0,20,50,.55),0 0 0 3px #0b1d3a,0 26px 60px rgba(0,0,0,.75)}
.pz-brand{text-align:center;font-weight:900;letter-spacing:6px;font-size:12px;color:#0d2a52;margin:-14px 0 6px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pz-bezel{background:linear-gradient(180deg,#0d2238,#071526);border-radius:26px;padding:12px;box-shadow:inset 0 3px 10px rgba(0,0,0,.8)}
.pz-lcd{position:relative;border-radius:18px;padding:14px 16px;background:radial-gradient(ellipse at 50% 0%,#2b4b52,#16292e 50%,#0a1518);box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.pz-title{width:max-content;margin:0 auto 4px;padding:4px 16px;border-radius:10px;font-weight:900;letter-spacing:2px;font-size:12px;color:#fff;
  background:linear-gradient(180deg,#3a94e0,#1d5ea8);border:1px solid #7fd0ff;text-shadow:0 1px 0 #0d2a52}
.pz-zone{text-align:center;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#bfe9d8}
.pz-st{color:#7cf29c}
.pz-close{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:2px solid #9fe3ff;background:#0a2a4d;color:#fff;cursor:pointer;font-size:13px}
.pz-close:hover{background:#15527f}
.pz-profile{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin-top:10px}
.pz-av{width:92px;height:92px;border-radius:14px;border:2px solid #7fd0ff;display:grid;place-items:center;background:radial-gradient(circle,rgba(127,208,255,.35),rgba(127,208,255,.04))}
.pz-av img{width:74px;height:74px;object-fit:contain;image-rendering:pixelated}
.pz-av .pz-anim{width:84px;height:84px;background-size:500% 100%;background-position:0 50%}
.pz-name{font-size:26px;font-weight:900;color:#ffd54f;text-shadow:0 2px 0 #7a4b00;line-height:1.05}
.pz-quote{font-size:12px;font-style:italic;color:#bfe9ff;margin:2px 0 6px}
.pz-lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#bfe9ff;text-transform:uppercase;margin:5px 0 2px}
.pz-bar{height:13px;border-radius:7px;background:#06141a;border:1px solid #3b78b0;overflow:hidden;position:relative}
.pz-bar i{position:absolute;top:0;bottom:0;left:0;display:block;background:linear-gradient(90deg,#3fb950,#a6e35a)}
.pz-bar.evo i{background:linear-gradient(90deg,#8e24aa,#ffd54f)}
.pz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.pz-stats div{text-align:center;padding:6px 2px;border-radius:10px;background:rgba(8,26,34,.8);border:1px solid #2d5f78}
.pz-stats small{display:block;font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:#9ad3e8;line-height:1.2;min-height:20px}
.pz-stats b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.pz-btns{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:8px}
.pz-btn{padding:10px 6px;border-radius:12px;border:1px solid #7fd0ff;cursor:pointer;font:900 12px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;line-height:1.15;
  background:linear-gradient(180deg,#1e3a66,#0e1f3d);box-shadow:0 4px 0 #050b18}
.pz-btn small{display:block;font-size:9px;letter-spacing:.6px;font-weight:700;opacity:.85}
.pz-btn:hover{filter:brightness(1.12)}
.pz-btn:active{transform:translateY(2px)}
.pz-primary{background:linear-gradient(180deg,#7ef07e,#2fa84a 60%,#1c7a33);border-color:#bdf9c6;box-shadow:0 4px 0 #0f4a20}
.pz-danger{background:linear-gradient(180deg,#ff7a6b,#c62828 60%,#8e1b1b);border-color:#ffb3a8;box-shadow:0 4px 0 #4a0b0b}
.pz-confirm{text-align:center;padding:6px 0}
.pz-warn{font-size:17px;font-weight:bold;color:#ef9a9a;letter-spacing:.5px}
.pz-confirm p{margin:4px 0 12px;font-size:13px;color:#cfe8ff}
.pz-confirm .pz-btns{grid-template-columns:1fr 1fr}
.pz-keys{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:12px;font-size:11px;color:#cfe8ff}
.pz-keys span{white-space:nowrap}
.pz-keys .kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#f4f7fb,#b8c4d6);color:#1a2236;font:bold 10px ui-monospace,Menlo,monospace;border:1px solid #fff;box-shadow:0 2px 0 #55607a;text-align:center}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(10,20,40,.45) 100%)}
#minimap{position:fixed;right:16px;top:16px;width:170px;height:170px;border-radius:50%;border:3px solid #4fc3f7;
  box-shadow:0 0 14px rgba(79,195,247,.4);pointer-events:none;background:#16321f}
#mapview{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(4,8,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:15;cursor:pointer}
#mapview.open{display:flex}
#bigmap{width:min(72vh,600px);height:min(72vh,600px);border-radius:50%;border:3px solid #4fc3f7;box-shadow:0 0 30px rgba(79,195,247,.4)}
.mapleg{font-size:13px;color:#cfe8ff;text-align:center;background:rgba(6,14,26,.85);padding:6px 14px;border-radius:10px;border:1px solid #2d5f78}
.mini-btn{padding:9px 16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #050b18}
.mini-btn:hover{filter:brightness(1.15)}
.gacha{width:min(880px,96vw);max-height:92vh;overflow:auto;padding:18px 22px;color:#e6f4ff;text-align:left}
.g-back{padding:7px 12px;cursor:pointer}
.g-btn{margin:10px 0 6px;padding:12px 28px;cursor:pointer;font-weight:900;letter-spacing:2px}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.picker-screen{width:min(1000px,96vw);height:min(640px,92vh);display:flex;flex-direction:column;gap:12px;padding:16px 18px;color:#e6f4ff;text-align:left}
.pk-head{display:flex;align-items:center;gap:14px}
.pk-head h2{margin:0;flex:1;font-size:24px}
.pk-tab{padding:8px 16px;font-weight:bold;cursor:pointer}
.pk-start{cursor:pointer;font-weight:900;letter-spacing:1.5px}
.pk-hint{font-size:12px;color:#9fd4ff}
.play{background:linear-gradient(180deg,#ff5a5a,#ff3b3b);color:#fff;border:4px solid #fff;
  box-shadow:0 9px 0 #7a1010,0 0 0 4px #2a0c0c;text-shadow:0 3px 0 #7a1010;font-size:32px;padding:18px 70px;border-radius:18px;letter-spacing:4px}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #7a1010,0 0 0 4px #2a0c0c}
.logo{text-shadow:0 5px 0 #1d4fa0,0 0 26px rgba(79,195,247,.7)}
.pk-tab{border-width:2px}
.pk-start{font-size:20px;padding:14px 40px}
.settings{width:min(640px,94vw);padding:18px 22px;border-radius:22px;background:rgba(10,18,40,.95);border:3px solid #3a6fc4;color:#e6f4ff;text-align:left;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.set-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#overlay .set-head h2{margin:0;flex:1;font-size:24px;color:#ffd54f}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid #1e2a44}
.set-row b{display:block;font-size:16px;color:#fff}
.set-row small{font-size:12px;color:#9fd4ff}
.set-seg-wrap{display:flex;gap:6px}
.set-seg{padding:8px 14px;border-radius:12px;border:2px solid #3a6fc4;background:rgba(8,20,40,.9);color:#cfe8ff;font-weight:bold;cursor:pointer}
.set-seg.on{background:linear-gradient(180deg,#ffe082,#ffc94d);color:#1a1200;border-color:#ffd54f}
.set-toggle{padding:9px 16px;border-radius:12px;border:2px solid #7a7a7a;background:#2a2f3a;color:#bbb;font-weight:bold;cursor:pointer;min-width:130px}
.set-toggle.on{border-color:#7cf29c;background:linear-gradient(180deg,#3fb950,#2e9a3e);color:#fff}
.rw-frame{width:44px;height:44px;margin:0 auto 4px;background:#1a2440}
.rw-title{font-size:30px;line-height:44px;height:44px}
.rw-item{font-size:32px;line-height:44px;height:44px}
.hud-title{font-size:11px;color:#bfe9ff;letter-spacing:.5px;margin-top:2px;text-shadow:0 1px 2px #000}
.help-box{width:min(640px,94vw);padding:18px 22px;color:#e6f4ff}
.tuto-screen{text-align:center;margin-top:10px}
.tuto-video{display:block;margin:0 auto;width:100%;max-width:480px;height:auto;aspect-ratio:16/9;border-radius:12px;border:2px solid #3a6fc4;background:#000;object-fit:cover}
.tuto-screen h3{margin:10px 0 4px;color:#ffd54f;font-size:18px}
.tuto-screen p{margin:0 auto;max-width:460px;font-size:14px;min-height:40px}
.tuto-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.tuto-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tuto-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2a4a7a;cursor:pointer}
.tuto-dot.on{background:#ffd54f}
.hud-portrait.mini{width:44px;height:44px;border-radius:12px}
.hud-portrait.mini img{width:34px;height:34px}
#menubg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;display:block}
#overlay{z-index:1}
.hud-portrait[class*="fr-"]::after,.rw-frame[class*="fr-"]::after{content:"";position:absolute;right:-6px;top:-6px;width:10px;height:10px;border-radius:50%;background:#7cf29c;box-shadow:0 0 8px #7cf29c;border:2px solid #0a1428}
.rw-frame{position:relative;border-radius:14px}
.sc-box{width:min(680px,94vw)}
.sc-p{font-family:system-ui,sans-serif;font-size:13px;color:#9fd4ff;margin:8px 0}
.sc-box textarea{width:100%;height:92px;padding:10px;border-radius:12px;border:2px solid #3a6fc4;background:#0a1428;color:#cfe8ff;font:12px ui-monospace,Menlo,monospace;resize:vertical;box-sizing:border-box}
.sc-row{display:flex;justify-content:flex-end;margin:8px 0 6px}
.sc-row .mini-btn.armed{background:linear-gradient(180deg,#ff7a6b,#e0463a);color:#fff}
#menuart{position:fixed;inset:0;z-index:0;overflow:hidden}
#menuart .stars{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 37% 9%,#cfe9ff,transparent),
    radial-gradient(2px 2px at 63% 22%,#fff,transparent),radial-gradient(1px 1px at 82% 14%,#ffe0ff,transparent),
    radial-gradient(1.5px 1.5px at 91% 34%,#fff,transparent),radial-gradient(1px 1px at 25% 42%,#cfe9ff,transparent);
  animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.45}100%{opacity:1}}
.pf-av{width:150px;height:150px;flex:0 0 auto;display:grid;place-items:center;border-radius:20px;border:3px solid #3a6fc4;background:radial-gradient(circle,rgba(127,208,255,.3),rgba(127,208,255,.04))}
.pf-av img{width:120px;height:120px;image-rendering:pixelated}
@keyframes pvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pv-evo{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:6px;border-top:1px solid #2a5a8f;flex-wrap:wrap}
.pv-node{display:flex;flex-direction:column;align-items:center;gap:4px}

/* ===== Sistema común de pantallas: mismo fondo, marco, cabecera, botones y márgenes en todos los menús ===== */
:root{--ui-panel:linear-gradient(150deg,#256cbb 0%,#082f77 49%,#061c4c 100%);--ui-line:#9aefff;--ui-card:rgba(6,24,64,.82);--ui-card-line:#2f6fb3;--ui-text:#eaf6ff;--ui-muted:#a9c6e6;--ui-gold:#ffd54f;--ui-top:28px;--ui-bot:28px;--ui-radius:10px}

#menuart{background:#061433 url('ui/mundo_digital_solo_escenario.jpg') center/cover no-repeat;filter:blur(4px) brightness(.5) saturate(1.1);transform:scale(1.06)}
/* Márgenes iguales arriba y abajo: la barra superior reserva su hueco y el panel nunca toca los bordes */

#overlay.has-top:not(.menu-mode){--ui-top:76px;padding-top:var(--ui-top)}
#overlay:not(.menu-mode)>:is(.picker-screen,.settings,.help-box,.lab-screen,.end3){flex:none;box-sizing:border-box;max-height:calc(100dvh - var(--ui-top) - var(--ui-bot))}

#overlay:not(.menu-mode)>:is(.settings,.help-box){width:min(690px,94vw)}
#overlay:not(.menu-mode)>.settings.sc-box{width:min(730px,94vw)}
#overlay:not(.menu-mode)>.picker-screen.pk2{height:min(680px,calc(100dvh - var(--ui-top) - var(--ui-bot)))}
#overlay:not(.menu-mode):has(>:is(.dvl2,.pa,.pr3,.tr11)){padding:0}
/* Primer compañero: ficha arriba y los 8 Digimon en una rejilla debajo, sin huecos vacíos */

/* Laboratorio con el mismo marco y cabecera que Ajustes o Colección */

<script type="module">
import * as THREE from 'three';

// Prototipo 3D estilo Megabonk. Sprites 2D de Digimon (base DMC) como billboards.
const BOSS_AT = 1200; // segundos hasta el jefe final (20 minutos); ganas al derrotarlo
const MAX_ENEMIES = 100;   // igual en calidad alta y baja: la calidad gráfica no cambia la dificultad
const ARENA_R = 110;  // radio del escenario: el mapa tiene límite circular con montañas
// Dos zonas: el bosque inicial y el pantano de datos (a partir de 300 s). El jefe final está al final de la zona 2.
const ZONES = [
  {name:'Bosque Inicial',   at:0,   fog:0xbcd9e8, sky:['#4d86c9', '#a9d4ee', '#d8efff'], tint:0xffffff, color:'#ffd54f'},
  {name:'Pantano de Datos', at:600, fog:0x8c7cb8, sky:['#241b4a', '#6a4f9e', '#c59ad6'], tint:0xd8c6ff, color:'#ce93d8'}
];
const ZONE2_AT = ZONES[1].at;
// Recorta un punto al círculo de radio m (para aparecer y moverse dentro del escenario)
function clampArena(x, z, m){
  const r = Math.hypot(x, z);
  return r > m ? [x*m/r, z*m/r] : [x, z];
}
// Terreno: el claro del centro es llano y el resto del mapa tiene colinas suaves
const smooth01 = t => { t = Math.min(1, Math.max(0, t)); return t*t*(3 - 2*t); };
// Estanque al suroeste: cuenca plana con agua; se funde con el terreno alrededor
const POND = {x: -38, z: 22, r: 6, water: -0.35, bed: -0.9};
function pondWeight(x, z){
  const d = Math.hypot(x - POND.x, z - POND.z);
  return 1 - smooth01((d - POND.r)/3);
}
function terrainH(x, z){
  const r = Math.hypot(x, z);
  const flat = smooth01((r - 26)/14);                 // 0 en el claro central, 1 fuera
  const edge = 1 - smooth01((r - (ARENA_R - 18))/8);  // vuelve a 0 junto a las montañas
  const hills = 4.5*Math.sin(x*0.05 + 1.3)*Math.cos(z*0.043) + 3*Math.sin((x - z)*0.11 + 0.7) + 1.5*Math.cos(x*0.13 + z*0.09);
  const base = hills * flat * edge;
  // Cerca del estanque la orilla queda por encima del agua; el cuenco baja hasta POND.bed
  const d = Math.hypot(x - POND.x, z - POND.z);
  const near = 1 - smooth01((d - (POND.r + 6))/6);
  const shore = Math.max(base, POND.water + 0.45);
  const hn = base*(1 - near) + shore*near;
  const t = smooth01((d - POND.r)/1.6);
  return POND.bed*(1 - t) + hn*t;
}
// Hitboxes: círculos y segmentos (por si se añaden obstáculos al mapa)
const solids = {circles: [], segs: []};
// Empuja un objeto {x, z} fuera de los sólidos, teniendo en cuenta su radio
function resolveSolids(o, rad, height = 0){
  for (const c of solids.circles){
    if (height >= c.h) continue;   // por encima de la altura del objeto se puede saltar
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), min = rad + c.r;

    if (height >= s.h) continue;
    const vx = s.bx - s.ax, vz = s.bz - s.az, len2 = vx*vx + vz*vz;
    const t = Math.min(1, Math.max(0, ((o.x - s.ax)*vx + (o.z - s.az)*vz)/len2));
    const px = s.ax + vx*t, pz = s.az + vz*t;

}

function buildMountains(){
  // Una sola malla continua de crestas: no hay conos que se crucen, así que no parpadea
  const SEG = 480, rBase = ARENA_R + 16, rPeak = ARENA_R + 5;
  const H = a => 40 + 12*Math.sin(a*5 + 1.3) + 6*Math.sin(a*11 + 0.4) + 3*Math.sin(a*23);
  const rock = new THREE.Color(0x4b5a73), snow = new THREE.Color(0xe8f1ff);
  const pos = [], col = [];
  const pt = (r, h, a) => [Math.cos(a)*r, h, Math.sin(a)*r];
  const colorAt = h => rock.clone().lerp(snow, THREE.MathUtils.smoothstep(h, 30, 38));
  for (let i = 0; i < SEG; i++){
    const a0 = i/SEG*Math.PI*2, a1 = (i+1)/SEG*Math.PI*2;
    const h0 = H(a0), h1 = H(a1), hm = H((a0+a1)/2) * 1.08;
    const b0 = pt(rBase, -3, a0), b1 = pt(rBase, -3, a1);   // la base se hunde bajo el suelo: sin superficies coincidentes
    const t0 = pt(rPeak, h0, a0), t1 = pt(rPeak, h1, a1), tm = pt(rPeak - 4, hm, (a0+a1)/2);
    // dos caras por segmento: base exterior -> pico
    const faces = [[b0, b1, tm], [b0, tm, t0], [b1, t1, tm], [b1, tm, t0]];
    for (const f of faces){
      for (const v of f){
        pos.push(v[0], v[1], v[2]);
        const c = colorAt(v[1]); col.push(c.r, c.g, c.b);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, flatShading: true, roughness: 0.9, side: THREE.DoubleSide}));
  scene.add(mesh);
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  audioInit();
  if (state === 'savecode'){ if (k === 'escape') showSettings(); return; }
  if (state === 'register') return;
  if (k === 'n'){ toggleMute(); return; }
  // Tab abre y cierra el mapa completo (la partida se queda parada mientras está abierto)
  if (k === 'tab'){ e.preventDefault(); if (state === 'play') openMap(); else if (state === 'map') closeMap(); return; }
  if (state === 'map'){ if (k === 'escape') closeMap(); return; }
  if (k === 'q' && state === 'play'){ bonkRelease(); return; }
  if (k === 'r' && state === 'play'){ triggerEmergency(); return; }
  if (state === 'help'){ if (k === 'escape') showSelect(); if (k === 'arrowright') tutoStep(1); if (k === 'arrowleft') tutoStep(-1); return; }
  if (state === 'gacha' || state === 'lab' || state === 'settings' || state === 'player' || state === 'collection'){ if (k === 'escape') showSelect(); return; }
  // Esc o P pausan y reanudan. Con el ratón bloqueado el navegador puede no entregar Esc:
  // en ese caso la pausa la dispara pointerlockchange (ver más abajo). P sirve en pantalla completa.
  if (k === 'escape' || k === 'p'){
    if (state === 'play'){ pauseGame(); return; }
    if (state === 'paused'){
      if (pauseConfirm && k === 'escape') showPause(false);   // Esc en la confirmación vuelve al menú de pausa
      else resumeGame();
      return;
    }
  }
  if (state === 'paused'){ if (k === 'enter' && !pauseConfirm) resumeGame(); return; }
  keys[k] = true;
  if (state === 'play' && k === 'shift') tryDash();
  if (state === 'play' && k === ' ' && g && g.p.y === 0) g.p.vy = 11;   // salto (altura ~2)
  if (state === 'play' && k === 'e' && g && g.nearChest) openChest(g.nearChest);
  const list = SEASONS.adventure.chars;
  if (state === 'select'){
    if (k === 'enter') showPicker('personaje');
  }
  else if (state === 'pick'){
    if (k.length === 1 && '123456789'.includes(k) && +k <= list.length && isUnlocked(list[+k-1])){ selectedKey = list[+k-1]; showPicker(); }
    else if (k === 'arrowleft') pickMove(-1);
    else if (k === 'arrowright') pickMove(1);
    else if (k === 'enter') startGame(selectedKey);
    else if (k === 'escape') showSelect();
  }
  else if (state === 'levelup' && k.length === 1 && '123'.includes(k)) (g.upMode === 'ban' ? banishUp(+k-1) : pickUpgrade(+k-1));
  else if (state === 'levelup' && k === 'f') rerollUp();
  else if (state === 'levelup' && k === 'x') skipUp();
  else if (state === 'levelup' && k === 'z') toggleBanish();
  else if (state === 'end' && (k === 'enter' || k === 'r')) showSelect();
});

function menuPlayPortrait(src, onReady){

  const picture = new Image();
  picture.onload = ()=>{
    const animCount = typeof ANIM_N==='number' ? ANIM_N : 5;
    const frames = picture.naturalWidth / picture.naturalHeight > animCount-1 ? animCount : 1;
    const side = Math.floor(picture.naturalWidth / frames), H=picture.naturalHeight;
    const probe = document.createElement('canvas'); probe.width=side;probe.height=H;
    const ctx=probe.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=false;
    ctx.drawImage(picture,0,0,side,H,0,0,side,H);
    const pixels=ctx.getImageData(0,0,side,H).data;
    let x0=side,y0=H,x1=-1,y1=-1;
    for(let y=0;y<H;y++)for(let x=0;x<side;x++)if(pixels[(y*side+x)*4+3]>90){
      x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
    }
    if(x1<0)return;
    const bw=x1-x0+1, bh=y1-y0+1;
    // Crop the upper 72% of the Digimon, never less than 85% of its width.
    const cropW=Math.min(side,Math.max(bw+8,bh*.88)), cropH=Math.min(H,Math.max(bh*.78,bw*.87));
    const cx=(x0+x1)/2, cy=y0+cropH*.47;
    const out=document.createElement('canvas');out.width=144;out.height=144;
    const o=out.getContext('2d');o.imageSmoothingEnabled=false;
    const size=Math.max(cropW,cropH);
    o.drawImage(picture,cx-size/2,cy-size/2,size,size,7,7,130,130);
    menuPlayPortraitCache[src]=out.toDataURL('image/png');onReady(menuPlayPortraitCache[src]);
  };
  picture.onerror=()=>{};picture.src=(typeof sheetOf==='function' ? (sheetOf(src)||src) : src);
}

function bindMenuFX(){
  document.querySelectorAll('.realhub .real-nav, .realhub .real-play, .realhub .real-panel').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      el.style.setProperty('--tx', (x * 10).toFixed(2) + 'deg');
      el.style.setProperty('--ty', (-y * 10).toFixed(2) + 'deg');
    });
    el.addEventListener('pointerleave', () => { el.style.removeProperty('--tx'); el.style.removeProperty('--ty'); });
  });
}

/* ---------- Código de guardado: lleva el progreso a otro navegador ---------- */
const SAVE_KEYS = ['digibonk3d-bits', 'digibonk3d-skins', 'digibonk3d-equip', 'digibonk3d-stats', 'digibonk3d-daily',
  'digibonk3d-inv', 'digibonk3d-extra', 'digibonk3d-evo', 'digibonk3d-name', 'digibonk3d-records', 'digibonk3d-ach', 'digibonk3d-avatar', 'digibonk3d-tickets', 'digibonk3d-tix', 'digibonk3d-pity', 'digibonk3d-legnew', 'digibonk3d-lab', 'digibonk3d-surv', 'digibonk3d-enc', 'digibonk3d-support'];
function makeSaveCode(){
  const data = {};
  for (const k of SAVE_KEYS){ const v = localStorage.getItem(k); if (v !== null) data[k] = v; }
  return 'DBK1-' + btoa(unescape(encodeURIComponent(JSON.stringify({v: 1, data}))));
}
function readSaveCode(code){
  const t = (code || '').trim();
  if (!t.startsWith('DBK1-')) throw new Error('El código debe empezar por DBK1-');
  let obj;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))); }
  catch(e){ throw new Error('El código está incompleto o alterado'); }
  if (!obj || obj.v !== 1 || typeof obj.data !== 'object') throw new Error('Formato no válido');
  const out = {};
  for (const k of SAVE_KEYS){
    if (k in obj.data){
      if (typeof obj.data[k] !== 'string') throw new Error('Dato no válido');
      out[k] = obj.data[k];
    }
  }
  if (!Object.keys(out).length) throw new Error('El código no contiene progreso');
  return out;
}
let scArmed = false;
function showSaveCode(){
  state = 'savecode';
  setHud(false);
  scArmed = false;
  showOverlay(`
    <div class="settings sc-box">
      <header class="set-head"><button class="g-back" id="scBack">← Volver</button><h2>Código de guardado</h2></header>
      <p class="sc-p">Copia este código para llevar tu progreso a otro navegador. Pégalo allí en "Cargar código".</p>
      <textarea id="scOut" readonly>${makeSaveCode()}</textarea>
      <div class="sc-row"><button class="mini-btn" id="scCopy">Copiar código</button></div>
      <p class="sc-p">¿Tienes un código de otro navegador? Pégalo aquí. Sustituye el progreso de este navegador.</p>
      <textarea id="scIn" placeholder="DBK1-..."></textarea>
      <div class="sc-row"><button class="mini-btn" id="scLoad">Cargar código</button></div>
    </div>`);
  document.getElementById('scBack').onclick = () => showSettings();
  document.getElementById('scCopy').onclick = () => {
    const ta = document.getElementById('scOut');
    ta.select();
    const done = () => announce('Código copiado', 'Pégalo en el otro navegador', '#7cf29c');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); });
    } else { document.execCommand('copy'); done(); }
  };
  document.getElementById('scLoad').onclick = () => {
    const btn = document.getElementById('scLoad');
    let data;
    try { data = readSaveCode(document.getElementById('scIn').value); }
    catch(e){ announce('Código no válido', e.message, '#ef5350'); return; }
    if (!scArmed){
      scArmed = true;
      btn.textContent = '¿Sustituir el progreso? Pulsa otra vez';
      btn.classList.add('armed');
      setTimeout(() => { scArmed = false; btn.textContent = 'Cargar código'; btn.classList.remove('armed'); }, 4000);
      return;
    }
    for (const k of Object.keys(data)) localStorage.setItem(k, data[k]);
    location.reload();
  };
}

function unlockedSet(){
  if (!localStorage.getItem('digibonk3d-unlocked')) return new Set(SEASONS.adventure.chars);
  return new Set([...loadJSON('digibonk3d-unlocked', []), 'agumon']); // Agumon es el inicial: siempre disponible
}
function isUnlocked(k){ return unlockedSet().has(k); }

function checkUnlocks(){
  const won = [];
  for (const k of SEASONS.adventure.chars){
    const r = UNLOCK[k];
    if (!r || isUnlocked(k)) continue;
    if ((r.ok && r.ok()) || (r.rnd && Math.random() < r.rnd)){ unlockDigi(k); won.push(CHARS[k].name); }

// Terreno procedural: hierba con matices, parches de tierra y claros (textura que se repite)
let chestTex = null;
function getChestTex(){
  if (chestTex) return chestTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < 4; i++){
    x.fillStyle = i % 2 ? '#7a4a22' : '#9a6432';
    x.fillRect(0, i*32, 128, 32);
    x.fillStyle = '#4e2e12'; x.fillRect(0, i*32, 128, 2);
  }
  x.fillStyle = '#c9a227';                                // bandas metálicas
  x.fillRect(0, 20, 128, 10); x.fillRect(0, 98, 128, 10); x.fillRect(56, 0, 12, 128);
  x.fillStyle = '#fff3a0'; x.fillRect(58, 56, 8, 12);    // cerradura
  chestTex = new THREE.CanvasTexture(c);
  chestTex.magFilter = THREE.NearestFilter;
  return chestTex;
}
function makeChest(){
  const mat = new THREE.MeshBasicMaterial({map: getChestTex()});
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.7), mat);
  body.position.y = 0.25;
  group.add(body);
  const pivot = new THREE.Group();          // bisagra en el borde trasero
  pivot.position.set(0, 0.5, -0.35);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.7), mat);
  lid.position.set(0, 0.1, 0.35);
  pivot.add(lid);
  group.add(pivot);
  group.add(makeShadow(1.3));
  return {group, pivot};
}

function burst(x, z, color){

function updateFx(dt){
  for (const f of fx){
    f.t += dt;
    f.vy -= 14*dt;
    f.m.position.x += f.vx*dt;
    f.m.position.z += f.vz*dt;

    f.m.material.opacity = Math.max(0, 1 - f.t/0.45);

  }

// ---------- Daño flotante ----------
function popText(x, z, n, color = '#ffeb3b', k = 0.6){
  if (g && g.texts && g.texts.length > 45) return;   // límite de textos flotantes en pantalla
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const cx = c.getContext('2d');
  cx.font = 'bold 44px sans-serif'; cx.textAlign = 'center';
  cx.lineWidth = 7; cx.strokeStyle = '#000';
  cx.strokeText(String(n), 128, 66);
  cx.fillStyle = color; cx.fillText(String(n), 128, 66);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false});
  const s = new THREE.Sprite(mat);

  s.renderOrder = 10;

function digivolve(){
  const line = EVO_LINE[g.ch.id], st = (g.ch.evolved | 0) + 1;
  if (!line || st > line.length || g.evoAnim) return;
  const evo = line[st - 1];
  g.ch.evolved = st;
  recordEvolve(g.ch.id);
  g.p.dmg *= 1.2;
  g.p.area *= 1.05;
  g.p.maxHp += 20; g.p.hp += 20;
  if (st === 1) g.p.count += 1;
  g.evoAnim = {t: 0, dur: 2.6, swapped: false, sprite: spriteOf(g.ch.id, st), name: evo.name};
  shake = Math.max(shake, 0.5);
  sfx('evolve');
  announce(evo.name + '!', 'Digievolución · +20% daño, +5% área, +20 vida', '#ffd54f');
}

// Animación de digievolución: 0-0.6 s brillo y temblor, cambio de sprite con destello y anillo, 0.6-1.6 s asentamiento
let screenFlash = 0;
let shake = 0;          // intensidad de la sacudida de cámara
let rings = [];
// Anillo que se expande: radius = radio final en unidades del mundo; life = duración en segundos
function spawnRing(x, z, color = 0xffd54f, radius = null, life = 0.7){
  const mesh = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.7, 32),
    new THREE.MeshBasicMaterial({color, transparent: true, depthWrite: false}));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0.05 + terrainH(x, z), z);
  world.add(mesh);
  const grow = radius ? (radius/0.7 - 1)/life : 12;
  rings.push({mesh, t: 0, life, grow});
}
// ---------- Digivice de la digievolución (dispositivo azul brillante generado con canvas) ----------
let digiviceTex = null;
function getDigiviceTex(){
  if (digiviceTex) return digiviceTex;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const halo = x.createRadialGradient(128, 128, 20, 128, 128, 128);
  halo.addColorStop(0, 'rgba(120,220,255,0.7)');
  halo.addColorStop(1, 'rgba(120,220,255,0)');
  x.fillStyle = halo; x.fillRect(0, 0, 256, 256);
  const body = x.createLinearGradient(0, 30, 0, 226);
  body.addColorStop(0, '#eaffff'); body.addColorStop(0.5, '#4fc3f7'); body.addColorStop(1, '#0d3f8f');
  x.beginPath(); x.ellipse(128, 128, 96, 112, 0, 0, Math.PI*2);
  x.fillStyle = body; x.fill();
  x.lineWidth = 6; x.strokeStyle = '#bff1ff'; x.stroke();
  x.fillStyle = '#06142b'; x.fillRect(78, 88, 100, 80);            // pantalla
  x.strokeStyle = 'rgba(79,195,247,0.8)'; x.lineWidth = 2;
  for (let i = 1; i < 4; i++){ x.beginPath(); x.moveTo(78 + i*25, 88); x.lineTo(78 + i*25, 168); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,0.35)';                           // brillo
  x.beginPath(); x.ellipse(118, 100, 28, 8, -0.2, 0, Math.PI*2); x.fill();
  for (const bx of [36, 220]){                                      // botones laterales
    x.beginPath(); x.arc(bx, 128, 12, 0, Math.PI*2);
    x.fillStyle = '#29b6f6'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#e1f5fe'; x.stroke();
  }
  digiviceTex = new THREE.CanvasTexture(c);
  return digiviceTex;
}
// Digivice que aparece sobre el personaje con un haz de luz, gira y se apaga al evolucionar
function updateDigivice(a, p, dt){
  if (!a.dv){
    a.dv = new THREE.Sprite(new THREE.SpriteMaterial({map: getDigiviceTex(), transparent: true, depthWrite: false,
      depthTest: false, blending: THREE.AdditiveBlending, opacity: 0}));
    a.dv.renderOrder = 12;
    world.add(a.dv);
    a.beam = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 16, 20, 1, true),
      new THREE.MeshBasicMaterial({color: 0x66ccff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
        depthWrite: false, side: THREE.DoubleSide}));
    world.add(a.beam);
  }
  const t = a.t;
  const grow = Math.min(1, t/0.6);
  const fade = t > 0.6 ? Math.max(0, 1 - (t - 0.6)/1.4) : 1;
  const pulse = 0.85 + 0.15*Math.sin(t*30);
  a.dv.position.set(p.x, terrainH(p.x, p.z) + 3.4 + Math.sin(t*6)*0.15, p.z);
  a.dv.scale.setScalar((3.2 + 1.2*grow) * pulse);
  a.dv.material.rotation += dt*(1.5 + 4*grow);
  a.dv.material.opacity = Math.min(1, t/0.15) * fade;
  a.beam.position.set(p.x, terrainH(p.x, p.z) + 8*grow, p.z);
  a.beam.scale.set(1 + grow*1.5, Math.max(0.01, grow), 1 + grow*1.5);
  a.beam.material.opacity = 0.55 * fade * Math.min(1, t/0.2);
  if (t > 0.6 && !a.burst){ a.burst = true; spawnRing(p.x, p.z); spawnRing(p.x, p.z); }
}
function removeDigivice(a){
  if (a.dv){ world.remove(a.dv); a.dv.material.dispose(); }
  if (a.beam){ world.remove(a.beam); a.beam.geometry.dispose(); a.beam.material.dispose(); }
}

function animateEvo(dt){
  for (const r of rings){
    r.t += dt;
    r.mesh.scale.setScalar(1 + r.t*r.grow);
    r.mesh.material.opacity = Math.max(0, 1 - r.t/r.life);
  }
  rings = rings.filter(r => {
    if (r.t < r.life) return true;
    world.remove(r.mesh); return false;
  });
  screenFlash = Math.max(0, screenFlash - dt*1.5);
  document.getElementById('flash').style.opacity = screenFlash;

  const a = g && g.evoAnim;
  if (!a) return;
  a.t += dt;
  const m = g.playerMesh, p = g.p;
  // Malla de alambre (icosaedro) que crece alrededor del personaje y se desvanece
  if (!a.wire){
    a.wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshBasicMaterial({color: 0x4fc3f7, wireframe: true, transparent: true}));
    world.add(a.wire);
  }
  a.wire.scale.setScalar(a.t < 0.6 ? 1.2 + 2.5*(a.t/0.6) : 3.7 + 2*(a.t-0.6));
  a.wire.position.set(p.x, terrainH(p.x, p.z) + 1.1, p.z);
  a.wire.material.opacity = a.t < 0.6 ? 1 : Math.max(0, 1 - (a.t-0.6)/0.6);
  a.wire.rotation.y += dt*4;
  a.wire.rotation.x += dt*2;
  updateDigivice(a, p, dt);
  if (a.t < 0.6){
    const glow = 1 + 1.5*Math.pow(Math.sin(a.t*40), 2);
    m.material.color.setRGB(glow, glow, glow);
    m.scale.set(2.9 + 0.4*(a.t/0.6), 2.9 + 0.4*(a.t/0.6), 1);
    m.position.x = p.x + (Math.random()-0.5)*0.25;
    m.position.z = p.z + (Math.random()-0.5)*0.25;
  } else if (!a.swapped){
    a.swapped = true;
    m.material.map = animTex(a.sprite, true);
    m.material.needsUpdate = true;
    spawnRing(p.x, p.z);
    popText(p.x, p.z, `¡${a.name}!`, '#ffd54f', 2.2);
    screenFlash = 1;
  } else {
    const e = Math.min(1, (a.t - 0.6) / 2.0);
    const s = 3.3 - 0.4*e;
    m.scale.set(s, s, 1);
    m.material.color.setRGB(1, 1, 1);
  }
  if (a.t >= a.dur){
    m.scale.set(2.9, 2.9, 1);
    m.material.color.setRGB(1, 1, 1);
    world.remove(a.wire);
    a.wire.geometry.dispose(); a.wire.material.dispose();
    removeDigivice(a);
    g.evoAnim = null;
  }
}

// BONK: al estar cargado (100%), libera una onda que daña y empuja a los enemigos cercanos y borra los proyectiles del jefe
function addBonk(v){
  const was = g.bonk;
  g.bonk = Math.min(100, g.bonk + v * (g.labBonk || 1));
  if (was < 100 && g.bonk >= 100) sfx('ready');
}
function bonkRelease(){
  if (!g || g.bonk < 100) return;
  g.bonk = 0;
  const p = g.p, R = 14;
  for (const e of g.enemies){
    const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz);
    if (d > R) continue;
    e.hp -= 80;
    [e.x, e.z] = clampArena(e.x + dx/(d || 1)*6, e.z + dz/(d || 1)*6, ARENA_R - 0.5);
    popText(e.x, e.z, 80, '#ffd54f', 0.7);
  }
  for (const s of g.eshots) s.life = 0;   // el bucle de proyectiles retira las bolas del jefe
  shake = Math.max(shake, 0.8);
  spawnRing(p.x, p.z, 0xffd54f, 14, 0.5);
  screenFlash = 0.6;
  sfx('evolve');
  g.bonks = (g.bonks || 0) + 1;
  const fx = BONK_FX[g.ch.id];
  if (fx){ fx.f(p); announce('¡BONK!', fx.name, '#ffd54f'); }
  else announce('¡BONK!', 'Onda de choque', '#ffd54f');
}

  biyomon:  {name: 'Espiral de fuego', f: p => { for (const e of g.enemies) if (dist2(e.x, e.z, p.x, p.z) < 20){ e.hp -= 60; popText(e.x, e.z, 60, '#ff7043', 0.6); } spawnRing(p.x, p.z, 0xff7043, 20, 0.6); }},

  gatomon:  {name: 'Luz sagrada: críticos 5 s', f: () => { g.critT = 5; }}
};
let dmgSrc = 'base';   // qué ataque está golpeando (para el resumen de fin de partida)
function hurt(e, dmg){
  // 12% de golpes críticos: doble daño, número naranja y sacudida ligera
  const crit = (g.critT || 0) > 0 || Math.random() < g.p.critChance;
  if (BEATS[g.attr] === attrOf(e)) dmg *= ATTR_ADV;               // ventaja de atributo
  dmg *= (g.evoSk && g.evoSk[dmgSrc]) || 1;                        // habilidad evolucionada
  if (crit){ dmg *= g.p.critMul; shake = Math.max(shake, 0.2); }
  e.hp -= dmg;
  g.dmgBy[dmgSrc] = (g.dmgBy[dmgSrc] || 0) + dmg;
  popText(e.x, e.z, Math.round(dmg), crit ? '#ffb300' : '#ffffff', crit ? 0.8 : 0.55);
  burst(e.x, e.z, hitColors[e.kind] || '#ffe082');
  sfx('hit');
}

// Cofres: abren una elección de 1 entre 3 cartas. Los dorados (élites y jefes menores) aplican la carta dos veces
function openChest(c){

  c.pivot.rotation.x = -1.5;
  if (!(g.mod && g.mod.noHeal)) g.p.hp = Math.min(g.p.maxHp, g.p.hp + 15);

  sfx('chest');

}
function spawnChestAt(x, z, gold){

    ring.rotation.x = -Math.PI/2; ring.position.y = 0.03; group.add(ring);

function tryDash(){
  if (!g || g.dashCd > 0 || g.dash > 0) return;
  g.dash = 0.18;   // segundos de dash (invulnerable)
  g.dashCd = 2.5*(g.p.dashMul || 1);  // cooldown
  g.dashUsed = true;
  // Esquiva perfecta: dash con un enemigo pegado o un proyectil del jefe a punto de dar
  const p = g.p;
  const close = g.enemies.some(e => dist2(e.x, e.z, p.x, p.z) < e.r + 1.1) || g.eshots.some(s => dist2(s.x, s.z, p.x, p.z) < 2.2);
  if (close && (g.perfectCd || 0) <= 0){
    g.slowT = 1; g.perfectCd = 4;
    addBonk(10);
    popText(p.x, p.z, '¡Esquiva perfecta!', '#40c4ff', 1);
    sfx('ready');
  }
}
function dist2(ax, az, bx, bz){ return Math.hypot(ax-bx, az-bz); }

// Los enemigos siguen el poder del jugador: cada digievolución les da más vida y daño
// Los enemigos nuevos solo ganan un 10% de vida por cada etapa (antes +25% vida y +10% daño: evolucionar no compensaba).
// La evolución de emergencia no cuenta: es temporal.
function evoStage(){ return g.emergT > 0 ? (g.emergPrev | 0) : (g.ch.evolved | 0); }
function evoHp(){ return Math.pow(1.1, evoStage()); }
function evoDmg(){ return 1; }
// Dificultad de la partida (modo difícil, para jugadores experimentados). Multiplicadores sobre la base:
// vida y daño de enemigos y minijefes, ritmo de aparición (menor = más enemigos) y tiempo entre élites
const DIFF = {hp: 1.35, dmg: 1.35, spawn: 0.75, eliteT: 35, spawnMin: 0.22};
// La dificultad sube poco a poco: al principio es la normal y llega a la del modo difícil en el minuto 10
const diffMul = k => 1 + (DIFF[k] - 1) * Math.min(1, (g ? g.t : 0) / 600);
const eliteGap = () => 45 + (DIFF.eliteT - 45) * Math.min(1, (g ? g.t : 0) / 600);
// Tiempo que cuenta para la dificultad: igual que el tiempo real hasta el minuto 10 (la dificultad de siempre)
// y después avanza a 0,3 para que el minuto 20 no sea imposible
// En Supervivencia no hay jefe final: la dificultad no se suaviza tras el minuto 10
const diffT = t => (g && g.mode === 'surv') ? t : (t <= 600 ? t : 600 + (t - 600) * 0.3);
let runMode = 'normal';   // 'normal' o 'surv' (lo elige el menú antes del selector)
function spawnEnemy(forced){
  const t = g.t, r = Math.random(), a = Math.random()*Math.PI*2, R = (g.idleT || 0) > 2.5 ? 13 : 25;
  let kind = 'basic';
  const z2 = g.zone >= 2;   // la zona 2 trae más tanques y rápidos
  if (forced) kind = forced;
  else if (g.mod && g.mod.fastOnly && t > 20) kind = 'fast';
  else if (t > 120 && r < (z2 ? 0.3 : 0.2)) kind = 'tank';
  else if (t > 60 && r < (z2 ? 0.5 : 0.4)) kind = 'fast';
  const tt = diffT(t);
  const d = ENEMY[kind], k = 1 + tt/60 + (tt/200)*(tt/200);   // vida: igual que siempre hasta el minuto 10
  const pool = ZONE_FOES[g.zone - 1][kind], sprite = pool ? pool[Math.floor(Math.random()*pool.length)] : d.sprite;
  const mesh = billboard(sprite, d.scale);
  mesh.position.y = d.scale/2;
  world.add(mesh);
  const sp = clampArena(g.p.x + Math.cos(a)*R, g.p.z + Math.sin(a)*R, ARENA_R - 0.5);
  const shadow = Q.shadows ? makeShadow(d.r*2.2) : new THREE.Object3D();
  world.add(shadow);
  g.enemies.push({
    kind, sprite, mesh, shadow, x: sp[0], z: sp[1],
    hp: d.hp*k*evoHp()*diffMul('hp'), max: d.hp*k*evoHp()*diffMul('hp'), spd: d.spd, r: d.r, xp: d.xp, dmg: d.dmg*(1 + tt/300)*evoDmg()*diffMul('dmg'), cd: 0
  });
}

// Santuarios: 6 por partida en el mapa. Al pasar por uno, un efecto para el resto de la partida (una sola vez)
const SHRINE_TYPES = [
  {name: 'Santuario de curación', col: 0x7cf29c, text: '+40 PS', apply: g => { if (!(g.mod && g.mod.noHeal)) g.p.hp = Math.min(g.p.maxHp, g.p.hp + 40); }},
  {name: 'Santuario de poder', col: 0xff7043, text: '+10% daño', apply: g => { g.p.dmg *= 1.1; }},

  {name: 'Santuario de área', col: 0xce93d8, text: '+10% área', apply: g => { g.p.area *= 1.1; }},
  {name: 'Santuario de tickets', col: 0xffd54f, text: '+1 ticket del permanente', apply: () => addTickets('std', 1)},
