function sheetOf(url){ const m = /([^\/]+)\.png$/.exec(url || ''); return m && ANIM_IDS.has(m[1]) ? `sprites/anim/${m[1]}.png` : null; }
const animTexs = [];   // texturas compartidas (enemigos del mismo tipo marcan el paso a la vez)
function animTex(url, own = false){
  const sh = sheetOf(url);
  if (!sh) return tex(url);
  if (!own && texCache['a:' + sh]) return texCache['a:' + sh];
  const t = loader.load(sh);
  t.magFilter = THREE.NearestFilter;
  t.repeat.set(1/ANIM_N, 1);
  t.isAnim = true;
  if (!own){ texCache['a:' + sh] = t; animTexs.push(t); }
  return t;
}
// Sprite de tamaño fijo para cualquier vista: animado si es hoja de fotogramas, fijo si no
function sprEl(url, size = 56, cls = ''){ return animEl(url, 'spr ' + cls, `--s:${size}px`); }
// Elemento animado para los menús (dos fotogramas de reposo) o imagen fija si no hay hoja
function animEl(url, cls = '', style = ''){
  const sh = sheetOf(url);
  return sh ? `<i class="anim ${cls}" style="background-image:url('${sh}');${style}"></i>` : `<img class="${cls}" src="${url}" alt="" style="${style}">`;
}
const spriteMats = {};
function billboard(url, scale, shared = true){
  let mat = shared ? spriteMats[url] : null;
  if (!mat){ mat = new THREE.SpriteMaterial({map: animTex(url, !shared), transparent: true}); if (shared) spriteMats[url] = mat; }
  const s = new THREE.Sprite(mat);
  s.scale.set(scale, scale, 1);
  return s;
}

// ---------- Sombras de contacto (manchas en el suelo bajo cada entidad) ----------
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const grd = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(0,0,0,0.45)');
  grd.addColorStop(0.6, 'rgba(0,0,0,0.15)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = grd; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const shadowGeo = new THREE.PlaneGeometry(1, 1);
shadowGeo.rotateX(-Math.PI/2);                 // plano horizontal
const shadowMat = new THREE.MeshBasicMaterial({map: shadowTex, transparent: true, depthWrite: false});
function makeShadow(diameter){
  const m = new THREE.Mesh(shadowGeo, shadowMat);
  m.scale.set(diameter, 1, diameter);
  m.position.y = 0.02;
  return m;
}

// ---------- Entorno: árboles, rocas y flores (texturas procedurales) ----------
// Decoración 2D integrada en el 3D: sprites de pixel art que siempre miran a la cámara
const decoTexCache = {};
function decoTex(file){
  if (decoTexCache[file]) return decoTexCache[file];
  const t = decoTexCache[file] = loader.load(file);
  t.magFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Portal entre pantallas (todos los mapas): siempre en el mismo sitio, al norte del escenario
const PORTAL = {x: 0, z: -(ARENA_R - 32), r: 3.2};
function portalClear(x, z){ return Math.hypot(x - PORTAL.x, z - PORTAL.z) < 10; }
const decoGroup = new THREE.Group();
scene.add(decoGroup);
function decoSprite(tex, w, h, x, y, z){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, alphaTest: 0.5}));
  sp.scale.set(w, h, 1);
  sp.position.set(x, y + h/2, z);
  decoGroup.add(sp);
  return sp;
}

    const [, kw, kh, , shad, size] = B.deco[j];

    placed++;
    const h = size*(0.85 + Math.random()*0.35);
    decoSprite(T[j], h*kw, h*kh, x0, gy, z0);
    if (shad){ const sh = makeShadow(h*shad); sh.position.set(x0, gy + 0.02, z0); decoGroup.add(sh); }
  }
}

const tZone = document.getElementById('tZone'), tJoy = document.getElementById('tJoy'), tKnob = document.getElementById('tKnob');
let tJoyId = null, tJoyC = {x: 0, y: 0};
function tJoyHome(){
  const r = tZone.getBoundingClientRect();
  const R = tJoy.offsetWidth / 2 || 60;
  tJoy.style.left = (R + 22) + 'px';
  tJoy.style.top = (r.height - R - (parseFloat(getComputedStyle(tJoy).getPropertyValue('--home-b')) || 22)) + 'px';
  tKnob.style.transform = '';
  tJoy.classList.remove('act');

function touchReset(){
  tMove.x = tMove.z = tMove.m = 0;

  tJoyHome();

}
function tJoyMove(e){
  const R = tJoy.offsetWidth / 2 || 60;
  let dx = e.clientX - tJoyC.x, dy = e.clientY - tJoyC.y;
  const d = Math.hypot(dx, dy), max = R * 0.75;
  if (d > max){ dx *= max/d; dy *= max/d; }
  tKnob.style.transform = `translate(${dx}px,${dy}px)`;
  const m = Math.min(d, max) / max, dead = 0.15;
  if (m < dead){ tMove.x = tMove.z = tMove.m = 0; return; }
  tMove.x = dx / max; tMove.z = dy / max;
  tMove.m = Math.min(1, (m - dead) / (1 - dead) * 1.2);
}

  const olTop = same ? overlay.scrollTop : 0;

  overlay.innerHTML = html;

// Las flechas mueven el foco al botón más cercano en esa dirección; Enter pulsa el botón enfocado
const MENU_NAV = ['select', 'gacha', 'lab', 'settings', 'player', 'collection', 'paused', 'end', 'levelup', 'savecode'];
function menuNavRoot(){
  const pz = document.getElementById('pause');
  if (pz && !pz.classList.contains('hidden') && pz.firstElementChild) return pz;
  return overlay.querySelector('.approved-info-scrim') || overlay;
}
function menuNav(k, e){
  const dirs = {arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0]};
  const root = menuNavRoot(), act = document.activeElement;
  if (k === 'enter'){
    if (act && act !== document.body && root.contains(act) && act.matches('button,[role=button]')){ e.preventDefault(); act.click(); return true; }
    return false;
  }
  const d = dirs[k];
  if (!d) return false;
  if (act && act.matches && act.matches('input[type=range]')) return false;
  const list = [...root.querySelectorAll('button:not([disabled]),[role=button],a[href]')].filter(b => { const r = b.getBoundingClientRect(); return r.width > 4 && r.height > 4 && r.bottom > 0 && r.top < innerHeight && getComputedStyle(b).visibility !== 'hidden'; });
  if (!list.length) return false;
  e.preventDefault();
  if (!act || !list.includes(act)){
    const first = root.querySelector('#playBtn,#pResume,#endAgain,.pz2-go') || list[0];
    first.focus({preventScroll: false});
    return true;
  }
  const c = r => [r.left + r.width / 2, r.top + r.height / 2];
  const [ax, ay] = c(act.getBoundingClientRect());
  let best = null, bestS = Infinity;
  for (const b of list){
    if (b === act) continue;
    const [bx, by] = c(b.getBoundingClientRect());
    const dx = bx - ax, dy = by - ay;
    const along = dx * d[0] + dy * d[1];
    if (along <= 4) continue;
    const across = Math.abs(dx * d[1]) + Math.abs(dy * d[0]);
    const sc = along + across * 2.2;
    if (sc < bestS){ bestS = sc; best = b; }
  }
  if (best){ best.focus(); best.scrollIntoView({block: 'nearest', inline: 'nearest'}); }
  return true;
}

// Portrait for the MENU PLAY Digivice: draw a fresh icon from the actual
// sprite sheet. Unlike the tiny head icon, this preserves the whole head/neck.
const menuPlayPortraitCache = Object.create(null);
function menuPlayPortrait(src, onReady){
  if(menuPlayPortraitCache[src]) { onReady(menuPlayPortraitCache[src]); return; }
  const picture = new Image();
  picture.onload = ()=>{
    const animCount = typeof ANIM_N==='number' ? ANIM_N : 5;
    const frames = picture.naturalWidth / picture.naturalHeight > animCount-1 ? animCount : 1;
    const side = Math.floor(picture.naturalWidth / frames), H=picture.naturalHeight;
    const probe = document.createElement('canvas'); probe.width=side;probe.height=H;
    const ctx=probe.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=false;
    ctx.drawImage(picture,0,0,side,H,0,0,side,H);
    const pixels=ctx.getImageData(0,0,side,H).data;
    let x0=side,y0=H,x1=-1,y1=-1;
    for(let y=0;y<H;y++)for(let x=0;x<side;x++)if(pixels[(y*side+x)*4+3]>90){
      x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
    }
    if(x1<0)return;
    const bw=x1-x0+1, bh=y1-y0+1;
    // Crop the upper 72% of the Digimon, never less than 85% of its width.
    const cropW=Math.min(side,Math.max(bw+8,bh*.88)), cropH=Math.min(H,Math.max(bh*.78,bw*.87));
    const cx=(x0+x1)/2, cy=y0+cropH*.47;
    const out=document.createElement('canvas');out.width=144;out.height=144;
    const o=out.getContext('2d');o.imageSmoothingEnabled=false;
    const size=Math.max(cropW,cropH);
    o.drawImage(picture,cx-size/2,cy-size/2,size,size,7,7,130,130);
    menuPlayPortraitCache[src]=out.toDataURL('image/png');onReady(menuPlayPortraitCache[src]);
  };
  picture.onerror=()=>{};picture.src=(typeof sheetOf==='function' ? (sheetOf(src)||src) : src);
}

// Inclinación 3D de los botones y paneles del menú siguiendo el puntero
function bindMenuFX(){
  document.querySelectorAll('.realhub .real-nav, .realhub .real-play, .realhub .real-panel').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      el.style.setProperty('--tx', (x * 10).toFixed(2) + 'deg');
      el.style.setProperty('--ty', (-y * 10).toFixed(2) + 'deg');
    });
    el.addEventListener('pointerleave', () => { el.style.removeProperty('--tx'); el.style.removeProperty('--ty'); });
  });
}

const SAVE_KEYS = ['digibonk3d-sfxvol', 'digibonk3d-musvol', 'digibonk3d-uiscale', 'digibonk3d-reducemotion', 'digibonk3d-bits', 'digibonk3d-skins', 'digibonk3d-equip', 'digibonk3d-stats', 'digibonk3d-daily',
  'digibonk3d-inv', 'digibonk3d-extra', 'digibonk3d-evo', 'digibonk3d-name', 'digibonk3d-records', 'digibonk3d-ach', 'digibonk3d-avatar', 'digibonk3d-tickets', 'digibonk3d-tix', 'digibonk3d-pity', 'digibonk3d-legnew', 'digibonk3d-lab', 'digibonk3d-surv', 'digibonk3d-enc', 'digibonk3d-support', 'digibonk3d-mapwins', 'digibonk3d-map', 'digibonk3d-diff', 'digibonk3d-surv-wave-bosque', 'digibonk3d-surv-wave-desierto', 'digibonk3d-surv-wave-nevado', 'digibonk3d-gift', 'digibonk3d-theme'];
function makeSaveCode(){
  const data = {};
  for (const k of SAVE_KEYS){ const v = localStorage.getItem(k); if (v !== null) data[k] = v; }
  return 'DBK1-' + btoa(unescape(encodeURIComponent(JSON.stringify({v: 1, data}))));
}
function readSaveCode(code){
  const t = (code || '').trim();
  if (!t.startsWith('DBK1-')) throw new Error('El código debe empezar por DBK1-');
  let obj;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))); }
  catch(e){ throw new Error('El código está incompleto o alterado'); }
  if (!obj || obj.v !== 1 || typeof obj.data !== 'object') throw new Error('Formato no válido');
  const out = {};
  for (const k of SAVE_KEYS){
    if (k in obj.data){
      if (typeof obj.data[k] !== 'string') throw new Error('Dato no válido');
      out[k] = obj.data[k];
    }
  }
  if (!Object.keys(out).length) throw new Error('El código no contiene progreso');
  return out;
}
let scArmed = false;
function showSaveCode(){
  state = 'savecode';
  setHud(false);
  scArmed = false;
  showOverlay(`
    <div class="settings sc-box">
      <header class="set-head"><button class="g-back" id="scBack">← Volver</button><h2>Código de guardado</h2></header>
      <p class="sc-p">Copia este código para llevar tu progreso a otro navegador. Pégalo allí en "Cargar código".</p>
      <textarea id="scOut" readonly>${makeSaveCode()}</textarea>
      <div class="sc-row"><button class="mini-btn" id="scCopy">Copiar código</button></div>

      <textarea id="scIn" placeholder="DBK1-..."></textarea>
      <div class="sc-row"><button class="mini-btn" id="scLoad">Cargar código</button></div>
    </div>`);
  document.getElementById('scBack').onclick = () => showSettings();
  document.getElementById('scCopy').onclick = () => {
    const ta = document.getElementById('scOut');
    ta.select();
    const done = () => announce('Código copiado', 'Pégalo en el otro navegador', '#7cf29c');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); });
    } else { document.execCommand('copy'); done(); }
  };
  document.getElementById('scLoad').onclick = () => {
    const btn = document.getElementById('scLoad');
    let data;
    try { data = readSaveCode(document.getElementById('scIn').value); }
    catch(e){ announce('Código no válido', e.message, '#ef5350'); return; }
    if (!scArmed){
      scArmed = true;
      btn.textContent = '¿Sustituir el progreso? Pulsa otra vez';
      btn.classList.add('armed');
      setTimeout(() => { scArmed = false; btn.textContent = 'Cargar código'; btn.classList.remove('armed'); }, 4000);

    }
    for (const k of Object.keys(data)) localStorage.setItem(k, data[k]);

  };
}

const UNLOCK = {

function sumStats(field){ return Object.values(loadJSON('digibonk3d-stats', {})).reduce((a, x) => a + (x[field] || 0), 0); }

function unlockedSet(){
  if (!localStorage.getItem('digibonk3d-unlocked')) return new Set(SEASONS.adventure.chars);
  return new Set([...loadJSON('digibonk3d-unlocked', []), 'agumon']); // Agumon es el inicial: siempre disponible
}
function isUnlocked(k){ return unlockedSet().has(k); }
function unlockDigi(k){ localStorage.setItem('digibonk3d-unlocked', JSON.stringify([...new Set([...unlockedSet(), k])])); }
// Tras cada partida: comprueba logros y apariciones aleatorias. Devuelve los Digimon nuevos
function checkUnlocks(){
  const won = [];
  for (const k of SEASONS.adventure.chars){
    const r = UNLOCK[k];
    if (!r || isUnlocked(k)) continue;
    if ((r.ok && r.ok()) || (r.rnd && Math.random() < r.rnd)){ unlockDigi(k); won.push(CHARS[k].name); }
  }
  return won;
}

// Cifras reales a nivel 1 de cada ataque aprendible (mismas fórmulas que updateSkills, con SKILL_K)
function skillFacts(id){
  const K = SKILL_K, L = 1;
  const f = {
    aura:     [['Daño', (1.5 + 0.8*L)*K], ['Cada', '0,3 s'], ['Radio', (2.6 + 0.9*L) + ' m']],
    tornado:  [['Daño', (3 + 1.5*L)*K], ['Bits', L + 1], ['Radio', '3,4 m']],
    pulso:    [['Daño', (6 + 2*L)*K], ['Recarga', fmtN(3.2 - 0.4*L) + ' s'], ['Radio', (6.5 + 1.5*L) + ' m']],
    espiral:  [['Daño', (7 + 3*L)*K], ['Recarga', '0,9 s'], ['Atraviesa', 1 + L]],
    cuchilla: [['Daño', (6 + 2*L)*K], ['Recarga', '1,6 s'], ['Hojas', 2*L]],
    laser:    [['Daño', (12 + 4*L)*K], ['Recarga', '2,8 s'], ['Alcance', '18 m']],
    mina:     [['Daño', (12 + 4*L)*K], ['Radio', fmtN(2.6 + 0.6*L) + ' m'], ['Una cada', '2,2 m']],
    meteoro:  [['Daño', (10 + 3*L)*K], ['Recarga', '2,6 s'], ['Impactos', L + 1]]
  }[id] || [];
  return f.map(([k, v]) => [k, typeof v === 'number' ? fmtN(v) : v]);
}
// Cifras del ataque básico según su tipo
function baseFacts(c){
  const dmg = fmtN(c.dmg);
  if (c.kind === 'ring') return [['Daño', dmg], ['Recarga', fmtN(c.cd, 2) + ' s'], ['Proyectiles', 6], ['Alcance', '8 m']];
  if (c.kind === 'orbit') return [['Daño', dmg], ['Golpe cada', '0,35 s'], ['Cuchillas', 2], ['Radio', '2,2 m']];
  return [['Daño', dmg], ['Recarga', fmtN(c.cd, 2) + ' s'], ['Proyectiles', 1], ['Alcance', '22 m']];
}
const chipsHtml = facts => `<div class="ps-chips">${facts.map(([k, v]) => `<span><small>${k}</small><b>${v}</b></span>`).join('')}</div>`;
// Victorias, mejor partida y nivel máximo por Digimon (se guardan en digibonk3d-stats)
function recordCharRun(key, win, diff, kills, lvl){
  const all = loadJSON('digibonk3d-stats', {});
  const st = all[key] || (all[key] = {plays: 0, kills: 0});
  st.best = Math.max(st.best || 0, kills | 0);
  st.maxLvl = Math.max(st.maxLvl || 0, lvl | 0);
  if (win){ st.wins = st.wins || {}; st.wins[diff] = (st.wins[diff] || 0) + 1; }
  try { localStorage.setItem('digibonk3d-stats', JSON.stringify(all)); } catch(e){}
}

    el.innerHTML = `<div class="ps-lbl">La skin se aplica a toda la línea de ${CHARS[k].name}</div>
      <div class="ps-grid">${list.map(sk => `<button type="button" class="ps-tile${eq === sk.id ? ' sel' : ''}" data-skin="${sk.id}" title="${sk.name}">${skinThumb(k, sk)}<b>${sk.name}</b></button>`).join('')}</div>

// Cambia de personaje en la pantalla de elección (flechas)
function pickMove(delta){
  const list = SEASONS.adventure.chars;
  let i = Math.max(0, list.indexOf(selectedKey));
  for (let n = 0; n < list.length; n++){
    i = (i + delta + list.length) % list.length;
    if (isUnlocked(list[i])) break;
  }
  selectedKey = list[i];
  showPicker();
}

let chestTex = null;
function getChestTex(){
  if (chestTex) return chestTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < 4; i++){
    x.fillStyle = i % 2 ? '#7a4a22' : '#9a6432';
    x.fillRect(0, i*32, 128, 32);
    x.fillStyle = '#4e2e12'; x.fillRect(0, i*32, 128, 2);
  }
  x.fillStyle = '#c9a227';                                // bandas metálicas
  x.fillRect(0, 20, 128, 10); x.fillRect(0, 98, 128, 10); x.fillRect(56, 0, 12, 128);
  x.fillStyle = '#fff3a0'; x.fillRect(58, 56, 8, 12);    // cerradura
  chestTex = new THREE.CanvasTexture(c);
  chestTex.magFilter = THREE.NearestFilter;
  return chestTex;
}
function makeChest(){
  const mat = new THREE.MeshBasicMaterial({map: getChestTex()});
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.7), mat);
  body.position.y = 0.25;

  lid.position.set(0, 0.1, 0.35);
  pivot.add(lid);
  group.add(pivot);
  group.add(makeShadow(1.3));
  return {group, pivot};
}

function digivolve(){

  const evo = line[st - 1];

  g.p.dmg *= 1.2;

  g.evoAnim = {t: 0, dur: 2.6, swapped: false, sprite: spriteOf(g.ch.id, st), name: evo.name};
  shake = Math.max(shake, 0.5);

}

// Animación de digievolución: 0-0.6 s brillo y temblor, cambio de sprite con destello y anillo, 0.6-1.6 s asentamiento
let screenFlash = 0;
let shake = 0;          // intensidad de la sacudida de cámara
let rings = [];
// Anillo que se expande: radius = radio final en unidades del mundo; life = duración en segundos
function spawnRing(x, z, color = 0xffd54f, radius = null, life = 0.7){

// ---------- Digivice de la digievolución (dispositivo azul brillante generado con canvas) ----------
let digiviceTex = null;
function getDigiviceTex(){
  if (digiviceTex) return digiviceTex;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const halo = x.createRadialGradient(128, 128, 20, 128, 128, 128);
  halo.addColorStop(0, 'rgba(120,220,255,0.7)');
  halo.addColorStop(1, 'rgba(120,220,255,0)');
  x.fillStyle = halo; x.fillRect(0, 0, 256, 256);
  const body = x.createLinearGradient(0, 30, 0, 226);
  body.addColorStop(0, '#eaffff'); body.addColorStop(0.5, '#4fc3f7'); body.addColorStop(1, '#0d3f8f');
  x.beginPath(); x.ellipse(128, 128, 96, 112, 0, 0, Math.PI*2);
  x.fillStyle = body; x.fill();
  x.lineWidth = 6; x.strokeStyle = '#bff1ff'; x.stroke();
  x.fillStyle = '#06142b'; x.fillRect(78, 88, 100, 80);            // pantalla
  x.strokeStyle = 'rgba(79,195,247,0.8)'; x.lineWidth = 2;
  for (let i = 1; i < 4; i++){ x.beginPath(); x.moveTo(78 + i*25, 88); x.lineTo(78 + i*25, 168); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,0.35)';                           // brillo
  x.beginPath(); x.ellipse(118, 100, 28, 8, -0.2, 0, Math.PI*2); x.fill();
  for (const bx of [36, 220]){                                      // botones laterales
    x.beginPath(); x.arc(bx, 128, 12, 0, Math.PI*2);
    x.fillStyle = '#29b6f6'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#e1f5fe'; x.stroke();
  }
  digiviceTex = new THREE.CanvasTexture(c);
  return digiviceTex;
}
// Digivice que aparece sobre el personaje con un haz de luz, gira y se apaga al evolucionar
function updateDigivice(a, p, dt){
  if (!a.dv){
    a.dv = new THREE.Sprite(new THREE.SpriteMaterial({map: getDigiviceTex(), transparent: true, depthWrite: false,
      depthTest: false, blending: THREE.AdditiveBlending, opacity: 0}));
    a.dv.renderOrder = 12;
    world.add(a.dv);
    a.beam = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 16, 20, 1, true),
      new THREE.MeshBasicMaterial({color: 0x66ccff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
        depthWrite: false, side: THREE.DoubleSide}));
    world.add(a.beam);
  }
  const t = a.t;
  const grow = Math.min(1, t/0.6);
  const fade = t > 0.6 ? Math.max(0, 1 - (t - 0.6)/1.4) : 1;
  const pulse = 0.85 + 0.15*Math.sin(t*30);
  a.dv.position.set(p.x, terrainH(p.x, p.z) + 3.4 + Math.sin(t*6)*0.15, p.z);
  a.dv.scale.setScalar((3.2 + 1.2*grow) * pulse);
  a.dv.material.rotation += dt*(1.5 + 4*grow);
  a.dv.material.opacity = Math.min(1, t/0.15) * fade;
  a.beam.position.set(p.x, terrainH(p.x, p.z) + 8*grow, p.z);
  a.beam.scale.set(1 + grow*1.5, Math.max(0.01, grow), 1 + grow*1.5);
  a.beam.material.opacity = 0.55 * fade * Math.min(1, t/0.2);
  if (t > 0.6 && !a.burst){ a.burst = true; spawnRing(p.x, p.z); spawnRing(p.x, p.z); }
}
function removeDigivice(a){
  if (a.dv){ world.remove(a.dv); a.dv.material.dispose(); }
  if (a.beam){ world.remove(a.beam); a.beam.geometry.dispose(); a.beam.material.dispose(); }
}

function animateEvo(dt){
  for (const r of rings){
    r.t += dt;
    r.mesh.scale.setScalar(1 + r.t*r.grow);
    r.mesh.material.opacity = Math.max(0, 1 - r.t/r.life);
  }
  rings = rings.filter(r => {
    if (r.t < r.life) return true;
    world.remove(r.mesh); return false;
  });
  screenFlash = Math.max(0, screenFlash - dt*1.5);
  document.getElementById('flash').style.opacity = screenFlash;

  const a = g && g.evoAnim;
  if (!a) return;
  a.t += dt;
  const m = g.playerMesh, p = g.p;
  // Malla de alambre (icosaedro) que crece alrededor del personaje y se desvanece
  if (!a.wire){
    a.wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshBasicMaterial({color: 0x4fc3f7, wireframe: true, transparent: true}));
    world.add(a.wire);
  }
  a.wire.scale.setScalar(a.t < 0.6 ? 1.2 + 2.5*(a.t/0.6) : 3.7 + 2*(a.t-0.6));
  a.wire.position.set(p.x, terrainH(p.x, p.z) + 1.1, p.z);
  a.wire.material.opacity = a.t < 0.6 ? 1 : Math.max(0, 1 - (a.t-0.6)/0.6);
  a.wire.rotation.y += dt*4;
  a.wire.rotation.x += dt*2;
  updateDigivice(a, p, dt);
  if (a.t < 0.6){
    const glow = 1 + 1.5*Math.pow(Math.sin(a.t*40), 2);
    m.material.color.setRGB(glow, glow, glow);
    m.scale.set(2.9 + 0.4*(a.t/0.6), 2.9 + 0.4*(a.t/0.6), 1);
    m.position.x = p.x + (Math.random()-0.5)*0.25;
    m.position.z = p.z + (Math.random()-0.5)*0.25;
  } else if (!a.swapped){
    a.swapped = true;
    m.material.map = animTex(a.sprite, true);
    m.material.needsUpdate = true;
    spawnRing(p.x, p.z);
    popText(p.x, p.z, `¡${a.name}!`, '#ffd54f', 2.2);
    screenFlash = 1;
  } else {
    const e = Math.min(1, (a.t - 0.6) / 2.0);
    const s = 3.3 - 0.4*e;
    m.scale.set(s, s, 1);
    m.material.color.setRGB(1, 1, 1);
  }
  if (a.t >= a.dur){
    m.scale.set(2.9, 2.9, 1);
    m.material.color.setRGB(1, 1, 1);
    world.remove(a.wire);
    a.wire.geometry.dispose(); a.wire.material.dispose();
    removeDigivice(a);
    g.evoAnim = null;
  }
}

// BONK: al estar cargado (100%), libera una onda que daña y empuja a los enemigos cercanos y borra los proyectiles del jefe
function addBonk(v){

function bonkRelease(){
  if (!g || g.bonk < 100) return;
  g.bonk = 0;
  const p = g.p, R = 14;
  for (const e of g.enemies){
    const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz);
    if (d > R) continue;
    e.hp -= 80;
    [e.x, e.z] = clampArena(e.x + dx/(d || 1)*6, e.z + dz/(d || 1)*6, ARENA_R - 0.5);

  for (const s of g.eshots) s.life = 0;   // el bucle de proyectiles retira las bolas del jefe

  spawnRing(p.x, p.z, 0xffd54f, 14, 0.5);
  screenFlash = 0.6;
  sfx('evolve');
  g.bonks = (g.bonks || 0) + 1;

}

let dmgSrc = 'base';   // qué ataque está golpeando (para el resumen de fin de partida)
function hurt(e, dmg){
  // 12% de golpes críticos: doble daño, número naranja y sacudida ligera
  const crit = (g.critT || 0) > 0 || Math.random() < g.p.critChance;
  if (BEATS[g.attr] === attrOf(e)) dmg *= ATTR_ADV;               // ventaja de atributo
  dmg *= (g.evoSk && g.evoSk[dmgSrc]) || 1;                        // habilidad evolucionada
  if (crit){ dmg *= g.p.critMul; shake = Math.max(shake, 0.2); }
  e.hp -= dmg;
  g.dmgBy[dmgSrc] = (g.dmgBy[dmgSrc] || 0) + dmg;
  popText(e.x, e.z, Math.round(dmg), crit ? '#ffb300' : '#ffffff', crit ? 0.8 : 0.55);
  burst(e.x, e.z, hitColors[e.kind] || '#ffe082');
  sfx('hit');
}

// Cofres: abren una elección de 1 entre 3 cartas. Los dorados (élites y jefes menores) aplican la carta dos veces
function openChest(c){
  if (!g || c.open) return;
  c.open = true; c.openT = 2;
  c.pivot.rotation.x = -1.5;
  if (!(g.mod && g.mod.noHeal)) g.p.hp = Math.min(g.p.maxHp, g.p.hp + 15);
  g.chestsOpened = (g.chestsOpened || 0) + 1;
  sfx('chest');
  g.chestPick = {gold: !!c.gold};
  g.choices = upgradeChoices();
  openUpgrades();
}
function spawnChestAt(x, z, gold){
  const [cx, cz] = clampArena(x, z, ARENA_R - 2);
  const {group, pivot} = makeChest();
  if (gold){
    group.scale.setScalar(1.3);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.75, 0.95, 32), new THREE.MeshBasicMaterial({color: 0xffd54f, transparent: true, opacity: 0.85, depthWrite: false}));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.03; group.add(ring);
  }
  group.position.set(cx, terrainH(cx, cz), cz);
  world.add(group);
  g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false, gold: !!gold});
}
function tryDash(){
  if (!g || g.dashCd > 0 || g.dash > 0) return;
  g.dash = 0.18;   // segundos de dash (invulnerable)
  g.dashCd = 2.5*(g.p.dashMul || 1);  // cooldown
  g.dashUsed = true;
  // Esquiva perfecta: dash con un enemigo pegado o un proyectil del jefe a punto de dar
  const p = g.p;
  const close = g.enemies.some(e => dist2(e.x, e.z, p.x, p.z) < e.r + 1.1) || g.eshots.some(s => dist2(s.x, s.z, p.x, p.z) < 2.2);
  if (close && (g.perfectCd || 0) <= 0){
    g.slowT = 1; g.perfectCd = 4;
    addBonk(10);
    popText(p.x, p.z, '¡Esquiva perfecta!', '#40c4ff', 1);
    sfx('ready');
  }
}
function dist2(ax, az, bx, bz){ return Math.hypot(ax-bx, az-bz); }

// Los enemigos siguen el poder del jugador: cada digievolución les da más vida y daño
// Los enemigos nuevos solo ganan un 10% de vida por cada etapa (antes +25% vida y +10% daño: evolucionar no compensaba).
// La evolución de emergencia no cuenta: es temporal.
// Quedarse quieto: a partir de 2,5 s el daño por contacto sube hasta x2,5 en 5 s más
function idleMul(){ const t = (g.idleT || 0) - 2.5; return t > 0 ? 1 + Math.min(1.5, t*0.3) : 1; }
function evoStage(){ return g.emergT > 0 ? (g.emergPrev | 0) : (g.ch.evolved | 0); }
function evoHp(){ return Math.pow(1.1, evoStage()); }
function evoDmg(){ return 1; }
// Dificultad de la partida (modo difícil, para jugadores experimentados). Multiplicadores sobre la base:
// vida y daño de enemigos y minijefes, ritmo de aparición (menor = más enemigos) y tiempo entre élites
const DIFF = {hp: 1.35, dmg: 1.35, spawn: 0.75, eliteT: 35, spawnMin: 0.22};
// La dificultad sube poco a poco: al principio es la normal y llega a la del modo difícil en el minuto 10
const diffMul = k => (lvlDiff()[k] || 1) * (1 + (DIFF[k] - 1) * Math.min(1, (g ? g.t : 0) / 600)) * (k === 'spawn' ? 1 / infMul() : infMul());
const eliteGap = () => (45 + (DIFF.eliteT - 45) * Math.min(1, (g ? g.t : 0) / 600)) * lvlDiff().elite / infMul();
// Infierno: tras 20 minutos en la misma pantalla todo se multiplica sin parar (+100% cada 15 s)
const infMul = () => (g && g.inferno) ? 1 + Math.max(0, g.screenT - SCREEN_LIMIT) / 15 : 1;
// Tiempo que cuenta para la dificultad: igual que el tiempo real hasta el minuto 10 (la dificultad de siempre)
// y después avanza a 0,3 para que el minuto 20 no sea imposible
// En Supervivencia no hay jefe final: la dificultad no se suaviza tras el minuto 10
const diffT = t => (g && g.mode === 'surv') ? t : (t <= 600 ? t : 600 + (t - 600) * 0.3);
let runMode = 'normal';   // 'normal' o 'surv' (lo elige el menú antes del selector)
function spawnEnemy(forced){
  const t = g.t, r = Math.random(), a = Math.random()*Math.PI*2, R = (g.idleT || 0) > 2.5 ? 13 : 25;
  let kind = 'basic';
  const z2 = g.zone >= 2;   // la zona 2 trae más tanques y rápidos
  if (forced) kind = forced;
  else if (g.mod && g.mod.fastOnly && t > 20) kind = 'fast';
  else if (t > 120 && r < (z2 ? 0.3 : 0.2)) kind = 'tank';
  else if (t > 60 && r < (z2 ? 0.5 : 0.4)) kind = 'fast';
  const tt = diffT(t);
  const d = ENEMY[kind], k = 1 + tt/45 + (tt/170)*(tt/170);   // vida: igual que siempre hasta el minuto 10
  const pool = (zoneDef().foes || ZONE_FOES[g.zone - 1])[kind], sprite = pool ? pool[Math.floor(Math.random()*pool.length)] : d.sprite;
  const mesh = billboard(sprite, d.scale);
  mesh.position.y = d.scale/2;
  world.add(mesh);
  const sp = clampArena(g.p.x + Math.cos(a)*R, g.p.z + Math.sin(a)*R, ARENA_R - 0.5);
  const shadow = Q.shadows ? makeShadow(d.r*2.2) : new THREE.Object3D();
  world.add(shadow);
  g.enemies.push({
    kind, sprite, mesh, shadow, x: sp[0], z: sp[1],
    hp: d.hp*k*evoHp()*diffMul('hp'), max: d.hp*k*evoHp()*diffMul('hp'), spd: d.spd, r: d.r, xp: d.xp, dmg: d.dmg*(1 + tt/300)*evoDmg()*diffMul('dmg'), cd: 0
  });
}

// Santuarios: 6 por partida en el mapa. Al pasar por uno, un efecto para el resto de la partida (una sola vez)
const SHRINE_TYPES = [
  {name: 'Santuario de curación', col: 0x7cf29c, text: '+40 PS', apply: g => { if (!(g.mod && g.mod.noHeal)) g.p.hp = Math.min(g.p.maxHp, g.p.hp + 40); }},
  {name: 'Santuario de poder', col: 0xff7043, text: '+10% daño', apply: g => { g.p.dmg *= 1.1; }},
  {name: 'Santuario veloz', col: 0x40c4ff, text: '+8% velocidad', apply: g => { g.p.speed *= 1.08; }},
  {name: 'Santuario de área', col: 0xce93d8, text: '+10% área', apply: g => { g.p.area *= 1.1; }},
  {name: 'Santuario de tickets', col: 0xffd54f, text: '+1 ticket del permanente', apply: () => addTickets('std', 1)},
  {name: 'Santuario maldito', col: 0x8e24aa, text: '+25% daño · −20 vida máx.', apply: g => { g.p.dmg *= 1.25; g.p.maxHp = Math.max(30, g.p.maxHp - 20); g.p.hp = Math.min(g.p.hp, g.p.maxHp); }}
];
function initShrines(){
  g.shrines = [];
  for (let i = 0; i < 3; i++){   // 3 santuarios por partida
    const type = SHRINE_TYPES[Math.floor(Math.random()*SHRINE_TYPES.length)];   // tipo al azar entre todos
    const a = Math.random()*Math.PI*2, R = 22 + Math.random()*68;
    const [x, z] = clampArena(Math.cos(a)*R, Math.sin(a)*R, ARENA_R - 6);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 2.2, 10), new THREE.MeshBasicMaterial({color: type.col}));
    mesh.position.set(x, 1.1 + terrainH(x, z), z);
    world.add(mesh);
    // Círculo en el suelo con el radio real de carga
    const ring = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: type.col, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false}));
    ring.rotation.x = -Math.PI/2; ring.scale.setScalar(SHRINE_RANGE); ring.position.set(x, terrainH(x, z) + 0.08, z);
    world.add(ring);
    g.shrines.push({x, z, type, mesh, ring, used: false});
  }
}
// Para cargar un santuario hay que quedarse dentro de su círculo unos 3 segundos; si te alejas, la carga baja
const SHRINE_CHARGE = 3, SHRINE_RANGE = 2.2;
// Aviso con la cuenta atrás mientras se carga un santuario
function shrineHud(sh){
  let el = document.getElementById('shrineHud');
  if (!el){
    el = document.createElement('div');
    el.id = 'shrineHud';
    el.style.cssText = 'position:fixed;left:50%;bottom:92px;transform:translateX(-50%);min-width:280px;padding:10px 16px;border-radius:12px;background:rgba(8,14,30,.94);border:2px solid #ffd54f;color:#fff;font:700 14px system-ui,sans-serif;text-align:center;z-index:9;pointer-events:none';
    el.innerHTML = '<div id="shrineTxt"></div><div style="height:10px;margin-top:6px;border-radius:5px;background:#1b2740;overflow:hidden"><div id="shrineBar" style="height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#fff59d)"></div></div>';
    document.body.appendChild(el);
  }
  if (!sh){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.style.borderColor = '#' + sh.type.col.toString(16).padStart(6, '0');
  const left = Math.max(0, SHRINE_CHARGE - sh.charge);
  document.getElementById('shrineTxt').textContent = `${sh.type.name} · ${left > 0.05 ? 'mantente dentro: ' + left.toFixed(1) + ' s' : '¡listo!'}`;
  document.getElementById('shrineBar').style.width = (100 * sh.charge / SHRINE_CHARGE).toFixed(0) + '%';
}
function updateShrines(dt){
  if (!g.shrines) initShrines();
  let charging = null;
  for (const sh of g.shrines){
    if (sh.used) continue;
    const inside = dist2(sh.x, sh.z, g.p.x, g.p.z) < SHRINE_RANGE;   // dist2 ya es la distancia (no al cuadrado)
    sh.charge = Math.max(0, Math.min(SHRINE_CHARGE, (sh.charge || 0) + (inside ? dt : -dt*0.5)));
    sh.mesh.scale.y = 1 + 0.6 * (sh.charge / SHRINE_CHARGE);   // el santuario crece mientras se carga
    if (inside && sh.charge > 0 && !sh.used) charging = sh;
    if (inside && sh.charge >= SHRINE_CHARGE){
      sh.used = true; world.remove(sh.mesh); if (sh.ring) world.remove(sh.ring);
      sh.type.apply(g);
      announce(sh.type.name, sh.type.text, '#' + sh.type.col.toString(16).padStart(6, '0'));
      sfx('ready');
    }
  }
  shrineHud(charging);
}
function spawnChest(p){
  const a = Math.random()*Math.PI*2, R = 10 + Math.random()*8;
  const [cx, cz] = clampArena(p.x + Math.cos(a)*R, p.z + Math.sin(a)*R, ARENA_R - 2);
  const {group, pivot} = makeChest();
  group.position.set(cx, terrainH(cx, cz), cz);
  world.add(group);
  g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false});
}
// Imán total: objeto que cae del 2% de los enemigos y se recoge pasando por encima
function spawnMagnetDrop(x, z){
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.14, 8, 18), new THREE.MeshBasicMaterial({color: 0xff4081}));
  mesh.rotation.x = Math.PI/2;
  world.add(mesh);
  g.drops.push({x, z, mesh, taken: false});
}
function fireProjectile(x, z, vx, vz, dmg, life, color){
  const mesh = new THREE.Mesh(SPROJ_GEO, matFor(color));
  mesh.position.set(x, 0.9 + terrainH(x, z), z);
  world.add(mesh);
  g.shots.push({x, z, vx, vz, dmg, life, mesh, r: 0.3});
  sfx('shoot');
}

function update(dt){
  const p = g.p, ch = g.ch;
  g.t += dt;

  // Movimiento (ejes del mundo)
  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup'])    mz -= 1;
  if (keys['s'] || keys['arrowdown'])  mz += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  let amt = 1;   // joystick táctil: velocidad proporcional a cuánto se empuja
  if (!mx && !mz && tMove.m > 0){ mx = tMove.x; mz = tMove.z; amt = tMove.m; }
  g.dashCd = Math.max(0, g.dashCd - dt);
  if (g.dash > 0){
    g.dash -= dt;
    p.x += g.dir.x * 22 * dt;
    p.z += g.dir.z * 22 * dt;
  } else if (mx || mz){
    // Movimiento relativo a la cámara: W avanza hacia donde mira la cámara
    const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
    const wx = mx*cy + mz*sy, wz = -mx*sy + mz*cy;
    const L = Math.hypot(wx, wz);
    const k = waterSlow(p.x, p.z) * (g.inSlow ? 0.5 : 1);   // estanque y zona de concierto de Etemon frenan
    p.x += wx/L * p.speed * k * amt * dt;
    p.z += wz/L * p.speed * k * amt * dt;
    g.dir = {x: wx/L, z: wz/L};
  }
  // Salto: gravedad simple
  if (p.y > 0 || p.vy !== 0){
    p.vy -= 30*dt;
    p.y += p.vy*dt;
    if (p.y <= 0){ p.y = 0; p.vy = 0; }
  }
  // El jugador no puede salir del escenario (las montañas empiezan en ARENA_R - 1)
  [p.x, p.z] = clampArena(p.x, p.z, ARENA_R - 2);
  resolveSolids(p, 0.5, p.y);   // los obstáculos del mapa bloquean al jugador

  // Avisos de fase: hordas a los 45 s y aviso del jefe 15 s antes
  if (g.zone < 2 && g.t >= ZONE2_AT){ if (isPortalMap()){ if (g.mode === 'surv') enterScreen(2); } else setZone(2); }
  if (!g.hordeWarned && g.t >= 45){ g.hordeWarned = true; announce('¡HORDAS!', 'Más enemigos aparecen', '#ef5350'); }
  if (g.mode !== 'surv' && !isPortalMap() && !g.bossWarned && g.t >= BOSS_AT - 15){ g.bossWarned = true; announce('Algo se acerca…', 'Piedmon llega en 15 s', '#ce93d8'); }
  updateScreenClock(dt);
  updatePortal(dt);
  if (g.mode === 'surv') updateWaves();

  // Quedarse quieto: tras 2,5 s sin moverte, los enemigos salen más deprisa y más cerca
  const mvd = Math.hypot(g.p.x - (g.lastPx ?? g.p.x), g.p.z - (g.lastPz ?? g.p.z));
  g.idleT = mvd > 0.02 ? 0 : (g.idleT || 0) + dt;
  g.lastPx = g.p.x; g.lastPz = g.p.z;
  if (g.idleT > 2.5 && !g.idleWarned){ g.idleWarned = true; announce('¡Muévete!', 'Quieto recibes cada vez más daño y te rodean', '#ef5350'); }
  if (g.idleT <= 2.5) g.idleWarned = false;

  // Aparición
  g.spawnT -= dt * (g.idleT > 2.5 ? 1.8 : 1);
  if (g.spawnT <= 0){
    if (g.enemies.length < MAX_ENEMIES) spawnEnemy();
    // Presión creciente: tras 45 s salen más enemigos por tanda (1 extra, +1 cada 90 s, máximo 3)
    const extra = g.t > 45 ? Math.min(3, 1 + Math.floor(diffT(g.t)/90)) : 0;
    for (let i = 0; i < extra && g.enemies.length < MAX_ENEMIES; i++) spawnEnemy();
    g.spawnT = Math.max(DIFF.spawnMin, (0.9 - diffT(g.t)/180) * diffMul('spawn')) * ((g.mod && g.mod.spawnMul) || 1);
  }

  // Minijefes en sus minutos
  while (g.mode !== 'surv' && mapDef().minis && g.miniI < MINIS.length && g.t >= MINIS[g.miniI].at) spawnMini(MINIS[g.miniI++]);
  // Fase extra: un jefe especial cada 40 s
  if (g.extraOn && !g.extraSpawned && g.t >= g.extraNext){ spawnSpecial(); g.extraSpawned = true; }

  // Élites: cada 45 s desde el minuto 1; a partir del minuto 5 salen de dos en dos
  g.eliteT -= dt;
  if (g.eliteT <= 0){
    g.eliteT = eliteGap();
    const n = g.t >= 300 ? 2 : 1;
    for (let i = 0; i < n; i++) spawnEnemy('elite');
    announce('¡Élite!', n > 1 ? 'Dos Digimon élite se acercan' : 'Un Digimon élite se acerca', '#ff7043');
  }

  // Enemigos: persiguen y dañan por contacto
  if (g.critT > 0) g.critT -= dt;
  for (const e of g.enemies){
    if (e.frozenT > 0){ e.frozenT -= dt; continue; }   // congelado o atrapado por el Bonk: ni se mueve ni daña
    const dx = p.x - e.x, dz = p.z - e.z, d = Math.hypot(dx, dz) || 1;
    if (e.golden){ [e.x, e.z] = clampArena(e.x - dx/d*e.spd*dt, e.z - dz/d*e.spd*dt, ARENA_R - 2); continue; }   // el Numemon dorado huye
    // Se paran a distancia de contacto (no se meten encima del jugador)
    if (d > e.r + 0.6){
      e.x += dx/d * e.spd * dt;
      e.z += dz/d * e.spd * dt;
    }
    [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);   // los enemigos también quedan dentro
    resolveSolids(e, e.r*0.8);                          // y no atraviesan casas ni vallas
    e.cd -= dt;
    if (d < e.r + 0.8 && g.dash <= 0){ p.hp -= e.dmg * foeMul(e) * (p.armor || 1) * idleMul() * (g.inferno && !e.boss ? Math.sqrt(infMul()) : 1) * dt; shake = Math.max(shake, 0.12); }
  }

  // Armas
  g.wCd -= dt;
  if (ch.kind === 'shot' && g.wCd <= 0 && g.enemies.length){
    g.wCd = ch.cd * p.cdMul; g.atkT = 0.26;
    const sorted = [...g.enemies].sort((a,b) => dist2(a.x,a.z,p.x,p.z) - dist2(b.x,b.z,p.x,p.z));
    for (let i = 0; i < Math.min(p.count, sorted.length); i++){
      const e = sorted[i], d = dist2(e.x, e.z, p.x, p.z) || 1;
      fireProjectile(p.x, p.z, (e.x-p.x)/d*14, (e.z-p.z)/d*14, ch.dmg*p.dmg, 1.6, 0xffb74d);
    }
  }
  if (ch.kind === 'ring' && g.wCd <= 0){
    g.wCd = ch.cd * p.cdMul; g.atkT = 0.26;
    const n = 6*p.count, off = Math.random()*Math.PI*2;
    for (let i = 0; i < n; i++){
      const an = off + i/n*Math.PI*2;
      fireProjectile(p.x, p.z, Math.cos(an)*9, Math.sin(an)*9, ch.dmg*p.dmg, 0.9, 0x4fc3f7);
    }
  }

  // Proyectiles
  for (const s of g.shots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 0.9 + terrainH(s.x, s.z), s.z);
    if (s.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp > 0 && dist2(s.x, s.z, e.x, e.z) < e.r + s.r){
        hurt(e, s.dmg); s.life = 0; break;
      }
    }
  }
  g.shots = g.shots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Cuchillas orbitales
  if (ch.kind === 'orbit'){
    g.orbitA += dt*3.2;
    const n = p.count + 1, R = 2.2*p.area;
    while (g.blades.length < n){
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), new THREE.MeshBasicMaterial({color:0xa5d6a7}));
      world.add(m); g.blades.push(m);
    }
    while (g.blades.length > n){ world.remove(g.blades.pop()); }
    for (let i = 0; i < n; i++){
      const an = g.orbitA + i*Math.PI*2/n;
      const bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      g.blades[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.cd <= 0 && dist2(bx, bz, e.x, e.z) < e.r + 0.5){
          hurt(e, ch.dmg*p.dmg); e.cd = 0.35;
        }
      }
    }
  } else if (g.blades.length){
    for (const m of g.blades) world.remove(m);
    g.blades = [];
  }

  updateSkills(dt);

  // Muertes
  const dead = g.enemies.filter(e => e.hp <= 0);
  for (const e of dead){
    if (g.p.lifesteal && !(g.mod && g.mod.noHeal)) g.p.hp = Math.min(g.p.maxHp, g.p.hp + g.p.lifesteal);
    g.gems.push({x:e.x, z:e.z, v:e.xp*(1 + g.t/600), heal: !(g.mod && g.mod.noHeal) && Math.random() < 0.10, mesh: null});   // las bajas valen más según avanza la partida
    // 2% por baja, pero con enfriamiento de 45 s y un solo imán en el mapa a la vez
    if ((g.magnetT || 0) <= 0 && Math.random() < 0.02){ spawnMagnetDrop(e.x, e.z); g.magnetT = 45; }
    // Tickets de tirada: 25% de cada élite y 3 seguros del jefe
    if (e.kind === 'elite' && Math.random() < 0.25){ g.tix++; popText(e.x, e.z, '+1 ticket', '#3de0ff', 1); }
    if (e.kind === 'mini'){ g.tix++; announce('¡' + e.name + ' derrotado!', '+1 ticket de tirada · cofre dorado', '#3de0ff'); spawnChestAt(e.x, e.z, true); if (!e.special){ (g.minisKilled || (g.minisKilled = [])).push(e.name); grantEmblem(); } }
    if (e.kind === 'elite' && Math.random() < 0.3) spawnChestAt(e.x, e.z, true);   // 30% de las élites dejan un cofre dorado
    if (e.boss) g.tix += 3;
    world.remove(e.mesh);
    world.remove(e.shadow);
  }
  if (dead.length) sfx('kill');
  if (dead.length){
    shake = Math.max(shake, Math.min(0.5, 0.1*dead.length));
    if (dead.some(e => e.kind === 'elite' || e.kind === 'mini' || e.boss)) shake = Math.max(shake, 0.7);
    addBonk(0.35*dead.length);
  }
  g.kills += dead.length;
  if (dead.length){ g.combo += dead.length; g.comboT = 3; }
  g.comboT -= dt;
  if (g.comboT <= 0) g.combo = 0;
  g.enemies = g.enemies.filter(e => e.hp > 0);

  // Imán total: al recogerlo, todas las gemas del mapa vuelan hacia el jugador
  for (const dr of g.drops){
    dr.mesh.rotation.y += dt*4;
    dr.mesh.position.set(dr.x, 0.6 + terrainH(dr.x, dr.z) + Math.sin(g.t*4)*0.1, dr.z);
    if (!dr.taken && dist2(dr.x, dr.z, p.x, p.z) < 1.4){
      dr.taken = true; world.remove(dr.mesh);
      for (const gm of g.gems) gm.attract = true;
      announce('¡Imán total!', 'Toda la experiencia del mapa va hacia ti', '#ff4081');
      sfx('chest');
    }
  }
  g.drops = g.drops.filter(dr => !dr.taken);

  // Gemas de XP
  for (const gm of g.gems){
    if (!gm.mesh){
      gm.mesh = new THREE.Mesh(gm.heal ? GEM_HEAL_GEO : GEM_GEO, matFor(gm.heal ? 0x66bb6a : 0x29b6f6));
      world.add(gm.mesh);
    }
    const d = dist2(gm.x, gm.z, p.x, p.z), dd = d || 1;
    if (d < p.pickup || gm.attract){
      const sp = gm.attract ? Math.max(12, d*8) : 12;   // con el imán total se acercan en pocos segundos
      gm.x += (p.x-gm.x)/dd * sp*dt;
      gm.z += (p.z-gm.z)/dd * sp*dt;
    }
    gm.mesh.position.set(gm.x, 0.4 + terrainH(gm.x, gm.z), gm.z);
    gm.mesh.rotation.y += dt*3;
    if (d < 0.9){
      gm.taken = true; world.remove(gm.mesh);
      if (gm.heal){ p.hp = Math.min(p.maxHp, p.hp + 10); popText(gm.x, gm.z, '+10', '#7cf29c'); sfx('chest'); }
      else { p.xp += gm.v * (g.labXp || 1); addBonk(0.02); }
    }
  }
  g.gems = g.gems.filter(gm => !gm.taken);

  updateShrines(dt);
  updateBossMechanics(dt);
  updateMapEvent(dt);
  updateSupport(dt);
  updateEmergency(dt);
  if (g.regen && !(g.mod && g.mod.noHeal)) p.hp = Math.min(p.maxHp, p.hp + g.regen*dt);
  // Cofres: aparecen cada 50 s (máximo 2 vivos) y dan una mejora aleatoria al pasar por encima
  g.chestT -= dt;
  g.magnetT = Math.max(0, (g.magnetT || 0) - dt);
  if (g.chestT <= 0){
    g.chestT = 50;
    // Como mucho 2 cofres vivos a la vez: si ya hay dos en el mapa, no sale otro
    if (g.chests.filter(c => !c.gone && !c.open).length < 2) spawnChest(p);
  }
  g.nearChest = null;
  let best = 2.0;
  for (const c of g.chests){
    if (c.open){
      c.openT -= dt;
      if (c.openT <= 0){ world.remove(c.group); c.gone = true; }
      continue;
    }
    const d = dist2(c.x, c.z, p.x, p.z);
    if (d < best){ best = d; g.nearChest = c; }
  }
  g.chests = g.chests.filter(c => !c.gone);
  if (g.flashT > 0) g.flashT -= dt;

  // Números de daño: suben y se desvanecen
  for (const t of g.texts){
    t.life -= dt;
    t.s.position.y += dt*1.2;
    t.mat.opacity = Math.max(0, t.life/0.7);
  }
  for (const t of g.texts.filter(t => t.life <= 0)){
    world.remove(t.s); t.tex.dispose(); t.mat.dispose();
  }
  g.texts = g.texts.filter(t => t.life > 0);

  // Jefe final: aparece a los 240 s y lanza anillos de proyectiles
  if (g.mode !== 'surv' && !isPortalMap() && !g.bossSpawned && g.t >= BOSS_AT){
    g.bossSpawned = true; g.bossName = 'Piedmon';
    const mesh = billboard('sprites/adventure/piedmon.png', 5.4);
    world.add(mesh);
    const shadow = makeShadow(5);
    world.add(shadow);
    g.boss = {kind: 'boss', boss: true, mesh, shadow, x: p.x + 14, z: p.z, hp: 2400*evoHp(), max: 2400*evoHp(),
              spd: 2.2, r: 2.4, xp: 40, dmg: 15, cd: 0};
    g.enemies.push(g.boss);
    g.bossShotT = 2;
    sfx('boss');
    announce('¡JEFE FINAL!', 'Piedmon, líder de los Dark Masters', '#ce93d8');
  }
  if (g.boss && g.enemies.includes(g.boss)){
    g.bossShotT -= dt;
    bossPhases(dt);
    // Aviso: un anillo rojo se encoge sobre el jefe 0.8 s antes de cada disparo
    if (g.bossShotT <= 0.8){
      if (!g.bossRing) g.bossRing = makeBossRing();
      const prog = 1 - Math.max(0, g.bossShotT) / 0.8;
      g.bossRing.position.set(g.boss.x, terrainH(g.boss.x, g.boss.z) + 0.15, g.boss.z);
      g.bossRing.scale.setScalar(1 + 6*(1 - prog));
      g.bossRing.material.opacity = 0.25 + 0.6*prog;
    }
    if (g.bossShotT <= 0){
      const bd = g.boss.def || {};
      const b = g.boss, ph = b.phase || 1;
      g.bossShotT = (bd.gap || 2.5) * (ph === 3 ? 0.75 : 1);
      clearBossRing();
      const ns = Math.round((bd.shots || 10) * [1, 1, 1.4, 1.7][ph]), spd = 6 + (ph - 1) * 1.2;
      for (let i = 0; i < ns; i++){
        const an = i/ns*Math.PI*2 + g.t;
        const shot = new THREE.Mesh(SPROJ_GEO, matFor(0xff1744));
        shot.position.set(b.x, 1 + terrainH(b.x, b.z), b.z);
        world.add(shot);
        g.eshots.push({x: b.x, z: b.z, vx: Math.cos(an)*spd, vz: Math.sin(an)*spd, life: 4, mesh: shot, dmg: bd.shotDmg || 8});
      }
    }
    // Mapa 3: el jefe único huye por el portal a mitad de vida en la primera pantalla
    if (g.boss.def && g.boss.def.retreatAt && g.boss.hp > 0 && g.boss.hp <= g.boss.max * g.boss.def.retreatAt) bossRetreat();
  } else if (g.boss && isPortalMap() && !g.bossDown){
    // Jefe de zona derrotado: en la primera pantalla abre el portal; en la última, victoria
    clearBossRing();
    const def = g.boss.def || {};
    g.boss = null;
    if (def.final) g.bossDown = true;
    else openPortal(def.name + ' derrotado');
  } else if (g.boss && !g.bossDown){
    g.bossDown = true;   // el jefe ha caído
    clearBossRing();
    // Jefe especial: 10% de que aparezca uno más, de entre tus Digimon desbloqueados
    if (specialPool().length && Math.random() < SPECIAL_CHANCE){
      g.extraOn = true; g.extraNext = g.t + 4; g.extraSpawned = false;
      announce('¡Algo se mueve!', 'Un jefe especial aparece', '#ffd54f');
    }
  }
  for (const s of g.eshots){
    s.x += s.vx*dt; s.z += s.vz*dt; s.life -= dt;
    s.mesh.position.set(s.x, 1 + terrainH(s.x, s.z), s.z);
    if (s.life > 0 && dist2(s.x, s.z, p.x, p.z) < 0.9 && g.dash <= 0){
      p.hp -= s.dmg * (p.armor || 1); s.life = 0; shake = Math.max(shake, 0.3);
    }
  }
  g.eshots = g.eshots.filter(s => {
    if (s.life > 0) return true;
    world.remove(s.mesh); return false;
  });

  // Subida de nivel
  if (p.xp >= p.nextXp){
    p.xp -= p.nextXp;
    p.lvl++;
    p.nextXp = Math.floor(2*(10 + 4*(p.lvl - 1) + 0.9*(p.lvl - 1)*(p.lvl - 1)));   // curva para 20 minutos: evoluciones hacia los minutos 3-4, 8 y 13 (medido con __dbk.sim)
    g.choices = upgradeChoices();
    const evoAt = evoLevelFor(g.ch.id, g.ch.evolved | 0);
    if (evoAt && p.lvl >= evoAt && (g.ch.evolved | 0) < EVO_LINE[g.ch.id].length) digivolve();
    g.pendingUp = true;
  }
  // Las mejoras aparecen cuando termina la animación de digievolución
  if (g.pendingUp && !g.evoAnim){
    g.pendingUp = false;
    openUpgrades();
  }

  // Fin
  if (p.hp <= 0 && g.revives > 0){
    // Segunda oportunidad del Laboratorio: vuelve con media vida y aparta a la horda
    g.revives--; p.hp = Math.round(p.maxHp * 0.5);
    for (const e of g.enemies){ if (e.boss || e.kind === 'mini') continue; const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz) || 1; if (d < 10) [e.x, e.z] = clampArena(e.x + dx/d*8, e.z + dz/d*8, ARENA_R - 0.5); }
    spawnRing(p.x, p.z, 0x7cf29c, 10, 0.6); screenFlash = 0.5;
    announce('¡Segunda oportunidad!', 'Laboratorio · 50% de vida', '#7cf29c');
  }
  if (p.hp <= 0){ p.hp = 0; endGame(false); }
  else if (g.bossDown && (!g.extraOn || (g.extraSpawned && !g.enemies.some(e => e.special && e.hp > 0)))) endGame(true);
}

// Radar de bordes: flechas en el borde de la pantalla hacia cofres y jefe que están fuera de vista
function drawEdgeMarkers(){
  const cv = document.getElementById('edgeCv');
  if (!cv) return;
  if (cv.width !== innerWidth || cv.height !== innerHeight){ cv.width = innerWidth; cv.height = innerHeight; }
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  if (state !== 'play' || !g) return;
  const targets = g.chests.filter(ch => !ch.open && !ch.gone).map(ch => ({x: ch.x, z: ch.z, col: '#ffd54f'}));
  if (g.boss && g.enemies.includes(g.boss)) targets.push({x: g.boss.x, z: g.boss.z, col: '#ce93d8'});
  if (g.portal && g.portalOpen) targets.push({x: PORTAL.x, z: PORTAL.z, col: '#3de0ff'});
  if (g.ev) for (const n of g.ev.nodes || [{x: g.ev.foe.x, z: g.ev.foe.z}]) if (!n.done) targets.push({x: n.x, z: n.z, col: '#7cf29c'});
  for (const e of g.enemies) if (e.kind === 'elite' || e.kind === 'mini') targets.push({x: e.x, z: e.z, col: e.kind === 'mini' ? '#ce93d8' : '#ff7043'});
  const W = cv.width, H = cv.height, cx = W/2, cy = H/2;
  for (const t of targets){
    const v = new THREE.Vector3(t.x, terrainH(t.x, t.z) + 1.5, t.z).project(camera);
    const sx = (v.x + 1)/2*W, sy = (1 - v.y)/2*H;
    const inside = v.z < 1 && sx > 40 && sx < W - 40 && sy > 40 && sy < H - 40;
    if (inside) continue;
    let dx = sx - cx, dy = sy - cy;
    if (v.z > 1){ dx = -dx; dy = -dy; }          // detrás de la cámara: la flecha apunta al lado correcto
    const k = Math.min((cx - 40)/Math.abs(dx || 1e-6), (cy - 40)/Math.abs(dy || 1e-6));
    const px = cx + dx*k, py = cy + dy*k;
    c.save(); c.translate(px, py); c.rotate(Math.atan2(dy, dx));
    c.fillStyle = t.col; c.strokeStyle = '#000'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(16, 0); c.lineTo(-9, -11); c.lineTo(-9, 11); c.closePath(); c.fill(); c.stroke();
    c.restore();
    c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 3; c.font = 'bold 13px system-ui'; c.textAlign = 'center';
    const d = Math.round(Math.hypot(t.x - g.p.x, t.z - g.p.z));
    c.strokeText(d + ' m', px, py - 16); c.fillText(d + ' m', px, py - 16);
  }
}
// ---------- Habilidades de ataque: se eligen al subir de nivel (hasta nivel 3) ----------
const SKILLS = {
  aura:     {name:'Aura de Datos',         k:'defensiva', d:'Anillo digital alrededor del Digimon: daña cada 0,25 s a quien entra en él.'},
  tornado:  {name:'Tornado Bit',           k:'defensiva', d:'Bits que giran a tu alrededor: empujan enemigos y frenan proyectiles del jefe.'},
  pulso:    {name:'Onda de Pulso',         k:'defensiva', d:'Onda de 360° cada pocos segundos que empuja a toda la horda.'},
  espiral:  {name:'Disparo Espiral',       k:'ofensiva',  d:'Proyectil rápido que atraviesa a los enemigos (2 al nivel 1).'},
  cuchilla: {name:'Cuchilla Persiguiente', k:'ofensiva',  d:'Hojas de energía que buscan al enemigo más fuerte de la pantalla.'},
  laser:    {name:'Rayo Láser',            k:'ofensiva',  d:'Haz neón hacia el enemigo más cercano; atraviesa a los que están en línea.'},
  mina:     {name:'Mina Digital',          k:'utilidad',  d:'Dejas minas al moverte; explotan en área cuando un enemigo las pisa.'},
  meteoro:  {name:'Lluvia de Meteoros',    k:'ofensiva',  d:'Impactos aleatorios cerca de ti, avisados con un círculo en el suelo.'}
};
const SKILL_MAX = 3;      // niveles por habilidad
const SKILL_K = 0.8;      // factor de daño de las habilidades: regulado para partidas de 20 minutos
const SKILL_SLOTS = 3;   // habilidades distintas que puedes llevar en una partida
// Cada Digimon tiene su propio grupo de 4 ataques (de los 8 disponibles)
const CHAR_SKILLS = {
  agumon:   ['espiral', 'laser', 'meteoro', 'mina'],
  gabumon:  ['cuchilla', 'pulso', 'aura', 'tornado'],
  palmon:   ['mina', 'tornado', 'aura', 'pulso'],
  gatomon:  ['cuchilla', 'laser', 'espiral', 'pulso'],
  gomamon:  ['pulso', 'tornado', 'espiral', 'mina'],
  patamon:  ['aura', 'meteoro', 'pulso', 'laser'],
  biyomon:  ['meteoro', 'espiral', 'cuchilla', 'aura'],
  tentomon: ['laser', 'mina', 'meteoro', 'tornado']
};
function addSkill(id){ g.skills[id] = Math.min(SKILL_MAX, (g.skills[id] || 0) + 1); }
// Opciones del nivel: mejoras base + ataques de este Digimon (máximo SKILL_SLOTS distintos por partida)
function upgradeChoices(){
  const pool = [...UPGRADES];
  const mine = CHAR_SKILLS[g.ch.id] || Object.keys(SKILLS).slice(0, 4);
  const owned = Object.keys(g.skills).filter(id => g.skills[id] > 0);
  for (const id of mine){
    const lv = g.skills[id] || 0;
    if (lv >= SKILL_MAX) continue;
    if (!lv && owned.length >= SKILL_SLOTS) continue;   // ya llevas el máximo de ataques distintos
    const s = SKILLS[id];
    pool.push({t: `${s.name} · ${lv ? 'Nivel ' + (lv + 1) : 'Nueva'}`, name: s.name, skill: id, lv, k: s.k, d: s.d, f: () => addSkill(id)});
  }
  // Las cartas desterradas en esta partida no vuelven a salir
  const picks = pool.filter(c => !upRes().banned.includes(upKey(c))).sort(() => Math.random() - 0.5).slice(0, 3)
    .map(c => !c.skill && Math.random() < 0.18 ? {...c, rare: true} : c);   // carta rara: la mejora pasiva cuenta doble
  const evo = g.chestPick ? [] : evoSkillCards();   // si hay una evolución disponible, ocupa la primera carta
  if (evo.length) picks[0] = evo[0];
  const fus = g.chestPick ? [] : fusionCards().filter(c => !upRes().banned.includes('fus:' + c.fusion));   // y una fusión, la segunda
  if (fus.length) picks[evo.length && picks.length > 1 ? 1 : 0] = fus[Math.floor(Math.random() * fus.length)];
  return picks;
}
// Recursos de la subida de nivel por partida: refrescar 2, saltar 2, desterrar 1
function upRes(){ return g.upRes || (g.upRes = {rer: 2, skip: 2, ban: 1, banned: []}); }
function upKey(c){ return c.fusion ? 'fus:' + c.fusion : c.skill ? 'skill:' + c.skill : 'up:' + c.t; }
function rerollUp(){
  const r = upRes(); if (r.rer <= 0 || state !== 'levelup') return;
  r.rer--; g.upMode = null;
  g.choices = upgradeChoices(); openUpgrades();
}
function skipUp(){
  const r = upRes(); if (r.skip <= 0 || state !== 'levelup') return;
  r.skip--; SAVE.bits = SAVE.bits + 15; g.chestPick = null;
  announce('+15 Bits', 'Carta saltada', '#ffd54f');
  hideOverlay(); lockMouse(); state = 'play';
}
function toggleBanish(){
  if (upRes().ban <= 0 || state !== 'levelup') return;
  g.upMode = g.upMode === 'ban' ? null : 'ban'; openUpgrades();
}
function banishUp(i){
  const r = upRes(); if (r.ban <= 0 || state !== 'levelup') return;
  r.ban--; r.banned.push(upKey(g.choices[i])); g.upMode = null;
  g.choices = upgradeChoices(); openUpgrades();
}
// Materiales y geometrías compartidos (evitan crear objetos en cada disparo o impacto)
const matCache = {};
function matFor(color){ return matCache[color] || (matCache[color] = new THREE.MeshBasicMaterial({color})); }
const RING_GEO = new THREE.RingGeometry(0.96, 1, 48);
const GEM_GEO = new THREE.OctahedronGeometry(0.25), GEM_HEAL_GEO = new THREE.OctahedronGeometry(0.32);
const BIT_GEO = new THREE.SphereGeometry(0.3, 10, 10), BIT_MAT = new THREE.MeshBasicMaterial({color: 0xe040fb});
const SPROJ_GEO = new THREE.SphereGeometry(0.28, 8, 8);
const BEAM_GEO = new THREE.BoxGeometry(0.22, 0.22, 1), BEAM_MAT = new THREE.MeshBasicMaterial({color: 0x40c4ff, transparent: true, opacity: 0.85, depthWrite: false});
const MINE_GEO = new THREE.CylinderGeometry(0.42, 0.42, 0.12, 14), MINE_MAT = new THREE.MeshBasicMaterial({color: 0xff7043});
function newSkillState(){
  return {aura: null, auraT: 0, bits: [], spin: 0, pulseT: 1.5, spiralT: 0.3, bladeT: 1.0, laserT: 1.2,
    lastMine: {x: 0, z: 0}, mines: [], meteorT: 1.5, meteors: [], beams: [], proj: []};
}
// Enemigo más fuerte (más vida máxima) dentro del radio
function strongestIn(x, z, R){
  let best = null, bm = -1;
  for (const e of g.enemies){
    if (e.hp <= 0 || e.max <= bm) continue;
    if (dist2(x, z, e.x, e.z) <= R*R){ best = e; bm = e.max; }
  }
  return best;
}
function nearestIn(x, z, R){
  let best = null, bd = R*R;
  for (const e of g.enemies){
    if (e.hp <= 0) continue;
    const d = dist2(x, z, e.x, e.z);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
function spawnSProj(x, z, vx, vz, dmg, life, pierce, homing, color, target = null){
  const mesh = new THREE.Mesh(SPROJ_GEO, matFor(color));
  world.add(mesh);
  g.sk.proj.push({x, z, vx, vz, dmg, life, pierce, homing, target, hit: new Set(), mesh, src: dmgSrc});
}
function dropMine(x, z, lv){
  const mesh = new THREE.Mesh(MINE_GEO, MINE_MAT);
  mesh.position.set(x, 0.1 + terrainH(x, z), z);
  world.add(mesh);

}
// Aplica una habilidad activa cada frame: lo que cada una hace está en el bloque de abajo
function updateSkills(dt){
  const p = g.p, S = g.sk, L = g.skills, ar = p.area, dm = p.dmg * SKILL_K, cm = p.cdMul;
  const lv = id => L[id] || 0;

  dmgSrc = 'aura';
  // Aura de Datos: anillo que daña a los enemigos que entran
  if (lv('aura')){
    const R = (2.6 + 0.9*lv('aura')) * ar;
    if (!S.aura){
      S.aura = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: 0x4fc3f7, transparent: true, opacity: 0.4, depthWrite: false}));
      S.aura.rotation.x = -Math.PI/2;
      world.add(S.aura);
    }
    S.aura.scale.setScalar(R);
    S.aura.position.set(p.x, terrainH(p.x, p.z) + 0.06, p.z);
    S.auraT -= dt;
    if (S.auraT <= 0){
      S.auraT = 0.3;
      const dmg = (1.5 + 0.8*lv('aura')) * dm;
      for (const e of g.enemies) if (e.hp > 0 && dist2(p.x, p.z, e.x, e.z) < (R + e.r)*(R + e.r)) hurt(e, dmg);
    }
  }

  dmgSrc = 'tornado';
  // Tornado Bit: bits que giran, empujan y frenan proyectiles del jefe
  const nT = lv('tornado') ? lv('tornado') + 1 : 0;
  while (S.bits.length < nT){ const m = new THREE.Mesh(BIT_GEO, BIT_MAT); world.add(m); S.bits.push(m); }
  while (S.bits.length > nT) world.remove(S.bits.pop());
  if (nT){
    S.spin += dt*3.2;
    const R = 3.4*ar;
    for (const e of g.enemies) if (e.tcd > 0) e.tcd -= dt;
    for (let i = 0; i < nT; i++){
      const an = S.spin + i*Math.PI*2/nT, bx = p.x + Math.cos(an)*R, bz = p.z + Math.sin(an)*R;
      S.bits[i].position.set(bx, 0.9 + terrainH(bx, bz), bz);
      for (const e of g.enemies){
        if (e.hp <= 0) continue;
        const dx = e.x - bx, dz = e.z - bz, d = Math.hypot(dx, dz);
        if (d < e.r + 0.9){
          if (!(e.tcd > 0)){ hurt(e, (3 + 1.5*lv('tornado')) * dm); e.tcd = 0.5; }
          const push = 1.2/(d || 1); e.x += dx*push; e.z += dz*push;
          [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);
        }
      }
    }
    for (const s of g.eshots){
      if (s.life > 0 && S.bits.some(m => dist2(s.x, s.z, m.position.x, m.position.z) < 1.6)) s.life = 0;
    }
  }

  dmgSrc = 'pulso';
  // Onda de Pulso: anillo de 360° que daña y empuja
  if (lv('pulso')){
    S.pulseT -= dt;
    if (S.pulseT <= 0){
      const L2 = lv('pulso');
      S.pulseT = (3.2 - 0.4*L2) * cm;
      const R = (6.5 + 1.5*L2) * ar;
      spawnRing(p.x, p.z, 0x4fc3f7, R, 0.5);
      for (const e of g.enemies){
        if (e.hp <= 0) continue;
        const dx = e.x - p.x, dz = e.z - p.z, d = Math.hypot(dx, dz);
        if (d < R + e.r){
          hurt(e, (6 + 2*L2) * dm);
          const push = 5/(d || 1); e.x += dx*push; e.z += dz*push;
          [e.x, e.z] = clampArena(e.x, e.z, ARENA_R - 0.5);
        }
      }
    }
  }

  dmgSrc = 'espiral';
  // Disparo Espiral: al enemigo más cercano; atraviesa varios
  if (lv('espiral')){
    S.spiralT -= dt;
    if (S.spiralT <= 0){
      const t = nearestIn(p.x, p.z, 40);
      if (t){
        S.spiralT = 0.9 * cm;
        const d = Math.hypot(t.x - p.x, t.z - p.z) || 1;
        spawnSProj(p.x, p.z, (t.x - p.x)/d*24, (t.z - p.z)/d*24, (7 + 3*lv('espiral')) * dm, 1.8, 1 + lv('espiral'), false, 0xffe082);
      } else S.spiralT = 0.2;
    }
  }

  dmgSrc = 'cuchilla';
  // Cuchilla Persiguiente: hojas que se dirigen al enemigo más fuerte
  if (lv('cuchilla')){
    S.bladeT -= dt;
    if (S.bladeT <= 0){
      S.bladeT = 1.6 * cm;
      const n = 2*lv('cuchilla') + (p.count - 1);
      const base = Math.random()*Math.PI*2;
      for (let i = 0; i < n; i++){
        const an = base + i*Math.PI*2/n;
        spawnSProj(p.x, p.z, Math.cos(an)*10, Math.sin(an)*10, (6 + 2*lv('cuchilla')) * dm, 4, 1, true, 0xce93d8, strongestIn(p.x, p.z, 45));
      }
    }
  }

  dmgSrc = 'laser';
  // Rayo Láser: haz hacia el enemigo más cercano; daña a todos los que están en la línea
  if (lv('laser')){
    S.laserT -= dt;
    if (S.laserT <= 0){
      const t = nearestIn(p.x, p.z, 36);
      if (t){
        const L2 = lv('laser'), len = 18;
        S.laserT = 2.8 * cm;
        const dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz) || 1, ux = dx/d, uz = dz/d;
        for (const e of g.enemies){
          if (e.hp <= 0) continue;
          const ex = e.x - p.x, ez = e.z - p.z, along = ex*ux + ez*uz;
          if (along < 0 || along > len) continue;
          if (Math.abs(ex*uz - ez*ux) < e.r + 0.5) hurt(e, (12 + 4*L2) * dm);
        }
        const beam = new THREE.Mesh(BEAM_GEO, BEAM_MAT);
        beam.position.set(p.x + ux*len/2, 0.9 + terrainH(p.x, p.z), p.z + uz*len/2);
        beam.rotation.y = Math.atan2(ux, uz);
        beam.scale.z = len;
        world.add(beam);
        S.beams.push({m: beam, t: 0});
      } else S.laserT = 0.25;
    }
  }
  for (const b of S.beams) b.t += dt;
  S.beams = S.beams.filter(b => { if (b.t < 0.18) return true; world.remove(b.m); return false; });

  dmgSrc = 'mina';
  // Mina Digital: se deja una mina cada 2,2 m recorridos; explota al pisarla un enemigo
  if (lv('mina')){
    const L2 = lv('mina');
    if (dist2(p.x, p.z, S.lastMine.x, S.lastMine.z) > 2.2*2.2 && S.mines.length < 14 + 4*L2){
      dropMine(p.x, p.z, L2);
      S.lastMine = {x: p.x, z: p.z};
    }
    for (const m of S.mines){
      if (m.life <= 0) continue;
      m.life -= dt;
      const trig = g.enemies.some(e => e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (e.r + 1.2)*(e.r + 1.2));
      if (m.life <= 0 || trig){
        const R = (2.6 + 0.6*m.lv) * ar;
        m.life = 0;
        spawnRing(m.x, m.z, 0xff7043, R, 0.45);
        burst(m.x, m.z, 0xff7043);
        for (const e of g.enemies) if (e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (R + e.r)*(R + e.r)) hurt(e, (12 + 4*m.lv) * dm);
      }
    }
    S.mines = S.mines.filter(m => { if (m.life > 0) return true; world.remove(m.mesh); return false; });
  }

  dmgSrc = 'meteoro';
  // Lluvia de Meteoros: aviso en el suelo y después impacto en área
  if (lv('meteoro')){
    S.meteorT -= dt;
    if (S.meteorT <= 0){
      const L2 = lv('meteoro');
      S.meteorT = 2.6 * cm;
      for (let i = 0; i < L2 + 1; i++){
        const an = Math.random()*Math.PI*2, rr = Math.sqrt(Math.random())*13;
        const [mx, mz] = clampArena(p.x + Math.cos(an)*rr, p.z + Math.sin(an)*rr, ARENA_R - 2);
        const R = 2.6 * ar;
        const wm = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({color: 0xff5252, transparent: true, opacity: 0.6, depthWrite: false}));
        wm.rotation.x = -Math.PI/2;
        wm.position.set(mx, terrainH(mx, mz) + 0.07, mz);
        wm.scale.setScalar(R);
        world.add(wm);
        S.meteors.push({x: mx, z: mz, t: 0, R, mesh: wm, dmg: (10 + 3*L2) * dm});
      }
    }
    for (const m of S.meteors){
      m.t += dt;
      m.mesh.material.opacity = 0.35 + 0.35*Math.sin(m.t*18);
      if (m.t >= 0.7 && !m.done){
        m.done = true;
        for (const e of g.enemies) if (e.hp > 0 && dist2(m.x, m.z, e.x, e.z) < (m.R + e.r)*(m.R + e.r)) hurt(e, m.dmg);
        spawnRing(m.x, m.z, 0xff5252, m.R, 0.4);
        burst(m.x, m.z, 0xff5252);
      }
    }
    S.meteors = S.meteors.filter(m => { if (!m.done) return true; world.remove(m.mesh); return false; });
  }

  // Proyectiles de Espiral y Cuchilla: avanzan, las cuchillas giran hacia su objetivo y atraviesan según su alcance
  for (const pr of S.proj){
    if (pr.homing){
      if (!pr.target || pr.target.hp <= 0) pr.target = strongestIn(pr.x, pr.z, 60);
      if (pr.target){
        const dx = pr.target.x - pr.x, dz = pr.target.z - pr.z, d = Math.hypot(dx, dz) || 1;
        const sp = Math.hypot(pr.vx, pr.vz) || 16, k = Math.min(1, dt*4);
        pr.vx += ((dx/d)*sp - pr.vx)*k;
        pr.vz += ((dz/d)*sp - pr.vz)*k;
      }
    }
    pr.x += pr.vx*dt; pr.z += pr.vz*dt; pr.life -= dt;
    pr.mesh.position.set(pr.x, 0.9 + terrainH(pr.x, pr.z), pr.z);
    if (pr.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp <= 0 || pr.hit.has(e)) continue;
      if (dist2(pr.x, pr.z, e.x, e.z) < (e.r + 0.3)*(e.r + 0.3)){
        dmgSrc = pr.src; hurt(e, pr.dmg);
        pr.hit.add(e);
        if (--pr.pierce <= 0){ pr.life = 0; break; }
      }
    }
  }
  S.proj = S.proj.filter(pr => { if (pr.life > 0) return true; world.remove(pr.mesh); return false; });
  dmgSrc = 'base';
  updateFusions(dt);
}

function pickUpgrade(i){
  if (state !== 'levelup') return;
  const ch = g.choices[i];
  ch.f(g.p);
  if (g.chestPick && g.chestPick.gold && !ch.evo && !ch.fusion) ch.f(g.p);
  if (ch.rare) ch.f(g.p);
  if (!ch.skill && !ch.evo && !ch.fusion){ g.upTaken = g.upTaken || {}; g.upTaken[ch.t] = (g.upTaken[ch.t] || 0) + 1; }   // cofre dorado: la carta cuenta dos veces
  g.chestPick = null;
  hideOverlay();
  lockMouse();
  state = 'play';
}

function endGame(win){
  state = 'end';
  setHud(false); evHud(null); shrineHud(null);
  sfx(win ? 'victory' : 'defeat');
  const daily = loadDaily();
  const raw = Math.floor((g.kills/2 + g.t/10) * labMul('bits') * 1.25 * (g.mode === 'surv' ? 1.5 : 1) * lvlDiff().reward * (win && isPortalMap() ? 1.5 : 1));   // +25% por el modificador semanal
  const earned = Math.min(raw, Math.max(0, DAILY.runCap - daily.runBits));
  if (g.t >= 5) daily.runs += 1;
  daily.runBits += earned;
  let bonus = 0;
  if (!daily.claimed && daily.runs >= DAILY.runsGoal){ daily.claimed = true; bonus = DAILY.reward; g.tix += DAILY.rewardTix; g.dailyTix = DAILY.rewardTix; }
  // Toda partida larga da al menos un ticket, aunque no caiga ningún jefe
  if (g.t >= DAILY.runTixAt && g.tix < DAILY.runTix) g.tix = DAILY.runTix;
  saveDaily(daily);
  SAVE.bits = SAVE.bits + earned + bonus + (g.extraBits || 0);
  g.tix = Math.round(g.tix * lvlDiff().reward);   // la dificultad también multiplica los tickets
  addTickets('std', g.tix);   // élites y jefe: monedero del permanente
  if (g.mode === 'surv'){ const wk = 'digibonk3d-surv-wave-' + g.map; g.waveBest = (g.wave || 1) > +(localStorage.getItem(wk) || 0); if (g.waveBest) localStorage.setItem(wk, String(g.wave || 1)); }
  g.earned = earned + bonus + (g.extraBits || 0);
  g.bonus = bonus;
  g.unlocked = recordRun(g.ch.id, g.kills, g.t);
  g.newTitles = checkAchievements(win);
  g.newDigis = checkUnlocks();
  g.survBest = g.mode === 'surv' ? recordSurv(g.ch.id, g.t) : null;
  g.encDone = checkEncargos();
  unlockMouse();
  saveRecord(win);
  recordCharRun(g.ch.id, win && g.mode !== 'surv', g.diff, g.kills, g.p.lvl);
  if (win && g.mode !== 'surv'){ const mw = mapWins(), l = mw[g.map] || (mw[g.map] = []); if (!l.includes(g.diff)) l.push(g.diff); localStorage.setItem('digibonk3d-mapwins', JSON.stringify(mw)); }
  // Resumen de la partida: cifras, daño por habilidad y recompensas
  const dmgRows = Object.entries(g.dmgBy).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const dmgMax = dmgRows.length ? dmgRows[0][1] : 1;
  const dmgName = k => k === 'base' ? `Ataque de ${g.ch.name}` : k.startsWith('fus:') ? 'Fusión: ' + (FUSION_NAMES[k.slice(4)] || k.slice(4)) : (SKILLS[k] ? SKILLS[k].name : k);
  const rewards = [`<li><b>+${g.earned - g.bonus - (g.extraBits || 0)}</b> Bits</li>`];
  if (g.extraBits) rewards.push(`<li><b>+${g.extraBits}</b> Bits de eventos del mapa</li>`);
  if (g.emblems && g.emblems.length) rewards.push(`<li>Emblemas: <b>${g.emblems.length}/8</b></li>`);
  if (g.bonus) rewards.push(`<li><b>+${g.bonus}</b> Bits y <b>+${g.dailyTix}</b> tickets · misión diaria completada</li>`);
  if (g.tix) rewards.push(`<li><b>+${g.tix}</b> tickets de tirada</li>`);
  for (const u of g.unlocked) rewards.push(`<li>Skin nueva: <b>${u}</b></li>`);
  for (const tl of g.newTitles) rewards.push(`<li>Título desbloqueado: <b>${tl.name}</b></li>`);
  for (const d of g.newDigis) rewards.push(`<li>Digimon desbloqueado: <b>${d}</b></li>`);
  for (const e of g.encDone) rewards.push(`<li>Encargo cumplido: <b>${e}</b> · +${ENC_REWARD.bits} Bits y +${ENC_REWARD.tix} ticket</li>`);
  if (g.survBest) rewards.push(`<li>¡Nuevo récord de Supervivencia con ${g.ch.name}!</li>`);
  if (g.waveBest) rewards.push(`<li>¡Nueva mejor oleada en ${mapDef().name}: <b>${g.wave}</b>!</li>`);
  if (lvlDiff().reward !== 1) rewards.push(`<li>Dificultad ${lvlDiff().name}: premios ×${String(lvlDiff().reward).replace('.', ',')}</li>`);
  const endKey = g.ch.id;
  showOverlay(`
    <div class="end3 ${win ? 'win' : 'lose'}">
      <div class="end3-top"><img class="end3-ic" src="${charIcon(g.ch.id)}" alt=""><h1>${g.mode === 'surv' ? 'FIN DE LA SUPERVIVENCIA' : win ? '¡VICTORIA!' : 'HAS CAÍDO'}</h1></div>
      <p class="end3-sub">${g.mode === 'surv' ? `Has aguantado ${fmtTime(Math.floor(g.t))} · récord con ${g.ch.name}: ${fmtTime(Math.floor(survBest(g.ch.id)))}` : win ? (g.bossName || 'Piedmon') + ' ha sido derrotado' : `${stageName(g.ch.id, g.ch.evolved)} vuelve al Laboratorio`} · ${mapDef().name} · ${zoneDef().name} · ${lvlDiff().name}${g.mode === 'surv' ? ' · Oleada ' + (g.wave || 1) : ''}</p>
      <div class="end3-cells">
        <span><i>⏱</i><b>${fmtTime(Math.floor(g.t))}</b>Tiempo</span><span><i>⭐</i><b>${g.p.lvl}</b>Nivel</span><span><i>⚔</i><b>${g.kills}</b>Bajas</span><span><i>✦</i><b>${Object.keys(g.skills).length}</b>Habilidades</span>
        <span class="end3-gain"><i><img src="ui/hud/ic_bits.webp" alt=""></i><b>+${g.earned}</b>Bits ganados</span><span class="end3-gain"><i><img src="ui/hud/ic_ticket.webp" alt=""></i><b>+${(g.tix || 0) + g.encDone.length * ENC_REWARD.tix}</b>Tickets</span>
      </div>
      <div class="end3-cols">
        <section><h3>Daño por ataque</h3>
          ${dmgRows.map(([k, v], i) => `<div class="end3-bar" style="animation-delay:${.15 + i*.08}s"><span>${svgIcon(k)}${dmgName(k)}</span><i><u style="width:${Math.round(v/dmgMax*100)}%"></u></i><em>${Math.round(v)}</em></div>`).join('') || '<p class="muted">Sin daño registrado</p>'}
        </section>
        <section><h3>Recompensas</h3><ul class="end3-rw">${rewards.join('')}</ul></section>
      </div>
      <div class="end3-act2"><button class="end3-go" id="endAgain">↻ Otra vez <kbd>Enter</kbd></button><button class="end3-pill" id="endPick">Cambiar Digimon <kbd>C</kbd></button><button class="end3-pill" id="endMenu">Menú <kbd>M</kbd></button></div>
    </div>`);
  overlay.onclick = null;
  document.getElementById('endAgain').onclick = () => startGame(endKey);
  document.getElementById('endMenu').onclick = () => showSelect();
  document.getElementById('endPick').onclick = () => showPicker();

}

// ---------- Cámara y sincronización ----------
function syncMeshes(){
  const p = g.p;
  const gp = terrainH(p.x, p.z);
  g.playerMesh.position.set(p.x, gp + 1.1 + p.y, p.z);
  g.playerShadow.position.set(p.x, gp + 0.02, p.z);
  if (g.hiRing) g.hiRing.position.set(p.x, gp + 0.03, p.z);
  for (const e of g.enemies){
    const ge = terrainH(e.x, e.z);
    e.mesh.position.set(e.x, ge + e.mesh.scale.y/2, e.z);
    e.shadow.position.set(e.x, ge + 0.02, e.z);
  }
}
// Cámara orbital integrada con el ratón: el ratón bloqueado (pointer lock) gira la vista sin pulsar nada.

  if (r && r.catch) r.catch(() => { if (onFail) onFail(); });
}
function unlockMouse(){
  const r = document.exitPointerLock();
  if (r && r.catch) r.catch(() => {});

function updateCamera(dt){
  const p = g.p;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  // La cámara no sale del escenario: así el muro de piedra y las montañas nunca se interponen
  const [camX, camZ] = clampArena(p.x + Math.sin(camYaw)*cp*camDist, p.z + Math.cos(camYaw)*cp*camDist, ARENA_R - 4);
  camBase.lerp(new THREE.Vector3(camX, terrainH(p.x, p.z) + 1.2 + sp*camDist, camZ), Math.min(1, dt*10));
  shake = Math.max(0, shake - dt*2.5);
  const s = shake*shake*0.8;
  camera.position.set(
    camBase.x + (Math.random()-0.5)*s,
    camBase.y + (Math.random()-0.5)*s,
    camBase.z + (Math.random()-0.5)*s);
  camera.lookAt(p.x, terrainH(p.x, p.z) + 1.2 + p.y*0.5, p.z);
}

function updatePortal(dt){

// Cambio de pantalla: limpia la pantalla anterior, aplica el bioma nuevo y reinicia el reloj del Infierno
function enterScreen(n){

  if (g.ev) endMapEvent(false);
  if (g.portal){ world.remove(g.portal.grp); g.portal = null; }

}
// Fases de los jefes: al 50% y al 25% de vida cambian de ritmo y añaden golpes en el suelo avisados con círculos
function bossPhases(dt){
  const b = g.boss;
  if (!b || b.hp <= 0) return;
  const ph = b.hp <= b.max * 0.25 ? 3 : b.hp <= b.max * 0.5 ? 2 : 1;
  if ((b.phase || 1) < ph){
    b.phase = ph; b.spd *= 1.15; b.slamT = 1.2;
    spawnRing(b.x, b.z, 0xff1744, 10, 0.9); shake = Math.max(shake, 0.6); sfx('boss');
    announce('¡Fase ' + ph + '!', ph === 2 ? 'Golpes en el suelo: sal de los círculos rojos' : 'Más disparos y más golpes', '#ff5a6e');
  }
  if ((b.phase || 1) < 2) return;
  b.slamT -= dt;
  if (b.slamT > 0) return;
  b.slamT = b.phase === 3 ? 4 : 6;
  const n = b.phase === 3 ? 5 : 3, dmg = 14 * (lvlDiff().dmg || 1) * (b.phase === 3 ? 1.25 : 1);
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, r = i ? 2.5 + Math.random() * 4 : 0;
    const [x, z] = clampArena(g.p.x + Math.cos(a) * r, g.p.z + Math.sin(a) * r, ARENA_R - 1);
    addHazard(x, z, 2.6, 1.3, 'bomb', dmg, 0xff1744);
  }
}
// Invoca al jefe de la pantalla cuando quieras: su fuerza no depende del tiempo ni de tu nivel
function summonBoss(){
  if (!isPortalMap() || g.mode === 'surv' || state !== 'play') return;
  const def = zoneDef().boss;
  if (!def) return;
  if (g.boss && g.enemies.includes(g.boss)){ announce(def.name + ' ya está aquí', 'Derrótalo', def.col); return; }
  if (g.portalOpen){ announce('El portal ya está abierto', 'Ve al norte para cruzarlo', '#3de0ff'); return; }
  if (g.bossDown) return;
  const max = def.hp * lvlDiff().boss;
  const hp = def.resume && g.bossLeftHp ? g.bossLeftHp : max;
  const a = Math.atan2(g.dir.z, g.dir.x);
  const [x, z] = clampArena(g.p.x + Math.cos(a)*14, g.p.z + Math.sin(a)*14, ARENA_R - 4);
  const mesh = billboard(def.sprite, 5.6);
  world.add(mesh);
  const shadow = makeShadow(5);
  world.add(shadow);
  g.boss = {kind: 'boss', boss: true, def, name: def.name, sprite: def.sprite, mesh, shadow, x, z, hp, max, spd: 2.3, r: 2.4, xp: 60, dmg: def.dmg * lvlDiff().dmg, cd: 0};
  g.enemies.push(g.boss);
  g.bossSpawned = true; g.bossName = def.name; g.bossShotT = 2.2;
  spawnRing(x, z, 0xff1744, 9, 0.9); shake = Math.max(shake, 0.6);
  sfx('boss');
  announce('¡' + def.name.toUpperCase() + '!', def.resume && g.bossLeftHp ? 'Vuelve con ' + Math.round(hp / max * 100) + '% de vida' : def.sub, def.col);
}

// Reloj de cada pantalla: a los 20 minutos empieza el Infierno y ya no hay forma de sobrevivir
function updateScreenClock(dt){
  if (!isPortalMap() || g.mode === 'surv') return;
  g.screenT += dt;
  const marks = [[900, 'Quedan 5 minutos', 'A los 20 minutos en esta pantalla empieza el Infierno'], [1080, 'Quedan 2 minutos', 'Derrota al jefe y cruza el portal'], [1170, '¡30 segundos!', 'El Infierno está a punto de empezar']];
  while ((g.screenWarn || 0) < marks.length && g.screenT >= marks[g.screenWarn || 0][0]){ const m = marks[g.screenWarn || 0]; announce(m[1], m[2], '#ff7043'); g.screenWarn = (g.screenWarn || 0) + 1; }
  if (g.screenT >= SCREEN_LIMIT){
    if (!g.inferno){
      g.inferno = true; g.revives = 0;
      scene.fog.color.set(0x5a0a0a);
      const old = scene.background; scene.background = skyTexture(['#1a0000', '#7a0d0d', '#ff3d00']); if (old && old.dispose) old.dispose();
      floorMat.color.set(0xff8a80);
      shake = Math.max(shake, 1); sfx('boss');
      announce('¡INFIERNO!', '20 minutos en esta pantalla: la dificultad no deja de subir', '#ff1744');
    }
    // Corrupción: daño directo que crece cada segundo (no lo reduce la armadura)
    g.p.hp -= (4 + (g.screenT - SCREEN_LIMIT) * 0.8) * dt;
  }
}
// Supervivencia: una oleada por minuto; cada 5 oleadas, un jefe menor y un ticket
function updateWaves(){
  const w = 1 + Math.floor(g.t / 60);
  if (w <= (g.wave || 1)) return;
  g.wave = w;
  const n = Math.min(MAX_ENEMIES - g.enemies.length, 6 + w*2);
  for (let i = 0; i < n; i++) spawnEnemy(i < Math.floor(w/3) ? 'elite' : null);
  if (w % 5 === 0){
    spawnMini(MINIS[(w/5 - 1) % MINIS.length]);
    g.tix++;
    announce('Oleada ' + w, 'Un jefe menor se une a la horda · +1 ticket', '#ce93d8');
  } else announce('Oleada ' + w, 'La horda se hace más fuerte', '#ef5350');
}
