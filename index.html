const Music = {on: localStorage.getItem('digibonk3d-music') !== '0', nodes: null, vol: Math.min(1, Math.max(0, +(localStorage.getItem('digibonk3d-musvol') ?? 1)))};
function setMusicVol(v){ Music.vol = v; localStorage.setItem('digibonk3d-musvol', String(v)); if (Music.file) Music.file.volume = 0.5 * v; if (Music.nodes && Sfx.ctx) Music.nodes.out.gain.setTargetAtTime(0.32 * v, Sfx.ctx.currentTime, 0.1); }
function setSfxVol(v){ Sfx.vol = v; localStorage.setItem('digibonk3d-sfxvol', String(v)); if (Sfx.master) Sfx.master.gain.value = Sfx.muted ? 0 : 0.5 * v; }
// Melodía propia en la menor/do mayor: 8 compases de corcheas (MIDI, null = silencio)
const TUNE_BPM = 150;
const TUNE_LEAD = [
  [69,69,72,69,76,74,72,null], [65,65,69,65,69,67,65,64], [67,67,72,67,64,62,60,null], [62,64,67,71,74,null,67,69],
  [69,72,76,72,69,64,69,null], [65,69,72,69,65,69,72,null], [67,72,76,74,72,67,64,60], [62,67,71,74,67,71,74,null]
];
// Raíz del acorde de cada compás (Am F C G Am F G C) y el bajo sube raíz, quinta, octava, quinta
const TUNE_ROOT = [45, 41, 48, 43, 45, 41, 43, 48];
function midiHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
// Música de fondo: pista MP3 en bucle (audio/). Si el archivo no carga, se usa el bucle sintetizado
const MUSIC_FILE = 'audio/together-we-are-strong.mp3';
function musicStart(){
  if (!Music.file){
    Music.file = new Audio(MUSIC_FILE);
    Music.file.loop = true;
    Music.file.volume = 0.5 * Music.vol;
    Music.file.onerror = () => { Music.file = null; if (Music.on && !Music.nodes) musicSynth(); };
  }
  Music.file.muted = Sfx.muted;
  const p = Music.file.play();
  if (p && p.catch) p.catch(() => {});
}
function musicStop(){
  if (Music.file) Music.file.pause();
  musicSynth(true);
}
function musicSynth(stopOnly){
  if (stopOnly) return musicSynthStop();
  if (!Sfx.ctx || Music.nodes) return;
  const c = Sfx.ctx;
  const out = c.createGain(); out.gain.value = 0;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  lp.connect(out); out.connect(c.destination);
  out.gain.setTargetAtTime(0.32 * Music.vol, c.currentTime, 0.6);
  const eighth = 60 / TUNE_BPM / 2;
  const nodes = {out, stopped: false, timer: null};
  const tone = (m, t, dur, type, vol) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = midiHz(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t + dur + 0.05);
  };
  const kick = t => {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.16);
  };
  const hat = (t, vol) => {
    if (!Sfx.noiseBuf) return;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = Sfx.noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.3); s.stop(t + 0.06);
  };
  let step = 0, next = c.currentTime + 0.1;
  const schedule = () => {
    if (nodes.stopped) return;
    while (next < c.currentTime + 0.3){
      const bar = (step >> 3) & 7, pos = step & 7;
      const r = TUNE_ROOT[bar];
      const bassM = [r, r + 7, r + 12, r + 7][pos & 3];
      tone(TUNE_LEAD[bar][pos], next, eighth * 0.85, 'square', 0.05);
      tone(bassM, next, eighth * 0.9, 'triangle', 0.3);
      if ((pos & 3) === 0) kick(next);
      if (pos === 2 || pos === 6) hat(next, 0.05);
      else if (pos & 1) hat(next, 0.02);
      next += eighth; step++;
    }
  };
  schedule();
  nodes.timer = setInterval(schedule, 60);
  Music.nodes = nodes;
}
function musicSynthStop(){
  if (!Music.nodes) return;
  const {out, timer} = Music.nodes;
  Music.nodes.stopped = true;
  clearInterval(timer);
  out.gain.setTargetAtTime(0, Sfx.ctx.currentTime, 0.3);
  setTimeout(() => { try { out.disconnect(); } catch(e){} }, 1200);
  Music.nodes = null;
}

/* ---------- Sonido: efectos sintetizados con Web Audio (sin archivos) ---------- */
const Sfx = {ctx:null, master:null, muted: localStorage.getItem('digibonk3d-sfx') === '0', last:{}, noiseBuf:null, vol: Math.min(1, Math.max(0, +(localStorage.getItem('digibonk3d-sfxvol') ?? 1)))};
function audioInit(){
  if (Sfx.ctx){ if (Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  Sfx.ctx = new AC();
  Sfx.master = Sfx.ctx.createGain();
  Sfx.master.gain.value = Sfx.muted ? 0 : 0.5 * Sfx.vol;
  Sfx.master.connect(Sfx.ctx.destination);
  if (Music.on) musicStart();
  const len = Math.floor(Sfx.ctx.sampleRate * 0.5);
  Sfx.noiseBuf = Sfx.ctx.createBuffer(1, len, Sfx.ctx.sampleRate);
  const d = Sfx.noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
}
function tone(freq, dur, type, vol, slideTo, delay){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), gn = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(Sfx.master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, delay, hp){
  const c = Sfx.ctx, t0 = c.currentTime + (delay || 0);
  const src = c.createBufferSource(); src.buffer = Sfx.noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
  const gn = c.createGain();
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(gn); gn.connect(Sfx.master);
  src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.05);
}
// Intervalo mínimo entre repeticiones para que los efectos frecuentes no saturen
const SFX_GAP = {shoot:70, hit:60, kill:40, hurt:250, uiHover:50};
function sfx(name){
  const c = Sfx.ctx;
  if (!c || Sfx.muted || c.state !== 'running') return;
  if (SFX_GAP[name]){
    const now = performance.now();
    if (now - (Sfx.last[name] || 0) < SFX_GAP[name]) return;
    Sfx.last[name] = now;
  }
  switch (name){
    case 'shoot':   tone(880, .08, 'triangle', .07, 440); break;
    case 'hit':     noise(.05, .10, 0, 1500); break;
    case 'kill':    tone(520, .10, 'square', .06, 260); break;
    case 'hurt':    tone(170, .28, 'sawtooth', .16, 70); noise(.15, .06, 0, 300); break;
    case 'chest':   [523,659,784,1046].forEach((f,i) => tone(f, .16, 'triangle', .18, null, i*.07)); break;
    case 'uiHover': tone(1320, .03, 'square', .018); break;
    case 'uiClick': tone(880, .05, 'square', .04, 1320); break;
    case 'pick':    tone(660, .07, 'triangle', .10); tone(990, .12, 'triangle', .10, null, .06); break;
    case 'ready':   tone(1568, .10, 'square', .05); tone(2349, .16, 'triangle', .06, null, .07); break;
    case 'levelup': [440,554,660,880].forEach((f,i) => tone(f, .18, 'square', .07, null, i*.08)); break;
    case 'evolve':  tone(220, 1.0, 'sawtooth', .10, 880); [523,659,784].forEach((f,i) => tone(f, .5, 'triangle', .14, null, .6 + i*.1)); break;
    case 'boss':    tone(65, 1.6, 'sawtooth', .16, 40); noise(1.2, .07, 0, 200); break;
    case 'victory': [523,659,784,1046,784,1046].forEach((f,i) => tone(f, .22, 'triangle', .18, null, i*.12)); break;
    case 'defeat':  tone(330, .6, 'triangle', .18, 110); tone(220, .9, 'triangle', .16, 55, .3); break;
  }
}
function toggleMute(silent){
  Sfx.muted = !Sfx.muted;
  localStorage.setItem('digibonk3d-sfx', Sfx.muted ? '0' : '1');
  if (Sfx.master) Sfx.master.gain.value = Sfx.muted ? 0 : 0.5 * Sfx.vol;
  if (Music.file) Music.file.muted = Sfx.muted;
  if (!silent) announce(Sfx.muted ? 'Sonido desactivado' : 'Sonido activado', 'N para cambiarlo', '#7fd0ff');
}

addEventListener('pointerover', e => { if (state !== 'play' && e.target.closest && e.target.closest('button') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('button') === e.target.closest('button'))) sfx('uiHover'); });

/* ---------- Mapa 2D: minimapa en la esquina y mapa completo (tecla Tab) ---------- */
// Iconos: sprites del juego cargados una vez y reutilizados en el mapa
const iconCache = {};
function iconImg(src){
  if (!iconCache[src]){ const im = new Image(); im.src = src; iconCache[src] = im; }
  return iconCache[src];
}
function drawIcon(c, src, cx, cy, size){
  const im = iconImg(src);
  if (im.complete && im.naturalWidth) c.drawImage(im, cx - size/2, cy - size/2, size, size);
  else { c.fillStyle = '#ffffff'; c.beginPath(); c.arc(cx, cy, size/4, 0, Math.PI*2); c.fill(); }
}
function drawWorldMap(cv, size){
  if (!cv) return;
  const c = cv.getContext('2d');
  const R = size / 2, k = (R - 6) / ARENA_R;
  const X = x => R + x*k, Y = z => R + z*k;
  const u = size / 170;   // escala de los iconos según el tamaño del mapa
  c.clearRect(0, 0, size, size);
  c.fillStyle = '#4b5d72'; c.fillRect(0, 0, size, size);      // montañas
  const MC = {bosque: ['#3f7d3f', '#2a7fb8'], dunas: ['#c9a25a', '#3aa88a'], ruinas: ['#9a7a5a', '#3a8a5a'], nieve: ['#c8d8ea', '#8ac6ea'], fortaleza: ['#4a3a56', '#e0561a']}[curBiome] || ['#3f7d3f', '#2a7fb8'];
  c.fillStyle = MC[0]; c.fillRect(X(-ARENA_R), Y(-ARENA_R), 2*ARENA_R*k, 2*ARENA_R*k);  // suelo del bioma (cuadrado)
  if (layoutMini){ c.save(); c.beginPath(); c.rect(X(-ARENA_R), Y(-ARENA_R), 2*ARENA_R*k, 2*ARENA_R*k); c.clip(); c.drawImage(layoutMini, X(-TERRAIN_SIZE/2), Y(-TERRAIN_SIZE/2), TERRAIN_SIZE*k, TERRAIN_SIZE*k); c.restore(); }
  c.fillStyle = MC[1];
  for (const P of PONDS){ c.beginPath(); c.ellipse(X(P.x), Y(P.z), P.rx*1.05*k, P.rz*1.05*k, 0, 0, Math.PI*2); c.fill(); }
  if (!g) return;
  // Portal: anillo gris (cerrado) o cian (abierto)
  if (g.portal){ c.strokeStyle = g.portalOpen ? '#3de0ff' : '#9aa0b0'; c.lineWidth = 3*u; c.beginPath(); c.arc(X(PORTAL.x), Y(PORTAL.z), 6*u, 0, Math.PI*2); c.stroke(); }
  // Cofres sin abrir: icono de regalo
  c.font = `${Math.max(12, 14*u)}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const ch of g.chests){
    if (ch.open) continue;
    c.fillText('🎁', X(ch.x), Y(ch.z));
  }
  // Enemigos: su propio sprite, en miniatura
  for (const e of g.enemies){
    if (e.boss) continue;
    const d = {...ENEMY[e.kind], sprite: e.sprite || ENEMY[e.kind].sprite};
    drawIcon(c, d ? d.sprite : 'sprites/numemon.png', X(e.x), Y(e.z), (e.kind === 'tank' ? 16 : 12) * u);
  }
  // Jefe final
  if (g.boss && g.enemies.includes(g.boss)){
    drawIcon(c, g.boss.sprite || 'sprites/adventure/piedmon.png', X(g.boss.x), Y(g.boss.z), 26 * u);
  }
  // Jugador: el Digimon que estás usando
  const pc = X(g.p.x), py = Y(g.p.z);
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(pc, py, 12*u, 0, Math.PI*2); c.fill();
  drawIcon(c, spriteOf(g.ch.id, g.ch.evolved), pc, py, 24 * u);
}
function openMap(){
  if (state !== 'play' || !g) return;
  state = 'map';

const DAILY = {runsGoal: 3, reward: 150, rewardTix: 3, runCap: 600, runTix: 1, runTixAt: 300};

  {id:'pureza',       name:'Emblema de la Pureza',     owner:'palmon',   text:'+20% área',            f: k => { g.p.area *= 1 + 0.2*k; }},

function grantEmblem(){
  g.emblems = g.emblems || [];
  const left = EMBLEMS.filter(em => !g.emblems.includes(em.id));
  if (!left.length) return;
  // El emblema de tu compañero sale antes y vale el doble
  const own = left.find(em => em.owner === g.ch.id);
  const em = own && Math.random() < 0.4 ? own : left[Math.floor(Math.random()*left.length)];
  const k = em.owner === g.ch.id ? 2 : 1;
  em.f(k);
  g.emblems.push(em.id);
  setTimeout(() => { if (g) announce(em.name, em.text + (k > 1 ? ' ×2 (el de tu compañero)' : ''), '#ffd54f'); }, 1400);
}

/* ---------- Habilidades evolucionadas: habilidad a nivel 3 + su mejora pasiva ---------- */

const fusionKey = (a, b) => [a, b].sort().join('+');
// Tipo de efecto según los ataques: dos ofensivos disparan en estrella, con cuchilla persiguen, el resto es una onda expansiva
function fusionKind(a, b){
  if (a === 'cuchilla' || b === 'cuchilla') return 'homing';

function fusionCards(){

  for (let i = 0; i < have.length; i++) for (let j = i + 1; j < have.length; j++){
    const a = have[i], b = have[j], key = fusionKey(a, b);
    if ((g.fus || []).some(f => f.key === key)) continue;
    const name = FUSION_NAMES[key] || `${SKILLS[a].name} + ${SKILLS[b].name}`, kind = fusionKind(a, b);
    const what = kind === 'nova' ? 'una estrella de 10 proyectiles que atraviesan' : kind === 'homing' ? '4 proyectiles que persiguen al enemigo más fuerte' : 'una onda expansiva que daña y empuja';
    out.push({t: 'FUSIÓN: ' + name, name, fusion: key, k: 'ofensiva', d: `${SKILLS[a].name} + ${SKILLS[b].name}: cada pocos segundos lanza ${what}. Los dos ataques siguen como estaban.`,

function updateMapEvent(dt){
  if (g.evT === undefined) g.evT = 150;

    if (g.t >= g.evT && !g.bossSpawned){

      const near = MINIS.some(m => Math.abs(m.at - g.t) < 30) || (g.mode !== 'surv' && BOSS_AT - g.t < 30);

  if (ev.kind === 'defend'){
    const n = ev.nodes[0];
    if (dist2(n.x, n.z, p.x, p.z) < 6) n.prog += dt;
    ev.spawnT -= dt;
    if (ev.spawnT <= 0){ ev.spawnT = 2; spawnEnemy(); const m = g.enemies[g.enemies.length - 1]; const a = Math.random()*Math.PI*2; [m.x, m.z] = clampArena(n.x + Math.cos(a)*12, n.z + Math.sin(a)*12, ARENA_R - 0.5); }

    for (const n of ev.nodes){
      if (n.done) continue;
      if (dist2(n.x, n.z, p.x, p.z) < 2.5) n.prog += dt;
      if (n.prog >= 1.5){ n.done = true; world.remove(n.mesh); world.remove(n.ring); burst(n.x, n.z, '#e040fb'); sfx('chest'); }
    }
    const done = ev.nodes.filter(n => n.done).length;
    evHud(`Datos corruptos: ${done}/3 nodos · quedan ${Math.ceil(ev.t)} s`);
    if (done === 3) return endMapEvent(true);
  } else {
    const e = ev.foe;
    evHud(`Numemon dorado · quedan ${Math.ceil(ev.t)} s`);
    if (e.hp <= 0) return endMapEvent(true);
  }
  if (ev.t <= 0) endMapEvent(false);
}

/* ---------- Encargos: 3 al día, se cumplen dentro de una partida ---------- */
const ENC_REWARD = {bits: 100, tix: 1};
const ENC_TYPES = [
  {id:'kills', ns:[200, 300, 400], t: n => `Derrota a ${n} enemigos en una partida`, ok: (n) => g.kills >= n},
  {id:'nodash', ns:[5, 8, 10], t: n => `Llega al minuto ${n} sin usar el dash`, ok: (n) => !g.dashUsed && g.t >= n*60},
  {id:'chests', ns:[3, 4, 5], t: n => `Abre ${n} cofres en una partida`, ok: (n) => (g.chestsOpened || 0) >= n},
  {id:'bonk', ns:[2, 3, 4], t: n => `Usa el Bonk ${n} veces en una partida`, ok: (n) => (g.bonks || 0) >= n},
  {id:'level', ns:[15, 20, 25], t: n => `Llega al nivel ${n}`, ok: (n) => g.p.lvl >= n},
  {id:'mini', ns:[0, 1, 2], t: n => `Derrota a ${MINIS[n].name}`, ok: (n) => (g.minisKilled || []).includes(MINIS[n].name)},
  {id:'with', ns:null, t: k => `Aguanta 10 minutos con ${CHARS[k].name}`, ok: (k) => g.ch.id === k && g.t >= 600}
];
// Generador con semilla del día: todos los jugadores ven los mismos encargos ese día
function dayRng(){ let h = 2166136261; for (const ch of dayKey()) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function loadEncargos(){
  const st = loadJSON('digibonk3d-enc', null);

  const rnd = dayRng(), types = [...ENC_TYPES].sort(() => rnd() - 0.5).slice(0, 3);
  const opened = SEASONS.adventure.chars.filter(k => isUnlocked(k));
  const list = types.map(tp => ({id: tp.id, n: tp.ns ? tp.ns[Math.floor(rnd()*tp.ns.length)] : opened[Math.floor(rnd()*opened.length)], done: false}));

}
function encText(e){ const tp = ENC_TYPES.find(x => x.id === e.id); return tp ? tp.t(e.n) : e.id; }
// Al terminar la partida: marca los encargos cumplidos y da la recompensa. Devuelve sus textos
function checkEncargos(){
  const st = loadEncargos(), won = [];
  for (const e of st.list){
    const tp = ENC_TYPES.find(x => x.id === e.id);

    const fr = im.naturalWidth / im.naturalHeight > ANIM_N - 1 ? ANIM_N : 1;
    const fw = Math.floor(im.naturalWidth / fr), h = im.naturalHeight;
    // Caja real del Digimon dentro del fotograma (píxeles con alfa)
    const probe = document.createElement('canvas'); probe.width = fw; probe.height = h;
    const pc = probe.getContext('2d', {willReadFrequently: true});
    pc.drawImage(im, 0, 0, fw, h, 0, 0, fw, h);
    const d = pc.getImageData(0, 0, fw, h).data;
    let x0 = fw, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < fw; x++){
      if (d[(y*fw + x)*4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0){ x0 = 0; y0 = 0; x1 = fw - 1; y1 = h - 1; }
    // Cabeza: la mitad superior de la caja, cuadrada y centrada
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    // Centro de la cabeza: centro de masa de los píxeles de la mitad superior
    const hh = bh * 0.5, side = hh * 1.65;
    let mx = 0, my = 0, mn = 0;
    for (let y = y0; y < y0 + hh; y++) for (let x = x0; x <= x1; x++){
      if (d[(y*fw + x)*4 + 3] > 40){ mx += x; my += y; mn++; }
    }
    const cx = mn ? mx/mn : x0 + bw/2, cy = mn ? my/mn : y0 + hh/2;
    const c = document.createElement('canvas'); c.width = 96; c.height = 96;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    x.drawImage(im, cx - side/2, cy - side/2, side, side, 0, 0, 96, 96);
    headCache[src] = c.toDataURL('image/png');
    for (const cb of headListeners[src] || []) cb(headCache[src]);
    delete headListeners[src];
  };
  im.onerror = () => { delete headCache[src]; delete headListeners[src]; };
  im.src = sheetOf(src) || src;
  return src;
}

// Diálogo "Avatar, marco y título" (botón Cambiar de la ficha). Solo guarda al pulsar Guardar.
function openCustomizer(){
  const host = document.getElementById('overlay');
  if (!host || document.getElementById('czBack')) return;
  let pAv = normAv(localStorage.getItem('digibonk3d-avatar'));
  let pFrame = extra.frame || '', pTitle = extra.title || '';
  let tab = 'av';
  const ownsFrame = id => !id || inv.frames.includes(id);
  const ownsTitle = id => !id || inv.titles.includes(id);
  const prog = (() => { const a = loadAch(), k = loadJSON('digibonk3d-stats', {}); const kills = Object.values(k).reduce((s, x) => s + (x.kills || 0), 0); return {novato: [Math.min(a.runs, 1), 1], cazador: [Math.min(kills, 300), 300], explorador: [a.zone2 ? 1 : 0, 1], maestro: [a.boss ? 1 : 0, 1]}; })();
  const back = document.createElement('div');
  back.id = 'czBack'; back.className = 'cz-back';
  back.innerHTML = '<div class="cz-box" role="dialog" aria-label="Avatar, marco y título"></div>';
  host.appendChild(back);
  const box = back.firstElementChild;
  const tile = (sel, cls, img, name, sub, locked, extraCls) => `<button type="button" class="cz-tile${sel ? ' sel' : ''}${locked ? ' locked' : ''}${extraCls || ''}" ${locked ? 'disabled' : ''} data-v="${cls}">${img}<b>${name}</b>${sub ? `<small>${sub}</small>` : ''}${locked ? '<i class="cz-lock">🔒</i>' : ''}</button>`;
  const rar = t => ({c:'Común', r:'Rara', e:'Épica', l:'Legendaria'})[t] || '';
  const card = (sel, v, inner, locked, tier) => `<button type="button" class="cz-tile cz-t-${tier || 'c'}${sel ? ' sel' : ''}${locked ? ' locked' : ''}" ${locked ? 'disabled' : ''} data-v="${v}">${inner}${locked ? '<i class="cz-lock">🔒</i>' : ''}</button>`;
  const grid = () => {
    if (tab === 'av') return AVATAR_KIDS.map(ic => card(pAv === ic.id, 'av:' + ic.id, `<span class="cz-av"><img src="${ic.src}" alt=""></span><b>${ic.name}</b>`, false, 'c')).join('');
    if (tab === 'dg') return PLAYER_ICONS.map(ic => card(pAv === ic.id, 'av:' + ic.id, `<span class="cz-av">${ic.src ? `<img src="${ic.src}" alt="">` : sprEl(spriteWith(ic.id, false, 'clasico'), 44)}</span><b>${ic.name}</b>`, false, 'c')).join('')
      + SKIN_ICONS.filter(ic => ownsSkinIcon(ic) || !(SKINS.find(s => s.id === ic.skin) || {}).hidden).map(ic => { const ok = ownsSkinIcon(ic); return card(pAv === ic.id, 'av:' + ic.id, `<span class="cz-av"><img src="${ic.src}" alt=""${ok ? '' : ' style="filter:grayscale(1) brightness(.45)"'}></span><b>${skinIconName(ic)}</b>`, !ok, ok ? 'r' : 'c'); }).join('');
    if (tab === 'frame') return [{id: '', name: 'Sin marco', tier: 'c'}, ...FRAMES.filter(f => !f.weekly && !f.seasonal)].map(f => {
      const ok = ownsFrame(f.id);
      return card(pFrame === f.id, 'fr:' + f.id, `<span class="cz-fr">${f.id ? `<span class="rw-frame fr-${f.id}"></span>` : '<span class="cz-none">∅</span>'}</span><b>${ok ? f.name : '???'}</b><small>${ok ? (f.id ? rar(f.tier) : 'Sin marco') : 'Gacha'}</small>`, !ok, ok ? f.tier : 'c');
    }).join('');
    return [{id: '', name: 'Sin título', how: '', tier: 'c'}, ...TITLES].map(t => {
      const ok = ownsTitle(t.id), pg = prog[t.id];
      const bar = !ok && pg ? `<i class="cz-bar"><u style="width:${Math.round(pg[0] / pg[1] * 100)}%"></u></i><em>${pg[0]}/${pg[1]}</em>` : '';
      return card(pTitle === t.id, 'ti:' + t.id, `<b>${ok ? t.name : '???'}</b><small>${ok ? (t.id ? rar(t.tier) : 'Sin título') : t.how}</small>${bar}`, !ok, ok ? (t.tier || 'c') : 'c');
    }).join('');
  };
  const preview = () => {
    const ic = AVATAR_KIDS.find(x => x.id === pAv) || PLAYER_ICONS.find(x => x.id === pAv) || SKIN_ICONS.find(x => x.id === pAv);
    const img = ic ? ic.src : headUrl(spriteOf(avatarKey(), false));
    const t = pTitle ? TITLES.find(x => x.id === pTitle) : null;
    return `<div class="cz-prev"><div class="hud-portrait pf-av${pFrame ? ' fr-' + pFrame : ''}"><img src="${img}" alt=""></div><span class="cz-ttl">${t ? t.name : 'Sin título'}</span></div>`;
  };
  const render = () => {
    box.innerHTML = `
      <div class="cz-head">${preview()}
        <div class="cz-copy"><small>Tu imagen en la clasificación y en tu ficha</small><h2>Avatar, marco y título</h2>
          <p>Los marcos y títulos se ganan con el gacha y con los logros. Los iconos de entrenador están disponibles desde el principio.</p></div></div>
      <div class="cz-tabs">${[['av', 'Entrenadores'], ['dg', 'Digimon'], ['frame', 'Marcos'], ['title', 'Títulos']].map(([k, l]) => `<button type="button" class="cz-tab${tab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
      <div class="cz-grid">${grid()}</div>
      <div class="cz-foot"><button type="button" class="cz-btn" id="czCancel">Cancelar</button><button type="button" class="cz-btn ok" id="czSave">Guardar</button></div>`;
    box.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
    box.querySelectorAll('.cz-tile:not(.locked)').forEach(b => b.onclick = () => {
      const [k, v] = b.dataset.v.split(':');
      if (k === 'av') pAv = v; else if (k === 'fr') pFrame = v; else pTitle = v;
      render(); sfx('ready');
    });
    box.querySelector('#czCancel').onclick = close;
    box.querySelector('#czSave').onclick = save;
  };
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); };
  const save = () => {
    if (pAv) localStorage.setItem('digibonk3d-avatar', pAv);
    if (pFrame) equipExtra('frame', pFrame); else unequipExtra('frame');
    if (pTitle) equipExtra('title', pTitle); else unequipExtra('title');
    close(); sfx('ready'); showPlayer();
  };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });

const WEEK_PULLS = 5;

// Tres banners: el permanente con las skins galácticas y dos de Navidad (Papá Noel y Reno, solo con el evento activo)
const BANNERS = {
  std:      {name: 'Digivice Estándar', sub: 'Skins galáctica y holográfica', skins: ['galactico', 'holografica'], weekly: true},
  navidadP: {name: EVENT.name, sub: 'Skin Papá Noel · tiempo limitado', skins: ['festival'], event: true},
  navidadR: {name: EVENT.name, sub: 'Skin Reno · tiempo limitado', skins: ['reno'], event: true}

// Nombre que se muestra a la skin destacada de cada banner
const FEATURED_NAME = {galactico: 'Aventurero', holografica: 'Holográfico', festival: 'Papá Noel', reno: 'Reno'};
// Skins que da un banner: [{key, st, sk}]. El permanente solo tiene la línea de la semana
function bannerPool(bn = gxBanner){
  const b = BANNERS[bn];
  const out = [];
  // solo entran las skins que ya tienen hoja dibujada
  const add = (key, times, sk) => { const st = skinLineArt(key, sk.id); if (st >= 0) for (let t = 0; t < times; t++) out.push({key, st, sk}); };
  const all = () => { for (const sk of b.skins.map(id => SKIN_BY_ID[id])) for (const key of SEASONS.adventure.chars) add(key, 1, sk); };
  if (b.weekly){
    const chars = SEASONS.adventure.chars, i = weeklyIndex();
    const second = chars[(i + 3) % chars.length];
    for (const sk of b.skins.map(id => SKIN_BY_ID[id])){ add(weeklyDigimon(), 2, sk); add(second, 1, sk); }
    if (!out.length) all();   // la línea de la semana aún no tiene skins: entran las que haya
  } else all();
  return out;
}
let gxBanner = 'std';

const PITY_AT = 100, LEG_DUP_REFUND = 200;
// Garantía por banner: el permanente cada 100 tiradas, cada Navidad cada 50 (contadores separados)
const PITY_BY_BANNER = {std: 100, navidadP: 50, navidadR: 50};
const pityAt = bn => PITY_BY_BANNER[bn] || 100;
const pityKey = bn => bn === 'std' ? 'digibonk3d-pity' : 'digibonk3d-pity-' + bn;
const pityCount = (bn = gxBanner) => +(localStorage.getItem(pityKey(bn)) || 0);

function bannerOpen(bn){ return !BANNERS[bn].event || (eventActive() && bannerPool(bn).length > 0); }
function bannerSkins(){ if (!bannerOpen(gxBanner)) gxBanner = 'std'; return BANNERS[gxBanner].skins.map(id => SKIN_BY_ID[id]); }

// La rareza se decide primero. Legendaria = skin; el resto reparte entre marco, título y objeto
const TIER_ODDS = {c: 60, r: 26, e: 12, l: 2};
// Reparto de lo que no es legendaria: marcos, títulos, tickets y Bits
const CAT_WEIGHTS = [['frame', 32], ['title', 28], ['ticket', 10], ['bits', 30]];
// Bits según rareza: común 30, rara 80, épica 160. Tickets: siempre 1 por drop
const BITS_BY_TIER = {c: 30, r: 80, e: 160};
// Tickets por banner: peso del drop (en el reparto no legendario) y cantidad por drop.
// El permanente da poco; los promocionales dan más para tirar en su evento.
const TICKET_DROP = {w: 10, amt: 1};   // todos los banners: mismo peso y cantidad de ticket por drop
function ticketRule(){ return TICKET_DROP; }
function rollTier(){
  let x = Math.random()*100;
  for (const t of ['c', 'r', 'e', 'l']){ if ((x -= TIER_ODDS[t]) < 0) return t; }
  return 'c';
}
function pickCategory(){
  const W = CAT_WEIGHTS.map(([k, w]) => [k, k === 'ticket' ? ticketRule().w : w]);
  let tot = W.reduce((a, c) => a + c[1], 0), x = Math.random()*tot;
  for (const [k, w] of W){ if ((x -= w) < 0) return k; }
  return 'title';
}
// Devuelve una recompensa: {type, ...} o null si no queda nada de ese tipo
// Si no quedan recompensas de ese nivel, baja al inmediatamente inferior (los objetos no tienen épicos)
const TIER_DOWN = {l: 'e', e: 'r', r: 'c', c: 'c'};
function unownedPool(list, tier, owned){
  let t = tier;
  for (;;){
    const pool = list.filter(x => x.tier === t && !owned(x));
    if (pool.length || t === 'c') return pool;
    t = TIER_DOWN[t];
  }
}
function pickOne(pool){ return pool[Math.floor(Math.random()*pool.length)]; }
// Devuelve una recompensa: {type, ...}. Legendaria da una skin de un Digimon
function rollReward(tier){
  if (tier === 'l'){
    // Banner de temporada: 50% una de sus skins y 50% la del banner permanente. Puede salir repetida,
    // pero tras una repetida la siguiente legendaria es nueva seguro (mientras quede alguna por conseguir)
    const pool = bannerPool();
    if (!pool.length) return {type:'bits', amount: LEG_DUP_REFUND, tier:'l'};   // aún no hay skins dibujadas para este banner
    if (localStorage.getItem('digibonk3d-legnew') === '1'){
      const fresh = pool.filter(e => !ownsAt(e.key, e.st, e.sk.id));
      if (fresh.length){
        // respeta el 50/50 si en la mitad que toca queda algo nuevo
        const f = pickOne(fresh);
        return {type:'skin', key: f.key, st: f.st, sk: f.sk, tier:'l'};
      }
    }
    const key = pickOne(SEASONS.adventure.chars);
    const pick = pickOne(pool);
    return {type:'skin', key: pick.key, st: pick.st, sk: pick.sk, tier:'l'};
  }
  const cat = pickCategory();
  if (cat === 'ticket') return {type:'ticket', amount: ticketRule().amt, tier};
  if (cat === 'bits') return {type:'bits', amount: BITS_BY_TIER[tier] || 30, tier};
  // Banner permanente: parte de las tiradas de marco o título dan el de la semana
  // Marcos y títulos del banner: la semana en el permanente, Navidad en sus banners
  const bf = bannerFrame();
  if (bf && Math.random() < 0.3){
    if (cat === 'frame' && !inv.frames.includes(bf.frame)) return {type:'frame', f: FRAMES.find(f => f.id === bf.frame), tier:'e'};
    if (cat === 'title' && !inv.titles.includes(bf.title)) return {type:'title', t: TITLES.find(t => t.id === bf.title), tier:'e'};
  }
  if (cat === 'frame'){
    const pool = unownedPool(FRAMES.filter(f => !f.weekly && !f.seasonal), tier, f => inv.frames.includes(f.id));
    if (pool.length){ const f = pickOne(pool); return {type:'frame', f, tier: f.tier}; }
  }
  {
    const pool = unownedPool(TITLES.filter(t => !t.weekly && !t.seasonal), tier, t => inv.titles.includes(t.id));
    if (pool.length){ const t = pickOne(pool); return {type:'title', t, tier: t.tier}; }
  }
  // Sin marcos ni títulos nuevos: Bits
  return {type:'bits', amount: BITS_BY_TIER[tier] || 30, tier};
}
// Aplica la recompensa a la colección; los repetidos se convierten en Bits
function grantReward(r){
  if (r.type === 'skin'){
    if (ownsAt(r.key, r.st, r.sk.id)){
      SAVE.bits = SAVE.bits + LEG_DUP_REFUND;
      localStorage.setItem('digibonk3d-legnew', '1');   // la siguiente legendaria será nueva
      return {...r, dup:true, refund: LEG_DUP_REFUND};
    }
    localStorage.removeItem('digibonk3d-legnew');
    grantSkinAt(r.key, r.st, r.sk.id);
    return {...r, dup:false};
  }
  if (r.type === 'frame'){
    if (inv.frames.includes(r.f.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.frames.push(r.f.id); saveInv(); return {...r, dup:false};
  }
  if (r.type === 'title'){
    if (inv.titles.includes(r.t.id)){ SAVE.bits = SAVE.bits + 30; return {...r, dup:true, refund:30}; }
    inv.titles.push(r.t.id); saveInv(); return {...r, dup:false};
  }
  if (r.type === 'bits'){ SAVE.bits = SAVE.bits + r.amount; return {...r, dup:false}; }
  if (r.type === 'ticket'){ addTickets(gxBanner, r.amount); return {...r, dup:false}; }   // el ticket es del banner en el que tiraste
  return {...r, dup:false};
}
// Tirada: 1 o 10. Con 10 se garantiza al menos una recompensa rara o épica
function doPulls(n){
  if (usableTickets(gxBanner) < n){ announce('Tickets insuficientes', `Necesitas ${n} ${n === 1 ? 'ticket' : 'tickets'}. Se consiguen jugando`, '#ef5350'); return; }
  spendUsable(gxBanner, n);
  const tiers = Array.from({length: n}, () => rollTier());
  if (n === 10 && !tiers.some(t => t !== 'c')) tiers[9] = 'r';
  // Contador de garantía: se reinicia con cada legendaria y fuerza una en la tirada número PITY_AT
  let pity = pityCount(gxBanner);
  for (let i = 0; i < tiers.length; i++){
    pity++;
    if (tiers[i] !== 'l' && pity >= pityAt(gxBanner)) tiers[i] = 'l';
    if (tiers[i] === 'l') pity = 0;
  }
  localStorage.setItem(pityKey(gxBanner), String(pity));
  if (gxBanner === 'std' && n === 10){ addTickets('std', 1); announce('+1 ticket', '10 tiradas en el banner permanente', '#3de0ff'); }
  if (addWeekPulls(n)) announce('Misión semanal completada', '+1 ticket por 5 tiradas esta semana', '#ffd54f');
  const results = [];
  for (const t of tiers){
    let r = rollReward(t);
    results.push(grantReward(r));
  }
  playPullAnimation(results);
}

// Texto que explica cómo se consigue una skin que aún no tienes
function howTo(key, sk){
  if (sk.src === 'base') return '';
  if (!sk.req) return sk.desc || '';
  if (sk.src === 'gacha') return 'Legendaria del gacha';
  if (sk.src === 'evento') return eventActive() ? 'Solo en el banner de evento' : 'Evento terminado';
  if (sk.src === 'shiny') return '1 entre 8192 al empezar una partida';
  const st = statsOf(key);

/* ---------- Efectos de skin: bonus de estadísticas y aura alrededor del Digimon ---------- */
const dotTexCache = {};
function dotTex(kind, color){
  const k = kind + color;
  if (dotTexCache[k]) return dotTexCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = color;
  if (kind === 'star'){
    x.beginPath();
    for (let i = 0; i < 10; i++){ const r = i % 2 ? 6 : 14, a = -Math.PI/2 + i*Math.PI/5; x.lineTo(16 + Math.cos(a)*r, 16 + Math.sin(a)*r); }
    x.closePath(); x.fill();
  } else if (kind === 'shard'){
    x.beginPath(); x.moveTo(16, 2); x.lineTo(26, 16); x.lineTo(16, 30); x.lineTo(6, 16); x.closePath(); x.fill();
  } else {
    x.beginPath(); x.arc(16, 16, 9, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  dotTexCache[k] = t;
  return t;
}
// Bonus permanente: cada skin conseguida da su bonus a ese Digimon, equipada o no
function applySkinFx(key){
  const p = g.p;
  for (const id of ownedSkins(key)){
    const fx = SKIN_FX[id];
    if (!fx) continue;
    const b = fx.bonus;
    if (b.speed) p.speed *= b.speed;
    if (b.dmg) p.dmg *= b.dmg;
    if (b.pickup) p.pickup *= b.pickup;
    if (b.maxHp){ p.maxHp += b.maxHp; }
  }
  p.hp = p.maxHp;
}
function makeAura(skinId, key){
  const fx = SKIN_FX[skinId];
  if (!fx) return null;
  const group = new THREE.Group();
  world.add(group);
  const sprite = (map, color, scale) => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map, color: color || 0xffffff, transparent: true, depthWrite: false}));
    sp.scale.set(scale, scale, 1);
    group.add(sp);
    return sp;
  };
  let update = () => {};
  if (fx.aura === 'stars'){
    const st = Array.from({length: 6}, () => sprite(dotTex('star', '#d1a3ff'), 0xffffff, .45));
    update = t => st.forEach((s, i) => { const a = t*1.6 + i*Math.PI/3; s.position.set(Math.cos(a)*1.2, 2.2 + Math.sin(t*2 + i)*.15, Math.sin(a)*1.2); });
  } else if (fx.aura === 'shards'){
    const sh = Array.from({length: 6}, () => sprite(dotTex('shard', '#bff6ff'), 0xffffff, .4));
    update = t => sh.forEach((s, i) => { const a = -t + i*Math.PI/3; s.position.set(Math.cos(a)*1.0, 1.6 + Math.sin(t*3 + i)*.2, Math.sin(a)*1.0); });
  } else if (fx.aura === 'confetti'){
    const cols = ['#ffd54f', '#ff7043', '#81d4fa', '#aed581'];
    const cf = Array.from({length: 12}, (_, i) => sprite(dotTex('dot', cols[i % 4]), 0xffffff, .25));
    update = t => cf.forEach((s, i) => {
      const f = (t*0.5 + i/12) % 1;
      s.position.set(Math.sin(i*2.3)*1.1, .3 + f*2.4, Math.cos(i*1.7)*1.1);
      s.material.opacity = 1 - f;
    });
  } else if (fx.aura === 'ghost'){
    const url = spriteOf(key, false);
    const g1 = sprite(tex(url), 0xff4d6d, 2.2), g2 = sprite(tex(url), 0x4dd0ff, 2.2);
    g1.material.opacity = g2.material.opacity = .45;
    update = t => {
      const j = Math.sin(t*23) > .8 ? .14 : 0;   // parpadeo: el eco se separa de vez en cuando
      g1.position.set(-.12 - j, 1.1, 0);
      g2.position.set(.12 + j, 1.1, 0);
    };
  }
  return {group, update};
}

/* ---------- Equilibrio: perfil de cada Digimon según la dificultad ----------
   Valores iniciales basados en el daño por segundo (daño / recarga × multiplicador)
   y en la facilidad de cada estilo. Hay que ajustarlos con pruebas reales. */

};

let frameNo = 0;
/* ---------- Agua: chapoteo, anillos y frenado dentro del estanque ---------- */
const waterFx = [];   // gotas y anillos: {m, vx, vy, vz, life, t, kind, r0}
const dropGeo = new THREE.SphereGeometry(0.07, 6, 6);
const ringGeo = new THREE.RingGeometry(0.82, 1, 32);
function waterSlow(x, z){ return 1 - 0.4*pondWeight(x, z); }
function splashAt(x, z, n){
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(dropGeo, new THREE.MeshBasicMaterial({color: 0xdff6ff, transparent: true}));
    m.position.set(x, POND.water + 0.05, z);
    scene.add(m);
    const a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*2.2;
    waterFx.push({m, kind: 'drop', vx: Math.cos(a)*sp, vy: 3.5 + Math.random()*2.5, vz: Math.sin(a)*sp, t: 0, life: 0.6});
  }
}
function addRipple(x, z, r0){
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: 0xeaf8ff, transparent: true, opacity: 0.8, depthWrite: false}));
  m.rotation.x = -Math.PI/2;
  m.position.set(x, POND.water + 0.04, z);
  m.scale.setScalar(r0);
  scene.add(m);
  waterFx.push({m, kind: 'ring', r0, t: 0, life: 0.8});
}
function updateWater(dt){
  for (let i = waterFx.length - 1; i >= 0; i--){
    const f = waterFx[i];
    f.t += dt;
    if (f.kind === 'drop'){
      f.vy -= 14*dt;
      f.m.position.x += f.vx*dt; f.m.position.z += f.vz*dt; f.m.position.y += f.vy*dt;
      f.m.material.opacity = Math.max(0, 1 - f.t/f.life);
    } else {
      const sc = f.r0 + f.t*1.9;
      f.m.scale.setScalar(sc);
      f.m.material.opacity = 0.8*Math.max(0, 1 - f.t/f.life);
    }
    if (f.t >= f.life){ scene.remove(f.m); waterFx.splice(i, 1); }
  }
  if (!g || state !== 'play') return;
  const p = g.p;
  const inside = pondWeight(p.x, p.z) > 0.6;
  if (inside && !g.inWater) splashAt(p.x, p.z, 14);              // entrada: salpicadura
  const moved = g.lastX !== undefined && Math.hypot(p.x - g.lastX, p.z - g.lastZ) > 0.01;
  if (inside && moved){                                          // al andar: anillos y gotas
    g.wakeT = (g.wakeT || 0) - dt;
    if (g.wakeT <= 0){ addRipple(p.x, p.z, 0.6); splashAt(p.x, p.z, 2); g.wakeT = 0.3; }
  }
  g.inWater = inside;
  g.lastX = p.x; g.lastZ = p.z;
}

/* ---------- Fondo animado del menú: bosque en pixel art con movimiento ---------- */
const menuBg = {cv: null, ctx: null, t: 0, trees: [], parts: [], dig: [], img: {}};
function menuImg(src){
  if (!menuBg.img[src]){ const im = new Image(); im.src = src; menuBg.img[src] = im; }
  return menuBg.img[src];
}
function drawSprite(c, src, x, y, w, h, flip){
  const im = menuImg(src);
  if (!im.complete || !im.naturalWidth) return;
  c.save();
  if (flip){ c.translate(x + w, y); c.scale(-1, 1); c.drawImage(im, 0, 0, w, h); }
  else c.drawImage(im, x, y, w, h);
  c.restore();
}
function initMenuBg(){
  menuBg.cv = document.getElementById('menubg');
  menuBg.ctx = menuBg.cv.getContext('2d');
  menuBg.ctx.imageSmoothingEnabled = false;
  const kinds = ['deco/arbol.png', 'deco/arbol_otono.png', 'deco/arbusto.png'];
  for (let layer = 0; layer < 3; layer++){
    for (let i = 0; i < 9 + layer*3; i++){
      menuBg.trees.push({layer, x: Math.random()*340 - 10, src: 'sprites/' + kinds[(Math.random()*3)|0], ph: Math.random()*6});
    }
  }
  for (let i = 0; i < 46; i++){
    menuBg.parts.push({x: Math.random()*320, y: Math.random()*180, v: 4 + Math.random()*8, ph: Math.random()*6,
      c: ['#9ff8ff', '#ffb3ff', '#e8ffa0'][i % 3]});
  }
  const cast = SEASONS.adventure.chars;
  cast.forEach((key, i) => menuBg.dig.push({key, x: i*58 - 20, sp: (i % 2 ? 1 : -1) * (7 + i*1.3), ph: i*1.1}));
  const loop = (now) => { drawMenuBg(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  let last = performance.now();
  menuBg.lastT = last;
}
function drawMenuBg(){
  const c = menuBg.ctx, W = 320, H = 180;
  if (!c || menuBg.cv.style.display === 'none') return;
  const now = performance.now();
  const dt = Math.min(0.05, (now - (menuBg.lastT || now)) / 1000);
  menuBg.lastT = now;
  menuBg.t += dt;
  const t = menuBg.t;
  // Cielo: turquesa, verde y un resplandor violeta
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d6b6e'); sky.addColorStop(0.45, '#2fb08a'); sky.addColorStop(0.72, '#8fdc6a'); sky.addColorStop(1, '#4fae4a');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  const glow = c.createRadialGradient(250, 30, 4, 250, 30, 150);
  glow.addColorStop(0, 'rgba(230,150,255,.45)'); glow.addColorStop(1, 'rgba(230,150,255,0)');
  c.fillStyle = glow; c.fillRect(0, 0, W, H);
  // Haces de luz que se desplazan
  c.fillStyle = 'rgba(255,255,220,.10)';
  for (let i = 0; i < 4; i++){
    const x = ((i*95 + t*14) % 420) - 60;
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 26, 0); c.lineTo(x - 40, H); c.lineTo(x - 66, H); c.closePath(); c.fill();
  }
  // Árboles en tres capas, con viento
  for (const tr of menuBg.trees){
    const depth = [0.5, 0.8, 1.15][tr.layer];
    const w = 22*depth, h = 30*depth;
    const y = [92, 116, 146][tr.layer] - h;
    const sway = Math.sin(t*1.3 + tr.ph) * (0.6 + tr.layer*0.6);
    drawSprite(c, tr.src, tr.x + sway - w/2, y, w, h, false);
  }
  // Suelo con franjas que se mueven
  const ground = c.createLinearGradient(0, 140, 0, H);
  ground.addColorStop(0, '#6fd45a'); ground.addColorStop(1, '#2e8f3a');
  c.fillStyle = ground; c.fillRect(0, 140, W, H - 140);
  c.fillStyle = 'rgba(20,80,30,.25)';
  for (let x = -20; x < W + 20; x += 28){ c.fillRect(((x + t*18) % (W + 40)) - 20, 146, 12, 2); c.fillRect(((x + t*12 + 9) % (W + 40)) - 20, 162, 10, 2); }
  // Caminos luminosos que parpadean
  c.setLineDash([5, 7]); c.lineDashOffset = -t*22;
  c.strokeStyle = 'rgba(126,247,255,.85)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-5, 178); c.quadraticCurveTo(120, 150, 170, 128); c.quadraticCurveTo(230, 110, 340, 118); c.stroke();
  c.setLineDash([]);
  // Partículas que suben
  for (const p of menuBg.parts){
    p.y -= p.v*dt; p.x += Math.sin(t + p.ph)*0.15;
    if (p.y < -4){ p.y = H + 4; p.x = Math.random()*W; }
    c.globalAlpha = 0.55 + 0.45*Math.sin(t*2 + p.ph);
    c.fillStyle = p.c; c.fillRect(p.x|0, p.y|0, 2, 2);
  }
  c.globalAlpha = 1;
  // Digimon caminando de un lado a otro, con las skins equipadas
  for (const d of menuBg.dig){
    d.x += d.sp*dt;
    if (d.x > W + 30) d.x = -30;
    if (d.x < -30) d.x = W + 30;
    const bob = Math.abs(Math.sin(t*6 + d.ph)) * 3;
    drawSprite(c, spriteOf(d.key, false), d.x, 142 - bob - 26, 26, 26, d.sp < 0);
  }
  // Viñeta para enfocar el centro
  const v = c.createRadialGradient(W/2, H/2, 60, W/2, H/2, 220);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,20,30,.45)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}
initMenuBg();

// ---------- Bucle ----------
let last = performance.now(), animMs = 0;
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  if (state === 'play' && g){
    // Esquiva perfecta: 1 s de cámara lenta (el reloj real sigue)
    let sdt = dt;
    if (g.slowT > 0){ g.slowT -= dt; sdt = dt*0.35; }
    if (g.perfectCd > 0) g.perfectCd -= dt;
    if (!g.evoAnim) update(sdt);   // durante la digievolución el mundo se detiene y solo corre la animación
    if (g){
      syncMeshes(); updateCamera(dt); updateHUD(); drawEdgeMarkers();
      if (g.aura){ g.aura.group.position.set(g.p.x, terrainH(g.p.x, g.p.z) + g.p.y, g.p.z); g.aura.update(g.t); }
    }
  }
  touchCtlSync();
  animateEvo(dt);
  updateFx(dt);
  updateWater(dt);
  hurtT = Math.max(0, hurtT - dt);
  document.getElementById('hurt').style.opacity = (hurtT / 0.45) * 0.85;
  // Animación: los enemigos alternan sus dos fotogramas de reposo; el jugador además ataca y recibe daño
  if (state !== 'map') animMs += dt*1000;   // reloj de animación: se congela con el mapa abierto
  const idleF = Math.floor(animMs/380) % 2;
  for (const tx of animTexs) tx.offset.x = idleF/ANIM_N;
  if (g && g.playerMesh){
    const pm = g.playerMesh.material.map;
    if (pm && pm.isAnim){
      if (state === 'play'){
        g.atkT = Math.max(0, (g.atkT || 0) - dt);
        const lp = g.lastPos || (g.lastPos = {x: g.p.x, z: g.p.z});
        g.moving = Math.hypot(g.p.x - lp.x, g.p.z - lp.z) > 0.004; lp.x = g.p.x; lp.z = g.p.z;
      }
      const f = hurtT > 0.25 ? 4 : g.atkT > 0.13 ? 2 : g.atkT > 0 ? 3 : Math.floor(animMs/(g.moving ? 150 : 380)) % 2;
      pm.offset.x = f/ANIM_N;
    }
  }
  frameNo++;
  if (state === 'play' && g && frameNo % Q.minimapEvery === 0) drawWorldMap(document.getElementById('minimap'), 170);
  if (state === 'map' && g) drawWorldMap(document.getElementById('bigmap'), 600);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildSkins();
if (trainerName) showSelect(); else showRegister();
// Modo demo (solo para grabar los vídeos del tutorial con ?demo=1): expone el estado y atajos de escena
if (new URLSearchParams(location.search).has('demo')){
  window.__dbk = {
    get g(){ return g; }, get state(){ return state; }, get scene(){ return scene; },
    rollReward, grantReward, setBanner: b => { gxBanner = b; }, playPullAnimation,
    startGame, spawnEnemy, spawnMagnetDrop, setZone, showGacha, addSkill, upgradeChoices,
    // Datos de skins y personajes
    SKINS, EVO_LINE, CHARS, SEASONS, glitchPixels,
    headUrl, spriteWith,
    checkUnlocks, isUnlocked,
    showSelect, showCollection, showPicker,
    showSettings,
    rollTier,
    get music(){ return Music.file; },
    specialPool, spawnSpecial,
    spawnMini, MINIS, startMapEvent, summonBoss, openPortal, enterScreen, showMapSelect, MAPS, setRun: (m, d, mode) => { runMap = m; if (d) runDiff = d; if (mode) runMode = mode; }, triggerEmergency, grantEmblem, evoSkillCards, EVO_SKILLS, fusionCards, openUpgrades, pickUpgrade, bossPhases,
    // Simulación rápida sin dibujar (para medir el equilibrio): avanza sec segundos y elige la carta pick en cada subida
    sim(sec, pick = 0, move = false, god = false){
      const out = [];
      let t0 = g.t;
      while (g && g.t - t0 < sec && state !== 'end'){
        if (state === 'levelup'){
          let i = pick;
          if (pick < 0){   // jugador razonable: evolución > habilidad > daño/cadencia/proyectil > la primera
            const c = g.choices, f = fn => c.findIndex(fn);
            i = [f(x => x.evo), f(x => x.skill), f(x => /Daño \+|Cadencia|Proyectil/.test(x.t || '')), 0].find(v => v >= 0);
          }
          pickUpgrade(Math.min(i, g.choices.length - 1)); continue;
        }
        if (g.evoAnim){ animateEvo(5); continue; }
        if (state === 'paused'){ state = 'play'; hideOverlay(); continue; }
        if (state !== 'play') break;
        if (move){ const a = g.t*0.4; [g.p.x, g.p.z] = clampArena(g.p.x + Math.cos(a)*g.p.speed*0.05, g.p.z + Math.sin(a)*g.p.speed*0.05, ARENA_R - 3); }
        if (god) g.p.hp = g.p.maxHp;
        update(0.05);
        if (Math.floor(g.t) % 30 === 0 && Math.floor(g.t) !== Math.floor(g.t - 0.05)) out.push({t: Math.round(g.t), lvl: g.p.lvl, kills: g.kills, idle: +(g.idleT||0).toFixed(1), hp: Math.round(g.p.hp), max: g.p.maxHp, dmg: +g.p.dmg.toFixed(2), cd: +g.p.cdMul.toFixed(2), area: +g.p.area.toFixed(2), en: g.enemies.length, evo: g.ch.evolved | 0});
      }
      return {state, out};
    },
    nearChest(){
      const p = g.p, a = p.dir ? Math.atan2(p.dir.z, p.dir.x) : 0;
      const [cx, cz] = clampArena(p.x + Math.cos(a)*3, p.z + Math.sin(a)*3, ARENA_R - 2);
      const {group, pivot} = makeChest();
      group.position.set(cx, terrainH(cx, cz), cz);
      world.add(group);
      g.chests.push({x: cx, z: cz, group, pivot, open: false, openT: 0, gone: false});
    }
  };
}
requestAnimationFrame(frame);
</script>
