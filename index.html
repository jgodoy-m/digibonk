/* ---------- Paleta de los menús (Digibonk): claro por defecto, oscuro = los azules de siempre ---------- */
:root{
  --m-card:#ffffff; --m-cardb:#ffffff; --m-cardline:#dde4ef; --m-sunk:#f1f4fa; --m-line:#e2e8f1; --m-line2:#cad5e5;
  --m-text:#172036; --m-mute:#6b7891; --m-soft:#46526a; --m-acc:#4e63e8;
  --m-head:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 10px,transparent 10px 20px),linear-gradient(90deg,#12b4c8,#4e63e8);
  --m-banner:linear-gradient(180deg,#8576ff,#5b47ea 55%,#4733cc); --m-banner-sh:#2c1f97; --m-banner-txt:#ffffff;
  --m-cta:linear-gradient(180deg,#ffc24f,#ff8a1e 55%,#ef6400); --m-cta-sh:#b44700;
  --m-sel:#ff8a1e; --m-selbg:#fff3e6; --m-pillsh:0 2px 0 #d3dcea; --m-tile:#25306c; --m-tileline:#4e63e8; --m-tilehi:#3b4a8f;
  --m-tilesel:linear-gradient(180deg,#7fe6f2,#22a9c6); --m-hero:radial-gradient(50% 18% at 50% 78%,rgba(255,255,255,.55),transparent 70%),linear-gradient(180deg,#4fd3e3,#4e63e8);
  --m-panel:#ffffff; --m-rowbg:#f3f6fb; --m-tabon:#172036; --m-tabon-txt:#ffffff; --m-meter:linear-gradient(90deg,#12b4c8,#4e63e8);
  --m-good:#1d9a57; --m-bad:#d9392b; --m-gold:#c98a00; --m-shadow:0 10px 30px rgba(0,0,0,.25); --m-scrim:rgba(10,16,40,.55);
  --m-btn:#ffffff; --m-btnsh:0 3px 0 #c9d3e2,0 6px 14px rgba(0,0,0,.18);
}
html[data-theme=oscuro]{
  --m-card:#1e2024; --m-cardb:#1e2024; --m-cardline:#34373d; --m-sunk:#16171a; --m-line:#2c2f34; --m-line2:#3d4148;
  --m-text:#eceef2; --m-mute:#9aa0aa; --m-soft:#c4c9d1; --m-acc:#8b9bff;
  --m-selbg:rgba(255,138,30,.15); --m-pillsh:0 2px 0 #0b0c0e; --m-tile:#2a2d33; --m-tilehi:#363a41;
  --m-panel:#1e2024; --m-rowbg:#25282d; --m-good:#4fd68e; --m-bad:#ff6f62; --m-gold:#ffc24f;
  --m-shadow:0 10px 30px rgba(0,0,0,.55); --m-scrim:rgba(0,0,0,.66);
  --m-btn:#2a2d33; --m-btnsh:0 3px 0 #0b0c0e,0 6px 14px rgba(0,0,0,.35);
}
/* ---------- Selección de personaje: tarjetas blancas (tema claro) o azules de siempre (tema oscuro) ---------- */
.ps{
  --ps-card:var(--m-card); --ps-cardb:var(--m-cardb); --ps-cardline:var(--m-cardline); --ps-sunk:var(--m-sunk); --ps-line:var(--m-line); --ps-line2:var(--m-line2);
  --ps-text:var(--m-text); --ps-mute:var(--m-mute); --ps-soft:var(--m-soft); --ps-acc:var(--m-acc);
  --ps-head:var(--m-head); --ps-sel:var(--m-sel); --ps-selbg:var(--m-selbg); --ps-pillsh:var(--m-pillsh); --ps-tile:var(--m-tile); --ps-tileline:var(--m-tileline);
  --ps-hero:var(--m-hero); --ps-panel:var(--m-panel); --ps-rowbg:var(--m-rowbg); font-family:'Nunito',system-ui,sans-serif;
}
#overlay:not(.menu-mode)>.picker-screen.ps{width:min(1500px,98vw)!important;height:calc(100dvh - var(--ui-top) - var(--ui-bot) + 30px)!important;max-height:none!important;margin-top:-30px;
  padding:0!important;gap:14px;overflow:visible;background:none!important;border:0!important;outline:0!important;box-shadow:none!important;clip-path:none!important;color:var(--ps-text)!important}
#overlay:not(.menu-mode):has(>.ps){filter:none}
.ps-lbl{font:800 11px/1.2 'Nunito',system-ui,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--ps-mute)}
.ps-lbl small{text-transform:none;letter-spacing:0;font-weight:700}
.ps kbd{display:inline-grid;place-items:center;padding:1px 6px;border-radius:5px;background:#2b3448;color:#fff;font:800 10px 'Nunito',system-ui,sans-serif;text-shadow:none;border:0}
/* Cabecera: Volver, cartel naranja y tema */
.ps-top{display:flex;align-items:center;gap:16px;min-width:0}
#overlay:not(.menu-mode) .ps .g-back{display:inline-flex;align-items:center;gap:8px;background:var(--m-btn)!important;color:var(--m-text)!important;border:0!important;border-radius:99px!important;clip-path:none!important;padding:8px 16px 8px 10px;
  font:800 14px 'Nunito',system-ui,sans-serif;letter-spacing:0;box-shadow:var(--m-btnsh)!important}
#overlay:not(.menu-mode) .ps .g-back:hover{transform:translateY(-1px)}
.ps-banner{display:flex;align-items:baseline;gap:12px;padding:8px 30px 8px 22px;background:var(--m-banner);transform:skewX(-8deg);border-radius:10px;box-shadow:0 4px 0 var(--m-banner-sh),0 8px 18px rgba(0,0,0,.25)}
.ps-banner>*{transform:skewX(8deg)}
#overlay .ps-banner h2{margin:0;font:900 26px 'Orbitron',system-ui,sans-serif;letter-spacing:1px;color:var(--m-banner-txt)!important;text-shadow:0 2px 0 rgba(0,0,0,.2)!important}
.ps-banner small{font:800 13px 'Nunito',system-ui,sans-serif;color:var(--m-banner-txt);opacity:.85}
.ps-theme{margin-left:auto;display:inline-flex;gap:2px;padding:4px;border-radius:99px;background:var(--m-btn);box-shadow:var(--m-btnsh)}
.ps-theme button{border:0;border-radius:99px;padding:6px 14px;background:transparent;color:#6c7a90;font:800 13px 'Nunito',system-ui,sans-serif;cursor:pointer}
.ps-theme button.on{background:var(--m-tabon);color:var(--m-tabon-txt)}
/* Cuerpo: tarjeta grande + plantel */
.ps-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px}
.ps-card{background:var(--ps-card);border:1px solid var(--ps-cardline);border-radius:16px;min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ps-main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ps-sum{display:grid;grid-template-columns:170px minmax(300px,1fr) 200px 210px;gap:20px;padding:16px 18px;border-bottom:1px solid var(--ps-line)}
.ps-hero{position:relative;display:grid;place-items:center;border-radius:14px;background:var(--ps-hero);border:3px solid #a9e6ef;min-height:180px;align-self:start}
.anim.ps-hero-img{width:150px;height:150px;background-size:500% 100%;background-position:0 50%;margin-top:-14px}
.ps-hero-tag{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 12px 'Nunito',system-ui,sans-serif;padding:2px 12px;border-radius:99px;background:#fff;color:#1d2433}
.ps-id{display:flex;flex-direction:column;gap:7px;min-width:0}
.ps-idline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#overlay .ps-id h3{margin:0;font:900 38px/1 'Nunito',system-ui,sans-serif;color:var(--ps-text);letter-spacing:.3px}
.ps-attr,.ps-emb{display:inline-flex;align-items:center;gap:5px;font:800 12px 'Nunito',system-ui,sans-serif;padding:3px 12px;border-radius:99px;white-space:nowrap;color:#fff}
.ps-attr.a-vac{background:#2fb36a}
.ps-attr.a-dat{background:#2d7be5}
.ps-attr.a-vir{background:#9a4fd6}
.ps-emb{background:#a8781c;font-size:11px;padding:2px 10px}
.ps-evo{display:flex;align-items:center;gap:5px;flex-wrap:nowrap}
.ps-node{display:inline-block;padding:2px;border-radius:50%;border:3px solid #a9e6ef;background:var(--m-tilesel);cursor:pointer;line-height:0}
.ps-node.on{border-color:var(--ps-sel)}
.ps-node .spr{border-radius:50%}
.ps-arrow{display:flex;flex-direction:column;align-items:center;white-space:nowrap;font:800 10px 'Nunito',system-ui,sans-serif;color:var(--ps-mute);line-height:1}
.ps-arrow i{font-style:normal;font-size:18px;color:var(--ps-soft)}
.ps-wins{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ps-wins .ps-lbl{flex-basis:100%;margin-top:2px}
.ps-wins span:not(.ps-lbl){font:800 11px 'Nunito',system-ui,sans-serif;padding:2px 10px;border-radius:99px;background:var(--ps-sunk);color:var(--ps-mute)}
.ps-wins span.on{color:#fff;background:var(--dc)}
.ps-stats,.ps-ingame{display:flex;flex-direction:column;gap:3px;min-width:0}
.ps-stats .ps-lbl,.ps-ingame .ps-lbl{margin-bottom:5px}
.ps-bar{display:grid;grid-template-columns:66px 1fr 44px;gap:8px;align-items:center;font:800 13px 'Nunito',system-ui,sans-serif;padding:2px 0}
.ps-bar b{text-align:right;font-variant-numeric:tabular-nums}
.ps-meter{height:9px;border-radius:5px;background:var(--ps-sunk);overflow:hidden}
.ps-meter i{display:block;height:100%;border-radius:5px;background:var(--m-meter)}
.ps-row{display:flex;justify-content:space-between;gap:8px;font:700 12.5px 'Nunito',system-ui,sans-serif;color:var(--ps-soft);padding:3px 8px;border-radius:5px}
.ps-row:nth-child(even){background:var(--ps-rowbg)}
.ps-row b{color:var(--ps-text);font-weight:900;font-variant-numeric:tabular-nums}
/* Dos paneles con cabecera azul */
.ps-cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px;background:var(--ps-sunk)}
.ps-panel{display:flex;flex-direction:column;min-height:0;border-radius:14px;background:var(--ps-panel);border:1px solid var(--ps-line);overflow:hidden}
.ps-ph{display:flex;align-items:center;gap:10px;margin:0;padding:9px 14px;background:var(--ps-head);color:#fff;font:900 15px 'Nunito',system-ui,sans-serif;letter-spacing:.3px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.ps-ph i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;color:#3b56d8;font:900 13px 'Nunito',system-ui,sans-serif;text-shadow:none}
.ps-pb{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.ps-big{margin:0;font:900 17px 'Nunito',system-ui,sans-serif;color:var(--ps-text)}
.ps-txt{margin:0;font:600 13px/1.45 'Nunito',system-ui,sans-serif;color:var(--ps-soft)}
.ps-hr{border:0;border-top:1px dashed var(--ps-line2);margin:6px 0;width:100%}
.ps-note{margin:0;font:700 11.5px 'Nunito',system-ui,sans-serif;color:var(--ps-mute)}
.ps-chips{display:flex;gap:6px;flex-wrap:wrap}
.ps-chips span{display:inline-flex;align-items:baseline;gap:5px;padding:2px 9px;border-radius:7px;background:var(--m-btn);border:1px solid var(--ps-line2);box-shadow:var(--ps-pillsh);font:700 11px 'Nunito',system-ui,sans-serif;color:var(--ps-mute)}
.ps-chips b{color:var(--ps-text);font-weight:900;font-size:12px}
.ps-kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ps-atk{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:2px solid #c9cffd;background:linear-gradient(180deg,#f2f3ff,#e7eaff)}
.ps-atk.k-ofensiva{border-color:#ffd2a6;background:linear-gradient(180deg,#fff6ec,#ffeedd)}
.ps-atk.k-utilidad{border-color:#bfe8c9;background:linear-gradient(180deg,#effbf2,#e2f6e8)}
html[data-theme=oscuro] .ps-atk{background:#25282d;border-color:#3d4148}
html[data-theme=oscuro] .ps-atk.k-ofensiva{background:rgba(255,138,30,.08);border-color:rgba(255,138,30,.45)}
html[data-theme=oscuro] .ps-atk.k-utilidad{background:rgba(79,214,142,.08);border-color:rgba(79,214,142,.45)}
.ps-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-style:normal;font:900 17px system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#7c8cff,#4e63e8);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ps-atk.k-ofensiva .ps-ico{background:linear-gradient(180deg,#ffb04a,#f06a14)}
.ps-atk.k-utilidad .ps-ico{background:linear-gradient(180deg,#5fd68a,#26a05a)}
.ps-ico.r{font:900 15px 'Nunito',system-ui,sans-serif;background:linear-gradient(180deg,#ff8a65,#e0412b)}
.ps-atk-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ps-atk-h b{font:900 14px 'Nunito',system-ui,sans-serif;color:var(--ps-text)}
.ps-atk-h em{font:900 10px 'Nunito',system-ui,sans-serif;font-style:normal;text-transform:capitalize;color:#fff;border-radius:99px;padding:1px 8px;background:#4e63e8}
.ps-atk.k-ofensiva .ps-atk-h em{background:#f06a14}
.ps-atk.k-utilidad .ps-atk-h em{background:#26a05a}
.ps-kind{display:block;font:800 11px 'Nunito',system-ui,sans-serif;color:#4e63e8}
.ps-atk.k-ofensiva .ps-kind{color:#d9580f}
.ps-atk.k-utilidad .ps-kind{color:#1f9a55}
.ps-atk p{margin:3px 0 7px;font:600 12px/1.35 'Nunito',system-ui,sans-serif;color:var(--ps-soft)}
.ps-ult{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ps-ult b{font:900 14.5px 'Nunito',system-ui,sans-serif;color:var(--ps-text)}
.ps-ult p{margin:2px 0 0;font:600 12px/1.35 'Nunito',system-ui,sans-serif;color:var(--ps-soft)}
.ps-ult .ps-node{cursor:default}
.ps-ult .ps-ico{width:46px;height:46px;font-size:18px}
.ps-trow{display:grid;grid-template-columns:110px auto 1fr;gap:6px 10px;align-items:center;padding:6px 0}
.ps-trow .ps-foes{grid-column:1/-1}
.ps-tl{font:900 13px 'Nunito',system-ui,sans-serif;color:var(--ps-text)}
.ps-trow.good .ps-tl{color:#1f9a55}
.ps-trow.bad .ps-tl{color:#d93a2b}
.ps-trow>b{font:800 11.5px 'Nunito',system-ui,sans-serif;color:var(--ps-mute);white-space:nowrap}
.ps-foes{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.ps-foes img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated;border-radius:50%;background:var(--ps-sunk);border:1px solid var(--ps-line)}
.ps-foes small{font:800 11px 'Nunito',system-ui,sans-serif;color:var(--ps-mute);margin-left:2px}
/* Pie: tus cifras y botón grande */
.ps-foot{display:flex;align-items:center;gap:16px;padding:12px 18px;border-top:1px solid var(--ps-line)}
.ps-mine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.ps-mine .ps-lbl{margin-right:4px}
.ps-pill{padding:4px 12px;border-radius:99px;background:var(--m-btn);border:1px solid var(--ps-line2);box-shadow:var(--ps-pillsh);font:700 12px 'Nunito',system-ui,sans-serif;color:var(--ps-mute)}
.ps-pill b{color:var(--ps-text);font-weight:900;font-size:15px;margin-right:2px}
#overlay:not(.menu-mode) .ps-go{min-width:300px;padding:14px 26px;border-radius:14px!important;clip-path:none!important;font:900 22px 'Nunito',system-ui,sans-serif;letter-spacing:.3px;display:inline-flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  background:var(--m-cta)!important;border:0!important;box-shadow:0 5px 0 var(--m-cta-sh),0 8px 18px rgba(239,100,0,.3)!important;text-shadow:0 2px 0 var(--m-cta-sh)!important}
.ps-go kbd{font-size:11px!important;background:#fff!important;color:#c45200!important}
/* Plantel */
.ps-roster{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:14px;gap:10px}
.ps-seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--ps-sunk)}
.ps-seg button{flex:1;border:0;border-radius:9px;padding:8px 6px;background:transparent;color:var(--ps-soft);font:800 13px 'Nunito',system-ui,sans-serif;cursor:pointer}
.ps-seg button.on{background:var(--m-tabon);color:var(--m-tabon-txt)}
.ps-roster-in{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px;scrollbar-width:thin}
.ps-search{width:100%;box-sizing:border-box;padding:9px 14px;border-radius:99px;border:1px solid var(--ps-line2);background:var(--ps-sunk);color:var(--ps-text);font:700 13px 'Nunito',system-ui,sans-serif}
.ps-search::placeholder{color:var(--ps-mute)}
.ps-search:focus{outline:none;border-color:var(--ps-acc)}
.ps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ps-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;aspect-ratio:1/1.08;padding:6px 2px;border-radius:12px;border:3px solid var(--ps-tileline);background:linear-gradient(180deg,var(--m-tilehi),var(--ps-tile));color:#fff;cursor:pointer;font:inherit;min-width:0;box-sizing:border-box}
.ps-tile:hover{filter:brightness(1.1)}
.ps-tile.sel{border-color:var(--ps-sel);background:var(--m-tilesel);box-shadow:0 0 0 2px rgba(255,138,30,.3)}
.ps-tile.lock,.ps-tile.soon{cursor:default}
.ps-tile.lock .anim{filter:grayscale(1) brightness(.3)}
.ps-tile.soon{border-color:#5c6a8f;opacity:.85}
.ps-tile.soon img{width:62%;height:62%;object-fit:contain;image-rendering:pixelated;filter:grayscale(1) brightness(.35)}
.ps-lock{position:absolute;top:4px;right:5px;font-size:11px}
.ps-tile.miss{display:none}
.ps-tile b{font:900 11.5px 'Nunito',system-ui,sans-serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.anim.ps-face{width:72%;height:auto;aspect-ratio:1;background-size:500% 100%;background-position:0 50%}
.ps-none{display:grid;place-items:center;width:72%;aspect-ratio:1;color:#cfe4fa;font-size:22px}
.ps-key{position:absolute;top:4px;left:7px;font:900 10px 'Nunito',system-ui,sans-serif;color:#cfe4fa}
.ps-evo-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#5fe08f;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.ps-prog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px 2px;border-top:1px solid var(--ps-line);font:900 15px 'Nunito',system-ui,sans-serif}
@media (max-height:860px) and (min-width:761px){
  .ps-sum{grid-template-columns:150px minmax(280px,1fr) 190px 200px;gap:16px;padding:12px 14px}
  .ps-hero{min-height:150px}
  .anim.ps-hero-img{width:120px;height:120px}
  #overlay .ps-id h3{font-size:30px}
  .ps-id{gap:5px}
  .ps-node .spr{width:38px!important;height:38px!important}
  .ps-row{padding:2px 8px;font-size:12px}
  .ps-bar{font-size:12px;padding:1px 0}
  .ps-cols{padding:10px 12px;gap:10px}
  .ps-foot{padding:8px 14px}
  #overlay:not(.menu-mode) .ps-go{padding:11px 22px;font-size:19px}
}
@media (max-width:1300px) and (min-width:761px){
  .ps-body{grid-template-columns:minmax(0,1fr) 300px}
  .ps-sum{grid-template-columns:150px minmax(0,1fr) 210px}
  .ps-ingame{display:none}
  .ps-evo{flex-wrap:wrap}
}
@media (max-width:1000px) and (min-width:761px){
  .ps-cols{grid-template-columns:1fr;overflow:auto}
  .ps-panel{min-height:auto;overflow:visible}
  .ps-pb{overflow:visible}
  .ps-kit{grid-template-columns:1fr}
}
@media (max-width:760px){
  #overlay:not(.menu-mode)>.picker-screen.ps{width:auto!important;height:auto!important;margin:4px 6px 14px!important;overflow:visible!important}
  .ps-top{flex-wrap:wrap;gap:10px}
  .ps-banner{order:3;flex-basis:100%;padding:6px 18px;box-sizing:border-box}
  #overlay .ps-banner h2{font-size:18px}
  .ps-body{display:flex;flex-direction:column;gap:12px}
  .ps-roster{order:-1;overflow:visible}
  .ps-roster-in{overflow:visible}
  .ps-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .ps-evo{flex-wrap:wrap}
  .ps-main{overflow:visible}
  .ps-sum{grid-template-columns:120px minmax(0,1fr);gap:12px;padding:12px}
  .ps-hero{min-height:120px}
  .anim.ps-hero-img{width:100px;height:100px;margin-top:-10px}
  #overlay .ps-id h3{font-size:26px}
  .ps-node .spr{width:32px!important;height:32px!important}
  .ps-stats,.ps-ingame{grid-column:1/-1}
  .ps-cols{grid-template-columns:1fr;padding:10px}
  .ps-panel,.ps-pb{overflow:visible}
  .ps-kit{grid-template-columns:1fr}
  .ps-trow{grid-template-columns:auto auto 1fr}
  .ps-foot{position:sticky;bottom:0;z-index:5;flex-direction:column;align-items:stretch;gap:10px;border-radius:0 0 16px 16px;background:var(--ps-cardb)}
  #overlay:not(.menu-mode) .ps-go{min-width:0;width:100%}
  .ps-foot .ps-mine{display:none}
  .ps-foot{padding:10px 12px}
}
/* ---------- Kit común de menús: misma estructura que la selección de personaje, colores por tema ---------- */
#overlay:not(.menu-mode)>:is(.picker-screen.cl4,.picker-screen.ms,.pk2-starter,.settings,.help-box,.lab-screen){
  background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:16px!important;outline:0!important;clip-path:none!important;
  box-shadow:var(--m-shadow)!important;color:var(--m-text)!important;font-family:'Nunito',system-ui,sans-serif}
#overlay:not(.menu-mode):has(>:is(.cl4,.ms,.pk2-starter,.settings,.help-box,.lab-screen)){filter:none}
/* Cabeceras: fuera la barra; el título va en el cartel de color */
#overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen) :is(.pk-head,.set-head,.lab-top),#overlay:not(.menu-mode) :is(.ms,.pk2-starter) .pk2-top{
  background:none!important;border:0!important;box-shadow:none!important;clip-path:none!important;padding:0 0 4px!important;color:var(--m-text)!important;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen,.ms,.pk2-starter) :is(.pk-head,.set-head,.lab-top,.pk2-top) h2{
  margin:0;display:inline-block;padding:7px 24px 7px 18px;border-radius:10px;background:var(--m-banner)!important;color:var(--m-banner-txt)!important;
  font:900 20px 'Orbitron',system-ui,sans-serif!important;letter-spacing:1px!important;text-transform:none!important;text-shadow:0 2px 0 rgba(0,0,0,.18)!important;
  box-shadow:0 4px 0 var(--m-banner-sh);transform:skewX(-8deg)}
#overlay:not(.menu-mode) .lab-top small{color:var(--m-mute)!important}
/* Volver y botones secundarios en píldora */
html[lang] #overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen,.ms,.pk2-starter) .g-back,
html[lang] #overlay:not(.menu-mode) :is(.settings,.lab-screen,.cl4) .mini-btn:not(.danger){
  background:var(--m-btn)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important;border-radius:99px!important;clip-path:none!important;
  font:800 13px 'Nunito',system-ui,sans-serif!important;letter-spacing:0!important;box-shadow:var(--m-pillsh)!important;padding:8px 16px}
html[lang] #overlay:not(.menu-mode) .mini-btn.danger{border-radius:99px!important;clip-path:none!important;font:800 13px 'Nunito',system-ui,sans-serif!important;letter-spacing:0!important}
/* Segmentos y pestañas */
#overlay:not(.menu-mode) :is(.cl4-tab,.set-seg){border-radius:99px!important;border:1px solid var(--m-line2)!important;background:var(--m-sunk)!important;color:var(--m-soft)!important;font:800 13px 'Nunito',system-ui,sans-serif!important;box-shadow:none!important}
#overlay:not(.menu-mode) :is(.cl4-tab,.set-seg).on{background:var(--m-tabon)!important;color:var(--m-tabon-txt)!important;border-color:transparent!important}
#overlay:not(.menu-mode) .set-toggle{border-radius:99px!important;font:800 13px 'Nunito',system-ui,sans-serif!important}
/* Botón principal */
#overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen,.ms,.pk2-starter) :is(.pk-start,.g-btn){background:var(--m-cta)!important;border:0!important;border-radius:14px!important;clip-path:none!important;
  box-shadow:0 5px 0 var(--m-cta-sh)!important;text-shadow:0 2px 0 var(--m-cta-sh)!important;font-family:'Nunito',system-ui,sans-serif!important;font-weight:900!important;color:#fff!important}
/* Tarjetas internas */
#overlay:not(.menu-mode) :is(.cl4-item,.cl4-skin,.cl4-card,.lab-card,.ms-card,.ms-diff){background:var(--m-sunk)!important;border:2px solid var(--m-line)!important;border-radius:12px!important;color:var(--m-text)!important;box-shadow:none!important}
#overlay:not(.menu-mode) :is(.cl4-item.sel,.cl4-skin.eq,.ms-card.on,.ms-diff.on){border-color:var(--m-sel)!important;background:var(--m-selbg)!important}
#overlay:not(.menu-mode) :is(.cl4-detail,.ms-table,.lab-say){background:var(--m-panel)!important;border:1px solid var(--m-line)!important;border-radius:14px!important;color:var(--m-text)!important}
#overlay:not(.menu-mode) .lab-say{border-left:4px solid var(--m-sel)!important;color:var(--m-soft)!important}
#overlay:not(.menu-mode) .ms-table li{background:var(--m-rowbg)!important}
#overlay:not(.menu-mode) .settings .set-row{border-bottom:1px solid var(--m-line)!important;padding:12px 0!important}
#overlay:not(.menu-mode) .settings textarea{background:var(--m-sunk)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important;border-radius:10px!important}
/* Textos */
#overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen,.ms,.pk2-starter) :is(b,strong,h3,h4,.cl-pct,.ms-txt b){color:var(--m-text)!important;text-shadow:none!important}
#overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen,.ms,.pk2-starter) :is(small,p,.muted,.sc-p,.pk2-sub,.pk-hint,.cl4-item small,.lab-txt p){color:var(--m-soft)!important;text-shadow:none!important}
#overlay:not(.menu-mode) :is(.cl4,.ms) h4{color:var(--m-mute)!important;font:800 11px 'Nunito',system-ui,sans-serif!important;letter-spacing:1.4px;text-transform:uppercase}
#overlay:not(.menu-mode) .cl4-detail h3,#overlay:not(.menu-mode) .help-box h3{font:900 22px 'Nunito',system-ui,sans-serif!important}
#overlay:not(.menu-mode) .lab-bits{background:var(--m-sunk)!important;color:var(--m-gold)!important;border:1px solid var(--m-line2)!important;border-radius:99px!important}
#overlay:not(.menu-mode) .lab-ic{background:var(--m-tilesel)!important;color:#fff!important;border-radius:50%!important}
#overlay:not(.menu-mode) .lab-buy{background:var(--m-cta)!important;color:#fff!important;border-radius:10px!important;box-shadow:0 3px 0 var(--m-cta-sh)!important;text-shadow:0 1px 0 var(--m-cta-sh)}
#overlay:not(.menu-mode) .lab-pips i{background:var(--m-line2)!important}
#overlay:not(.menu-mode) .lab-pips i.on{background:var(--m-acc)!important}
#overlay:not(.menu-mode) .tuto-dot{background:var(--m-line2)!important}
#overlay:not(.menu-mode) .tuto-dot.on{background:var(--m-sel)!important}
#overlay:not(.menu-mode) .ms-card em{background:var(--m-banner)!important;border:0!important;color:#fff!important}
#overlay:not(.menu-mode) .ms-card .ms-tags i{background:var(--m-panel)!important;border:1px solid var(--m-line2)!important;color:var(--m-soft)!important;font-style:normal}
#overlay:not(.menu-mode) .ms-rec{color:var(--m-gold)!important}
/* Ventanas del menú principal (encargos, logros, misión, récords) */
.approved-info-scrim{background:var(--m-scrim)!important}
.approved-info-scrim .approved-info-dialog{background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:16px!important;box-shadow:var(--m-shadow)!important;color:var(--m-text)!important;text-shadow:none!important;font-family:'Nunito',system-ui,sans-serif}
.approved-info-dialog header{border-bottom:0!important}
.approved-info-dialog header h2{display:inline-block;padding:6px 20px 6px 16px;border-radius:10px;background:var(--m-banner);color:var(--m-banner-txt)!important;font:900 18px 'Orbitron',system-ui,sans-serif!important;box-shadow:0 4px 0 var(--m-banner-sh);transform:skewX(-8deg);margin:0 0 6px!important}
.approved-info-dialog header button{width:34px;height:34px;padding:0!important;border-radius:50%!important;background:var(--m-sunk)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important}
.approved-info-dialog #realDone{background:var(--m-cta)!important;border:0!important;border-radius:12px!important;box-shadow:0 4px 0 var(--m-cta-sh)!important;font:900 15px 'Nunito',system-ui,sans-serif!important;text-shadow:0 1px 0 var(--m-cta-sh)}
.approved-info-dialog .enc-row{background:var(--m-sunk)!important;border:1px solid var(--m-line)!important;border-radius:12px!important;color:var(--m-text)!important}
.approved-info-dialog :is(b,strong,span,p){color:var(--m-text)!important}
.approved-info-dialog small{color:var(--m-good)!important}
.approved-info-dialog :is(.approved-info-meter,.ach-bar){background:var(--m-line2)!important;border:0!important}
.approved-info-dialog .ach-bar u,.approved-info-dialog .approved-info-meter i{background:var(--m-meter)!important}
#overlay:not(.menu-mode) :is(.cl4,.settings,.help-box,.lab-screen,.ms,.pk2-starter) :is(.pk-head,.set-head,.lab-top,.pk2-top) h2{flex:none!important;width:auto!important}
#overlay:not(.menu-mode) .ms-diff{border-color:color-mix(in srgb,var(--dc) 45%,var(--m-line))!important}
#overlay:not(.menu-mode) .ms-diff b{color:var(--dc)!important;filter:brightness(.85)}
#overlay:not(.menu-mode) .ms-diff.on{border-color:var(--dc)!important;background:color-mix(in srgb,var(--dc) 14%,transparent)!important}
#overlay:not(.menu-mode)>.picker-screen.ms{overflow:auto!important;height:auto!important}
/* Ficha de entrenador */
.pl4{font-family:'Nunito',system-ui,sans-serif}
.pl4 .pl4-banner{background:none!important;border:0!important;box-shadow:none!important;padding:0!important}
.pl4 .pl4-banner b{display:inline-block;padding:7px 24px 7px 18px;border-radius:10px;background:var(--m-banner);color:var(--m-banner-txt)!important;font:900 20px 'Orbitron',system-ui,sans-serif;letter-spacing:1px;text-transform:none;box-shadow:0 4px 0 var(--m-banner-sh);transform:skewX(-8deg);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.pl4 .pl4-banner small{display:block;margin-top:6px;color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.6)}
html[lang] .pl4 .g-back,html[lang] .pl4 .pl5-share{background:var(--m-btn)!important;color:var(--m-text)!important;border:0!important;border-radius:99px!important;clip-path:none!important;font:800 14px 'Nunito',system-ui,sans-serif!important;letter-spacing:0!important;box-shadow:var(--m-btnsh)!important;padding:8px 16px 8px 10px}
html[lang] .pl4 .g-back kbd{background:#2b3448;color:#fff;border-radius:5px;padding:1px 6px;font:800 10px 'Nunito',system-ui,sans-serif}
.pl4 :is(.pl5-hero,.pl5-panel){background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:16px!important;box-shadow:var(--m-shadow)!important;color:var(--m-text)!important;text-shadow:none!important}
.pl4 .pl5-panel{padding:0!important;overflow:hidden}
.pl4 .pl5-panel>*:not(h3){margin-left:16px;margin-right:16px}
.pl4 .pl5-panel>h3{margin:0 0 10px!important;padding:9px 14px;background:var(--m-head);color:#fff!important;font:900 15px 'Nunito',system-ui,sans-serif!important;text-shadow:0 1px 0 rgba(0,0,0,.25)!important;border:0!important}
.pl4 .pl5-panel>h3 small{color:#fff!important;opacity:.85;font-weight:700}
.pl4 .pl5-panel>:last-child{margin-bottom:14px}
.pl4 :is(.pl5-hero,.pl5-panel) :is(b,strong,h4,.pl4-name,.pl5-rv){color:var(--m-text)!important;text-shadow:none!important}
.pl4 :is(.pl5-hero,.pl5-panel) :is(small,p,em,.pl4-empty,.pl5-rt){color:var(--m-soft)!important;text-shadow:none!important}
.pl4 .pl4-stat{background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:12px!important;box-shadow:var(--m-pillsh)!important;color:var(--m-text)!important}
.pl4 .pl4-stat b{color:var(--m-text)!important;text-shadow:none!important}
.pl4 .pl4-stat small{color:var(--m-mute)!important}
.pl4 .pl4-stat i{color:var(--m-acc)!important}
.pl4 .pl4-chg{background:var(--m-sunk)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important;border-radius:99px!important;clip-path:none!important;font:800 12px 'Nunito',system-ui,sans-serif!important}
.pl4 .pl4-chips span:not(.pl4-title-badge){background:var(--m-sunk)!important;color:var(--m-soft)!important;border:1px solid var(--m-line)!important}
.pl4 .pl4-rec,.pl4 .pl5-rec{border-color:var(--m-line)!important}
.pl4 u{background:var(--m-meter)!important}
.realhub.pl4 .pl5-panel{padding:0 0 12px!important}
.realhub.pl4 .pl5-panel>*:not(h3){margin-left:14px!important;margin-right:14px!important}
.realhub.pl4 .pl5-panel>h3{margin:0 0 10px!important;padding:9px 14px!important;font-size:15px!important}
.realhub.pl4 .pl5-panel>h3 small{color:#fff!important}
.realhub.pl4 .pl4-ach{background:var(--m-sunk)!important;border:1px solid var(--m-line)!important;border-radius:12px!important;padding:8px 10px!important}
.realhub.pl4 .pl4-ach i{background:var(--m-line2)!important}
.realhub.pl4 .pl4-ach u{background:var(--m-meter)!important}
.realhub.pl4 .pl4-ach-top :is(b,em){color:var(--m-text)!important}
html[lang] .realhub.pl4 .pl5-share{background:var(--m-btn)!important;color:var(--m-text)!important;border:0!important;opacity:1!important;box-shadow:var(--m-btnsh)!important;font-family:'Nunito',system-ui,sans-serif!important}
/* Tesoros (gacha): cabecera, pestañas, marco y lateral con el kit; las cartas de premio siguen oscuras como las fichas del plantel */
.tr11{font-family:'Nunito',system-ui,sans-serif}
.tr11 .tr11-title{background:var(--m-banner)!important;border:0!important;border-radius:12px!important;clip-path:none!important;box-shadow:0 5px 0 var(--m-banner-sh),0 10px 22px rgba(0,0,0,.25)!important;transform:skewX(-6deg)}
.tr11 .tr11-title>*{transform:skewX(6deg)}
.tr11 .tr11-title h1{color:var(--m-banner-txt)!important;-webkit-text-stroke:0!important;text-shadow:0 3px 0 rgba(0,0,0,.2)!important;background:none!important;-webkit-text-fill-color:currentColor!important;font-family:'Orbitron',system-ui,sans-serif!important}
.tr11 .tr11-title small{color:var(--m-banner-txt)!important;opacity:.85}
html[lang] .tr11 :is(.tr11-return,.tr11-chrome,.tr11-wallet){background:var(--m-btn)!important;color:var(--m-text)!important;border:0!important;border-radius:99px!important;clip-path:none!important;box-shadow:var(--m-btnsh)!important;font-family:'Nunito',system-ui,sans-serif!important}
html[lang] .tr11 .tr11-wallet b{color:var(--m-gold)!important}
html[lang] .tr11 :is(.tr11-return,.tr11-chrome,.tr11-wallet) *{color:inherit}
.tr11 .tr11-banner-tab{background:var(--m-sunk)!important;color:var(--m-soft)!important;border:1px solid var(--m-line2)!important;border-radius:99px!important;clip-path:none!important;font-family:'Nunito',system-ui,sans-serif!important;font-weight:800!important;box-shadow:none!important}
.tr11 .tr11-banner-tab.chosen{background:var(--m-tabon)!important;color:var(--m-tabon-txt)!important;border-color:transparent!important}
html[lang] .tr11 .tr11-fighter{background:var(--m-btn)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important;box-shadow:var(--m-pillsh)!important}
html[lang] .tr11 .tr11-fighter *{color:var(--m-text)!important;text-shadow:none!important}
html[lang] .tr11 .tr11-fighter small{color:var(--m-mute)!important}
.tr11 :is(.tr11-loot-board,.tr11-side){background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:16px!important;clip-path:none!important;box-shadow:var(--m-shadow)!important;color:var(--m-text)!important}
html[lang] .tr11 .tr11-side :is(h2,b,strong,span,div){color:var(--m-text)!important;text-shadow:none!important}
html[lang] .tr11 .tr11-side h2{background:none!important;-webkit-text-fill-color:currentColor!important}
html[lang] .tr11 .tr11-side :is(small,p,.tr11-help,.tr11-guarantee){color:var(--m-soft)!important;text-shadow:none!important}
.tr11 .tr11-progress{background:var(--m-sunk)!important;border:1px solid var(--m-line2)!important}
.tr11 .tr11-cost{background:var(--m-sunk)!important;border:1px solid var(--m-line)!important;border-radius:12px!important}
.tr11 .tr11-pull{background:var(--m-cta)!important;border:0!important;border-radius:14px!important;clip-path:none!important;box-shadow:0 5px 0 var(--m-cta-sh)!important}
.tr11 .tr11-pull *{text-shadow:0 2px 0 var(--m-cta-sh)!important}
html[lang] .tr11 .tr11-more-btn{background:var(--m-btn)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important;border-radius:99px!important;box-shadow:var(--m-pillsh)!important}
html[lang] .tr11 .tr11-loot-board>:is(p,small,span){color:var(--m-soft)!important}
html[lang] .tr11 .tr11-foot{background:rgba(255,255,255,.85)!important;color:var(--m-soft)!important;border-color:var(--m-line)!important}
.tr11 .tr11-info-box{background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:16px!important;color:var(--m-text)!important}
html[lang] .tr11 .tr11-info-box *{color:var(--m-text);text-shadow:none!important}
html[lang] .tr11 #trHint{color:var(--m-soft)!important}
/* Compañero inicial */
#overlay:not(.menu-mode) .pk2-starter .pk2-hero{background:var(--m-hero)!important;border:3px solid #a9e6ef!important;border-radius:14px!important}
#overlay:not(.menu-mode) .pk2-starter .pk2-hero :is(h2,small,p){color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.35)!important}
#overlay:not(.menu-mode) .pk2-starter .pk2-hero h2{font:900 32px 'Nunito',system-ui,sans-serif!important}
#overlay:not(.menu-mode) .pk2-starter .pk2-tile{border:3px solid var(--m-tileline)!important;border-radius:12px!important;background:linear-gradient(180deg,var(--m-tilehi),var(--m-tile))!important;box-shadow:none!important}
#overlay:not(.menu-mode) .pk2-starter .pk2-tile.sel{border-color:var(--m-sel)!important;background:var(--m-tilesel)!important}
#overlay:not(.menu-mode) .pk2-starter .pk2-tile :is(b,small){color:#fff!important;text-shadow:0 1px 0 rgba(0,0,0,.4)!important}
/* Subir de nivel: cartel con la paleta; botones en píldora */
.lv3-banner{background:var(--m-banner)!important;box-shadow:0 5px 0 var(--m-banner-sh)!important;color:var(--m-banner-txt)!important;border-radius:12px!important;transform:skewX(-8deg)}
/* Fin de partida */
#overlay .end3{background:var(--m-card)!important;border:1px solid var(--m-cardline)!important;border-radius:16px!important;clip-path:none!important;box-shadow:var(--m-shadow)!important;color:var(--m-text)!important;font-family:'Nunito',system-ui,sans-serif}
#overlay .end3 h1{display:table;margin:0 auto!important;padding:6px 30px 6px 24px;border-radius:12px;background:var(--m-banner);color:var(--m-banner-txt)!important;text-shadow:0 3px 0 rgba(0,0,0,.2)!important;box-shadow:0 5px 0 var(--m-banner-sh);transform:skewX(-8deg);font-size:40px!important}
#overlay .end3.lose h1{background:linear-gradient(180deg,#ff7a7a,#e04848 55%,#c22f3a);box-shadow:0 5px 0 #84202a;color:#fff!important}
#overlay .end3 .end3-sub{color:var(--m-soft)!important;margin-top:12px!important}
#overlay .end3 .end3-cells span{background:var(--m-sunk)!important;border:1px solid var(--m-line)!important;border-radius:12px;color:var(--m-mute)!important;font-family:'Nunito',system-ui,sans-serif}
#overlay .end3 .end3-cells b{color:var(--m-text)!important}
#overlay .end3 h3{color:var(--m-mute)!important;font-family:'Nunito',system-ui,sans-serif;font-weight:800}
#overlay .end3 .end3-bar{color:var(--m-soft)}
#overlay .end3 .end3-bar i{background:var(--m-sunk)!important;border-radius:5px;overflow:hidden}
#overlay .end3 .end3-bar u{background:var(--m-meter)!important}
#overlay .end3 .end3-bar em{color:var(--m-text)!important}
#overlay .end3 .end3-rw li{background:var(--m-sunk)!important;border-left-color:var(--m-sel)!important;border-radius:0 10px 10px 0;color:var(--m-text)!important}
#overlay .end3 .end3-rw b{color:var(--m-gold)!important}
#overlay .end3 :is(p,small){color:var(--m-soft)!important}
#overlay .end3 .g-btn{background:var(--m-cta)!important;border:0!important;border-radius:14px!important;clip-path:none!important;box-shadow:0 5px 0 var(--m-cta-sh)!important;font-family:'Nunito',system-ui,sans-serif!important;font-weight:900}
html[lang] #overlay .end3 .mini-btn{background:var(--m-btn)!important;color:var(--m-text)!important;border:1px solid var(--m-line2)!important;border-radius:99px!important;clip-path:none!important;font:800 13px 'Nunito',system-ui,sans-serif!important;box-shadow:var(--m-pillsh)!important}
#overlay:not(.menu-mode) .pk2-starter .pk2-stage{background:rgba(255,255,255,.18)!important;border:0!important}
#overlay:not(.menu-mode) .lab-top .lab-head small{display:block;margin-top:6px}
#overlay:not(.menu-mode) .lab-top .lab-head{flex-wrap:wrap}
/* ---------- Menú principal: botones-tarjeta con la paleta de los menús (claro / oscuro) ---------- */
#overlay .realhub.hb{--hb-ink:var(--m-text);font-family:'Nunito',system-ui,sans-serif!important;color:var(--m-text)!important;display:flex!important;flex-direction:column!important}
#overlay .realhub.hb button{font-family:inherit!important;cursor:pointer;-webkit-tap-highlight-color:transparent}
#overlay .realhub.hb .hb-top{position:relative;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,2vw,30px) 0;flex-wrap:wrap}
#overlay .realhub.hb .hb-utils,#overlay .realhub.hb .hb-user{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#overlay .realhub.hb .hb-pill,#overlay .realhub.hb .hb-ic,#overlay .realhub.hb .hb-out,#overlay .realhub.hb .hb-chip,#overlay .realhub.hb .hb-me{height:40px;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1px solid var(--m-cardline);background:var(--m-card);color:var(--m-text);font:800 14px/1 'Nunito',system-ui,sans-serif;box-shadow:var(--m-pillsh),0 4px 14px rgba(0,0,0,.12);transition:transform .12s}
#overlay .realhub.hb .hb-sq,#overlay .realhub.hb .hb-ic{width:40px;padding:0;justify-content:center}
#overlay .realhub.hb .hb-c1{background:var(--m-banner);color:var(--m-banner-txt);border-color:transparent;box-shadow:0 3px 0 var(--m-banner-sh)}
#overlay .realhub.hb .hb-c2{background:var(--m-tilesel);color:#06234b;border-color:transparent;box-shadow:0 3px 0 #10708a}
#overlay .realhub.hb .hb-me{padding:0 14px 0 4px;height:46px;gap:8px;text-align:left}
#overlay .realhub.hb .hb-me .hud-portrait{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;background:var(--m-sunk);display:grid;place-items:center;margin:0!important}
#overlay .realhub.hb .hb-me .hud-portrait img{width:100%;height:100%;object-fit:cover}
#overlay .realhub.hb .hb-me strong{display:block;font-size:14px;color:var(--m-text);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overlay .realhub.hb .hb-me small{display:block;font-size:11px;color:var(--m-mute);font-weight:700}
#overlay .realhub.hb .hb-chip{background:var(--m-sunk);box-shadow:none;padding:0 12px 0 6px;font-variant-numeric:tabular-nums}
#overlay .realhub.hb .hb-chip img{width:24px;height:24px;object-fit:contain}
#overlay .realhub.hb .hb-out{color:var(--m-bad);font-size:13px}
#overlay .realhub.hb .hb-main{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(500px,44%) minmax(0,1fr) minmax(270px,22%);gap:clamp(14px,1.8vw,28px);padding:14px clamp(14px,2vw,30px) 34px;align-items:start}
#overlay .realhub.hb .hb-left{display:flex;flex-direction:column;gap:12px;min-width:0}
#overlay .realhub.hb .hb-brand{margin:0;display:flex;align-items:flex-end;gap:10px;line-height:0}
#overlay .realhub.hb .hb-brand img{height:clamp(70px,11vh,112px);width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
#overlay .realhub.hb .hb-ver{font:900 11px/1 'Nunito',sans-serif;letter-spacing:.12em;padding:5px 9px;border-radius:999px;background:var(--m-card);color:var(--m-acc);border:1px solid var(--m-cardline);margin-bottom:12px}
/* tarjetas de modo */
#overlay .realhub.hb .hb-modes{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
#overlay .realhub.hb .hb-play{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;min-height:190px;padding:16px 18px;border:0;border-radius:22px;background:var(--m-cta);color:#fff;text-align:left;overflow:hidden;box-shadow:0 6px 0 var(--m-cta-sh),0 12px 26px rgba(0,0,0,.25);transition:transform .12s}
#overlay .realhub.hb .hb-play::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,rgba(255,255,255,.4),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 12px,transparent 12px 24px);pointer-events:none}
#overlay .realhub.hb .hb-dev{position:absolute;left:16px;top:16px;width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.18);overflow:hidden}
#overlay .realhub.hb .hb-dev img{width:86%;height:86%;object-fit:contain}
#overlay .realhub.hb .hb-play-txt{position:relative;z-index:1}
#overlay .realhub.hb .hb-play-txt b{display:block;font:900 clamp(34px,3.4vw,48px)/1 'Nunito',sans-serif;text-shadow:0 3px 0 var(--m-cta-sh)}
#overlay .realhub.hb .hb-play-txt small{display:block;margin-top:5px;font-weight:800;font-size:14px;opacity:.95}
#overlay .realhub.hb .hb-play-face{position:absolute;right:6px;bottom:6px;width:46%;height:82%;display:grid;place-items:end center;pointer-events:none}
#overlay .realhub.hb .hb-play-face>*{width:clamp(120px,10vw,160px);height:clamp(120px,10vw,160px);object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
#overlay .realhub.hb .hb-stack{display:grid;grid-template-rows:1fr 1fr;gap:12px}
#overlay .realhub.hb .hb-mode{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:18px;color:#fff;text-align:left;transition:transform .12s}
#overlay .realhub.hb .hb-mode i,#overlay .realhub.hb .hb-event i,#overlay .realhub.hb .hb-enc>i{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:900 24px/1 'Nunito',sans-serif;font-style:normal;background:rgba(255,255,255,.22)}
#overlay .realhub.hb .hb-mode b,#overlay .realhub.hb .hb-event b,#overlay .realhub.hb .hb-enc b{display:block;font-size:18px;font-weight:900;line-height:1.1}
#overlay .realhub.hb .hb-mode small,#overlay .realhub.hb .hb-event small,#overlay .realhub.hb .hb-enc small{display:block;font-size:12.5px;font-weight:700;opacity:.9;margin-top:2px}
#overlay .realhub.hb .m-surv{background:var(--m-banner);color:var(--m-banner-txt);box-shadow:0 5px 0 var(--m-banner-sh)}
#overlay .realhub.hb .m-gacha{background:var(--m-tilesel);color:#06234b;box-shadow:0 5px 0 #10708a}
#overlay .realhub.hb .hb-new{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--m-bad);color:#fff;font:900 12px/22px 'Nunito',sans-serif;font-style:normal;text-align:center;border:2px solid #fff}
#overlay .realhub.hb .hb-row2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
#overlay .realhub.hb .hb-event{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:18px;background:var(--m-head);color:#fff;text-align:left;box-shadow:0 5px 0 #2a3a9e;transition:transform .12s}
#overlay .realhub.hb .hb-event small{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
#overlay .realhub.hb .hb-enc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--m-cardline);border-radius:18px;background:var(--m-card);color:var(--m-text);text-align:left;box-shadow:var(--m-pillsh),0 6px 18px rgba(0,0,0,.12);transition:transform .12s}
#overlay .realhub.hb .hb-enc>i{background:var(--m-selbg);color:var(--m-sel)}
#overlay .realhub.hb .hb-enc small{color:var(--m-mute);opacity:1}
#overlay .realhub.hb .hb-dots{display:flex;gap:4px;margin-top:5px}
#overlay .realhub.hb .hb-dots u{width:16px;height:6px;border-radius:3px;background:var(--m-line);text-decoration:none}
#overlay .realhub.hb .hb-dots u.on{background:var(--m-sel)}
/* botones de cada cosa */
#overlay .realhub.hb .hb-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#overlay .realhub.hb .hb-tile{--tc:#4e63e8;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:104px;padding:12px 6px 10px;border:1px solid var(--m-cardline);border-bottom:4px solid var(--tc);border-radius:18px;background:var(--m-card);color:var(--m-text);box-shadow:0 6px 16px rgba(0,0,0,.12);transition:transform .12s}
#overlay .realhub.hb .hb-tile i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-style:normal;background:color-mix(in srgb,var(--tc) 16%,transparent)}
#overlay .realhub.hb .hb-tile i img{width:34px;height:34px;object-fit:contain}
#overlay .realhub.hb .hb-tile b{font-size:15px;font-weight:900;line-height:1.1}
#overlay .realhub.hb .hb-tile small{font-size:12px;font-weight:800;color:var(--m-mute);font-variant-numeric:tabular-nums}
#overlay .realhub.hb .t1{--tc:#12b4c8;grid-row:span 1}
#overlay .realhub.hb .t2{--tc:#4e63e8}
#overlay .realhub.hb .t3{--tc:#ff8a1e}
#overlay .realhub.hb .t4{--tc:#e0a400}
#overlay .realhub.hb .t5{--tc:#8576ff}
#overlay .realhub.hb .t6{--tc:#1d9a57}
#overlay .realhub.hb .t7{--tc:#e2476b}
#overlay .realhub.hb .hb-tile.hm-soon,#overlay .realhub.hb .hb-event.hm-soon{opacity:.6;filter:saturate(.4)}
#overlay .realhub.hb .hb-tiles .t7{grid-column:span 2;flex-direction:row;gap:12px;min-height:0}
#overlay .realhub.hb .hb-tiles .t7>span{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
/* barra inferior */
#overlay .realhub.hb .hb-bar{display:flex;gap:10px;flex-wrap:wrap}
#overlay .realhub.hb .hb-btn{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:999px;border:1px solid var(--m-cardline);background:var(--m-card);color:var(--m-text);font:900 15px/1 'Nunito',sans-serif;box-shadow:var(--m-pillsh),0 4px 14px rgba(0,0,0,.12);transition:transform .12s}
#overlay .realhub.hb .hb-btn i{font-style:normal;font-size:17px}
#overlay .realhub.hb .hb-btn.hb-sq{width:44px;padding:0;justify-content:center}
#overlay .realhub.hb .hb-discord{background:#5865f2;color:#fff;border-color:transparent;box-shadow:0 3px 0 #3640b8}
#overlay .realhub.hb .hb-x{background:#11131a;color:#fff;border-color:transparent;box-shadow:0 3px 0 #000}
#overlay .realhub.hb .hm-msg{margin:0;align-self:flex-start;font-weight:800;font-size:13px;color:var(--m-text);text-shadow:none;background:var(--m-btn);border-radius:999px;padding:6px 14px;box-shadow:var(--m-btnsh)}
#overlay .realhub.hb .hm-msg:empty{display:none}
/* lateral */
#overlay .realhub.hb .hb-side{display:flex;flex-direction:column;gap:10px;padding:0 0 14px;border:1px solid var(--m-cardline);border-radius:22px;background:var(--m-card);color:var(--m-text);overflow:hidden;box-shadow:var(--m-shadow);min-width:0}
#overlay .realhub.hb .hb-side-h{text-align:left;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--m-head);color:#fff}
#overlay .realhub.hb .hb-side-h i{font-style:normal;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.22)}
#overlay .realhub.hb .hb-side-h b{display:block;font-size:17px;font-weight:900}
#overlay .realhub.hb .hb-side-h small{display:block;font-size:12px;font-weight:700;opacity:.9}
#overlay .realhub.hb .hb-mission{margin:0 14px;padding:12px;border:1px solid var(--m-line);border-radius:14px;background:var(--m-sunk);color:var(--m-text);text-align:left}
#overlay .realhub.hb .hb-mission p{margin:0 0 8px;font-size:14px;font-weight:800;line-height:1.25}
#overlay .realhub.hb .hb-meter{display:block;height:8px;border-radius:4px;background:var(--m-line);overflow:hidden}
#overlay .realhub.hb .hb-meter i{display:block;height:100%;background:var(--m-meter);border-radius:4px}
#overlay .realhub.hb .hb-mission small{display:block;margin-top:7px;font-size:12px;font-weight:800;color:var(--m-gold)}
#overlay .realhub.hb .hb-lbl{margin:4px 16px 0;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--m-mute)}
#overlay .realhub.hb .hb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 14px}
#overlay .realhub.hb .hb-stats span{padding:8px 4px;border-radius:12px;background:var(--m-sunk);text-align:center}
#overlay .realhub.hb .hb-stats b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
#overlay .realhub.hb .hb-stats small{display:block;font-size:10.5px;font-weight:800;color:var(--m-mute)}
#overlay .realhub.hb .hb-top5{list-style:none;margin:0 14px;padding:0;display:flex;flex-direction:column;gap:4px}
#overlay .realhub.hb .hb-top5 li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:var(--m-rowbg)}
#overlay .realhub.hb .hb-top5 em{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;background:var(--m-line);color:var(--m-text)}
#overlay .realhub.hb .hb-top5 li:nth-child(1) em{background:#ffc24f;color:#5a3500}
#overlay .realhub.hb .hb-top5 li:nth-child(2) em{background:#cfd8e6;color:#2a3550}
#overlay .realhub.hb .hb-top5 li:nth-child(3) em{background:#f0a56b;color:#5a2600}
#overlay .realhub.hb .hb-top5 span{flex:1;min-width:0}
#overlay .realhub.hb .hb-top5 b{display:block;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overlay .realhub.hb .hb-top5 small{display:block;font-size:11px;font-weight:700;color:var(--m-mute)}
#overlay .realhub.hb .hb-top5 strong{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
#overlay .realhub.hb .hb-top5 .hb-empty{justify-content:center;font-size:13px;font-weight:700;color:var(--m-mute);padding:12px}
#overlay .realhub.hb .hb-all{margin:2px 14px 0;height:42px;border:0;border-radius:999px;background:var(--m-tabon);color:var(--m-tabon-txt);font:900 14px/1 'Nunito',sans-serif}
#overlay .realhub.hb .hb-legal{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;pointer-events:none}
#overlay .realhub.hb :is(.hb-pill,.hb-ic,.hb-out,.hb-me,.hb-play,.hb-mode,.hb-event,.hb-enc,.hb-tile,.hb-btn,.hb-mission,.hb-all):hover{transform:translateY(-2px)}
#overlay .realhub.hb :is(.hb-pill,.hb-ic,.hb-out,.hb-me,.hb-play,.hb-mode,.hb-event,.hb-enc,.hb-tile,.hb-btn,.hb-mission,.hb-all):active{transform:translateY(1px)}
#overlay .realhub.hb :is(button):focus-visible{outline:3px solid var(--m-sel)!important;outline-offset:2px}
@media(max-width:1100px){#overlay .realhub.hb .hb-main{grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr)}#overlay .realhub.hb .real-scene{display:none!important}}
@media(max-width:760px){
  #overlay .realhub.hb{overflow-x:hidden!important}
  #overlay .realhub.hb .hb-top{padding:10px 12px 0;gap:8px}
  #overlay .realhub.hb .hb-top,#overlay .realhub.hb .hb-user{display:contents}
  #overlay .realhub.hb .hb-top{display:flex;justify-content:flex-start}
  #overlay .realhub.hb .hb-utils{display:contents}
  #overlay .realhub.hb .hb-c1,#overlay .realhub.hb .hb-c2{display:none!important}
  #overlay .realhub.hb .hb-me{flex:1 0 120px;min-width:0;height:40px;order:-2}
  #overlay .realhub.hb .hb-ic,#overlay .realhub.hb .hb-out{order:-1}
  #overlay .realhub.hb .hb-pill.hb-sq{margin-right:auto}
  #overlay .realhub.hb .hb-top{gap:6px!important}
  #overlay .realhub.hb .hb-me strong{max-width:100%}
  #overlay .realhub.hb .hb-me .hud-portrait{width:32px;height:32px}
  #overlay .realhub.hb .hb-pill,#overlay .realhub.hb .hb-ic,#overlay .realhub.hb .hb-out,#overlay .realhub.hb .hb-chip{height:34px;font-size:12.5px;padding:0 9px;gap:4px}
  #overlay .realhub.hb .hb-chip img{width:20px;height:20px}
  #overlay .realhub.hb .hb-sq,#overlay .realhub.hb .hb-ic{width:34px;padding:0}
  #overlay .realhub.hb .hb-main{display:flex!important;flex-direction:column;padding:10px 12px 40px;gap:14px}
  #overlay .realhub.hb .hb-left{width:100%}
  #overlay .realhub.hb .hb-brand{justify-content:center}
  #overlay .realhub.hb .hb-modes,#overlay .realhub.hb .hb-row2{grid-template-columns:1fr}
  #overlay .realhub.hb .hb-stack{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  #overlay .realhub.hb .hb-play{min-height:160px}
  #overlay .realhub.hb .hb-mode{padding:10px}
  #overlay .realhub.hb .hb-mode i{width:36px;height:36px;font-size:20px}
  #overlay .realhub.hb .hb-mode b{font-size:15px}
  #overlay .realhub.hb .hb-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  #overlay .realhub.hb .hb-tiles .t7{grid-column:span 3}
  #overlay .realhub.hb .hb-tile{min-height:92px}
  #overlay .realhub.hb .hb-bar{justify-content:center}
  #overlay .realhub.hb .hb-btn{padding:0 14px;height:40px;font-size:14px}
  #overlay .realhub.hb .hb-btn.hb-sq{width:40px;padding:0}
  #overlay .realhub.hb .hb-side{width:100%}
  #overlay .realhub.hb .hb-legal{position:static;padding:0 0 10px}
}
/* Barra superior de los menús: mismas píldoras redondeadas que el menú principal */
html[lang] body #topbar{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;gap:8px!important;height:auto!important;font-family:'Nunito',system-ui,sans-serif!important}
html[lang] body #topbar :is(.tb-id,.tb-chip,.tb-btn){height:40px!important;box-sizing:border-box!important;display:inline-flex!important;align-items:center!important;justify-content:center;gap:6px!important;border-radius:999px!important;border:1px solid var(--m-cardline)!important;background:var(--m-btn)!important;color:var(--m-text)!important;box-shadow:var(--m-btnsh)!important;font:800 14px/1 'Nunito',system-ui,sans-serif!important;clip-path:none!important;position:static!important;width:auto!important;left:auto!important}
html[lang] body #topbar .tb-id{padding:0 14px 0 4px!important;max-width:220px!important}
html[lang] body #topbar .tb-id .hud-portrait{width:32px;height:32px;border-radius:50%;overflow:hidden;margin:0!important}
html[lang] body #topbar .tb-id .hud-portrait img{width:100%;height:100%;object-fit:cover}
html[lang] body #topbar .tb-id b{color:var(--m-text)!important;font-size:13px!important}
html[lang] body #topbar .tb-id small{color:var(--m-mute)!important;font:700 11px 'Nunito',system-ui,sans-serif!important}
html[lang] body #topbar .tb-chip{white-space:nowrap!important;padding:0 12px!important;font-variant-numeric:tabular-nums;color:var(--m-gold)!important}
html[lang] body #topbar .tb-chip.tix{color:var(--m-text)!important}
html[lang] body #topbar .tb-btn{width:40px!important;padding:0!important}
html[lang] body #topbar :is(.tb-id,.tb-btn):hover{transform:translateY(-2px);text-decoration:none}
@media(max-width:760px){html[lang] body #topbar{gap:5px!important}
html[lang] body #topbar :is(.tb-id,.tb-chip,.tb-btn){height:32px!important;font-size:11.5px!important}
html[lang] body #topbar .tb-btn{width:32px!important}
html[lang] body #topbar .tb-chip{padding:0 8px!important}
html[lang] body #topbar .tb-id .hud-portrait{width:26px;height:26px}}
/* Plantel con iconos redondos de cada Digimon */
.ps-grid:has(.ps-ic){grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ps-tile:has(.ps-ic){aspect-ratio:auto;justify-content:flex-start;gap:5px;padding:8px 2px 7px;border:0;background:transparent;box-shadow:none;color:var(--m-text)}
.ps-tile:has(.ps-ic):hover{filter:none}
.ps-tile:has(.ps-ic):hover .ps-ic{transform:translateY(-3px)}
.ps-ic{position:relative;display:grid;place-items:center;width:100%;max-width:76px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--m-sunk);box-shadow:0 0 0 3px var(--m-cardline),0 4px 0 var(--m-line2);transition:transform .12s,box-shadow .12s}
.ps-ic img{width:100%;height:100%;object-fit:cover;image-rendering:auto!important;filter:none!important}
.ps-tile:has(.ps-ic) b{color:var(--m-text);text-shadow:none;font-size:12px}
.ps-tile.sel:has(.ps-ic){background:transparent;box-shadow:none}
.ps-tile.sel .ps-ic{box-shadow:0 0 0 4px var(--m-sel),0 0 0 8px var(--m-selbg),0 5px 0 var(--m-cta-sh)}
.ps-tile.sel:has(.ps-ic) b{color:var(--m-sel)}
.ps-tile.lock .ps-ic img,.ps-tile.soon .ps-ic img{filter:grayscale(1) brightness(.45)!important;width:100%!important;height:100%!important}
.ps-tile.soon:has(.ps-ic){opacity:1}
.ps-tile.soon:has(.ps-ic) b,.ps-tile.lock:has(.ps-ic) b{color:var(--m-mute)}
.ps-tile:has(.ps-ic) .ps-key{position:absolute;top:4px;left:4px;z-index:2;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--m-btn);color:var(--m-text);font:900 10px/18px 'Nunito',system-ui,sans-serif;text-align:center;box-shadow:var(--m-pillsh)}
.ps-tile:has(.ps-ic) .ps-evo-dot{position:absolute;top:6px;right:8px;z-index:2}
.ps-tile:has(.ps-ic) .ps-lock{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);z-index:2;font-size:20px}
.ps-ic.ps-none{font:900 26px 'Nunito',sans-serif;color:var(--m-mute)}
@media(max-width:760px){.ps-grid:has(.ps-ic){grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ps-ic{max-width:64px}}
/* Arreglos de iconos */
.approved-info-dialog .enc-row.ach-row>b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--m-line);font-size:17px}
.approved-info-dialog .enc-row.ach-row.got>b{background:color-mix(in srgb,var(--m-gold) 22%,transparent)}
.approved-info-dialog .enc-row.ach-row:not(.got){opacity:.8}
.approved-info-dialog .enc-row.ach-row{grid-template-columns:34px 1fr auto!important}
.ach-got{font:900 12px 'Nunito',system-ui,sans-serif;font-style:normal;color:var(--m-good);white-space:nowrap}
@media (max-width:700px){
  .tr11 .treasure-card .tc-art{transform:none!important;margin:0!important;height:52px!important;font-size:34px!important}
  .tr11 .treasure-card .tc-art svg{width:40px!important;height:40px!important}
  .tr11 .treasure-card .tc-art .rw-item,.tr11 .treasure-card .tc-art .rw-title{font-size:32px!important}
  .tr11 .treasure-card .tc-art .rw-frame{width:44px!important;height:44px!important}
  .tr11 .treasure-card .tc-art img{max-width:48px!important;max-height:48px!important}
}
@media (max-width:640px){
  #overlay:not(.menu-mode) .lab-top .lab-head{flex:1 1 100%!important;flex-wrap:nowrap!important;gap:10px!important}
  #overlay:not(.menu-mode) .lab-top .lab-host{width:44px!important;height:44px!important;flex:none}
}
/* Iconos en selección y colección */
.ps-hero-ic{width:78%;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.18);margin-bottom:22px}
.ps-node-ic{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ps-ic-spr{background:var(--m-tilesel)}
.ps-ic-spr .anim{width:88%!important;height:88%!important}
.cl4-skin .ps-ic{width:84px;max-width:84px;margin:0 auto 6px}
.cl4-item .cl4-ic{width:44px;max-width:44px;flex:none;box-shadow:0 0 0 2px var(--m-cardline)}
.cl4-item.lock .cl4-ic img{filter:grayscale(1) brightness(.45)}
/* ---------- Registro y pausa con el estilo de los menús ---------- */
#overlay:has(.rg){background:radial-gradient(ellipse 60% 70% at 30% 50%,rgba(78,99,232,.35),transparent 70%),radial-gradient(ellipse 40% 50% at 80% 45%,rgba(255,138,30,.2),transparent 70%),#0e1222!important}
html[data-theme=oscuro] #overlay:has(.rg){background:radial-gradient(ellipse 60% 70% at 30% 50%,rgba(78,99,232,.18),transparent 70%),#121316!important}
.rg{font-family:'Nunito',system-ui,sans-serif!important;color:var(--m-text)}
.rg-pill{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 18px;border-radius:999px;border:1px solid var(--m-cardline);background:var(--m-btn);color:var(--m-text);font:800 14px 'Nunito',system-ui,sans-serif;box-shadow:var(--m-btnsh);cursor:pointer;transition:transform .12s}
.rg-pill:hover{transform:translateY(-2px)}
.rg-lang{position:absolute;top:16px;right:18px;z-index:3}
.rg-scene{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.rg-logo{width:min(520px,80%);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.rg-tag{font:900 13px 'Nunito',sans-serif;letter-spacing:.18em;color:#fff;padding:6px 14px;border-radius:999px;background:var(--m-banner);box-shadow:0 3px 0 var(--m-banner-sh)}
.rg-pitch{margin:0;color:#e9edff;font-weight:700;font-size:16px}
.rg-duo{display:flex;gap:30px;margin-top:10px}
.rg-duo .anim{width:170px;height:170px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:animIdle .8s steps(1) infinite,pvBob 1.8s ease-in-out infinite}
.rg-duo .anim.flip{transform:scaleX(-1)}
.rg-side{display:grid;place-items:center;padding:20px}
.rg-card{width:min(430px,92vw);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:0 26px 26px;border-radius:24px;background:var(--m-card);border:1px solid var(--m-cardline);box-shadow:var(--m-shadow)}
.rg-banner{margin:-18px auto 4px;padding:10px 26px;border-radius:14px;background:var(--m-banner);box-shadow:0 4px 0 var(--m-banner-sh);transform:skewX(-6deg)}
#overlay .rg-banner h2{margin:0;transform:skewX(6deg);font:900 20px "Nunito",sans-serif!important;color:var(--m-banner-txt)!important;text-shadow:0 2px 0 rgba(0,0,0,.2)!important;-webkit-text-fill-color:currentColor!important;background:none!important;text-align:center}
.rg-boot{margin:0;font:900 11px 'Nunito',sans-serif;letter-spacing:.14em;color:var(--m-acc);text-align:center}
.rg-saved{margin:0;font-weight:700;font-size:13px;color:var(--m-mute);text-align:center}
.rg-input{height:50px;box-sizing:border-box;padding:0 20px;border-radius:999px;border:2px solid var(--m-line2);background:var(--m-sunk);color:var(--m-text);font:800 17px 'Nunito',sans-serif;text-align:center;outline:none}
.rg-input:focus{border-color:var(--m-sel);box-shadow:0 0 0 4px var(--m-selbg)}
.rg-go,.pz2-go{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:999px;background:var(--m-cta);color:#fff;font:900 18px 'Nunito',sans-serif;text-shadow:0 2px 0 var(--m-cta-sh);box-shadow:0 5px 0 var(--m-cta-sh);cursor:pointer;transition:transform .12s}
.rg-go:hover,.pz2-go:hover{transform:translateY(-2px)}
.rg-go kbd,.pz2-go kbd{font:800 11px 'Nunito',sans-serif;padding:2px 7px;border-radius:6px;background:#fff;color:#c45200;text-shadow:none}
.rg-or{display:flex;align-items:center;gap:10px;color:var(--m-mute);font-weight:800;font-size:12px}
.rg-or::before,.rg-or::after{content:'';flex:1;height:1px;background:var(--m-line)}
.rg-guest{width:100%}
@media (max-width:1000px),(max-height:620px){.rg{grid-template-columns:1fr!important;height:auto!important;min-height:100vh;padding:60px 0 30px}.rg-duo .anim{width:110px;height:110px}.rg-logo{width:min(360px,80%)}}
#pause:has(.pz2){background:var(--m-scrim)!important;backdrop-filter:blur(3px)}
.pz2{width:min(560px,94vw);max-height:94vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:0 22px 20px;border-radius:24px;background:var(--m-card);border:1px solid var(--m-cardline);box-shadow:var(--m-shadow);color:var(--m-text);font-family:'Nunito',system-ui,sans-serif}
.pz2-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pz2-banner{display:flex;align-items:baseline;gap:10px;margin-top:-1px;padding:10px 22px;border-radius:0 0 14px 14px;background:var(--m-banner);box-shadow:0 4px 0 var(--m-banner-sh)}
.pz2-banner h2{margin:0;font:900 22px 'Orbitron',system-ui,sans-serif;color:var(--m-banner-txt);letter-spacing:1px}
.pz2-banner small{color:var(--m-banner-txt);opacity:.85;font-weight:800;font-size:12px}
.pz2-x{margin-top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--m-cardline);background:var(--m-btn);color:var(--m-text);font:900 15px 'Nunito',sans-serif;box-shadow:var(--m-btnsh);cursor:pointer}
.pz2-profile{display:flex;gap:16px;align-items:center;padding:12px;border-radius:18px;background:var(--m-sunk)}
.pz2-av{flex:none;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--m-hero);box-shadow:0 0 0 3px var(--m-cardline)}
.pz2-av .anim{width:92px;height:92px}
.pz2-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pz2-name{font-size:20px;font-weight:900}
.pz2-quote{color:var(--m-mute);font-weight:700;font-style:italic}
.pz2-lbl{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--m-soft);margin-top:4px}
.pz2-bar{height:9px;border-radius:5px;background:var(--m-line);overflow:hidden}
.pz2-bar i{display:block;height:100%;border-radius:5px;background:var(--m-meter)}
.pz2-bar.hp i{background:linear-gradient(90deg,#3fd47d,#1d9a57)}
.pz2-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pz2-stats div{padding:10px 4px;border-radius:14px;background:var(--m-sunk);text-align:center}
.pz2-stats b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.pz2-stats small{font-size:11px;font-weight:800;color:var(--m-mute)}
.pz2-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script type="module">
import * as THREE from 'three';

// Prototipo 3D estilo Megabonk. Sprites 2D de Digimon (base DMC) como billboards.
const BOSS_AT = 1200; // segundos hasta el jefe final (20 minutos); ganas al derrotarlo
const MAX_ENEMIES = 100;   // igual en calidad alta y baja: la calidad gráfica no cambia la dificultad
const ARENA_R = 110;  // medio lado del escenario: el mapa es cuadrado y lo cierran montañas
// Dos zonas: el bosque inicial y el pantano de datos (a partir de 300 s). El jefe final está al final de la zona 2.
const ZONES = [
  {name:'Bosque Inicial',   at:0,   fog:0xbcd9e8, sky:['#4d86c9', '#a9d4ee', '#d8efff'], tint:0xffffff, color:'#ffd54f', biome:'bosque',
    boss: {name: 'Andromon', sprite: 'sprites/adventure/andromon.png', hp: 3000, dmg: 15, shots: 10, shotDmg: 8, gap: 2.5, col: '#ffd54f', sub: 'Guardián del Bosque Inicial'}},
  {name:'Pantano de Datos', at:600, fog:0x8c7cb8, sky:['#241b4a', '#6a4f9e', '#c59ad6'], tint:0xd8c6ff, color:'#ce93d8', biome:'bosque',
    boss: {name: 'Piedmon', sprite: 'sprites/adventure/piedmon.png', hp: 6000, dmg: 20, shots: 12, shotDmg: 10, gap: 2.3, col: '#ce93d8', sub: 'Líder de los Dark Masters · jefe final', final: true}}
];
const ZONE2_AT = ZONES[1].at;
/* ---------- Mapas ----------
   Los tres mapas tienen dos pantallas unidas por un portal. El portal se abre al derrotar al jefe de la pantalla,
   que se invoca cuando quieras (tecla B o botón) y siempre tiene la misma fuerza. Si pasas 20 minutos
   en una pantalla empieza el Infierno: la dificultad se dispara hasta que caes.
   El mapa 3 tiene un único jefe final: en la primera pantalla huye por el portal a mitad de vida
   y en la segunda vuelve con la vida que le quedaba. */
const AD = n => 'sprites/adventure/' + n + '.png';
const MAPS = {
  bosque: {n: 1, name: 'Bosque File', kind: 'portal', zones: ZONES, minis: true, preview: ['textures/mapa_hierba.png', 'sprites/deco/bosque/arbol.png', AD('piedmon')],
    desc: 'Bosque y Pantano de Datos. Andromon abre el portal y Piedmon es el jefe final. Seis jefes menores por el camino.'},
  desierto: {n: 2, name: 'Desierto de Datos', kind: 'portal', minis: true, preview: ['textures/mapa_arena.png', 'sprites/deco/desierto/cactus1.png', AD('metaletemon')],
    desc: 'Dunas y ruinas. Cada pantalla tiene su jefe: Scorpiomon abre el portal y MetalEtemon cierra el mapa.',
    zones: [
      {name: 'Dunas de Datos', biome: 'dunas', fog: 0xe9cf9a, sky: ['#e08a3c', '#f4c27a', '#fde6b8'], tint: 0xffd08a, color: '#ffb74d',
        foes: {basic: [AD('gotsumon'), AD('kokatorimon')], fast: [AD('flymon'), AD('snimon')], tank: [AD('drimogemon'), AD('monochromon')], elite: [AD('tyrannomon')]},
        boss: {name: 'Scorpiomon', sprite: AD('scorpiomon'), hp: 3200, dmg: 16, shots: 10, shotDmg: 8, gap: 2.5, col: '#ffb74d', sub: 'Guardián de las dunas'}},
      {name: 'Ruinas del Faraón', biome: 'ruinas', fog: 0x9c7a6a, sky: ['#3b1f3f', '#9a4f5e', '#e0a070'], tint: 0xf0bf8c, color: '#ef9a9a',
        foes: {basic: [AD('bakemon'), AD('pumpkinmon')], fast: [AD('phantomon'), AD('gazimon')], tank: [AD('ogremon'), AD('warumonzaemon')], elite: [AD('gigadramon'), AD('megadramon')]},
        boss: {name: 'MetalEtemon', sprite: AD('metaletemon'), hp: 6000, dmg: 20, shots: 14, shotDmg: 10, gap: 2.2, col: '#ef9a9a', sub: 'Jefe final del Desierto de Datos', final: true}}
    ]},
  nevado: {n: 3, name: 'Montaña Helada', kind: 'portal', single: true, minis: false, preview: ['textures/mapa_nieve.png', 'sprites/deco/nieve/pino1.png', AD('machinedramon')],
    desc: 'Nieve y una fortaleza oscura. Sin jefes menores: solo Machinedramon, el único jefe final, que te espera en las dos pantallas.',
    zones: [
      {name: 'Valle Nevado', biome: 'nieve', fog: 0xe4eefa, sky: ['#7fa6d6', '#c4dcf2', '#f2f8ff'], tint: 0xffffff, color: '#81d4fa',
        foes: {basic: [AD('snowbotamon'), AD('gotsumon')], fast: [AD('gazimon'), AD('kokatorimon')], tank: [AD('mojyamon'), AD('mammothmon')], elite: [AD('skullgreymon'), AD('darktyrannomon')]},
        boss: {name: 'Machinedramon', sprite: AD('machinedramon'), hp: 9000, dmg: 22, shots: 16, shotDmg: 11, gap: 2.0, col: '#b0bec5', sub: 'El único jefe final de la Montaña Helada', retreatAt: 0.5}},
      {name: 'Fortaleza Oscura', biome: 'fortaleza', fog: 0x3a2440, sky: ['#120818', '#3d1838', '#8a3a4a'], tint: 0xb8a8d8, color: '#ce93d8',
        foes: {basic: [AD('bakemon'), AD('dokugumon')], fast: [AD('phantomon'), AD('snimon')], tank: [AD('darktyrannomon'), AD('warumonzaemon')], elite: [AD('megadramon'), AD('gigadramon')]},
        boss: {name: 'Machinedramon', sprite: AD('machinedramon'), hp: 9000, dmg: 22, shots: 16, shotDmg: 11, gap: 2.0, col: '#b0bec5', sub: 'Vuelve con la vida que le quedaba', final: true, resume: true}}
    ]}
};
const MAP_ORDER = ['bosque', 'desierto', 'nevado'];
const SCREEN_LIMIT = 1200;   // 20 minutos en una misma pantalla: empieza el Infierno
/* ---------- Dificultad ----------
   Multiplicadores fijos de cada nivel sobre la base (vida y daño de enemigos y jefes menores, intervalo entre
   apariciones y entre élites; menor = más enemigos), vida de los jefes de zona y premio de Bits y tickets.
   Además, en todos los niveles la presión sube con el tiempo de partida (ver diffMul y spawnEnemy). */
const DIFFS = {
  facil:     {name: 'Fácil',     hp: 0.75, dmg: 0.7, spawn: 1.25, elite: 1.3,  boss: 0.75, reward: 0.75, col: '#7cf29c', d: 'Para aprender: enemigos más flojos y menos numerosos.'},
  normal:    {name: 'Normal',    hp: 1,    dmg: 1,   spawn: 1,    elite: 1,    boss: 1,    reward: 1,    col: '#4fc3f7', d: 'La experiencia equilibrada del juego.'},
  dificil:   {name: 'Difícil',   hp: 1.35, dmg: 1.3, spawn: 0.8,  elite: 0.8,  boss: 1.3,  reward: 1.5,  col: '#ffb74d', d: 'Más vida, más daño y más hordas. Premios ×1,5.'},
  pesadilla: {name: 'Pesadilla', hp: 1.8,  dmg: 1.6, spawn: 0.65, elite: 0.65, boss: 1.7,  reward: 2.2,  col: '#ef5350', d: 'Solo para expertos. Premios ×2,2.'}
};
const DIFF_ORDER = ['facil', 'normal', 'dificil', 'pesadilla'];
let runMap = MAPS[localStorage.getItem('digibonk3d-map')] ? localStorage.getItem('digibonk3d-map') : 'bosque';
let runDiff = DIFFS[localStorage.getItem('digibonk3d-diff')] ? localStorage.getItem('digibonk3d-diff') : 'normal';
const mapDef = () => MAPS[(g && g.map) || 'bosque'];
const zonesOf = () => mapDef().zones;
const zoneDef = (n = g ? g.zone : 1) => zonesOf()[n - 1];
const isPortalMap = () => !!g && mapDef().kind === 'portal';
const lvlDiff = () => DIFFS[(g && g.diff) || 'normal'];
// Recorta un punto al círculo de radio m (para aparecer y moverse dentro del escenario)
function clampArena(x, z, m){
  return [Math.max(-m, Math.min(m, x)), Math.max(-m, Math.min(m, z))];
}
const sqDist = (x, z) => Math.max(Math.abs(x), Math.abs(z));   // distancia "cuadrada" al centro
// Terreno: el claro del centro es llano y el resto del mapa tiene colinas suaves
const smooth01 = t => { t = Math.min(1, Math.max(0, t)); return t*t*(3 - 2*t); };
// Estanque al suroeste: cuenca plana con agua; se funde con el terreno alrededor
const POND = {x: -38, z: 22, r: 6, water: -0.35, bed: -0.9};
// Lagos de orilla irregular (rx/rz: radios; s: forma). El segundo lo cruza un puente de este a oeste
const PONDS = [{x: -38, z: 22, rx: 8, rz: 6.5, s: 0.4}, {x: 54, z: -22, rx: 6, rz: 12, s: 1.7}, {x: 22, z: 66, rx: 10, rz: 7, s: 2.9}];
const pondEdge = (P, a) => 1 + 0.12*Math.sin(3*a + P.s) + 0.07*Math.sin(5*a + P.s*2);
// Distancia aproximada (en unidades) desde la orilla: negativa dentro del lago
function pondDist(P, x, z){
  const dx = (x - P.x)/P.rx, dz = (z - P.z)/P.rz;
  return (Math.hypot(dx, dz)/pondEdge(P, Math.atan2(dz, dx)) - 1)*Math.min(P.rx, P.rz);
}
const BRIDGE = (() => { const P = PONDS[1], half = P.rx*1.25 + 2.5; return {x0: P.x - half, x1: P.x + half, z: P.z, hw: 1.7}; })();
const onBridge = (x, z) => Math.abs(z - BRIDGE.z) < BRIDGE.hw && x > BRIDGE.x0 && x < BRIDGE.x1;
function pondWeight(x, z){
  if (onBridge(x, z)) return 0;
  let w = 0;
  for (const P of PONDS) w = Math.max(w, 1 - smooth01(pondDist(P, x, z)/3));
  return w;
}
// Llanuras y laderas: las colinas suben en terrazas planas unidas por cuestas cortas (las cuestas llevan roca)
const TERRACE = 2.2;
function hillBase(x, z){
  const r = Math.hypot(x, z);
  const flat = smooth01((r - 26)/14);                          // 0 en el claro central, 1 fuera
  const edge = 1 - smooth01((sqDist(x, z) - (ARENA_R - 18))/8);  // vuelve a 0 junto a las montañas
  const hills = 4.5*Math.sin(x*0.05 + 1.3)*Math.cos(z*0.043) + 3*Math.sin((x - z)*0.11 + 0.7) + 1.5*Math.cos(x*0.13 + z*0.09);
  const q = hills/TERRACE, fl = Math.floor(q);
  return (fl + smooth01((q - fl - 0.62)/0.38))*TERRACE * flat * edge;
}
// Sitios de plaza (donde van las ruinas): el suelo se aplana a la altura de su centro
const PLAZA_SPOTS = [[-64, -38, 11], [76, 24, 10], [-28, 84, 9], [-86, 18, 9], [66, 72, 8.5], [-44, -82, 9], [30, -62, 8], [-88, -88, 9], [88, -86, 9], [86, 92, 9], [-88, 88, 9]];
const FLAT_SPOTS = [...PLAZA_SPOTS, [0, -(ARENA_R - 32) + 4, 9]].map(([x, z, r]) => [x, z, r, hillBase(x, z)]);
function terrainH(x, z){
  let base = hillBase(x, z);
  for (const [px, pz, pr, ph] of FLAT_SPOTS){
    const f = 1 - smooth01((Math.hypot(x - px, z - pz) - pr - 1.5)/4);
    if (f > 0) base = base*(1 - f) + ph*f;
  }
  // Cerca de un lago la orilla queda por encima del agua; el cuenco baja hasta POND.bed
  let d = Infinity;
  for (const P of PONDS) d = Math.min(d, pondDist(P, x, z));
  const near = 1 - smooth01((d - 6)/6);
  const shore = Math.max(base, POND.water + 0.45);
  const hn = base*(1 - near) + shore*near;
  const t = smooth01(d/1.6);
  let h = POND.bed*(1 - t) + hn*t;
  // Bajo el puente hay un terraplén a ras de orilla: se camina por encima del agua
  if (x > BRIDGE.x0 - 2 && x < BRIDGE.x1 + 2){
    const k = (1 - smooth01((Math.abs(z - BRIDGE.z) - BRIDGE.hw)/1.2))*(1 - smooth01((Math.max(BRIDGE.x0 - x, x - BRIDGE.x1))/2));
    h = h*(1 - k) + (POND.water + 0.45)*k;   // a nivel: el puente queda siempre por encima del suelo
  }

// Empuja un objeto {x, z} fuera de los sólidos, teniendo en cuenta su radio
function resolveSolids(o, rad, height = 0){
  for (const c of solids.circles){
    if (height >= c.h) continue;   // por encima de la altura del objeto se puede saltar
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), min = rad + c.r;
    if (d < min){
      if (d > 1e-6){ o.x = c.x + dx/d*min; o.z = c.z + dz/d*min; }
      else { o.x = c.x + min; }
    }
  }
  for (const s of solids.segs){
    if (height >= s.h) continue;
    const vx = s.bx - s.ax, vz = s.bz - s.az, len2 = vx*vx + vz*vz;
    const t = Math.min(1, Math.max(0, ((o.x - s.ax)*vx + (o.z - s.az)*vz)/len2));
    const px = s.ax + vx*t, pz = s.az + vz*t;
    const dx = o.x - px, dz = o.z - pz, d = Math.hypot(dx, dz), min = rad + s.r;
    if (d < min){
      if (d > 1e-6){ o.x = px + dx/d*min; o.z = pz + dz/d*min; }
      else { o.x = px + min; }
    }
  }
}

function buildMountains(){
  // Una sola malla continua de crestas: no hay conos que se crucen, así que no parpadea
  const SEG = 480, rBase = ARENA_R + 16, rPeak = ARENA_R + 5;
  const H = a => 40 + 12*Math.sin(a*5 + 1.3) + 6*Math.sin(a*11 + 0.4) + 3*Math.sin(a*23);
  const rock = new THREE.Color(0x4b5a73), snow = new THREE.Color(0xe8f1ff);
  const pos = [], col = [];
  const pt = (r, h, a) => { const c = Math.cos(a), sn = Math.sin(a), k = r/Math.max(Math.abs(c), Math.abs(sn)); return [c*k, h, sn*k]; };   // anillo cuadrado
  const colorAt = h => rock.clone().lerp(snow, THREE.MathUtils.smoothstep(h, 30, 38));
  for (let i = 0; i < SEG; i++){
    const a0 = i/SEG*Math.PI*2, a1 = (i+1)/SEG*Math.PI*2;
    const h0 = H(a0), h1 = H(a1), hm = H((a0+a1)/2) * 1.08;
    const b0 = pt(rBase, -3, a0), b1 = pt(rBase, -3, a1);   // la base se hunde bajo el suelo: sin superficies coincidentes
    const t0 = pt(rPeak, h0, a0), t1 = pt(rPeak, h1, a1), tm = pt(rPeak - 4, hm, (a0+a1)/2);
    // dos caras por segmento: base exterior -> pico
    const faces = [[b0, b1, tm], [b0, tm, t0], [b1, t1, tm], [b1, tm, t0]];
    for (const f of faces){
      for (const v of f){
        pos.push(v[0], v[1], v[2]);
        const c = colorAt(v[1]); col.push(c.r, c.g, c.b);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = mountMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, flatShading: true, roughness: 0.9, side: THREE.DoubleSide}));
  scene.add(mesh);
}
