<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DigiBonk</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Prototipo estilo Megabonk. Los Digimon son formas de color (sin arte oficial).
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();

const DURATION = 300; // segundos para ganar
const CHARS = {
  agumon:  {name:'Agumon',  color:'#f7931e', kind:'shot',  cd:0.6, dmg:12, speed:150, desc:'Dispara al enemigo más cercano'},
  gabumon: {name:'Gabumon', color:'#4fc3f7', kind:'ring',  cd:1.6, dmg:8,  speed:150, desc:'Onda de energía alrededor'},
  palmon:  {name:'Palmon',  color:'#66bb6a', kind:'orbit', cd:0,   dmg:9,  speed:170, desc:'Cuchillas de hojas giratorias'}
};
const UPGRADES = [
  {t:'Daño +20%',                f:p=>{p.dmg*=1.2;}},
  {t:'Cadencia +15%',            f:p=>{p.cdMul*=0.85;}},
  {t:'Velocidad +10%',           f:p=>{p.speed*=1.1;}},
  {t:'+25 vida máx. y cura',     f:p=>{p.maxHp+=25; p.hp+=25;}},
  {t:'Proyectil / cuchilla +1',  f:p=>{p.count+=1;}},
  {t:'Área +20%',                f:p=>{p.area*=1.2;}},
  {t:'Imán +30%',                f:p=>{p.pickup*=1.3;}}
];

const keys = {};
let state = 'select';
let game = null;
let menuRects = [];

const rnd = (a,b) => a + Math.random()*(b-a);
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function startGame(key){
  const c = CHARS[key];
  game = {
    ch: {...c, id: key},
    p: {x:0, y:0, hp:100, maxHp:100, speed:c.speed, xp:0, lvl:1, nextXp:10,
        dmg:1, cdMul:1, area:1, count:1, pickup:40},
    t:0, kills:0, enemies:[], shots:[], gems:[], texts:[],
    wCd:0, spawnT:0, orbitA:0, choices:[]
  };
  menuRects = [];
  state = 'play';
}

function spawnEnemy(){
  const g = game, t = g.t;
  const a = rnd(0, Math.PI*2);
  const R = Math.hypot(cv.width, cv.height)/2 + 40;
  const r = Math.random();
  let type;
  if (t > 120 && r < 0.2)      type = {kind:'tank',  hp:90, spd:40,  r:20, xp:8, dmg:12};
  else if (t > 60 && r < 0.4) type = {kind:'fast',  hp:14, spd:100, r:10, xp:3, dmg:4};
  else                         type = {kind:'basic', hp:22, spd:55,  r:13, xp:2, dmg:5};
  const k = 1 + t/120;
  g.enemies.push({
    x: g.p.x + Math.cos(a)*R, y: g.p.y + Math.sin(a)*R,
    hp: type.hp*k, max: type.hp*k, spd: type.spd, r: type.r,
    kind: type.kind, xp: type.xp, dmg: type.dmg, cd: 0
  });
}

function hurt(e, dmg){
  e.hp -= dmg;
  game.texts.push({x:e.x, y:e.y - e.r - 10, txt:Math.round(dmg), life:0.6});
}

function update(dt){
  const g = game, p = g.p, ch = g.ch;
  g.t += dt;

  // Movimiento
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (mx || my){
    const L = Math.hypot(mx, my);
    p.x += mx/L * p.speed * dt;
    p.y += my/L * p.speed * dt;
  }

  // Aparición de enemigos
  g.spawnT -= dt;
  if (g.spawnT <= 0){
    spawnEnemy();
    g.spawnT = Math.max(0.2, 1.1 - g.t/200);
  }

  // Enemigos: persiguen y dañan por contacto
  for (const e of g.enemies){
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += dx/d * e.spd * dt;
    e.y += dy/d * e.spd * dt;
    e.cd -= dt;
    if (d < e.r + 12) p.hp -= e.dmg * dt;
  }

  // Armas
  g.wCd -= dt;
  if (ch.kind === 'shot' && g.wCd <= 0 && g.enemies.length){
    g.wCd = ch.cd * p.cdMul;
    const sorted = [...g.enemies].sort((a,b) => dist(a,p) - dist(b,p));
    for (let i = 0; i < Math.min(p.count, sorted.length); i++){
      const e = sorted[i], d = dist(e,p) || 1;
      g.shots.push({x:p.x, y:p.y, vx:(e.x-p.x)/d*420, vy:(e.y-p.y)/d*420,
                    dmg:ch.dmg*p.dmg, life:1.6, r:5, col:ch.color});
    }
  }
  if (ch.kind === 'ring' && g.wCd <= 0){
    g.wCd = ch.cd * p.cdMul;
    const n = 6*p.count, off = rnd(0, Math.PI*2);
    for (let i = 0; i < n; i++){
      const an = off + i/n*Math.PI*2;
      g.shots.push({x:p.x, y:p.y, vx:Math.cos(an)*260, vy:Math.sin(an)*260,
                    dmg:ch.dmg*p.dmg, life:0.9, r:6, col:ch.color});
    }
  }

  // Proyectiles
  for (const s of g.shots){ s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt; }
  for (const s of g.shots){
    if (s.life <= 0) continue;
    for (const e of g.enemies){
      if (e.hp > 0 && Math.hypot(s.x-e.x, s.y-e.y) < e.r + s.r){
        hurt(e, s.dmg); s.life = 0; break;
      }
    }
  }
  g.shots = g.shots.filter(s => s.life > 0);

  // Cuchillas orbitales
  if (ch.kind === 'orbit'){
    g.orbitA += dt*3.2;
    const n = p.count + 1, R = 55*p.area;
    for (let i = 0; i < n; i++){
      const an = g.orbitA + i*Math.PI*2/n;
      const bx = p.x + Math.cos(an)*R, by = p.y + Math.sin(an)*R;
      for (const e of g.enemies){
        if (e.cd <= 0 && Math.hypot(bx-e.x, by-e.y) < e.r + 7){
          hurt(e, ch.dmg*p.dmg); e.cd = 0.35;
        }
      }
    }
  }

  // Muertes
  const dead = g.enemies.filter(e => e.hp <= 0);
  for (const e of dead) g.gems.push({x:e.x, y:e.y, v:e.xp});
  g.kills += dead.length;
  g.enemies = g.enemies.filter(e => e.hp > 0);

  // Gemas de XP
  for (const gm of g.gems){
    const d = dist(gm, p), dd = d || 1;
    if (d < p.pickup){
      gm.x += (p.x-gm.x)/dd * 300*dt;
      gm.y += (p.y-gm.y)/dd * 300*dt;
    }
    if (d < 14){ gm.taken = true; p.xp += gm.v; }
  }
  g.gems = g.gems.filter(gm => !gm.taken);

  // Subida de nivel
  if (p.xp >= p.nextXp){
    p.xp -= p.nextXp;
    p.lvl++;
    p.nextXp = Math.floor(10*Math.pow(1.35, p.lvl-1));
    g.choices = [...UPGRADES].sort(() => Math.random()-0.5).slice(0,3);
    state = 'levelup';
  }

  // Textos de daño
  for (const t of g.texts){ t.life -= dt; t.y -= 30*dt; }
  g.texts = g.texts.filter(t => t.life > 0);

  // Fin de partida
  if (p.hp <= 0){ p.hp = 0; state = 'over'; }
  else if (g.t >= DURATION) state = 'win';
}

function pick(i){
  if (state !== 'levelup') return;
  game.choices[i].f(game.p);
  state = 'play';
}

function drawGrid(p){
  const cx = cv.width/2, cy = cv.height/2, step = 100;
  ctx.strokeStyle = '#162036'; ctx.lineWidth = 1; ctx.beginPath();
  const x0 = Math.floor((p.x-cx)/step)*step, x1 = p.x+cx;
  const y0 = Math.floor((p.y-cy)/step)*step, y1 = p.y+cy;
  for (let x = x0; x <= x1; x += step){ ctx.moveTo(x,y0); ctx.lineTo(x,y1); }
  for (let y = y0; y <= y1; y += step){ ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
  ctx.stroke();
}

// Dibujo de criaturas con formas propias (no son arte oficial de Digimon).
// Base de dibujo: radio ~14 unidades; s escala el tamaño.
function eye(ex, ey, er){
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(ex+0.5, ey+0.5, er*0.5, 0, Math.PI*2); ctx.fill();
}
// Sprites de pixel art (carpeta sprites/, ver sprites/CREDITS.txt).
// Si una imagen no carga, se dibuja la forma de respaldo de abajo.
const SPRITE_IDS = ['agumon','gabumon','palmon','basic','fast','tank'];
const SPRITES = {};
for (const id of SPRITE_IDS){
  const img = new Image();
  img.src = 'sprites/' + id + '.png';
  SPRITES[id] = img;
}
function drawCreature(id, x, y, s){
  const img = SPRITES[id];
  if (img && img.complete && img.naturalWidth > 0){
    const size = 40 * s;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x - size/2, y - size/2, size, size);
    return;
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.2;
  if (id === 'agumon'){
    ctx.fillStyle = '#ffe082';
    for (const sx of [-1,1]){
      ctx.beginPath(); ctx.moveTo(sx*9,-6); ctx.lineTo(sx*12,-17); ctx.lineTo(sx*4,-9); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#f7931e'; ctx.beginPath(); ctx.arc(0, 2, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe0b2'; ctx.beginPath(); ctx.ellipse(0, 6, 7, 6, 0, 0, Math.PI*2); ctx.fill();
    eye(-4, -2, 3); eye(4, -2, 3);
  } else if (id === 'gabumon'){
    ctx.fillStyle = '#fff59d';
    ctx.beginPath(); ctx.moveTo(-10,-4); ctx.lineTo(0,-16); ctx.lineTo(10,-4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(0, 2, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e1f5fe'; ctx.beginPath(); ctx.ellipse(0, 6, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    eye(-4, -2, 3); eye(4, -2, 3);
  } else if (id === 'palmon'){
    ctx.save(); ctx.rotate(-0.3);
    ctx.fillStyle = '#43a047'; ctx.beginPath(); ctx.ellipse(0, -12, 5, 8, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#66bb6a'; ctx.beginPath(); ctx.arc(0, 2, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c8e6c9'; ctx.beginPath(); ctx.ellipse(0, 6, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    eye(-4, -2, 3); eye(4, -2, 3);
  } else if (id === 'basic'){
    ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    eye(-4, -2, 2.6); eye(4, -2, 2.6);
  } else if (id === 'fast'){
    ctx.fillStyle = '#ab47bc';
    for (let i = 0; i < 4; i++){
      const a = i*Math.PI/2 + Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a-0.3)*8, Math.sin(a-0.3)*8);
      ctx.lineTo(Math.cos(a)*15, Math.sin(a)*15);
      ctx.lineTo(Math.cos(a+0.3)*8, Math.sin(a+0.3)*8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    eye(-3, -1, 2); eye(3, -1, 2);
  } else if (id === 'tank'){
    ctx.fillStyle = '#8d6e63';
    for (const sx of [-1,1]){
      ctx.beginPath(); ctx.moveTo(sx*12,-14); ctx.lineTo(sx*16,-22); ctx.lineTo(sx*6,-14); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.rect(-15, -14, 30, 28); ctx.fill(); ctx.stroke();
    eye(-6, -3, 3); eye(6, -3, 3);
  }
  ctx.restore();
}
function drawEnemy(e){ drawCreature(e.kind, e.x, e.y, e.r/13); }

function drawWorld(g){
  const p = g.p, cx = cv.width/2, cy = cv.height/2;
  ctx.save();
  ctx.translate(cx - p.x, cy - p.y);
  drawGrid(p);

  for (const gm of g.gems){
    ctx.fillStyle = '#29b6f6'; ctx.beginPath(); ctx.arc(gm.x, gm.y, 4, 0, Math.PI*2); ctx.fill();
  }
  for (const e of g.enemies){
    drawEnemy(e);
    ctx.fillStyle = '#000'; ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2, 3);
    ctx.fillStyle = '#4caf50'; ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2*Math.max(0,e.hp)/e.max, 3);
  }
  for (const s of g.shots){
    ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  if (g.ch.kind === 'orbit'){
    const n = p.count+1, R = 55*p.area;
    ctx.fillStyle = '#a5d6a7';
    for (let i = 0; i < n; i++){
      const an = g.orbitA + i*Math.PI*2/n;
      ctx.beginPath(); ctx.arc(p.x+Math.cos(an)*R, p.y+Math.sin(an)*R, 7, 0, Math.PI*2); ctx.fill();
    }
  }
  drawCreature(g.ch.id, p.x, p.y, 1);
  ctx.textAlign = 'center';

  ctx.font = 'bold 13px sans-serif';
  for (const t of g.texts){
    ctx.globalAlpha = Math.max(0, t.life/0.6);
    ctx.fillStyle = '#ffeb3b'; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore();
}

function drawHUD(g){
  const p = g.p, w = cv.width, h = cv.height;
  ctx.fillStyle = '#000'; ctx.fillRect(20, 20, 220, 16);
  ctx.fillStyle = '#e53935'; ctx.fillRect(20, 20, 220*Math.max(0,p.hp)/p.maxHp, 16);
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`${g.ch.name}   Nv ${p.lvl}   Bajas ${g.kills}`, 20, 56);
  const left = Math.max(0, DURATION - g.t);
  const m = Math.floor(left/60), s = Math.floor(left%60);
  ctx.textAlign = 'center'; ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`${m}:${String(s).padStart(2,'0')}`, w/2, 40);
  ctx.fillStyle = '#000'; ctx.fillRect(0, h-12, w, 12);
  ctx.fillStyle = '#29b6f6'; ctx.fillRect(0, h-12, w*p.xp/p.nextXp, 12);
  ctx.textAlign = 'left';
}

function drawLevelUp(g){
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('¡Subida de nivel! Elige una mejora (1-3 o clic)', cv.width/2, cv.height*0.25);
  menuRects = [];
  g.choices.forEach((c, i) => {
    const w = 320, h = 90, x = cv.width/2 - w/2, y = cv.height*0.35 + i*(h+20);
    ctx.fillStyle = '#1e2a44'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#4fc3f7'; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`${i+1}. ${c.t}`, cv.width/2, y + h/2 + 6);
    menuRects.push({x, y, w, h, act:() => pick(i)});
  });
  ctx.textAlign = 'left';
}

function drawSelect(){
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText('DigiBonk', cv.width/2, cv.height*0.2);
  ctx.font = '16px sans-serif';
  ctx.fillText('Mueve con WASD o flechas. Sobrevive 5 minutos. Elige tu Digimon (1-3 o clic):', cv.width/2, cv.height*0.2 + 30);
  menuRects = [];
  const list = Object.keys(CHARS);
  const w = 260, h = 150, startX = cv.width/2 - (3*w + 2*30)/2;
  list.forEach((k, i) => {
    const c = CHARS[k], x = startX + i*(w+30), y = cv.height*0.42;
    ctx.fillStyle = '#1e2a44'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = c.color; ctx.strokeRect(x, y, w, h);
    drawCreature(k, x+w/2, y+40, 1.3);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`${i+1}. ${c.name}`, x+w/2, y+85);
    ctx.font = '14px sans-serif';
    ctx.fillText(c.desc, x+w/2, y+115);
    menuRects.push({x, y, w, h, act:() => startGame(k)});
  });
  ctx.textAlign = 'left';
}

function drawEnd(g, win){
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(win ? '¡Sobreviviste!' : 'Has caído', cv.width/2, cv.height/2 - 30);
  ctx.font = '20px sans-serif';
  ctx.fillText(`Nivel ${g.p.lvl} · Bajas ${g.kills} · Tiempo ${Math.floor(g.t)}s`, cv.width/2, cv.height/2 + 10);
  ctx.fillText('Pulsa Enter o haz clic para volver a elegir', cv.width/2, cv.height/2 + 50);
  ctx.textAlign = 'left';
}

function draw(){
  ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (state === 'select'){ drawSelect(); return; }
  drawWorld(game); drawHUD(game);
  if (state === 'levelup') drawLevelUp(game);
  if (state === 'over') drawEnd(game, false);
  if (state === 'win') drawEnd(game, true);
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (state === 'select'){
    const idx = ['1','2','3'].indexOf(k);
    if (idx >= 0) startGame(Object.keys(CHARS)[idx]);
  } else if (state === 'levelup'){
    const idx = ['1','2','3'].indexOf(k);
    if (idx >= 0) pick(idx);
  } else if (state === 'over' || state === 'win'){
    if (k === 'enter' || k === 'r') state = 'select';
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

cv.addEventListener('click', e => {
  if (state === 'over' || state === 'win'){ state = 'select'; return; }
  if (state !== 'select' && state !== 'levelup') return; // en partida los clics no hacen nada
  const r = menuRects.find(r => e.clientX >= r.x && e.clientX <= r.x+r.w &&
                                e.clientY >= r.y && e.clientY <= r.y+r.h);
  if (r) r.act();
});

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  if (state === 'play') update(dt);
  if (state === 'play' || state === 'levelup') { /* mantener pantalla */ }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
